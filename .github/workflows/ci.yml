    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-r2dbc-h2
      - test-spring-boot
      - test-lettuce
      - test-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-duckdb
      - test-cache
      - test-jdbc-caffeine
      - test-r2dbc-caffeine
      - test-clickhouse
      - test-trino
      - test-bigquery
      - test-timefold
      - test-spring-boot-batch
      - test-utils-batch
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts
      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # Final status gate — skipped jobs treated as success
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - build
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-r2dbc-h2
      - test-spring-boot
      - test-lettuce
      - test-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-duckdb
      - test-cache
      - test-jdbc-caffeine
      - test-r2dbc-caffeine
      - test-clickhouse
      - test-trino
      - test-bigquery
      - test-timefold
      - test-spring-boot-batch
      - test-utils-batch
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
