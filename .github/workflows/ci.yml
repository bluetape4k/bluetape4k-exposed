name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'WIP.md'
      - 'LICENSE'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'WIP.md'
      - 'LICENSE'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Secret scan
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # Gradle Wrapper validation
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  # Detect changed modules (runs in parallel with build)
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      serialization: ${{ steps.filter.outputs.serialization }}
      tink: ${{ steps.filter.outputs.tink }}
      jdbc: ${{ steps.filter.outputs.jdbc }}
      r2dbc: ${{ steps.filter.outputs.r2dbc }}
      spring-boot4: ${{ steps.filter.outputs.spring-boot4 }}
      lettuce: ${{ steps.filter.outputs.lettuce }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'exposed/exposed-core/**'
              - 'exposed/exposed-dao/**'
            serialization:
              - 'exposed/exposed-jackson2/**'
              - 'exposed/exposed-jackson3/**'
              - 'exposed/exposed-fastjson2/**'
            tink:
              - 'exposed/exposed-tink/**'
            jdbc:
              - 'exposed/exposed-jdbc/**'
              - 'exposed/exposed-jdbc-tests/**'
            r2dbc:
              - 'exposed/exposed-r2dbc/**'
              - 'exposed/exposed-r2dbc-tests/**'
            spring-boot4:
              - 'spring-boot4/**'
            lettuce:
              - 'exposed/exposed-jdbc-lettuce/**'
              - 'exposed/exposed-r2dbc-lettuce/**'

  # Full build (no tests)
  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: ./gradlew build -x test -x koverVerify --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # exposed-core + exposed-dao (H2)
  test-core:
    name: Test / exposed-core + exposed-dao (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test exposed-core + exposed-dao
        run: ./gradlew :bluetape4k-exposed-core:test :bluetape4k-exposed-dao:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-exposed-core:koverXmlReport :bluetape4k-exposed-dao:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          retention-days: 7

  # Serialization modules (H2)
  test-serialization:
    name: Test / serialization modules (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.serialization == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test serialization modules
        run: >
          ./gradlew
          :bluetape4k-exposed-jackson2:test
          :bluetape4k-exposed-jackson3:test
          :bluetape4k-exposed-fastjson2:test
          --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-jackson2:koverXmlReport
          :bluetape4k-exposed-jackson3:koverXmlReport
          :bluetape4k-exposed-fastjson2:koverXmlReport
          --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-serialization
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-serialization
          path: '**/build/reports/kover/'
          retention-days: 7

  # exposed-tink (H2)
  test-tink:
    name: Test / exposed-tink (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.tink == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test exposed-tink
        run: ./gradlew :bluetape4k-exposed-tink:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-exposed-tink:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tink
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tink
          path: '**/build/reports/kover/'
          retention-days: 7

  # exposed-jdbc + exposed-jdbc-tests (H2)
  test-jdbc-h2:
    name: Test / exposed-jdbc + exposed-jdbc-tests (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.jdbc == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test exposed-jdbc (H2)
        run: >
          ./gradlew
          :bluetape4k-exposed-jdbc:test
          :bluetape4k-exposed-jdbc-tests:test
          --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          EXPOSED_TEST_DB: "H2"

      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-jdbc:koverXmlReport
          :bluetape4k-exposed-jdbc-tests:koverXmlReport
          --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdbc-h2
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jdbc-h2
          path: '**/build/reports/kover/'
          retention-days: 7

  # exposed-r2dbc + exposed-r2dbc-tests (H2)
  test-r2dbc-h2:
    name: Test / exposed-r2dbc + exposed-r2dbc-tests (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.r2dbc == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test exposed-r2dbc (H2)
        run: >
          ./gradlew
          :bluetape4k-exposed-r2dbc:test
          :bluetape4k-exposed-r2dbc-tests:test
          --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          EXPOSED_TEST_DB: "H2"

      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-r2dbc:koverXmlReport
          :bluetape4k-exposed-r2dbc-tests:koverXmlReport
          --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-r2dbc-h2
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-r2dbc-h2
          path: '**/build/reports/kover/'
          retention-days: 7

  # spring-boot4 exposed-jdbc + exposed-r2dbc
  test-spring-boot4:
    timeout-minutes: 10
    name: Test / spring-boot4 exposed-jdbc + exposed-r2dbc
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: ${{ needs.changes.outputs['spring-boot4'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test spring-boot4
        run: >
          ./gradlew
          :bluetape4k-spring-boot4-exposed-jdbc:test
          :bluetape4k-spring-boot4-exposed-r2dbc:test
          --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          DOCKER_HOST: 'unix:///var/run/docker.sock'

      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-spring-boot4-exposed-jdbc:koverXmlReport
          :bluetape4k-spring-boot4-exposed-r2dbc:koverXmlReport
          --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-spring-boot4
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-spring-boot4
          path: '**/build/reports/kover/'
          retention-days: 7

  # exposed-jdbc-lettuce + exposed-r2dbc-lettuce (Redis, Testcontainers)
  test-lettuce:
    name: Test / exposed-jdbc-lettuce + exposed-r2dbc-lettuce (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, changes]
    if: ${{ needs.changes.outputs.lettuce == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test exposed-jdbc-lettuce + exposed-r2dbc-lettuce
        run: >
          ./gradlew
          :bluetape4k-exposed-jdbc-lettuce:test
          :bluetape4k-exposed-r2dbc-lettuce:test
          --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-jdbc-lettuce:koverXmlReport
          :bluetape4k-exposed-r2dbc-lettuce:koverXmlReport
          --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-lettuce
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lettuce
          path: '**/build/reports/kover/'
          retention-days: 7

  # Coverage aggregation
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-r2dbc-h2
      - test-spring-boot4
      - test-lettuce
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts
      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # Final status gate — skipped jobs treated as success
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - build
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-r2dbc-h2
      - test-spring-boot4
      - test-lettuce
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
