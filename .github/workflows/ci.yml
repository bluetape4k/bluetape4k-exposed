name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'WIP.md'
      - 'LICENSE'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'WIP.md'
      - 'LICENSE'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Secret scan
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # Gradle Wrapper validation
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  # Detect changed modules (runs in parallel with build)
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      serialization: ${{ steps.filter.outputs.serialization }}
      tink: ${{ steps.filter.outputs.tink }}
      jdbc: ${{ steps.filter.outputs.jdbc }}
      r2dbc: ${{ steps.filter.outputs.r2dbc }}
      spring-boot: ${{ steps.filter.outputs.spring-boot }}
      lettuce: ${{ steps.filter.outputs.lettuce }}
      redisson: ${{ steps.filter.outputs.redisson }}
      measured: ${{ steps.filter.outputs.measured }}
      postgresql-module: ${{ steps.filter.outputs.postgresql-module }}
      mysql8-module: ${{ steps.filter.outputs.mysql8-module }}
      duckdb: ${{ steps.filter.outputs.duckdb }}
      cache: ${{ steps.filter.outputs.cache }}
      jdbc-caffeine: ${{ steps.filter.outputs.jdbc-caffeine }}
      r2dbc-caffeine: ${{ steps.filter.outputs.r2dbc-caffeine }}
      clickhouse: ${{ steps.filter.outputs.clickhouse }}
      trino: ${{ steps.filter.outputs.trino }}
      bigquery: ${{ steps.filter.outputs.bigquery }}
      timefold: ${{ steps.filter.outputs.timefold }}
      spring-boot-batch: ${{ steps.filter.outputs.spring-boot-batch }}
      utils-batch: ${{ steps.filter.outputs.utils-batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'exposed/exposed-core/**'
              - 'exposed/exposed-dao/**'
            serialization:
              - 'exposed/exposed-jackson2/**'
              - 'exposed/exposed-jackson3/**'
              - 'exposed/exposed-fastjson2/**'
            tink:
              - 'exposed/exposed-tink/**'
            jdbc:
              - 'exposed/exposed-jdbc/**'
              - 'exposed/exposed-jdbc-tests/**'
            r2dbc:
              - 'exposed/exposed-r2dbc/**'
              - 'exposed/exposed-r2dbc-tests/**'
            spring-boot:
              - 'spring-boot/**'
            lettuce:
              - 'exposed/exposed-jdbc-lettuce/**'
              - 'exposed/exposed-r2dbc-lettuce/**'
            redisson:
              - 'exposed/exposed-jdbc-redisson/**'
              - 'exposed/exposed-r2dbc-redisson/**'
            measured:
              - 'exposed/exposed-measured/**'
            postgresql-module:
              - 'exposed/exposed-postgresql/**'
            mysql8-module:
              - 'exposed/exposed-mysql8/**'
            duckdb:
              - 'exposed/exposed-duckdb/**'
            cache:
              - 'exposed/exposed-cache/**'
            jdbc-caffeine:
              - 'exposed/exposed-jdbc-caffeine/**'
            r2dbc-caffeine:
              - 'exposed/exposed-r2dbc-caffeine/**'
            clickhouse:
              - 'exposed/exposed-clickhouse/**'
            trino:
              - 'exposed/exposed-trino/**'
            bigquery:
              - 'exposed/exposed-bigquery/**'
            timefold:
              - 'exposed/exposed-timefold-solver-persistence/**'
            spring-boot-batch:
              - 'spring-boot/batch-exposed/**'
            utils-batch:
              - 'utils/**'

  # Full build (no tests)
  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: ./gradlew build -x test -x koverVerify --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # exposed-core + exposed-dao (H2)
  test-core:
    name: Test / exposed-core + exposed-dao (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test exposed-core + exposed-dao
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-exposed-core:test :bluetape4k-exposed-dao:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-exposed-core:koverXmlReport :bluetape4k-exposed-dao:koverXmlReport --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          retention-days: 7

  # Serialization modules (H2)
  test-serialization:
    name: Test / serialization modules (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.serialization == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test serialization modules
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-exposed-jackson2:test :bluetape4k-exposed-jackson3:test :bluetape4k-exposed-fastjson2:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-jackson2:koverXmlReport
          :bluetape4k-exposed-jackson3:koverXmlReport
          :bluetape4k-exposed-fastjson2:koverXmlReport
          --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
