name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'WIP.md'
      - 'LICENSE'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    # Keep the PR workflow always-on so branch protection receives CI Status
    # even when the change is limited to documentation or repository metadata.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: 'df64293753a9491b337852a158f89d4a93a1734a'

jobs:
  # Secret scan
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          GITLEAKS_ASSET_URL=$(
            curl -sSfL --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
              | jq -r '.assets[] | select(.name | test("linux_x64\\.tar\\.gz$")) | .browser_download_url' \
              | head -n 1
          )
          test -n "${GITLEAKS_ASSET_URL}"
          test "${GITLEAKS_ASSET_URL}" != "null"

          curl -sSfL "${GITLEAKS_ASSET_URL}" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # Gradle Wrapper validation
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  # Detect changed modules (runs in parallel with build)
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      serialization: ${{ steps.filter.outputs.serialization }}
      tink: ${{ steps.filter.outputs.tink }}
      jdbc: ${{ steps.filter.outputs.jdbc }}
      r2dbc: ${{ steps.filter.outputs.r2dbc }}
      spring-boot: ${{ steps.filter.outputs.spring-boot }}
      spring-modulith: ${{ steps.filter.outputs.spring-modulith }}
      ktor: ${{ steps.filter.outputs.ktor }}
      examples: ${{ steps.filter.outputs.examples }}
      lettuce: ${{ steps.filter.outputs.lettuce }}
      redisson: ${{ steps.filter.outputs.redisson }}
      measured: ${{ steps.filter.outputs.measured }}
      postgresql-module: ${{ steps.filter.outputs.postgresql-module }}
      mysql8-module: ${{ steps.filter.outputs.mysql8-module }}
      duckdb: ${{ steps.filter.outputs.duckdb }}
      druid: ${{ steps.filter.outputs.druid }}
      cache: ${{ steps.filter.outputs.cache }}
      jdbc-caffeine: ${{ steps.filter.outputs.jdbc-caffeine }}
      r2dbc-caffeine: ${{ steps.filter.outputs.r2dbc-caffeine }}
      clickhouse: ${{ steps.filter.outputs.clickhouse }}
      trino: ${{ steps.filter.outputs.trino }}
      starrocks: ${{ steps.filter.outputs.starrocks }}
      cockroachdb: ${{ steps.filter.outputs.cockroachdb }}
      bigquery: ${{ steps.filter.outputs.bigquery }}
      timefold: ${{ steps.filter.outputs.timefold }}
      spring-boot-batch: ${{ steps.filter.outputs.spring-boot-batch }}
      utils-batch: ${{ steps.filter.outputs.utils-batch }}
      docs-only: ${{ github.event_name == 'pull_request' && steps.filter.outputs['non-doc'] == 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            non-doc:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!.gitignore'
              - '!.editorconfig'
              - '!.gitleaks.toml'
              - '!CHANGELOG.md'
              - '!WIP.md'
              - '!LICENSE'
              - '!.claude/**'
            core:
              - 'exposed/core/**'
              - 'exposed/dao/**'
            serialization:
              - 'exposed/jackson2/**'
              - 'exposed/jackson3/**'
              - 'exposed/fastjson2/**'
            tink:
              - 'exposed/tink/**'
            jdbc:
              - 'exposed/jdbc/**'
              - 'exposed/jdbc-tests/**'
            r2dbc:
              - 'exposed/r2dbc/**'
              - 'exposed/r2dbc-tests/**'
            spring-boot:
              - 'spring-boot/**'
            spring-modulith:
              - 'spring-boot/spring-modulith/**'
              - 'spring-boot/common/**'
              - 'spring-boot/jdbc/**'
              - 'exposed/core/**'
              - 'exposed/dao/**'
              - 'exposed/jdbc/**'
              - 'exposed/jdbc-tests/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly-tests.yml'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle/**'
              - 'buildSrc/**'
            ktor:
              - 'ktor/exposed/**'
              - 'examples/ktor-exposed-demo/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly-tests.yml'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle/**'
              - 'buildSrc/**'
            examples:
              - 'examples/**'
              - 'ktor/exposed/**'
              - 'exposed/bigquery/**'
              - 'exposed/clickhouse/**'
              - 'spring-boot/jdbc/**'
              - 'spring-boot/r2dbc/**'
              - 'spring-boot/common/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly-tests.yml'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle/**'
              - 'buildSrc/**'
            lettuce:
              - 'exposed/jdbc-lettuce/**'
              - 'exposed/r2dbc-lettuce/**'
            redisson:
              - 'exposed/jdbc-redisson/**'
              - 'exposed/r2dbc-redisson/**'
            measured:
              - 'exposed/measured/**'
            postgresql-module:
              - 'exposed/postgresql/**'
            mysql8-module:
              - 'exposed/mysql8/**'
            duckdb:
              - 'exposed/duckdb/**'
            druid:
              - 'exposed/druid/**'
            cache:
              - 'exposed/cache/**'
            jdbc-caffeine:
              - 'exposed/jdbc-caffeine/**'
            r2dbc-caffeine:
              - 'exposed/r2dbc-caffeine/**'
            clickhouse:
              - 'exposed/clickhouse/**'
            trino:
              - 'exposed/trino/**'
            starrocks:
              - 'exposed/starrocks/**'
            cockroachdb:
              - 'exposed/cockroachdb/**'
            bigquery:
              - 'exposed/bigquery/**'
            timefold:
              - 'exposed/timefold-solver-persistence/**'
            spring-boot-batch:
              - 'spring-boot/batch-exposed/**'
            utils-batch:
              - 'utils/**'
              - 'scripts/batch/**'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle/**'
              - 'buildSrc/**'

  # Full build (no tests)
  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs['docs-only'] != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: ./gradlew help --no-daemon

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, validate-wrapper, catalog-governance]
    if: ${{ needs.changes.outputs['docs-only'] != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test -x koverVerify -x checkKotlinAbi --parallel --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Validate publication POMs
        run: |
          ./gradlew generateMetadataFileForBluetapeExposedPublication \
            generatePomFileForBluetapeExposedPublication exportPublicationInventory \
            -PsnapshotVersion=-SNAPSHOT \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby -I scripts/publication scripts/publication/gradle_module_metadata_audit_test.rb
          ruby scripts/publication/validate_module_metadata.rb
          ruby scripts/publication/validate_poms.rb
          ruby scripts/publication/validate_downstream_consumer.rb

      - name: Check production ABI (no retry)
        run: |
          set -euo pipefail
          mkdir -p build/abi/reports
          ./gradlew exportPublicationInventory --no-daemon --no-configuration-cache --no-build-cache \
            2>&1 | tee build/abi/reports/publication-inventory.txt
          ./gradlew checkProductionAbi --no-daemon --no-configuration-cache --no-build-cache \
            2>&1 | tee build/abi/reports/check-production-abi.log
          test -s build/abi/reports/production-abi.txt
          grep -F 'modules=38/38' build/abi/reports/production-abi.txt
          grep -F 'baselines=38/38' build/abi/reports/production-abi.txt
          grep -F 'actualDumps=38/38' build/abi/reports/production-abi.txt
          grep -F 'emptyBaselines=0' build/abi/reports/production-abi.txt

      - name: Upload production ABI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-abi-evidence
          path: build/abi/reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload production ABI inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-abi-inventory
          path: build/publication/publication-inventory.json
          if-no-files-found: error
          retention-days: 14

  docs-only-validation:
    name: Docs-only validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs['docs-only'] == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify changed paths stay in the docs-only boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test -n "$changed"

          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|.gitignore|.editorconfig|.gitleaks.toml|LICENSE|.claude/*) ;;
              *)
                echo "Unexpected non-doc path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

      - name: Validate README migration parity
        run: ruby scripts/manual/validate_migration_readme_parity.rb README.md README.ko.md

      - name: Validate diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  # exposed-core + exposed-dao (H2)
  test-core:
    name: Test / exposed-core + exposed-dao (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test exposed-core + exposed-dao
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-exposed-core:test :bluetape4k-exposed-dao:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-exposed-core:koverXmlReport :bluetape4k-exposed-dao:koverXmlReport --no-configuration-cache --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          retention-days: 7

  # Serialization modules (H2)
  test-serialization:
    name: Test / serialization modules (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.serialization == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test serialization modules
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-exposed-jackson2:test :bluetape4k-exposed-jackson3:test :bluetape4k-exposed-fastjson2:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-jackson2:koverXmlReport
          :bluetape4k-exposed-jackson3:koverXmlReport
          :bluetape4k-exposed-fastjson2:koverXmlReport
          --no-configuration-cache
          --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-serialization
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-serialization
          path: '**/build/reports/kover/'
          retention-days: 7

  # exposed-tink (H2)
  test-tink:
    name: Test / exposed-tink (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.tink == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test exposed-tink
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-exposed-tink:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-exposed-tink:koverXmlReport --no-configuration-cache --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-tink
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tink
          path: '**/build/reports/kover/'
          retention-days: 7

  # exposed-jdbc + exposed-jdbc-tests (H2)
  test-jdbc-h2:
    name: Test / exposed-jdbc + exposed-jdbc-tests (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.jdbc == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test exposed-jdbc (H2)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-exposed-jdbc:test :bluetape4k-exposed-jdbc-tests:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          EXPOSED_TEST_DB: "H2"
      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-jdbc:koverXmlReport
          :bluetape4k-exposed-jdbc-tests:koverXmlReport
          --no-configuration-cache
          --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jdbc-h2
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jdbc-h2
          path: '**/build/reports/kover/'
          retention-days: 7

  # exposed-r2dbc + exposed-r2dbc-tests (H2)
  test-r2dbc-h2:
    name: Test / exposed-r2dbc + exposed-r2dbc-tests (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.r2dbc == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test exposed-r2dbc (H2)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-exposed-r2dbc:test :bluetape4k-exposed-r2dbc-tests:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          EXPOSED_TEST_DB: "H2"
      - name: Generate Kover XML report
        if: always()
        run: >
          ./gradlew
          :bluetape4k-exposed-r2dbc:koverXmlReport
          :bluetape4k-exposed-r2dbc-tests:koverXmlReport
          --no-configuration-cache
          --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-r2dbc-h2
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-r2dbc-h2
          path: '**/build/reports/kover/'
          retention-days: 7

  # Ktor Exposed integration (H2)
  test-ktor-exposed:
    name: Test / exposed-ktor (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.ktor == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test exposed-ktor
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-exposed-ktor:test --no-configuration-cache --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-exposed-ktor:koverXmlReport --no-configuration-cache --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ktor-exposed
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ktor-exposed
          path: '**/build/reports/kover/'
          retention-days: 7

  # Ktor non-H2 driver timeout and Toxiproxy compatibility (sequential Testcontainers)
  test-ktor-driver-timeout:
    name: Test / exposed-ktor (driver-timeout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: ${{ needs.changes.outputs.ktor == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
