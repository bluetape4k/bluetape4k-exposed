  # Coverage aggregation
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-r2dbc-h2
      - test-ktor-exposed
      - test-ktor-driver-timeout
      - test-spring-boot
      - test-spring-modulith
      - test-lettuce
      - test-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-duckdb
      - test-druid
      - test-cache
      - test-jdbc-caffeine
      - test-r2dbc-caffeine
      - test-clickhouse
      - test-trino
      - test-starrocks
      - test-cockroachdb
      - test-bigquery
      - test-examples
      - test-timefold
      - test-spring-boot-batch
      - test-utils-batch
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts
      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # Final status gate — only proven docs-only may skip the non-doc build
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - catalog-governance
      - gitleaks
      - build
      - docs-only-validation
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-r2dbc-h2
      - test-ktor-exposed
      - test-ktor-driver-timeout
      - test-spring-boot
      - test-spring-modulith
      - test-lettuce
      - test-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-duckdb
      - test-druid
      - test-cache
      - test-jdbc-caffeine
      - test-r2dbc-caffeine
      - test-clickhouse
      - test-trino
      - test-starrocks
      - test-cockroachdb
      - test-bigquery
      - test-examples
      - test-timefold
      - test-spring-boot-batch
      - test-utils-batch
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_ONLY: ${{ needs.changes.outputs['docs-only'] }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          if [ "$DOCS_ONLY" != "true" ] && [ "$BUILD_RESULT" != "success" ]; then
            echo "Non-doc changes require the production build and ABI gate to run"
            exit 1
          fi
          echo "CI passed (docs-only build skip is the only allowed ABI N/A)"
