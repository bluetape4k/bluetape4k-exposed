        if: always()
        run: |
          set -euo pipefail
          for report in \
            utils/batch/core/build/reports/kover/report.xml \
            utils/batch/jdbc/build/reports/kover/report.xml \
            utils/batch/r2dbc/build/reports/kover/report.xml \
