  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-jdbc-postgresql
      - test-jdbc-mysql
      - test-r2dbc-h2
      - test-r2dbc-postgresql
      - test-r2dbc-mysql
      - test-jdbc-lettuce
      - test-jdbc-redisson
      - test-r2dbc-lettuce
      - test-r2dbc-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-spring-boot3
      - test-spring-boot4
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts
      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-jdbc-postgresql
      - test-jdbc-mysql
      - test-r2dbc-h2
      - test-r2dbc-postgresql
      - test-r2dbc-mysql
      - test-jdbc-lettuce
      - test-jdbc-redisson
      - test-r2dbc-lettuce
      - test-r2dbc-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-spring-boot3
      - test-spring-boot4
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
