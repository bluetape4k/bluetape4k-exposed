    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}

    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        db: [H2, POSTGRESQL, MYSQL_V8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test utils-batch (${{ matrix.db }})
        run: |
          for attempt in 1 2 3; do
            ./gradlew :bluetape4k-batch:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
          EXPOSED_TEST_DB: ${{ matrix.db }}
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          DOCKER_HOST: 'unix:///var/run/docker.sock'
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-batch:koverXmlReport --no-daemon
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-utils-batch-${{ matrix.db }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-utils-batch-${{ matrix.db }}
          path: '**/build/reports/kover/'
          retention-days: 14

  coverage-report:
    name: Coverage Report

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-jdbc-postgresql
      - test-jdbc-mysql
      - test-r2dbc-h2
      - test-r2dbc-postgresql
      - test-r2dbc-mysql
      - test-jdbc-lettuce
      - test-jdbc-redisson
      - test-r2dbc-lettuce
      - test-r2dbc-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-spring-boot
      - test-duckdb
      - test-cache
      - test-jdbc-caffeine
      - test-r2dbc-caffeine
      - test-clickhouse
      - test-trino
      - test-bigquery
      - test-timefold
      - test-spring-boot-batch
      - test-utils-batch
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '0 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts
      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - test-core
      - test-serialization
      - test-tink
      - test-jdbc-h2
      - test-jdbc-postgresql
      - test-jdbc-mysql
      - test-r2dbc-h2
      - test-r2dbc-postgresql
      - test-r2dbc-mysql
      - test-jdbc-lettuce
      - test-jdbc-redisson
      - test-r2dbc-lettuce
      - test-r2dbc-redisson
      - test-measured
      - test-postgresql-module
      - test-mysql8-module
      - test-spring-boot
      - test-duckdb
      - test-cache
      - test-jdbc-caffeine
      - test-r2dbc-caffeine
      - test-clickhouse
      - test-trino
      - test-bigquery
      - test-timefold
      - test-spring-boot-batch
      - test-utils-batch
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
