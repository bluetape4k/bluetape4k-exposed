<text class="title" x="56" y="72">H2 End-to-End Throughput</text><text class="subtitle" x="58" y="104" font-size="18">dataSize=10,000, poolSize=30</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">JDBC + VT</text><rect x="196" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="222" y="131">R2DBC</text><text class="label" x="56" y="173">parallelism 1</text><rect x="285" y="142" width="779.4884376053255" height="18" rx="7" fill="#8ecae6"/><text class="value" x="1074.4884376053255" y="157" font-size="16">2,155 ops/sec</text><rect x="285" y="166" width="367.878296916763" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="662.878296916763" y="181" font-size="16">171.8 ops/sec</text><text class="label" x="56" y="247">parallelism 4</text><rect x="285" y="216" width="650.7433801802634" height="18" rx="7" fill="#8ecae6"/><text class="value" x="945.7433801802634" y="231" font-size="16">976.9 ops/sec</text><rect x="285" y="240" width="133.10374142188886" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="428.10374142188886" y="255" font-size="16">40.6 ops/sec</text><text class="label" x="56" y="321">parallelism 8</text><rect x="285" y="290" width="577.245471457814" height="18" rx="7" fill="#8ecae6"/><text class="value" x="872.245471457814" y="305" font-size="16">621.9 ops/sec</text><rect x="285" y="314" width="36.316216444935094" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="331.3162164449351" y="329" font-size="16">22.4 ops/sec</text><text class="axis" x="285" y="396">log scale</text><text class="note" x="56" y="420">Higher is better. Log scale keeps both drivers readable.</text></svg>
