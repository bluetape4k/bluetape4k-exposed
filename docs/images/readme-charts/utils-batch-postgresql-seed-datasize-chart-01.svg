</style>
<rect width="1280" height="460" rx="0" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="412" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">PostgreSQL Seed Throughput by Data Size</text><text class="subtitle" x="58" y="104" font-size="18">poolSize=30</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">JDBC + VT</text><rect x="196" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="222" y="131">R2DBC</text><text class="label" x="56" y="173">1,000 rows</text><rect x="285" y="142" width="786.2558124587426" height="18" rx="7" fill="#8ecae6"/><text class="value" x="1081.2558124587426" y="157" font-size="16">147.6 ops/sec</text><rect x="285" y="166" width="457.48755580619627" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="752.4875558061963" y="181" font-size="16">4.10 ops/sec</text><text class="label" x="56" y="247">10,000 rows</text><rect x="285" y="216" width="572.7408158445569" height="18" rx="7" fill="#8ecae6"/><text class="value" x="867.7408158445569" y="231" font-size="16">14.4 ops/sec</text><rect x="285" y="240" width="243.97255919201075" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="538.9725591920107" y="255" font-size="16">0.400 ops/sec</text><text class="label" x="56" y="321">100,000 rows</text><rect x="285" y="290" width="358.90670750393133" height="18" rx="7" fill="#8ecae6"/><text class="value" x="653.9067075039313" y="305" font-size="16">1.40 ops/sec</text><rect x="285" y="314" width="20.47219998241104" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="315.47219998241104" y="329" font-size="16">0.035 ops/sec</text><text class="axis" x="285" y="396">log scale</text><text class="note" x="56" y="420">Higher is better. Log scale keeps small R2DBC values visible.</text></svg>
