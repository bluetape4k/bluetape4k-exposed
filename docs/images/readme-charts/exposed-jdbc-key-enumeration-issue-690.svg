<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">JDBC key enumeration throughput</title>
  <desc id="desc">Three-run median H2 throughput comparison between sequential keyset paging and opt-in parallel Virtual Thread range enumeration for 1,000 and 10,000 rows.</desc>
  <style>
    .background { fill: #08111f; }
    .panel { fill: #111f33; stroke: #263b57; stroke-width: 2; }
    .title { fill: #f8fafc; font: 700 34px "Architects Daughter", "Comic Mono", monospace; }
    .subtitle { fill: #a9bdd8; font: 16px "Comic Mono", monospace; }
    .panelTitle { fill: #f8fafc; font: 700 24px "Architects Daughter", "Comic Mono", monospace; }
    .panelSubtitle { fill: #a9bdd8; font: 15px "Comic Mono", monospace; }
    .label { fill: #dbeafe; font: 16px "Comic Mono", monospace; }
    .value { fill: #f8fafc; font: 700 15px "Comic Mono", monospace; }
    .tick { fill: #8da7c4; font: 13px "Comic Mono", monospace; }
    .footnote { fill: #8da7c4; font: 14px "Comic Mono", monospace; }
    .grid { stroke: #263b57; stroke-width: 1; stroke-dasharray: 4 6; }
  </style>
  <rect class="background" width="1600" height="980"/>
  <text x="44" y="58" class="title">JDBC key enumeration throughput</text>
  <text x="44" y="88" class="subtitle">Three-run median | JDK 25 | H2 | pool 10 | rangeCount 4 | ops/s</text>
  <rect x="1090" y="66" width="18" height="18" rx="4" fill="#38bdf8"/>
  <text x="1118" y="81" class="label">sequential keyset paging</text>
  <rect x="1350" y="66" width="18" height="18" rx="4" fill="#fbbf24"/>
  <text x="1378" y="81" class="label">parallel Virtual Thread</text>

  <rect x="44" y="126" width="1512" height="350" rx="18" class="panel"/>
  <text x="78" y="172" class="panelTitle">1,000 rows</text>
  <text x="78" y="198" class="panelSubtitle">same fixture and four disjoint PK ranges; axis max 16,000 ops/s</text>
  <line x1="430" y1="230" x2="430" y2="402" class="grid"/>
  <line x1="700" y1="230" x2="700" y2="402" class="grid"/>
  <line x1="970" y1="230" x2="970" y2="402" class="grid"/>
  <line x1="1240" y1="230" x2="1240" y2="402" class="grid"/>
  <line x1="1510" y1="230" x2="1510" y2="402" class="grid"/>
  <text x="78" y="266" class="label">sequentialKeysetPaging</text>
  <rect x="430" y="246" width="851.0" height="28" rx="6" fill="#38bdf8"/>
  <text x="1296" y="267" class="value">12,607 ops/s</text>
  <text x="78" y="344" class="label">parallelKeyEnumeration</text>
  <rect x="430" y="324" width="958.0" height="28" rx="6" fill="#fbbf24"/>
  <text x="1404" y="345" class="value">14,191 ops/s</text>
  <text x="422" y="430" class="tick">0</text>
  <text x="682" y="430" class="tick">4,000</text>
  <text x="950" y="430" class="tick">8,000</text>
  <text x="1214" y="430" class="tick">12,000</text>
  <text x="1475" y="430" class="tick">16,000 ops/s</text>

  <rect x="44" y="508" width="1512" height="350" rx="18" class="panel"/>
  <text x="78" y="554" class="panelTitle">10,000 rows</text>
  <text x="78" y="580" class="panelSubtitle">same fixture and four disjoint PK ranges; axis max 3,500 ops/s</text>
  <line x1="430" y1="612" x2="430" y2="784" class="grid"/>
  <line x1="738" y1="612" x2="738" y2="784" class="grid"/>
  <line x1="1046" y1="612" x2="1046" y2="784" class="grid"/>
  <line x1="1354" y1="612" x2="1354" y2="784" class="grid"/>
  <line x1="1510" y1="612" x2="1510" y2="784" class="grid"/>
  <text x="78" y="648" class="label">sequentialKeysetPaging</text>
  <rect x="430" y="628" width="385.7" height="28" rx="6" fill="#38bdf8"/>
  <text x="830" y="649" class="value">1,250 ops/s</text>
  <text x="78" y="726" class="label">parallelKeyEnumeration</text>
  <rect x="430" y="706" width="913.4" height="28" rx="6" fill="#fbbf24"/>
  <text x="1358" y="727" class="value">2,960 ops/s</text>
  <text x="422" y="812" class="tick">0</text>
  <text x="720" y="812" class="tick">1,000</text>
  <text x="1028" y="812" class="tick">2,000</text>
  <text x="1336" y="812" class="tick">3,000</text>
  <text x="1465" y="812" class="tick">3,500 ops/s</text>

  <text x="44" y="904" class="footnote">Median of three independent runs; raw JSON is preserved under docs/benchmarks/exposed-benchmark-2026-08-19-issue-690/.</text>
  <text x="44" y="930" class="footnote">Interpret each row-count panel on its own axis. H2 is directional evidence only; it does not establish a PostgreSQL/MySQL production gain.</text>
</svg>
