<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
<style>
.title{font-family:"Architects Daughter";font-size:34px;font-weight:400;fill:#273043}
.subtitle,.axis,.legend,.note{font-family:"Comic Mono";fill:#6b7280;font-weight:400}
.label{font-family:"Comic Mono";fill:#273043;font-weight:400}
.value{font-family:"Comic Mono";fill:#273043;font-weight:400;font-size:18px}
.axis{font-size:16px}.legend{font-size:18px}.note{font-size:17px}.label{font-size:18px}
</style>
<rect width="1280" height="460" rx="0" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="412" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">PostgreSQL End-to-End Throughput</text><text class="subtitle" x="58" y="104" font-size="18">dataSize=10,000, poolSize=30</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">JDBC + VT</text><rect x="196" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="222" y="131">R2DBC</text><text class="label" x="56" y="173">parallelism 1</text><rect x="285" y="142" width="613.7822091796952" height="18" rx="7" fill="#8ecae6"/><text class="value" x="908.7822091796952" y="157" font-size="16">5.10 ops/sec</text><rect x="285" y="166" width="49.46826574074089" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="344.4682657407409" y="181" font-size="16">0.400 ops/sec</text><text class="label" x="56" y="247">parallelism 4</text><rect x="285" y="216" width="773.8708691127749" height="18" rx="7" fill="#8ecae6"/><text class="value" x="1068.870869112775" y="231" font-size="16">10.5 ops/sec</text><rect x="285" y="240" width="595.6751632014548" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="890.6751632014548" y="255" font-size="16">4.70 ops/sec</text><text class="label" x="56" y="321">parallelism 8</text><rect x="285" y="290" width="771.7494358781064" height="18" rx="7" fill="#8ecae6"/><text class="value" x="1066.7494358781064" y="305" font-size="16">10.4 ops/sec</text><rect x="285" y="314" width="756.3022279681625" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1051.3022279681625" y="329" font-size="16">9.70 ops/sec</text><text class="axis" x="285" y="396">log scale</text><text class="note" x="56" y="420">Higher is better. Log scale keeps both drivers readable.</text></svg>
