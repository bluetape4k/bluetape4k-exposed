<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1360" viewBox="0 0 1680 1360" role="img" aria-labelledby="title desc">
  <title id="title">CockroachDB Helper Boundary</title>
  <desc id="desc">Vertical compatibility boundary diagram for exposed-cockroachdb showing application Exposed usage, helper contract, PostgreSQL-wire JDBC execution, verified CockroachDB compatibility slice, and deferred or out-of-scope paths.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .layer-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>

  <rect class="canvas" width="1680" height="1360"/>
  <rect class="frame" x="44" y="36" width="1592" height="1288" rx="34"/>
  <text class="title" x="72" y="88">CockroachDB Helper Boundary</text>
  <text class="subtitle" x="76" y="121">A bounded helper slice: PostgreSQL-wire JDBC plus verified Exposed behavior, without claiming a custom CockroachDB dialect.</text>

  <g id="layer-app">
    <rect class="layer" x="82" y="160" width="1516" height="174" rx="18"/>
    <text class="layer-title" x="112" y="188" dominant-baseline="middle">1. Application and Exposed usage</text>
  </g>
  <g id="layer-helper">
    <rect class="layer" x="82" y="376" width="1516" height="226" rx="18"/>
    <text class="layer-title" x="112" y="404" dominant-baseline="middle">2. Helper contract</text>
  </g>
  <g id="layer-wire">
    <rect class="layer" x="82" y="644" width="1516" height="184" rx="18"/>
    <text class="layer-title" x="112" y="672" dominant-baseline="middle">3. PostgreSQL-wire execution</text>
  </g>
  <g id="layer-boundary">
    <rect class="layer" x="82" y="870" width="1516" height="286" rx="18"/>
    <text class="layer-title" x="112" y="898" dominant-baseline="middle">4. Verified slice and explicit limits</text>
  </g>

  <path data-edge="app-&gt;factory" class="connector" d="M 360 282 L 360 454" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="serializable-&gt;retry" class="connector" d="M 840 282 L 840 454" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="pool-&gt;datasource" class="connector" d="M 1320 282 L 1320 454" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="factory-&gt;jdbc" class="connector" d="M 360 574 L 360 634 L 700 634 L 700 704" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="retry-&gt;jdbc" class="connector" d="M 840 574 L 840 704" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="datasource-&gt;jdbc" class="connector" d="M 1320 574 L 1320 634 L 980 634 L 980 704" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="jdbc-&gt;server" class="connector" d="M 840 764 L 840 930" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="server-&gt;evidence" class="connector" d="M 700 986 L 560 986" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="server-&gt;deferred" class="connector" d="M 980 986 L 1120 986" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="deferred-&gt;outofscope" class="connector" d="M 1320 1030 L 1320 1100 L 840 1100" stroke="#C94D68" marker-end="url(#arrow-red)"/>

  <g id="node-app" data-node="app" transform="translate(210,222)">
    <rect class="card" x="0" y="0" width="300" height="60" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="150" y="23" text-anchor="middle" dominant-baseline="middle">Application code</text>
    <text class="detail" x="150" y="45" text-anchor="middle" dominant-baseline="middle">connect, schema, insert, select</text>
  </g>
  <g id="node-serializable" data-node="serializable" transform="translate(690,222)">
    <rect class="card" x="0" y="0" width="300" height="60" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="150" y="23" text-anchor="middle" dominant-baseline="middle">Serializable work</text>
    <text class="detail" x="150" y="45" text-anchor="middle" dominant-baseline="middle">top-level retry helper</text>
  </g>
  <g id="node-pool" data-node="pool" transform="translate(1170,222)">
    <rect class="card" x="0" y="0" width="300" height="60" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="23" text-anchor="middle" dominant-baseline="middle">Caller pool</text>
    <text class="detail" x="150" y="45" text-anchor="middle" dominant-baseline="middle">HikariCP or DataSource</text>
  </g>

  <g id="node-factory" data-node="factory" transform="translate(220,454)">
    <rect class="card" x="0" y="0" width="280" height="120" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="140" y="30" text-anchor="middle" dominant-baseline="middle">CockroachDatabase</text>
    <text class="detail" x="140" y="56" text-anchor="middle" dominant-baseline="middle">host/port/database factory</text>
    <text class="detail" x="140" y="78" text-anchor="middle" dominant-baseline="middle">jdbc:postgresql URL guard</text>
    <text class="detail" x="140" y="100" text-anchor="middle" dominant-baseline="middle">loads org.postgresql.Driver</text>
  </g>
  <g id="node-retry" data-node="retry" transform="translate(640,454)">
    <rect class="card" x="0" y="0" width="400" height="120" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="200" y="30" text-anchor="middle" dominant-baseline="middle">withCockroachTransaction</text>
    <text class="detail" x="200" y="56" text-anchor="middle" dominant-baseline="middle">outer retry loop only</text>
    <text class="detail" x="200" y="78" text-anchor="middle" dominant-baseline="middle">inner Exposed maxAttempts = 1</text>
    <text class="detail" x="200" y="100" text-anchor="middle" dominant-baseline="middle">SQLSTATE 40001 signature</text>
  </g>
  <g id="node-datasource" data-node="datasource" transform="translate(1180,454)">
    <rect class="card" x="0" y="0" width="280" height="120" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="140" y="30" text-anchor="middle" dominant-baseline="middle">DataSource path</text>
    <text class="detail" x="140" y="56" text-anchor="middle" dominant-baseline="middle">Database.connect</text>
    <text class="detail" x="140" y="78" text-anchor="middle" dominant-baseline="middle">pool is caller-owned</text>
    <text class="detail" x="140" y="100" text-anchor="middle" dominant-baseline="middle">HikariCP example</text>
  </g>

  <g id="node-jdbc" data-node="jdbc" transform="translate(640,704)">
    <rect class="card" x="0" y="0" width="400" height="60" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="200" y="23" text-anchor="middle" dominant-baseline="middle">PostgreSQL JDBC and Exposed</text>
    <text class="detail" x="200" y="45" text-anchor="middle" dominant-baseline="middle">default PostgreSQL dialect behavior</text>
  </g>

  <g id="node-server" data-node="server" transform="translate(700,930)">
    <rect class="card" x="0" y="0" width="280" height="112" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="140" y="29" text-anchor="middle" dominant-baseline="middle">CockroachDB node</text>
    <text class="detail" x="140" y="55" text-anchor="middle" dominant-baseline="middle">Testcontainers smoke coverage</text>
    <text class="detail" x="140" y="77" text-anchor="middle" dominant-baseline="middle">PostgreSQL wire protocol</text>
  </g>
  <g id="node-evidence" data-node="evidence" transform="translate(260,930)">
    <rect class="card" x="0" y="0" width="300" height="112" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="150" y="29" text-anchor="middle" dominant-baseline="middle">Verified slice</text>
    <text class="detail" x="150" y="55" text-anchor="middle" dominant-baseline="middle">PK, unique, index, ID</text>
    <text class="detail" x="150" y="77" text-anchor="middle" dominant-baseline="middle">RETURNING and metadata</text>
  </g>
  <g id="node-deferred" data-node="deferred" transform="translate(1120,930)">
    <rect class="card" x="0" y="0" width="400" height="100" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="200" y="29" text-anchor="middle" dominant-baseline="middle">Deferred compatibility</text>
    <text class="detail" x="200" y="55" text-anchor="middle" dominant-baseline="middle">migration diff no-op</text>
    <text class="detail" x="200" y="77" text-anchor="middle" dominant-baseline="middle">CREATE DOMAIN and range types</text>
  </g>
  <g id="node-outofscope" data-node="outofscope" transform="translate(510,1080)">
    <rect class="card" x="0" y="0" width="330" height="44" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="detail" x="165" y="23" text-anchor="middle" dominant-baseline="middle">Out of scope: custom CockroachDB dialect</text>
  </g>

  <g transform="translate(112,1200)">
    <rect class="constraint" x="0" y="0" width="1456" height="52" rx="10"/>
    <text class="small" x="728" y="20" text-anchor="middle" dominant-baseline="middle">Use this module when the verified PostgreSQL-wire path is enough.</text>
    <text class="small" x="728" y="40" text-anchor="middle" dominant-baseline="middle">Open a dialect slice only after an accepted CockroachDB-specific use case requires it.</text>
  </g>
</svg>
