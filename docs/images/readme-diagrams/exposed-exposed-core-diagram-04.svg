<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="980" viewBox="0 0 1460 980" role="img" aria-labelledby="title desc">
  <title id="title">exposed-core ExposedPage Data Model</title>
  <desc id="desc">Data model diagram for ExposedPage constructor fields and derived read-only properties.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 6.5 3.2 Q 11 5 6.5 6.8 L 1 9" fill="#536C85" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .panel{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476}
      .model{fill:#FBFDFF;stroke:#58A978;stroke-width:2.4;filter:url(#shadow)}
      .field{fill:#E8F3FF;stroke:#4F83BF;stroke-width:2;filter:url(#shadow)}
      .calc{fill:#FFF3D9;stroke:#D6A441;stroke-width:2;filter:url(#shadow)}
      .flag{fill:#F1ECFF;stroke:#755BC6;stroke-width:2;filter:url(#shadow)}
      .name{font-family:"Architects Daughter";font-size:24px;fill:#22344A;font-weight:400}
      .label{font-family:"Architects Daughter";font-size:21px;fill:#22344A;font-weight:400}
      .text{font-family:"Comic Mono";font-size:14px;fill:#34485E}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184}
      .divider{stroke:#86A0B8;stroke-width:1.4}
      .line{fill:none;stroke:#536C85;stroke-width:2.4;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow-536c85" viewBox="0 0 12 10" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 6.5 3.2 Q 11 5 6.5 6.8 L 1 9" fill="#536C85" style="stroke-dasharray:none!important" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect class="canvas" width="1460" height="980"/>
  <rect class="panel" x="42" y="36" width="1376" height="908" rx="30"/>
  <text class="title" x="72" y="88">ExposedPage Data Model</text>
  <text class="subtitle" x="76" y="121">The DTO stores four constructor values and derives page metadata through read-only getters.</text>

  <path class="line" d="M380 265 L505 265" style="marker-end:url(#arrow-536c85)"/>
  <path class="line" d="M380 365 L505 365" style="marker-end:url(#arrow-536c85)"/>
  <path class="line" d="M380 465 L505 465" style="marker-end:url(#arrow-536c85)"/>
  <path class="line" d="M380 565 L505 565" style="marker-end:url(#arrow-536c85)"/>
  <path class="line" d="M 875 335 L 930 335 Q 942 335 942 323 L 942 292 Q 942 280 954 280 L 1010 280" style="marker-end:url(#arrow-536c85)"/>
  <path class="line" d="M 875 405 L 950 405 Q 962 405 962 393 L 962 395 Q 962 395 974 395 L 1010 395" style="marker-end:url(#arrow-536c85)"/>
  <path class="line" d="M 875 475 L 930 475 Q 942 475 942 487 L 942 498 Q 942 510 954 510 L 1010 510" style="marker-end:url(#arrow-536c85)"/>
  <path class="line" d="M 875 545 L 930 545 Q 942 545 942 557 L 942 613 Q 942 625 954 625 L 1010 625" style="marker-end:url(#arrow-536c85)"/>

  <g transform="translate(115 225)">
    <rect class="field" x="0" y="0" width="265" height="78" rx="10"/>
    <text class="label" x="132.5" y="29" text-anchor="middle">content: List&lt;T&gt;</text>
    <text class="text" x="132.5" y="54" text-anchor="middle">page result items</text>
  </g>
  <g transform="translate(115 325)">
    <rect class="field" x="0" y="0" width="265" height="78" rx="10"/>
    <text class="label" x="132.5" y="29" text-anchor="middle">totalCount: Long</text>
    <text class="text" x="132.5" y="54" text-anchor="middle">full result count</text>
  </g>
  <g transform="translate(115 425)">
    <rect class="field" x="0" y="0" width="265" height="78" rx="10"/>
    <text class="label" x="132.5" y="29" text-anchor="middle">pageNumber: Int</text>
    <text class="text" x="132.5" y="54" text-anchor="middle">zero-based index</text>
  </g>
  <g transform="translate(115 525)">
    <rect class="field" x="0" y="0" width="265" height="78" rx="10"/>
    <text class="label" x="132.5" y="29" text-anchor="middle">pageSize: Int</text>
    <text class="text" x="132.5" y="54" text-anchor="middle">0 is allowed</text>
  </g>

  <g transform="translate(505 230)">
    <rect class="model" x="0" y="0" width="370" height="400" rx="12"/>
    <text class="name" x="185" y="36" text-anchor="middle">data class ExposedPage&lt;T&gt;</text>
    <line class="divider" x1="0" y1="60" x2="370" y2="60"/>
    <text class="text" x="22" y="92">+ content: List&lt;T&gt;</text>
    <text class="text" x="22" y="122">+ totalCount: Long</text>
    <text class="text" x="22" y="152">+ pageNumber: Int</text>
    <text class="text" x="22" y="182">+ pageSize: Int</text>
    <line class="divider" x1="0" y1="212" x2="370" y2="212"/>
    <text class="text" x="22" y="244">+ totalPages: Int</text>
    <text class="text" x="22" y="274">+ isFirst: Boolean</text>
    <text class="text" x="22" y="304">+ isLast: Boolean</text>
    <text class="text" x="22" y="334">+ hasNext: Boolean</text>
    <text class="text" x="22" y="364">+ hasPrevious: Boolean</text>
  </g>

  <g transform="translate(1010 235)">
    <rect class="calc" x="0" y="0" width="310" height="92" rx="10"/>
    <text class="label" x="155" y="30" text-anchor="middle">totalPages</text>
    <text class="text" x="155" y="55" text-anchor="middle">pageSize == 0 ? 0</text>
    <text class="text" x="155" y="76" text-anchor="middle">ceil(totalCount / pageSize)</text>
  </g>
  <g transform="translate(1010 350)">
    <rect class="flag" x="0" y="0" width="310" height="92" rx="10"/>
    <text class="label" x="155" y="30" text-anchor="middle">isFirst / isLast</text>
    <text class="text" x="155" y="55" text-anchor="middle">pageNumber == 0</text>
    <text class="text" x="155" y="76" text-anchor="middle">pageNumber &gt;= totalPages - 1</text>
  </g>
  <g transform="translate(1010 465)">
    <rect class="flag" x="0" y="0" width="310" height="92" rx="10"/>
    <text class="label" x="155" y="30" text-anchor="middle">hasNext</text>
    <text class="text" x="155" y="55" text-anchor="middle">pageNumber &lt;</text>
    <text class="text" x="155" y="76" text-anchor="middle">totalPages - 1</text>
  </g>
  <g transform="translate(1010 580)">
    <rect class="flag" x="0" y="0" width="310" height="92" rx="10"/>
    <text class="label" x="155" y="30" text-anchor="middle">hasPrevious</text>
    <text class="text" x="155" y="55" text-anchor="middle">pageNumber &gt; 0</text>
    <text class="text" x="155" y="76" text-anchor="middle">independent of total count</text>
  </g>

  <g transform="translate(160 760)">
    <rect x="0" y="0" width="1140" height="72" rx="12" fill="#FBFDFF" stroke="#D7E2EC"/>
    <text class="label" x="570" y="29" text-anchor="middle">Immutability boundary</text>
    <text class="text" x="570" y="54" text-anchor="middle">The class does not store derived state; every metadata value is computed from constructor fields.</text>
  </g>

  <g transform="translate(76 870)">
    <rect x="0" y="0" width="1308" height="48" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="small" x="654" y="19" text-anchor="middle">This is a data model diagram: left boxes are stored fields, right boxes are derived getters.</text>
    <text class="small" x="654" y="36" text-anchor="middle">A pageSize of zero returns zero total pages, avoiding division by zero.</text>
  </g>
</svg>
