<svg xmlns="http://www.w3.org/2000/svg" width="998" height="782" viewBox="0 0 998 782" role="img" aria-label="HasIdentifier and ExposedPage">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
