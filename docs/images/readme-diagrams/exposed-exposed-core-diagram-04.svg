<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1120" viewBox="0 0 1520 1120" role="img" aria-labelledby="title desc">
  <title id="title">ExposedPage Result Model</title>
  <desc id="desc">Data-model diagram rebuilt from ExposedPage source, README usage examples, and ExposedPage unit tests.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1520" height="1120"/>
  <rect class="decor" x="44" y="36" width="1432" height="1048" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1356" height="824" rx="24"/>
  <text class="title" x="72" y="88">ExposedPage Result Model</text>
  <text class="subtitle" x="76" y="121">Immutable page content plus request metadata derive total pages and navigation flags without storing extra state.</text>
  <g id="group-inputs">
    <rect class="group" x="92" y="156" width="1336" height="260" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Stored constructor values</text>
  </g>
  <g id="group-dto">
    <rect class="group" x="92" y="456" width="1336" height="235" rx="18"/>
    <text class="group-title" x="122" y="480" dominant-baseline="middle">Immutable result DTO</text>
  </g>
  <g id="group-derived">
    <rect class="group" x="92" y="731" width="1336" height="235" rx="18"/>
    <text class="group-title" x="122" y="755" dominant-baseline="middle">Derived page metadata</text>
  </g>
  <path id="route-content-exposed-page" data-edge="content-&gt;exposed-page" data-label="stored field" class="connector" d="M 295 356 L 295 390 L 500 390 L 500 588 L 535 588" stroke="#4F83BF"/>
  <path id="route-total-count-exposed-page" data-edge="total-count-&gt;exposed-page" data-label="stored field" class="connector" d="M 670 356 L 670 540" stroke="#2E8F89"/>
  <path id="route-page-request-exposed-page" data-edge="page-request-&gt;exposed-page" data-label="stored field" class="connector" d="M 1080 356 L 1080 390 L 1020 390 L 1020 588 L 985 588" stroke="#B9851B"/>
  <path id="route-exposed-page-total-pages" data-edge="exposed-page-&gt;total-pages" data-label="derive page count" class="connector" d="M 625 636 L 625 790 L 315 790 L 315 820" stroke="#755BC6"/>
  <path id="route-exposed-page-position" data-edge="exposed-page-&gt;position" data-label="derive current position" class="connector" d="M 760 636 L 760 820" stroke="#2E8F89"/>
  <path id="route-exposed-page-navigation" data-edge="exposed-page-&gt;navigation" data-label="derive next/previous" class="connector" d="M 900 636 L 900 790 L 1210 790 L 1210 820" stroke="#C94D68"/>
  <g id="node-content" data-node="content" transform="translate(140,270)">
    <rect class="shape" x="0" y="0" width="310" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="155" y="24" text-anchor="middle" dominant-baseline="middle">content: List&lt;T&gt;</text>
    <text class="detail" x="155" y="43" text-anchor="middle" dominant-baseline="middle">query result items</text>
    <text class="detail" x="155" y="62" text-anchor="middle" dominant-baseline="middle">kept as provided</text>
  </g>
  <g id="node-total-count" data-node="total-count" transform="translate(520,270)">
    <rect class="shape" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">totalCount: Long</text>
    <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">full result size</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">used for page count</text>
  </g>
  <g id="node-page-request" data-node="page-request" transform="translate(900,270)">
    <rect class="shape" x="0" y="0" width="360" height="86" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="24" text-anchor="middle" dominant-baseline="middle">pageNumber + pageSize</text>
    <text class="detail" x="180" y="43" text-anchor="middle" dominant-baseline="middle">zero-based pageNumber</text>
    <text class="detail" x="180" y="62" text-anchor="middle" dominant-baseline="middle">pageSize can be 0</text>
  </g>
  <g id="node-exposed-page" data-node="exposed-page" transform="translate(535,540)">
    <rect class="shape" x="0" y="0" width="450" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="225" y="19.5" text-anchor="middle" dominant-baseline="middle">ExposedPage&lt;T&gt;</text>
    <text class="detail" x="225" y="38.5" text-anchor="middle" dominant-baseline="middle">data class</text>
    <text class="detail" x="225" y="57.5" text-anchor="middle" dominant-baseline="middle">content + paging fields</text>
    <text class="detail" x="225" y="76.5" text-anchor="middle" dominant-baseline="middle">computed getters only</text>
  </g>
  <g id="node-total-pages" data-node="total-pages" transform="translate(145,820)">
    <rect class="shape" x="0" y="0" width="340" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="170" y="24" text-anchor="middle" dominant-baseline="middle">totalPages</text>
    <text class="detail" x="170" y="43" text-anchor="middle" dominant-baseline="middle">pageSize == 0 -&gt; 0</text>
    <text class="detail" x="170" y="62" text-anchor="middle" dominant-baseline="middle">ceil(totalCount / pageSize)</text>
  </g>
  <g id="node-position" data-node="position" transform="translate(585,820)">
    <rect class="shape" x="0" y="0" width="360" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="180" y="24" text-anchor="middle" dominant-baseline="middle">position flags</text>
    <text class="detail" x="180" y="43" text-anchor="middle" dominant-baseline="middle">isFirst: pageNumber == 0</text>
    <text class="detail" x="180" y="62" text-anchor="middle" dominant-baseline="middle">isLast: pageNumber &gt;= totalPages - 1</text>
  </g>
  <g id="node-navigation" data-node="navigation" transform="translate(1035,820)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">navigation flags</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">hasNext: pageNumber &lt; totalPages - 1</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">hasPrevious: pageNumber &gt; 0</text>
  </g>
  <g transform="translate(76,1028)" data-footer="reader-contract">
    <rect class="pill" x="0" y="0" width="1368" height="48" rx="10"/>
    <text class="small" x="684" y="18" text-anchor="middle" dominant-baseline="middle">ExposedPage stores content and request metadata; navigation flags are derived on demand.</text>
    <text class="small" x="684" y="35" text-anchor="middle" dominant-baseline="middle">A pageSize of zero produces zero total pages rather than a divide-by-zero path.</text>
  </g>
</svg>
