<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="ExposedPage Result Model">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
  </style>
</defs>
<rect class="canvas" width="980" height="620"/>
<rect class="frame" x="32" y="28" width="916" height="564" rx="28"/>
<text class="title" x="66" y="82">ExposedPage Result Model</text>
<text class="subtitle" x="70" y="118">Current paginated result DTO; deprecated compatibility interfaces are omitted</text>
<g transform="translate(86,172)">
  <rect class="card" x="0" y="0" width="390" height="260" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="390" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="195" y="26" text-anchor="middle">data class</text>
  <text class="label" x="195" y="61" text-anchor="middle">ExposedPage&lt;T&gt;</text>
  <text class="mono" x="18" y="108">+content: List&lt;T&gt;</text>
  <text class="mono" x="18" y="129">+totalCount: Long</text>
  <text class="mono" x="18" y="150">+pageNumber: Int</text>
  <text class="mono" x="18" y="171">+pageSize: Int</text>
  <text class="mono" x="18" y="207">+totalPages: Int</text>
  <text class="mono" x="18" y="228">+isFirst / isLast / hasNext / hasPrevious</text>
</g>
<g transform="translate(548,172)">
  <rect class="card" x="0" y="0" width="346" height="260" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="173" y="58" text-anchor="middle">Usage Contract</text>
  <text class="mono" x="26" y="104">content holds the page items</text>
  <text class="mono" x="26" y="132">totalPages is derived from</text>
  <text class="mono" x="26" y="153">totalCount and pageSize</text>
  <text class="mono" x="26" y="190">navigation flags are computed</text>
  <text class="mono" x="26" y="211">from pageNumber and totalPages</text>
</g>
	<g transform="translate(86,472)">
	  <rect class="card" x="0" y="0" width="808" height="84" rx="18" fill="#FFF3D9" stroke="#D6A441"/>
	  <text class="label" x="28" y="35">Compatibility note</text>
	  <text class="small" x="30" y="61">Deprecated compatibility APIs are omitted; current diagrams prefer explicit DTO fields.</text>
	</g>
</svg>
