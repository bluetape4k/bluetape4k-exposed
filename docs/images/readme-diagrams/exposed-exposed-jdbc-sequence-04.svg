<g data-footer="reader-note"><rect class="note" x="110" y="2362" width="1520" height="48" rx="12"/><text class="small" x="870" y="2379" text-anchor="middle" dominant-baseline="middle">This is a sequence diagram: soft delete and restore are UPDATE operations on the isDeleted flag.</text><text class="small" x="870" y="2396" text-anchor="middle" dominant-baseline="middle">findActive and findDeleted reuse the same flag to filter lifecycle state.</text></g>
