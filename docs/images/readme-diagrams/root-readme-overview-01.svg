<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1240" viewBox="0 0 1640 1240" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Exposed Repository Overview</title>
  <desc id="desc">Repository overview rebuilt from root README features, module table, and settings.gradle.kts project mapping.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1640" height="1240"/>
  <rect class="decor" x="44" y="36" width="1552" height="1168" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1476" height="944" rx="24"/>
  <text class="title" x="72" y="88">Bluetape4k Exposed Repository Overview</text>
  <text class="subtitle" x="76" y="121">A production-oriented Exposed toolkit grouped by repository runtime, cache strategy, column extensions, database dialects, and Spring Boot integration.</text>
  <g id="group-foundation">
    <rect class="group" x="92" y="156" width="1456" height="245" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Foundation and repository runtime</text>
  </g>
  <g id="group-cache">
    <rect class="group" x="92" y="441" width="1456" height="195" rx="18"/>
    <text class="group-title" x="122" y="465" dominant-baseline="middle">Cache decorators</text>
  </g>
  <g id="group-columns">
    <rect class="group" x="92" y="676" width="1456" height="195" rx="18"/>
    <text class="group-title" x="122" y="700" dominant-baseline="middle">Column and value extensions</text>
  </g>
  <g id="group-dialects">
    <rect class="group" x="92" y="911" width="1456" height="205" rx="18"/>
    <text class="group-title" x="122" y="935" dominant-baseline="middle">Database dialect and analytics connectors</text>
  </g>
  <path id="route-core-dao" data-edge="core-&gt;dao" data-label="entity helpers build on core tables" class="connector" d="M 420 278 L 500 278" stroke="#2E8F89"/>
  <path id="route-cache-api-local-cache" data-edge="cache-api-&gt;local-cache" data-label="local cache implementation" class="connector" d="M 455 558 L 530 558" stroke="#3E9868"/>
  <path id="route-json-tink" data-edge="json-&gt;tink" data-label="same column extension surface" class="connector" d="M 475 793 L 560 793" stroke="#C94D68"/>
  <path id="route-tink-measured" data-edge="tink-&gt;measured" data-label="value conversion surface" class="connector" d="M 880 793 L 930 793" stroke="#2E8F89"/>
  <path id="route-sql-dialects-analytics" data-edge="sql-dialects-&gt;analytics" data-label="dialect-specific query surfaces" class="connector" d="M 450 1023 L 545 1023" stroke="#B9851B"/>
  <g id="node-core" data-node="core" transform="translate(120,230)">
    <rect class="shape" x="0" y="0" width="300" height="96" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="150" y="29" text-anchor="middle" dominant-baseline="middle">exposed-core</text>
    <text class="detail" x="150" y="48" text-anchor="middle" dominant-baseline="middle">Column types, DSL helpers</text>
    <text class="detail" x="150" y="67" text-anchor="middle" dominant-baseline="middle">auditable tables, CTE, paging</text>
  </g>
  <g id="node-dao" data-node="dao" transform="translate(500,230)">
    <rect class="shape" x="0" y="0" width="280" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="140" y="29" text-anchor="middle" dominant-baseline="middle">exposed-dao</text>
    <text class="detail" x="140" y="48" text-anchor="middle" dominant-baseline="middle">DAO entity extensions</text>
    <text class="detail" x="140" y="67" text-anchor="middle" dominant-baseline="middle">audit lifecycle hooks</text>
  </g>
  <g id="node-jdbc" data-node="jdbc" transform="translate(860,214)">
    <rect class="shape" x="0" y="0" width="270" height="90" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="135" y="26" text-anchor="middle" dominant-baseline="middle">exposed-jdbc</text>
    <text class="detail" x="135" y="45" text-anchor="middle" dominant-baseline="middle">blocking repository</text>
    <text class="detail" x="135" y="64" text-anchor="middle" dominant-baseline="middle">Exposed transaction</text>
  </g>
  <g id="node-r2dbc" data-node="r2dbc" transform="translate(1220,214)">
    <rect class="shape" x="0" y="0" width="270" height="90" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="135" y="26" text-anchor="middle" dominant-baseline="middle">exposed-r2dbc</text>
    <text class="detail" x="135" y="45" text-anchor="middle" dominant-baseline="middle">coroutine repository</text>
    <text class="detail" x="135" y="64" text-anchor="middle" dominant-baseline="middle">suspend transaction</text>
  </g>
  <g id="node-tests" data-node="tests" transform="translate(1040,312)">
    <rect class="shape" x="0" y="0" width="300" height="72" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="150" y="17" text-anchor="middle" dominant-baseline="middle">test fixtures</text>
    <text class="detail" x="150" y="36" text-anchor="middle" dominant-baseline="middle">JDBC and R2DBC test bases</text>
    <text class="detail" x="150" y="55" text-anchor="middle" dominant-baseline="middle">container-backed verification</text>
  </g>
  <g id="node-cache-api" data-node="cache-api" transform="translate(140,515)">
    <rect class="shape" x="0" y="0" width="315" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="157.5" y="24" text-anchor="middle" dominant-baseline="middle">exposed-cache</text>
    <text class="detail" x="157.5" y="43" text-anchor="middle" dominant-baseline="middle">cache repository contracts</text>
    <text class="detail" x="157.5" y="62" text-anchor="middle" dominant-baseline="middle">mode and resilience config</text>
  </g>
  <g id="node-local-cache" data-node="local-cache" transform="translate(530,515)">
    <rect class="shape" x="0" y="0" width="300" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Caffeine modules</text>
    <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">JDBC + local cache</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">R2DBC + local cache</text>
  </g>
  <g id="node-redis-cache" data-node="redis-cache" transform="translate(910,515)">
    <rect class="shape" x="0" y="0" width="310" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="155" y="24" text-anchor="middle" dominant-baseline="middle">Redis modules</text>
    <text class="detail" x="155" y="43" text-anchor="middle" dominant-baseline="middle">Lettuce and Redisson</text>
    <text class="detail" x="155" y="62" text-anchor="middle" dominant-baseline="middle">JDBC + R2DBC variants</text>
  </g>
  <g id="node-batch" data-node="batch" transform="translate(1290,515)">
    <rect class="shape" x="0" y="0" width="220" height="86" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="110" y="24" text-anchor="middle" dominant-baseline="middle">utils/batch</text>
    <text class="detail" x="110" y="43" text-anchor="middle" dominant-baseline="middle">chunked batch execution</text>
    <text class="detail" x="110" y="62" text-anchor="middle" dominant-baseline="middle">benchmark hub</text>
  </g>
  <g id="node-json" data-node="json" transform="translate(150,750)">
    <rect class="shape" x="0" y="0" width="325" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="162.5" y="24" text-anchor="middle" dominant-baseline="middle">JSON columns</text>
    <text class="detail" x="162.5" y="43" text-anchor="middle" dominant-baseline="middle">Jackson 2, Jackson 3</text>
    <text class="detail" x="162.5" y="62" text-anchor="middle" dominant-baseline="middle">Fastjson2 JSON/JSONB</text>
  </g>
  <g id="node-tink" data-node="tink" transform="translate(560,750)">
    <rect class="shape" x="0" y="0" width="320" height="86" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="160" y="24" text-anchor="middle" dominant-baseline="middle">encrypted columns</text>
    <text class="detail" x="160" y="43" text-anchor="middle" dominant-baseline="middle">Google Tink AEAD/DAEAD</text>
    <text class="detail" x="160" y="62" text-anchor="middle" dominant-baseline="middle">searchable deterministic path</text>
  </g>
  <g id="node-measured" data-node="measured" transform="translate(930,750)">
    <rect class="shape" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">measured columns</text>
    <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">unit-aware values</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">storage conversion</text>
  </g>
  <g id="node-timefold" data-node="timefold" transform="translate(1288,750)">
    <rect class="shape" x="0" y="0" width="230" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="115" y="24" text-anchor="middle" dominant-baseline="middle">Timefold persistence</text>
    <text class="detail" x="115" y="43" text-anchor="middle" dominant-baseline="middle">solver score storage</text>
    <text class="detail" x="115" y="62" text-anchor="middle" dominant-baseline="middle">Exposed persistence helpers</text>
  </g>
  <g id="node-sql-dialects" data-node="sql-dialects" transform="translate(130,985)">
    <rect class="shape" x="0" y="0" width="320" height="76" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="160" y="19" text-anchor="middle" dominant-baseline="middle">SQL dialect modules</text>
    <text class="detail" x="160" y="38" text-anchor="middle" dominant-baseline="middle">PostgreSQL, MySQL8</text>
    <text class="detail" x="160" y="57" text-anchor="middle" dominant-baseline="middle">CockroachDB smoke</text>
  </g>
  <g id="node-analytics" data-node="analytics" transform="translate(545,985)">
    <rect class="shape" x="0" y="0" width="350" height="76" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="175" y="19" text-anchor="middle" dominant-baseline="middle">analytics connectors</text>
    <text class="detail" x="175" y="38" text-anchor="middle" dominant-baseline="middle">BigQuery, ClickHouse</text>
    <text class="detail" x="175" y="57" text-anchor="middle" dominant-baseline="middle">Trino, StarRocks, DuckDB</text>
  </g>
  <g id="node-spring" data-node="spring" transform="translate(965,985)">
    <rect class="shape" x="0" y="0" width="330" height="76" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="165" y="19" text-anchor="middle" dominant-baseline="middle">Spring Boot modules</text>
    <text class="detail" x="165" y="38" text-anchor="middle" dominant-baseline="middle">JDBC, R2DBC, Batch</text>
    <text class="detail" x="165" y="57" text-anchor="middle" dominant-baseline="middle">Spring Modulith events</text>
  </g>
  <g id="node-examples" data-node="examples" transform="translate(1350,985)">
    <rect class="shape" x="0" y="0" width="165" height="76" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="82.5" y="19" text-anchor="middle" dominant-baseline="middle">examples</text>
    <text class="detail" x="82.5" y="38" text-anchor="middle" dominant-baseline="middle">BigQuery dry run</text>
    <text class="detail" x="82.5" y="57" text-anchor="middle" dominant-baseline="middle">ClickHouse OLTP/OLAP</text>
  </g>
  <g transform="translate(76,1148)" data-footer="repository-project-module">
    <rect class="pill" x="0" y="0" width="1488" height="48" rx="10"/>
    <text class="small" x="744" y="18" text-anchor="middle" dominant-baseline="middle">Start with exposed-jdbc or exposed-r2dbc, then add cache, column codecs, dialect modules, or Spring Boot integration only where the data path needs them.</text>
    <text class="small" x="744" y="35" text-anchor="middle" dominant-baseline="middle">BOM aligns dependency versions; it is not shown as a runtime component.</text>
  </g>
</svg>
