<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Soft Delete Visibility Flow</title>
  <desc id="desc">Flow diagram showing mutation and read visibility boundaries for SoftDeletedR2dbcRepository.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7e6ab8" stroke-dasharray="none"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#20303a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 44px; fill: #21343f; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 18px; fill: #51636f; }
      .laneTitle { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 30px; fill: #21343f; }
      .cardTitle { font-family: "Comic Mono", monospace; font-size: 20px; font-weight: 700; fill: #20323d; }
      .cardText { font-family: "Comic Mono", monospace; font-size: 16px; fill: #33454f; }
      .small { font-family: "Comic Mono", monospace; font-size: 14px; fill: #52636f; }
      .label { font-family: "Comic Mono", monospace; font-size: 14px; fill: #4b426b; }
      .flow { stroke: #7e6ab8; stroke-width: 4.4; marker-end: url(#arrow); fill: none; }
      .read { stroke: #5a8a55; stroke-width: 4.4; marker-end: url(#arrow); fill: none; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>
  <rect class="canvas" width="1680" height="980"/>
  <rect class="frame" x="42" y="34" width="1596" height="908" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Soft Delete Visibility Flow</text>
  <text class="subtitle" x="86" y="126">Soft delete changes a flag. Callers choose whether later reads include all, active, or deleted rows.</text>

  <g transform="translate(96 174)">
    <rect x="0" y="0" width="1488" height="292" rx="20" fill="#f3eefb" stroke="#b1a0d9" stroke-width="3"/>
    <text class="laneTitle" x="30" y="52">Mutation path</text>
    <rect x="92" y="104" width="250" height="116" rx="15" fill="#fffdf8" stroke="#b1a0d9" stroke-width="2"/>
    <text class="cardTitle" x="120" y="142">Caller</text>
    <text class="cardText code" x="120" y="174">softDeleteById(id)</text>
    <text class="cardText" x="120" y="202">or <tspan class="code">restoreById(id)</tspan></text>
    <path class="flow" d="M342 162 H446"/>
    <text class="label" x="368" y="140">intent</text>

    <rect x="466" y="104" width="304" height="116" rx="15" fill="#fffdf8" stroke="#b1a0d9" stroke-width="2"/>
    <text class="cardTitle type" x="494" y="142">SoftDeletedRepository</text>
    <text class="cardText" x="494" y="174"><tspan class="code">table.update</tspan>(id predicate)</text>
    <text class="cardText" x="494" y="202">does not delete the row</text>
    <path class="flow" d="M770 162 H874"/>
    <text class="label" x="794" y="140">update</text>

    <rect x="894" y="104" width="286" height="116" rx="15" fill="#fffdf8" stroke="#b1a0d9" stroke-width="2"/>
    <text class="cardTitle type" x="922" y="142">SoftDeletedIdTable</text>
    <text class="cardText" x="922" y="174"><tspan class="code">isDeleted</tspan> = <tspan class="keyword">true</tspan></text>
    <text class="cardText" x="922" y="202">or <tspan class="code">isDeleted</tspan> = <tspan class="keyword">false</tspan></text>
    <path class="flow" d="M1180 162 H1284"/>
    <text class="label" x="1206" y="140">persist</text>

    <rect x="1304" y="104" width="150" height="116" rx="15" fill="#fffdf8" stroke="#b1a0d9" stroke-width="2"/>
    <text class="cardTitle" x="1332" y="142">Row</text>
    <text class="cardText" x="1332" y="174">retained</text>
    <text class="small" x="1332" y="202">flag changed</text>
  </g>

  <g transform="translate(96 520)">
    <rect x="0" y="0" width="1488" height="330" rx="20" fill="#eef4e6" stroke="#a9c58b" stroke-width="3"/>
    <text class="laneTitle" x="30" y="52">Read visibility path</text>
    <rect x="92" y="98" width="250" height="116" rx="15" fill="#fffdf8" stroke="#a9c58b" stroke-width="2"/>
    <text class="cardTitle" x="120" y="136">Caller chooses</text>
    <text class="cardText" x="120" y="168">which rows are visible</text>
    <path d="M342 156 H410" stroke="#5a8a55" stroke-width="4.4" fill="none"/>
    <path d="M410 93 V277" stroke="#5a8a55" stroke-width="4.4" fill="none"/>
    <path class="read" d="M410 93 H446"/>
    <path class="read" d="M410 193 H446"/>
    <path class="read" d="M410 277 H446"/>

    <rect x="466" y="54" width="292" height="78" rx="14" fill="#fffdf8" stroke="#a9c58b" stroke-width="2"/>
    <text class="cardTitle" x="492" y="88">base <tspan class="code">findAll()</tspan></text>
    <text class="cardText" x="492" y="116">no <tspan class="code">isDeleted</tspan> filter</text>
    <rect x="466" y="154" width="292" height="78" rx="14" fill="#fffdf8" stroke="#a9c58b" stroke-width="2"/>
    <text class="cardTitle code" x="492" y="188">findActive()</text>
    <text class="cardText" x="492" y="216"><tspan class="code">isDeleted</tspan> = <tspan class="keyword">false</tspan></text>
    <rect x="466" y="238" width="292" height="78" rx="14" fill="#fffdf8" stroke="#a9c58b" stroke-width="2"/>
    <text class="cardTitle code" x="492" y="272">findDeleted()</text>
    <text class="cardText" x="492" y="300"><tspan class="code">isDeleted</tspan> = <tspan class="keyword">true</tspan></text>

    <path class="read" d="M758 93 H1200"/>
    <path class="read" d="M758 193 H1200"/>
    <path class="read" d="M758 277 H1200"/>
    <text class="label" x="1078" y="174">map rows</text>

    <rect x="1220" y="72" width="222" height="222" rx="15" fill="#fffdf8" stroke="#a9c58b" stroke-width="2"/>
    <text class="cardTitle type" x="1248" y="134">Flow&lt;E&gt;</text>
    <text class="cardText" x="1248" y="166"><tspan class="type">ResultRow</tspan>.<tspan class="code">toEntity()</tspan></text>
    <text class="small" x="1248" y="194">same mapping path</text>
  </g>

  <g transform="translate(126 872)">
    <rect x="0" y="0" width="1428" height="50" rx="14" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
    <text class="cardTitle" x="28" y="32">Boundary rule</text>
    <text class="cardText" x="194" y="32">Soft-delete filtering is opt-in; base repository reads intentionally keep deleted rows visible.</text>
  </g>
</svg>
