<text class="strong" x="653" y="1769" text-anchor="start">15. put(key, entity)</text>
<path class="line" d="M540 1800 L940 1800"/>
<rect x="441" y="1852" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="459" y="1879" text-anchor="start">16. writeBehindQueue.send(entry)</text>
<path class="line" d="M540 1910 C604 1910 604 1944 540 1944"/>
<rect x="235" y="1982" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="253" y="2009" text-anchor="start">17. done (immediate)</text>
