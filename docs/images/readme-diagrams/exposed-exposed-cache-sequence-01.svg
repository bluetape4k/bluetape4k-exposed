<g data-footer="reader-contract"><rect class="note" x="110" y="2202" width="1520" height="48" rx="12"/><text class="small" x="870" y="2219" text-anchor="middle" dominant-baseline="middle">READ_ONLY writes only cache state; WRITE_THROUGH returns after cache and DB both complete.</text><text class="small" x="870" y="2236" text-anchor="middle" dominant-baseline="middle">WRITE_BEHIND returns after queue acceptance; health reports queue depth, worker state, and last flush error.</text></g>
