<rect x="235" y="1632" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="253" y="1659" text-anchor="start">14. put(id, entity)</text>
<path class="line" d="M140 1690 L540 1690"/>
