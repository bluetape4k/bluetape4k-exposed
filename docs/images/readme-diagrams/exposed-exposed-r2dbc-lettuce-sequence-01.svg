<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1580" viewBox="0 0 1680 1580" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Lettuce Cache Sequence</title>
  <desc id="desc">Sequence diagram for NearCache, Redis loaded map, R2DBC loader, write-through or write-behind writer, and delete or clear cache behavior.</desc>
  <defs>
    <marker id="arrowCall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/></marker>
    <marker id="arrowCache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/></marker>
    <marker id="arrowDb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7e6ab8" stroke-dasharray="none"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke-dasharray="none"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/></filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle, .role, .msg, .note, .footer { font-family: "Comic Mono", monospace; fill: #52636f; }
      .subtitle { font-size: 18px; }
      .participantText { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 20px; fill: #1f3138; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; }
      .note { font-size: 13px; fill: #40515b; }
      .footer { font-size: 14px; }
      .participant { fill: #ffffff; stroke: #8db7c2; stroke-width: 2.2; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowCall); }
      .cache { fill: none; stroke: #6e8f4f; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowCache); }
      .db { fill: none; stroke: #7e6ab8; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowDb); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-linecap: round; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .alt { fill:#FFFFFF; fill-opacity:.12; stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .opt { fill: none; stroke: #7e6ab8; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .branchDivider { stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .branchHit { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.6; }
      .branchMiss { fill: #eaf4f8; stroke: #3f7d9c; stroke-width: 1.6; }
      .branchDb { fill: #f3eefb; stroke: #7e6ab8; stroke-width: 1.6; }
      .label { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; }
      .callLabel { stroke: #9cc2d1; }
      .cacheLabel { stroke: #b6c9a4; }
      .dbLabel { stroke: #b9addd; }
      .returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.7; }
      .callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .cacheBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .dbBadge { fill: #f3eefb; stroke: #7e6ab8; }
      .returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono", monospace; font-size: 11px; font-weight: 700; }
      .callText { fill: #2f6f8e; }
      .cacheText { fill: #55783f; }
      .dbText { fill: #6d58a8; }
      .returnText { fill: #7f6038; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="1580"/>
  <rect class="frame" x="42" y="34" width="1596" height="1494" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Lettuce Cache Sequence</text>
  <text class="subtitle" x="86" y="126">Reads short-circuit from NearCache or Redis; misses and DB writes pass through Exposed R2DBC loader/writer transactions.</text>

  <g id="participants">
    <rect class="participant" x="72" y="170" width="168" height="68" rx="10"/><text class="participantText" x="156" y="198" text-anchor="middle">Caller</text><text class="role" x="156" y="220" text-anchor="middle">coroutine</text>
    <rect class="participant" x="294" y="170" width="218" height="68" rx="10"/><text class="participantText" x="403" y="198" text-anchor="middle">Repository</text><text class="role" x="403" y="220" text-anchor="middle">R2dbcLettuce</text>
    <rect class="participant" x="566" y="170" width="208" height="68" rx="10"/><text class="participantText" x="670" y="198" text-anchor="middle">NearCache</text><text class="role" x="670" y="220" text-anchor="middle">optional Caffeine</text>
    <rect class="participant" x="828" y="170" width="224" height="68" rx="10"/><text class="participantText" x="940" y="198" text-anchor="middle">Redis map</text><text class="role" x="940" y="220" text-anchor="middle">Lettuce loaded map</text>
    <rect class="participant" x="1108" y="170" width="242" height="68" rx="10"/><text class="participantText" x="1229" y="198" text-anchor="middle">Loader / Writer</text><text class="role code" x="1229" y="220" text-anchor="middle">suspendTransaction</text>
    <rect class="participant" x="1460" y="170" width="130" height="68" rx="10"/><text class="participantText" x="1525" y="198" text-anchor="middle">DB</text><text class="role" x="1525" y="220" text-anchor="middle">rows</text>
  </g>

  <line class="lifeline" x1="156" y1="238" x2="156" y2="1450"/>
  <line class="lifeline" x1="403" y1="238" x2="403" y2="1450"/>
  <line class="lifeline" x1="670" y1="238" x2="670" y2="1450"/>
  <line class="lifeline" x1="940" y1="238" x2="940" y2="1450"/>
  <line class="lifeline" x1="1229" y1="238" x2="1229" y2="1450"/>
  <line class="lifeline" x1="1525" y1="238" x2="1525" y2="1450"/>
  <rect class="activation" x="396" y="310" width="14" height="976" rx="6"/>
  <rect class="activation" x="933" y="454" width="14" height="704" rx="6"/>
  <rect class="activation" x="1222" y="648" width="14" height="610" rx="6"/>

  <rect x="66" y="286" width="1548" height="420" rx="14" class="alt"/>
  <rect x="90" y="306" width="280" height="30" rx="15" class="branchHit"/><text class="note" x="114" y="326">alt NearCache hit</text>
  <line class="branchDivider" x1="66" y1="430" x2="1614" y2="430"/>
  <rect x="90" y="448" width="272" height="30" rx="15" class="branchMiss"/><text class="note" x="114" y="468">else Redis hit</text>
  <line class="branchDivider" x1="66" y1="572" x2="1614" y2="572"/>
  <rect x="90" y="590" width="302" height="30" rx="15" class="branchDb"/><text class="note" x="114" y="610">else Redis miss</text>

  <rect x="88" y="266" width="218" height="32" rx="16" class="label callLabel"/><circle cx="111" cy="282" r="12" class="badge callBadge"/><text x="111" y="286" text-anchor="middle" class="badgeText callText">1</text><text x="138" y="287" class="msg callText"><tspan class="code">findById(id)</tspan></text>
  <path class="call" d="M156 316 L403 316"/>
  <rect x="430" y="326" width="254" height="32" rx="16" class="label cacheLabel"/><circle cx="453" cy="342" r="12" class="badge cacheBadge"/><text x="453" y="346" text-anchor="middle" class="badgeText cacheText">2</text><text x="480" y="347" class="msg cacheText"><tspan class="code">nearCache.get(key)</tspan></text>
  <path class="cache" d="M403 374 L670 374"/>
  <rect x="432" y="386" width="190" height="32" rx="16" class="label returnLabel"/><circle cx="455" cy="402" r="12" class="badge returnBadge"/><text x="455" y="406" text-anchor="middle" class="badgeText returnText">3</text><text x="482" y="407" class="msg returnText">return <tspan class="type">E</tspan></text>
  <path class="return" d="M670 418 L403 418"/>

  <rect x="596" y="468" width="270" height="32" rx="16" class="label cacheLabel"/><circle cx="619" cy="484" r="12" class="badge cacheBadge"/><text x="619" y="488" text-anchor="middle" class="badgeText cacheText">4</text><text x="646" y="489" class="msg cacheText"><tspan class="code">cache.get(id)</tspan> on Redis</text>
  <path class="cache" d="M403 520 L940 520"/>
  <rect x="598" y="526" width="226" height="32" rx="16" class="label returnLabel"/><circle cx="621" cy="542" r="12" class="badge returnBadge"/><text x="621" y="546" text-anchor="middle" class="badgeText returnText">5</text><text x="648" y="547" class="msg returnText">Redis cached <tspan class="type">E</tspan></text>
  <path class="return" d="M940 558 L403 558"/>

  <rect x="758" y="616" width="306" height="32" rx="16" class="label dbLabel"/><circle cx="781" cy="632" r="12" class="badge dbBadge"/><text x="781" y="636" text-anchor="middle" class="badgeText dbText">6</text><text x="808" y="637" class="msg dbText">loader.load via R2DBC</text>
  <path class="db" d="M940 662 L1229 662"/>
  <rect x="1260" y="676" width="230" height="32" rx="16" class="label dbLabel"/><circle cx="1283" cy="692" r="12" class="badge dbBadge"/><text x="1283" y="696" text-anchor="middle" class="badgeText dbText">7</text><text x="1310" y="697" class="msg dbText"><tspan class="keyword">SELECT</tspan> by id</text>
  <path class="db" d="M1229 714 L1525 714"/>
  <rect x="1266" y="728" width="204" height="32" rx="16" class="label returnLabel"/><circle cx="1289" cy="744" r="12" class="badge returnBadge"/><text x="1289" y="748" text-anchor="middle" class="badgeText returnText">8</text><text x="1316" y="749" class="msg returnText"><tspan class="type">ResultRow?</tspan></text>
  <path class="return" d="M1525 766 L1229 766"/>
  <rect x="692" y="772" width="312" height="32" rx="16" class="label returnLabel"/><circle cx="715" cy="788" r="12" class="badge returnBadge"/><text x="715" y="792" text-anchor="middle" class="badgeText returnText">9</text><text x="742" y="793" class="msg returnText"><tspan class="code">toEntity()</tspan>, cache value</text>
  <path class="return" d="M1229 816 L403 816"/>

  <rect x="66" y="760" width="1548" height="302" rx="14" class="alt"/>
  <rect x="330" y="780" width="330" height="30" rx="15" class="branchHit"/><text class="note" x="354" y="800">save with write mode</text>
  <rect x="88" y="836" width="226" height="32" rx="16" class="label callLabel"/><circle cx="111" cy="852" r="12" class="badge callBadge"/><text x="111" y="856" text-anchor="middle" class="badgeText callText">10</text><text x="138" y="857" class="msg callText"><tspan class="code">save(id, entity)</tspan></text>
  <path class="call" d="M156 886 L403 886"/>
  <rect x="610" y="884" width="256" height="32" rx="16" class="label cacheLabel"/><circle cx="633" cy="900" r="12" class="badge cacheBadge"/><text x="633" y="904" text-anchor="middle" class="badgeText cacheText">11</text><text x="660" y="905" class="msg cacheText"><tspan class="code">cache.set(id, entity)</tspan></text>
  <path class="cache" d="M403 926 L940 926"/>
  <rect x="430" y="930" width="268" height="32" rx="16" class="label cacheLabel"/><circle cx="453" cy="946" r="12" class="badge cacheBadge"/><text x="453" y="950" text-anchor="middle" class="badgeText cacheText">12</text><text x="480" y="951" class="msg cacheText"><tspan class="code">nearCache.put</tspan> if enabled</text>
  <path class="cache" d="M403 976 L670 976"/>
  <rect x="982" y="986" width="330" height="32" rx="16" class="label dbLabel"/><circle cx="1005" cy="1002" r="12" class="badge dbBadge"/><text x="1005" y="1006" text-anchor="middle" class="badgeText dbText">13</text><text x="1032" y="1007" class="msg dbText">writer.write by <tspan class="type">WriteMode</tspan></text>
  <path class="db" d="M940 1032 L1229 1032"/>
  <rect x="1262" y="1018" width="304" height="32" rx="16" class="label dbLabel"/><circle cx="1285" cy="1034" r="12" class="badge dbBadge"/><text x="1285" y="1038" text-anchor="middle" class="badgeText dbText">14</text><text x="1312" y="1039" class="msg dbText"><tspan class="keyword">UPDATE</tspan>/<tspan class="keyword">INSERT</tspan> or queued write</text>
  <path class="db" d="M1229 1078 L1525 1078"/>
  <rect x="188" y="1012" width="286" height="32" rx="16" class="label returnLabel"/><circle cx="211" cy="1028" r="12" class="badge returnBadge"/><text x="211" y="1032" text-anchor="middle" class="badgeText returnText">15</text><text x="238" y="1033" class="msg returnText">return by write mode</text>
  <path class="return" d="M403 1108 L156 1108"/>

  <rect x="66" y="1128" width="1548" height="250" rx="14" class="opt"/>
  <rect x="90" y="1148" width="310" height="30" rx="15" class="branchDb"/><text class="note" x="114" y="1168">delete / invalidate / clear</text>
  <rect x="88" y="1200" width="292" height="32" rx="16" class="label callLabel"/><circle cx="111" cy="1216" r="12" class="badge callBadge"/><text x="111" y="1220" text-anchor="middle" class="badgeText callText">16</text><text x="138" y="1221" class="msg callText"><tspan class="code">delete</tspan>, <tspan class="code">invalidate</tspan>, <tspan class="code">clear</tspan></text>
  <path class="call" d="M156 1250 L403 1250"/>
  <rect x="610" y="1222" width="284" height="32" rx="16" class="label cacheLabel"/><circle cx="633" cy="1238" r="12" class="badge cacheBadge"/><text x="633" y="1242" text-anchor="middle" class="badgeText cacheText">17</text><text x="660" y="1243" class="msg cacheText">delete/evict Redis keys</text>
  <path class="cache" d="M403 1284 L940 1284"/>
  <rect x="430" y="1290" width="272" height="32" rx="16" class="label cacheLabel"/><circle cx="453" cy="1306" r="12" class="badge cacheBadge"/><text x="453" y="1310" text-anchor="middle" class="badgeText cacheText">18</text><text x="480" y="1311" class="msg cacheText">remove local keys</text>
  <path class="cache" d="M403 1338 L670 1338"/>
  <rect x="980" y="1310" width="366" height="32" rx="16" class="label dbLabel"/><circle cx="1003" cy="1326" r="12" class="badge dbBadge"/><text x="1003" y="1330" text-anchor="middle" class="badgeText dbText">19</text><text x="1030" y="1331" class="msg dbText">writer.delete for repository delete</text>
  <path class="db" d="M940 1364 L1229 1364"/>
  <rect x="1264" y="1366" width="208" height="32" rx="16" class="label dbLabel"/><circle cx="1287" cy="1382" r="12" class="badge dbBadge"/><text x="1287" y="1386" text-anchor="middle" class="badgeText dbText">20</text><text x="1314" y="1387" class="msg dbText"><tspan class="keyword">DELETE</tspan> rows</text>
  <path class="db" d="M1229 1414 L1525 1414"/>

  <rect x="128" y="1470" width="1424" height="42" rx="13" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
  <text class="footer" x="152" y="1496">Boundary rule: clearCache clears NearCache and Redis only; DB row changes happen through R2DBC writer paths.</text>
</svg>
