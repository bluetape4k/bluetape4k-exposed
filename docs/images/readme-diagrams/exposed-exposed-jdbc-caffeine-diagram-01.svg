<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1280" viewBox="0 0 1680 1280" role="img" aria-labelledby="title desc">
  <title id="title">JDBC Caffeine Local Cache Architecture</title>
  <desc id="desc">JDBC Caffeine architecture rebuilt from exposed-jdbc-caffeine README, AbstractJdbcCaffeineRepository, AbstractSuspendedJdbcCaffeineRepository, JdbcCacheRepository, and LocalCacheConfig source.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="0.8"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1280"/>
  <rect class="decor" x="44" y="36" width="1592" height="1208" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1516" height="984" rx="24"/>
  <text class="title" x="72" y="88">JDBC Caffeine Local Cache Architecture</text>
  <text class="subtitle" x="76" y="121">Sync and suspend JDBC repositories wrap Exposed table access with an in-process Caffeine cache; Redis is not part of this module.</text>
  <g id="group-api">
    <rect class="group" x="92" y="156" width="1496" height="210" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Reader-facing repository surface</text>
  </g>
  <g id="group-cache">
    <rect class="group" x="92" y="406" width="1496" height="265" rx="18"/>
    <text class="group-title" x="122" y="430" dominant-baseline="middle">Local Caffeine wrapper</text>
  </g>
  <g id="group-persistence">
    <rect class="group" x="92" y="711" width="1496" height="240" rx="18"/>
    <text class="group-title" x="122" y="735" dominant-baseline="middle">Exposed JDBC persistence path</text>
  </g>
  <g id="group-ops">
    <rect class="group" x="92" y="991" width="1496" height="165" rx="18"/>
    <text class="group-title" x="122" y="1015" dominant-baseline="middle">Write-behind and cache operations</text>
  </g>
  <path id="route-caller-sync-repo" data-edge="caller-&gt;sync-repo" data-label="blocking calls" class="connector" d="M 445 293 L 560 293" stroke="#3E9868"/>
  <path id="route-caller-suspend-repo" data-edge="caller-&gt;suspend-repo" data-label="suspend calls" class="connector" d="M 290 336 L 290 360 L 1270 360 L 1270 339" stroke="#755BC6"/>
  <path id="route-sync-repo-contract" data-edge="sync-repo-&gt;contract" data-label="implements cache contract" class="connector" d="M 650 339 L 650 456 L 310 456 L 310 500" stroke="#4F83BF"/>
  <path id="route-suspend-repo-contract" data-edge="suspend-repo-&gt;contract" data-label="suspend variant mirrors contract" class="connector" d="M 1170 339 L 1170 456 L 310 456 L 310 500" stroke="#755BC6"/>
  <path id="route-config-caffeine" data-edge="config-&gt;caffeine" data-label="builds local cache" class="connector" d="M 930 548 L 1035 548" stroke="#3E9868"/>
  <path id="route-contract-caffeine" data-edge="contract-&gt;caffeine" data-label="get/put/invalidate" class="connector" d="M 310 596 L 310 650 L 1225 650 L 1225 612" stroke="#3E9868"/>
  <path id="route-contract-jdbc-tx" data-edge="contract-&gt;jdbc-tx" data-label="misses and writes delegate" class="connector" d="M 480 548 L 520 548 L 520 760 L 785 760 L 785 790" stroke="#2E8F89"/>
  <path id="route-table-jdbc-tx" data-edge="table-&gt;jdbc-tx" data-label="table + mapper" class="connector" d="M 470 848 L 590 848" stroke="#755BC6"/>
  <path id="route-jdbc-tx-database" data-edge="jdbc-tx-&gt;database" data-label="JDBC statements" class="connector" d="M 980 846 L 1110 846" stroke="#C94D68"/>
  <path id="route-write-through-jdbc-tx" data-edge="write-through-&gt;jdbc-tx" data-label="sync DB update" class="connector" d="M 660 1070 L 660 902" stroke="#2E8F89"/>
  <path id="route-write-behind-jdbc-tx" data-edge="write-behind-&gt;jdbc-tx" data-label="batch flush" class="connector" d="M 1055 1070 L 1055 940 L 785 940 L 785 902" stroke="#B9851B"/>
  <path id="route-evict-caffeine" data-edge="evict-&gt;caffeine" data-label="cache removal only" class="connector" d="M 1520 1105 L 1545 1105 L 1545 548 L 1415 548" stroke="#758297"/>
  <g id="node-caller" data-node="caller" transform="translate(135,250)">
    <rect class="shape" x="0" y="0" width="310" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="155" y="24" text-anchor="middle" dominant-baseline="middle">Application code</text>
    <text class="detail" x="155" y="43" text-anchor="middle" dominant-baseline="middle">get, put, putAll</text>
    <text class="detail" x="155" y="62" text-anchor="middle" dominant-baseline="middle">invalidate, clear</text>
  </g>
  <g id="node-sync-repo" data-node="sync-repo" transform="translate(560,235)">
    <rect class="shape" x="0" y="0" width="390" height="104" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="195" y="33" text-anchor="middle" dominant-baseline="middle">Sync Caffeine repository</text>
    <text class="detail" x="195" y="52" text-anchor="middle" dominant-baseline="middle">AbstractJdbcCaffeineRepository</text>
    <text class="detail" x="195" y="71" text-anchor="middle" dominant-baseline="middle">blocking transaction {}</text>
  </g>
  <g id="node-suspend-repo" data-node="suspend-repo" transform="translate(1070,235)">
    <rect class="shape" x="0" y="0" width="400" height="104" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="200" y="33" text-anchor="middle" dominant-baseline="middle">Suspend Caffeine repository</text>
    <text class="detail" x="200" y="52" text-anchor="middle" dominant-baseline="middle">AbstractSuspendedJdbcCaffeineRepository</text>
    <text class="detail" x="200" y="71" text-anchor="middle" dominant-baseline="middle">suspendedTransactionAsync</text>
  </g>
  <g id="node-contract" data-node="contract" transform="translate(140,500)">
    <rect class="shape" x="0" y="0" width="340" height="96" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="170" y="29" text-anchor="middle" dominant-baseline="middle">JdbcCacheRepository contract</text>
    <text class="detail" x="170" y="48" text-anchor="middle" dominant-baseline="middle">read-through lookup</text>
    <text class="detail" x="170" y="67" text-anchor="middle" dominant-baseline="middle">write mode dispatch</text>
  </g>
  <g id="node-config" data-node="config" transform="translate(570,494)">
    <rect class="shape" x="0" y="0" width="360" height="108" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="35" text-anchor="middle" dominant-baseline="middle">LocalCacheConfig</text>
    <text class="detail" x="180" y="54" text-anchor="middle" dominant-baseline="middle">keyPrefix, maximumSize, TTL</text>
    <text class="detail" x="180" y="73" text-anchor="middle" dominant-baseline="middle">READ_ONLY / THROUGH / BEHIND</text>
  </g>
  <g id="node-caffeine" data-node="caffeine" transform="translate(1035,494)">
    <rect class="shape" x="0" y="0" width="380" height="118" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="190" y="30.5" text-anchor="middle" dominant-baseline="middle">Caffeine Cache&lt;String,E&gt;</text>
    <text class="detail" x="190" y="49.5" text-anchor="middle" dominant-baseline="middle">in-process local cache</text>
    <text class="detail" x="190" y="68.5" text-anchor="middle" dominant-baseline="middle">CacheMode.LOCAL only</text>
    <text class="detail" x="190" y="87.5" text-anchor="middle" dominant-baseline="middle">no Redis/network cache</text>
  </g>
  <g id="node-table" data-node="table" transform="translate(140,805)">
    <rect class="shape" x="0" y="0" width="330" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="165" y="24" text-anchor="middle" dominant-baseline="middle">Exposed IdTable&lt;ID&gt;</text>
    <text class="detail" x="165" y="43" text-anchor="middle" dominant-baseline="middle">repository table</text>
    <text class="detail" x="165" y="62" text-anchor="middle" dominant-baseline="middle">ResultRow.toEntity</text>
  </g>
  <g id="node-jdbc-tx" data-node="jdbc-tx" transform="translate(590,790)">
    <rect class="shape" x="0" y="0" width="390" height="112" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="195" y="37" text-anchor="middle" dominant-baseline="middle">JDBC transaction path</text>
    <text class="detail" x="195" y="56" text-anchor="middle" dominant-baseline="middle">selectAll/update/batchInsert</text>
    <text class="detail" x="195" y="75" text-anchor="middle" dominant-baseline="middle">auto-increment insert skip</text>
  </g>
  <g id="node-database" data-node="database" transform="translate(1110,805)">
    <rect class="shape" x="0" y="0" width="330" height="86" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="165" y="24" text-anchor="middle" dominant-baseline="middle">SQL database</text>
    <text class="detail" x="165" y="43" text-anchor="middle" dominant-baseline="middle">H2, PostgreSQL, MySQL</text>
    <text class="detail" x="165" y="62" text-anchor="middle" dominant-baseline="middle">Testcontainers verified</text>
  </g>
  <g id="node-read" data-node="read" transform="translate(140,1070)">
    <rect class="shape" x="0" y="0" width="280" height="70" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="140" y="16" text-anchor="middle" dominant-baseline="middle">Read-through</text>
    <text class="detail" x="140" y="35" text-anchor="middle" dominant-baseline="middle">miss loads from DB</text>
    <text class="detail" x="140" y="54" text-anchor="middle" dominant-baseline="middle">findAll warms cache</text>
  </g>
  <g id="node-write-through" data-node="write-through" transform="translate(510,1070)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="16" text-anchor="middle" dominant-baseline="middle">Write-through</text>
    <text class="detail" x="150" y="35" text-anchor="middle" dominant-baseline="middle">cache + DB together</text>
    <text class="detail" x="150" y="54" text-anchor="middle" dominant-baseline="middle">synchronous consistency</text>
  </g>
  <g id="node-write-behind" data-node="write-behind" transform="translate(900,1070)">
    <rect class="shape" x="0" y="0" width="310" height="70" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="155" y="16" text-anchor="middle" dominant-baseline="middle">Write-behind</text>
    <text class="detail" x="155" y="35" text-anchor="middle" dominant-baseline="middle">bounded Channel</text>
    <text class="detail" x="155" y="54" text-anchor="middle" dominant-baseline="middle">background batch flush</text>
  </g>
  <g id="node-evict" data-node="evict" transform="translate(1300,1070)">
    <rect class="shape" x="0" y="0" width="220" height="70" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="110" y="16" text-anchor="middle" dominant-baseline="middle">Evict only</text>
    <text class="detail" x="110" y="35" text-anchor="middle" dominant-baseline="middle">invalidate / clear</text>
    <text class="detail" x="110" y="54" text-anchor="middle" dominant-baseline="middle">DB unchanged</text>
  </g>
  <g transform="translate(76,1188)" data-footer="reader-note">
    <rect class="pill" x="0" y="0" width="1528" height="48" rx="10"/>
    <text class="small" x="764" y="18" text-anchor="middle" dominant-baseline="middle">This architecture view shows local cache ownership and JDBC transaction boundaries, not a class hierarchy.</text>
    <text class="small" x="764" y="35" text-anchor="middle" dominant-baseline="middle">Caffeine is in-process only; write-behind uses a bounded Channel and background batch flush.</text>
  </g>
</svg>
