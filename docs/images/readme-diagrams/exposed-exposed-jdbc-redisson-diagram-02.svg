<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="902" viewBox="0 0 1366 902" role="img" aria-label="Synchronous Repository Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1366" height="902"/>
<rect class="frame" x="32" y="28" width="1302" height="846" rx="28"/>
<text class="title" x="66" y="82">Synchronous Repository Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="inheritLine" d="M1103 498 C1103 415 683 415 683 332"/>
<path class="inheritLine" d="M683 498 C683 415 263 415 263 332"/>
<path class="line" d="M263 498 C263 415 683 415 683 332"/>
<path class="line" d="M263 498 C263 415 263 415 263 332"/>
<path class="implLine" d="M263 498 C263 463 1103 463 1103 428"/>
<g transform="translate(88,180)">
  <rect class="card" x="0" y="0" width="350" height="144" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="175" y="57" text-anchor="middle">EntityMapLoaderID_E</text>
  <text class="mono" x="18" y="108">+load(key: ID): E?</text>
<text class="mono" x="18" y="132">+loadAllKeys(): Iterable~ID~?</text>
</g>
<g transform="translate(508,180)">
  <rect class="card" x="0" y="0" width="350" height="144" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
  <text class="small" x="175" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="175" y="57" text-anchor="middle">EntityMapWriterID_E</text>
  <text class="mono" x="18" y="108">+write(map: Map~ID, E~)</text>
<text class="mono" x="18" y="132">+delete(keys: Collection~Any~)</text>
</g>
<g transform="translate(928,180)">
  <rect class="card" x="0" y="0" width="350" height="240" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="57" text-anchor="middle">JdbcRedissonRepositoryID_E</text>
  <text class="mono" x="18" y="108">+cacheName: String</text>
<text class="mono" x="18" y="132">+table: IdTable~ID~</text>
<text class="mono" x="18" y="156">+cache: RMap~ID, E~</text>
<text class="mono" x="18" y="180">+extractId(entity: E): ID</text>
<text class="mono" x="18" y="204">+toEntity(ResultRow): E</text>
<text class="mono" x="18" y="228">+exists(id: ID): Boolean</text>
</g>
<g transform="translate(88,506)">
  <rect class="card" x="0" y="0" width="350" height="240" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#DC6B82"/>
  <text class="small" x="175" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="175" y="57" text-anchor="middle">AbstractJdbcRedissonRepositoryID_E</text>
  <text class="mono" x="18" y="108">+redissonClient: RedissonClient</text>
<text class="mono" x="18" y="132">+cacheName: String</text>
<text class="mono" x="18" y="156">#config: RedissonCacheConfig</text>
<text class="mono" x="18" y="180">#mapLoader: EntityMapLoader~ID, E~</text>
<text class="mono" x="18" y="204">#mapWriter: EntityMapWriter~ID, E~?</text>
<text class="mono" x="18" y="228">#createLocalCacheMap(): RLocalCachedMap</text>
</g>
<g transform="translate(508,506)">
  <rect class="card" x="0" y="0" width="350" height="168" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#45A7A1"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="57" text-anchor="middle">ExposedEntityMapLoaderID_E</text>
  <text class="mono" x="18" y="108">-entityTable: IdTable~ID~</text>
<text class="mono" x="18" y="132">-batchSize: Int</text>
<text class="mono" x="18" y="156">-toEntity: ResultRow.() -&gt; E</text>
</g>
<g transform="translate(928,506)">
  <rect class="card" x="0" y="0" width="350" height="216" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#8A72D6"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="57" text-anchor="middle">ExposedEntityMapWriterID_E</text>
  <text class="mono" x="18" y="108">-entityTable: IdTable~ID~</text>
<text class="mono" x="18" y="132">-updateBody: (UpdateStatement, E) -&gt; Unit</text>
<text class="mono" x="18" y="156">-batchInsertBody: BatchInsertStatement.(E) -&gt; Unit</text>
<text class="mono" x="18" y="180">-deleteFromDBOnInvalidate: Boolean</text>
<text class="mono" x="18" y="204">-writeMode: WriteMode</text>
</g>
<rect x="205" y="400" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="263" y="418" text-anchor="middle">mapLoader</text>
<rect x="415" y="400" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="473" y="418" text-anchor="middle">mapWriter (nullab.</text>
</svg>
