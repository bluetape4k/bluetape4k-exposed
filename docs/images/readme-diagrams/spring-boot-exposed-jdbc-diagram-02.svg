<path class="repo" d="M 1250 790 L 1250 812 Q 1250 824 1238 824 L 912 824 Q 900 824 900 836 L 900 870" style="marker-end:url(#arrow-5b8def)"/>

<g transform="translate(96,190)">
  <rect class="card" x="0" y="0" width="294" height="92" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="147" y="35" text-anchor="middle">Service Layer</text>
  <text class="mono" x="147" y="64" text-anchor="middle">repository.findByName()</text>
</g>
<g transform="translate(506,190)">
  <rect class="card" x="0" y="0" width="284" height="92" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="142" y="35" text-anchor="middle">Repository Proxy</text>
  <text class="small" x="142" y="64" text-anchor="middle">Spring Data dispatch</text>
</g>
<g transform="translate(906,190)">
  <rect class="card" x="0" y="0" width="328" height="118" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="164" y="34" text-anchor="middle">Query Lookup Strategy</text>
  <text class="small" x="164" y="64" text-anchor="middle">USE_DECLARED_QUERY</text>
  <text class="small" x="164" y="88" text-anchor="middle">CREATE or CREATE_IF_NOT_FOUND</text>
</g>

<g transform="translate(260,430)">
  <rect class="card" x="0" y="0" width="260" height="60" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="130" y="38" text-anchor="middle">@Query present?</text>
</g>
<g transform="translate(690,430)">
  <rect class="card" x="0" y="0" width="260" height="60" rx="8" fill="#fff7e8" stroke="#d99a36"/>
  <text class="label" x="130" y="38" text-anchor="middle">PartTree method?</text>
</g>
<g transform="translate(1120,430)">
  <rect class="card" x="0" y="0" width="260" height="60" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="130" y="38" text-anchor="middle">Base operation?</text>
</g>

<g transform="translate(240,654)">
  <rect class="card" x="0" y="0" width="300" height="136" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="150" y="34" text-anchor="middle">DeclaredExposedQuery</text>
  <text class="small" x="150" y="64" text-anchor="middle">binds ?1, ?2 parameters</text>
  <text class="mono" x="150" y="92" text-anchor="middle">tx.exec(sql, args)</text>
  <text class="small" x="150" y="118" text-anchor="middle">loads entities by id column</text>
</g>
<g transform="translate(670,654)">
  <rect class="card" x="0" y="0" width="300" height="136" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="150" y="34" text-anchor="middle">PartTreeExposedQuery</text>
  <text class="small" x="150" y="64" text-anchor="middle">builds Op&lt;Boolean&gt;</text>
  <text class="mono" x="150" y="92" text-anchor="middle">EntityClass.find { op }</text>
  <text class="small" x="150" y="118" text-anchor="middle">Page, Slice, count, exists, delete</text>
</g>
<g transform="translate(1100,654)">
  <rect class="card" x="0" y="0" width="300" height="136" rx="8" fill="#e9f7f6" stroke="#45a7a1"/>
  <text class="label" x="150" y="34" text-anchor="middle">Simple Repository</text>
  <text class="small" x="150" y="64" text-anchor="middle">CRUD, sort, pageable, QBE</text>
  <text class="mono" x="150" y="92" text-anchor="middle">save / findAll / exists</text>
  <text class="small" x="150" y="118" text-anchor="middle">uses Exposed DAO identity model</text>
</g>

<g transform="translate(670,870)">
  <rect class="card" x="0" y="0" width="300" height="70" rx="8" fill="#f8fbff" stroke="#6b7f93"/>
  <image data-bluetape4k-icon="database.generic" x="28" y="12" width="46" height="46" href="data:image/svg+xml;base64,"/>
  <text class="label" x="188" y="30" text-anchor="middle">Exposed DAO + RDBMS</text>
  <text class="small" x="188" y="55" text-anchor="middle">transactional JDBC execution</text>
</g>
</svg>
