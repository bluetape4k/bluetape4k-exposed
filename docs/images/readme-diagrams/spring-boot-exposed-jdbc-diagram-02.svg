<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="980" viewBox="0 0 1640 980" role="img" aria-labelledby="title desc">
<title id="title">Spring Boot Exposed JDBC query resolution flow</title>
<desc id="desc">Repository method calls flow through Spring Data query lookup and execute as declared SQL, PartTree Exposed queries, or default repository operations.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5d6f83" stroke="#5d6f83" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-5d6f83" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5d6f83" stroke="#5d6f83" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-5b8def" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5b8def" stroke="#5b8def" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-d99a36" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#d99a36" stroke="#d99a36" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-dc6b82" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#dc6b82" stroke="#dc6b82" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .band{fill:#fbfdff;stroke:#d8e0ea;stroke-width:1.4}
    .bandTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:24px;fill:#243447}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:17px;fill:#536273}
    .card{stroke-width:2.2;filter:url(#shadow)}
    .label{font-family:"Architects Daughter","Comic Mono",monospace;font-size:22px;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:14px;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:13px;fill:#102033}
    .line{stroke:#5d6f83;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .sql{stroke:#dc6b82;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .part{stroke:#d99a36;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .repo{stroke:#5b8def;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1640" height="980"/>
<rect class="frame" x="32" y="28" width="1576" height="924" rx="26"/>
<text class="title" x="68" y="86">Spring Data Query Resolution Flow</text>
<text class="subtitle" x="72" y="120">A repository method becomes declared SQL, a derived PartTree query, or a built-in repository operation.</text>

<rect class="band" x="64" y="158" width="1512" height="152" rx="18"/>
<text class="bandTitle" x="90" y="198">Caller and proxy</text>
<rect class="band" x="64" y="360" width="1512" height="214" rx="18"/>
<text class="bandTitle" x="90" y="400">Query resolution</text>
<rect class="band" x="64" y="624" width="1512" height="318" rx="18"/>
<text class="bandTitle" x="90" y="664">Execution boundary</text>

<path class="repo" d="M390 236 H506" style="marker-end:url(#arrow-5b8def)"/>
<path class="repo" d="M790 236 H906" style="marker-end:url(#arrow-5b8def)"/>
<path class="line" d="M 1070 308 L 1070 348 Q 1070 360 1058 360 L 402 360 Q 390 360 390 372 L 390 430" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M 1070 308 L 1070 348 Q 1070 360 1058 360 L 832 360 Q 820 360 820 372 L 820 430" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M 1070 308 L 1070 348 Q 1070 360 1082 360 L 1238 360 Q 1250 360 1250 372 L 1250 430" style="marker-end:url(#arrow-5d6f83)"/>
