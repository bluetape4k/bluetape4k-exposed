<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1306" viewBox="0 0 1754 1306" role="img" aria-label="UML">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1306"/>
<rect class="frame" x="32" y="28" width="1690" height="1250" rx="28"/>
<text class="title" x="66" y="82">UML</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1082 384 C1082 449.5 877 449.5 877 515"/>
<path class="line" d="M877 840 C877 612 1082 612 1082 384"/>
<path class="inheritLine" d="M877 840 C877 612 262 612 262 384"/>
<path class="line" d="M1492 405 C1492 622.5 877 622.5 877 840"/>
<path class="line" d="M672 172 C672 288.5 1492 288.5 1492 405"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ExposedJdbcRepository</text>
  <text class="mono" x="18" y="108">+save(entity): E</text>
<text class="mono" x="18" y="129">+findById(id): Optional~E~</text>
<text class="mono" x="18" y="150">+findAll(pageable): Page~E~</text>
<text class="mono" x="18" y="171">+delete(entity)</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">UserController</text>
  <text class="mono" x="18" y="108">-userService: UserService</text>
<text class="mono" x="18" y="129">+createUser(request): ResponseEntity~User~</text>
<text class="mono" x="18" y="150">+listUsers(pageable): Page~User~</text>
<text class="mono" x="18" y="171">+searchByName(name): List~User~</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">UserEntity</text>
  <text class="mono" x="18" y="108">+id: EntityID~Long~</text>
<text class="mono" x="18" y="129">+name: String</text>
<text class="mono" x="18" y="150">+email: String</text>
<text class="mono" x="18" y="171">+age: Int</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">UserService</text>
  <text class="mono" x="18" y="108">-userRepository: UserRepository</text>
<text class="mono" x="18" y="129">+createUser(name, email, age): User</text>
<text class="mono" x="18" y="150">+getUserByName(name): List~User~</text>
<text class="mono" x="18" y="171">+getAdultUsers(): List~User~</text>
<text class="mono" x="18" y="192">+getUserPage(pageable): Page~User~</text>
</g>
<g transform="translate(707,523)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="61" text-anchor="middle">UserTable</text>
  <text class="mono" x="18" y="108">+name: Column~String~</text>
<text class="mono" x="18" y="129">+email: Column~String~</text>
<text class="mono" x="18" y="150">+age: Column~Int~</text>
</g>
<g transform="translate(707,848)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">UserRepository</text>
  <text class="mono" x="18" y="108">+findByName(name): List~User~</text>
<text class="mono" x="18" y="129">+findByAgeGreaterThan(age): List~User~</text>
<text class="mono" x="18" y="150">+findByEmailContaining(keyword):</text>
<text class="mono" x="18" y="171">List~User~</text>
<text class="mono" x="18" y="192">+countByAge(age): Long</text>
<text class="mono" x="18" y="213">+existsByEmail(email): Boolean</text>
</g>
</svg>
