<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1320" viewBox="0 0 1700 1320" role="img" aria-labelledby="title desc">
  <title id="title">JDBC Architecture Overview</title>
  <desc id="desc">JDBC architecture rebuilt from exposed-jdbc README, JdbcRepository, SoftDeletedJdbcRepository, SuspendedQuery, CteQuery, and VirtualThreadJdbcTransaction source.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="0.8"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1700" height="1320"/>
  <rect class="decor" x="44" y="36" width="1612" height="1248" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1536" height="1024" rx="24"/>
  <text class="title" x="72" y="88">JDBC Architecture Overview</text>
  <text class="subtitle" x="76" y="121">Repository methods run inside Exposed JDBC transactions; virtual-thread helpers submit transaction blocks through VirtualFuture.</text>
  <g id="group-api">
    <rect class="group" x="92" y="156" width="1516" height="235" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Application-facing JDBC repository surface</text>
  </g>
  <g id="group-tx">
    <rect class="group" x="92" y="431" width="1516" height="300" rx="18"/>
    <text class="group-title" x="122" y="455" dominant-baseline="middle">Transaction execution paths</text>
  </g>
  <g id="group-runtime">
    <rect class="group" x="92" y="771" width="1516" height="240" rx="18"/>
    <text class="group-title" x="122" y="795" dominant-baseline="middle">Exposed JDBC runtime and database</text>
  </g>
  <g id="group-utilities">
    <rect class="group" x="92" y="1051" width="1516" height="145" rx="18"/>
    <text class="group-title" x="122" y="1075" dominant-baseline="middle">Supporting query utilities</text>
  </g>
  <path id="route-caller-repo" data-edge="caller-&gt;repo" data-label="implements and calls repository" class="connector" d="M 440 288 L 545 288" stroke="#4F83BF"/>
  <path id="route-repo-soft" data-edge="repo-&gt;soft" data-label="soft-delete extension" class="connector" d="M 935 283 L 1070 283" stroke="#2E8F89"/>
  <path id="route-repo-standard-tx" data-edge="repo-&gt;standard-tx" data-label="used inside transaction" class="connector" d="M 650 336 L 650 405 L 370 405 L 370 540" stroke="#3E9868"/>
  <path id="route-caller-virtual-api" data-edge="caller-&gt;virtual-api" data-label="optional virtual-thread entry" class="connector" d="M 285 331 L 285 405 L 780 405 L 780 520" stroke="#755BC6"/>
  <path id="route-virtual-api-executor" data-edge="virtual-api-&gt;executor" data-label="submits virtualFuture" class="connector" d="M 1070 573 L 1170 573" stroke="#B9851B"/>
  <path id="route-virtual-api-future" data-edge="virtual-api-&gt;future" data-label="returns result handle" class="connector" d="M 970 626 L 970 675 L 1190 675" stroke="#758297"/>
  <path id="route-standard-tx-jdbc-tx" data-edge="standard-tx-&gt;jdbc-tx" data-label="creates transaction" class="connector" d="M 370 626 L 370 755 L 720 755 L 720 850" stroke="#3E9868"/>
  <path id="route-virtual-api-jdbc-tx" data-edge="virtual-api-&gt;jdbc-tx" data-label="runs statement block" class="connector" d="M 855 626 L 855 850" stroke="#755BC6"/>
  <path id="route-jdbc-tx-query-table" data-edge="jdbc-tx-&gt;query-table" data-label="executes DSL operations" class="connector" d="M 615 893 L 535 893" stroke="#4F83BF"/>
  <path id="route-query-table-database" data-edge="query-table-&gt;database" data-label="JDBC SQL" class="connector" d="M 535 930 L 570 930 L 570 970 L 1320 970 L 1320 951" stroke="#3E9868"/>
  <path id="route-suspended-query-table" data-edge="suspended-&gt;query-table" data-label="wraps Query batching" class="connector" d="M 355 1112 L 355 951" stroke="#2E8F89"/>
  <path id="route-cte-query-table" data-edge="cte-&gt;query-table" data-label="prepends CTE" class="connector" d="M 850 1112 L 850 1028 L 430 1028 L 430 951" stroke="#755BC6"/>
  <g id="node-caller" data-node="caller" transform="translate(130,245)">
    <rect class="shape" x="0" y="0" width="310" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="155" y="24" text-anchor="middle" dominant-baseline="middle">Application code</text>
    <text class="detail" x="155" y="43" text-anchor="middle" dominant-baseline="middle">transaction { ... }</text>
    <text class="detail" x="155" y="62" text-anchor="middle" dominant-baseline="middle">or virtual-thread API</text>
  </g>
  <g id="node-repo" data-node="repo" transform="translate(545,230)">
    <rect class="shape" x="0" y="0" width="390" height="106" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="195" y="34" text-anchor="middle" dominant-baseline="middle">JdbcRepository&lt;ID, E&gt;</text>
    <text class="detail" x="195" y="53" text-anchor="middle" dominant-baseline="middle">table, toEntity()</text>
    <text class="detail" x="195" y="72" text-anchor="middle" dominant-baseline="middle">findById, findPage, saveAll</text>
  </g>
  <g id="node-soft" data-node="soft" transform="translate(1070,240)">
    <rect class="shape" x="0" y="0" width="390" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="195" y="24" text-anchor="middle" dominant-baseline="middle">SoftDeletedJdbcRepository</text>
    <text class="detail" x="195" y="43" text-anchor="middle" dominant-baseline="middle">findActive / findDeleted</text>
    <text class="detail" x="195" y="62" text-anchor="middle" dominant-baseline="middle">softDeleteById / restoreById</text>
  </g>
  <g id="node-standard-tx" data-node="standard-tx" transform="translate(190,540)">
    <rect class="shape" x="0" y="0" width="360" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="180" y="24" text-anchor="middle" dominant-baseline="middle">Exposed transaction { }</text>
    <text class="detail" x="180" y="43" text-anchor="middle" dominant-baseline="middle">caller-managed boundary</text>
    <text class="detail" x="180" y="62" text-anchor="middle" dominant-baseline="middle">blocking JDBC path</text>
  </g>
  <g id="node-virtual-api" data-node="virtual-api" transform="translate(640,520)">
    <rect class="shape" x="0" y="0" width="430" height="106" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="215" y="34" text-anchor="middle" dominant-baseline="middle">VirtualThread JDBC helpers</text>
    <text class="detail" x="215" y="53" text-anchor="middle" dominant-baseline="middle">newVirtualThreadJdbcTransaction</text>
    <text class="detail" x="215" y="72" text-anchor="middle" dominant-baseline="middle">virtualThreadJdbcTransactionAsync</text>
  </g>
  <g id="node-executor" data-node="executor" transform="translate(1170,540)">
    <rect class="shape" x="0" y="0" width="330" height="86" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="165" y="24" text-anchor="middle" dominant-baseline="middle">VirtualThreadExecutor</text>
    <text class="detail" x="165" y="43" text-anchor="middle" dominant-baseline="middle">shared when executor is null</text>
    <text class="detail" x="165" y="62" text-anchor="middle" dominant-baseline="middle">caller owns custom executor</text>
  </g>
  <g id="node-future" data-node="future" transform="translate(1190,640)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="150" y="16" text-anchor="middle" dominant-baseline="middle">VirtualFuture&lt;T&gt;</text>
    <text class="detail" x="150" y="35" text-anchor="middle" dominant-baseline="middle">async result</text>
    <text class="detail" x="150" y="54" text-anchor="middle" dominant-baseline="middle">await() for sync helper</text>
  </g>
  <g id="node-jdbc-tx" data-node="jdbc-tx" transform="translate(615,850)">
    <rect class="shape" x="0" y="0" width="390" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="195" y="24" text-anchor="middle" dominant-baseline="middle">JdbcTransaction</text>
    <text class="detail" x="195" y="43" text-anchor="middle" dominant-baseline="middle">statement block receiver</text>
    <text class="detail" x="195" y="62" text-anchor="middle" dominant-baseline="middle">readOnly and isolation</text>
  </g>
  <g id="node-query-table" data-node="query-table" transform="translate(165,865)">
    <rect class="shape" x="0" y="0" width="370" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="185" y="24" text-anchor="middle" dominant-baseline="middle">Exposed Table and Query</text>
    <text class="detail" x="185" y="43" text-anchor="middle" dominant-baseline="middle">selectAll, batchInsert</text>
    <text class="detail" x="185" y="62" text-anchor="middle" dominant-baseline="middle">ResultRow.toEntity()</text>
  </g>
  <g id="node-database" data-node="database" transform="translate(1140,865)">
    <rect class="shape" x="0" y="0" width="360" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="180" y="24" text-anchor="middle" dominant-baseline="middle">JDBC database</text>
    <text class="detail" x="180" y="43" text-anchor="middle" dominant-baseline="middle">SQL execution</text>
    <text class="detail" x="180" y="62" text-anchor="middle" dominant-baseline="middle">transaction manager isolation</text>
  </g>
  <g id="node-suspended" data-node="suspended" transform="translate(160,1112)">
    <rect class="shape" x="0" y="0" width="390" height="62" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="195" y="12" text-anchor="middle" dominant-baseline="middle">SuspendedQuery</text>
    <text class="detail" x="195" y="31" text-anchor="middle" dominant-baseline="middle">batched Flow&lt;List&lt;ResultRow&gt;&gt;</text>
    <text class="detail" x="195" y="50" text-anchor="middle" dominant-baseline="middle">cursor column validation</text>
  </g>
  <g id="node-cte" data-node="cte" transform="translate(655,1112)">
    <rect class="shape" x="0" y="0" width="390" height="62" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="195" y="12" text-anchor="middle" dominant-baseline="middle">CteQuery.withCte(s)</text>
    <text class="detail" x="195" y="31" text-anchor="middle" dominant-baseline="middle">WITH / WITH RECURSIVE</text>
    <text class="detail" x="195" y="50" text-anchor="middle" dominant-baseline="middle">preserves source Query state</text>
  </g>
  <g id="node-table-utils" data-node="table-utils" transform="translate(1150,1112)">
    <rect class="shape" x="0" y="0" width="360" height="62" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="180" y="12" text-anchor="middle" dominant-baseline="middle">Table and schema extensions</text>
    <text class="detail" x="180" y="31" text-anchor="middle" dominant-baseline="middle">implicit selectAll</text>
    <text class="detail" x="180" y="50" text-anchor="middle" dominant-baseline="middle">create missing columns</text>
  </g>
  <g transform="translate(76,1228)" data-footer="repository-project-module">
    <rect class="pill" x="0" y="0" width="1548" height="48" rx="10"/>
    <text class="small" x="774" y="18" text-anchor="middle" dominant-baseline="middle">This is an architecture overview: it shows runtime ownership and transaction paths, not a class hierarchy.</text>
    <text class="small" x="774" y="35" text-anchor="middle" dominant-baseline="middle">Use the repository contract map for interface relationships and the sequence diagrams for call timing.</text>
  </g>
</svg>
