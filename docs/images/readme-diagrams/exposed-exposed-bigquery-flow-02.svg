<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180" role="img" aria-labelledby="title desc">
  <title id="title">BigQuery Query Job Lifecycle</title>
  <desc id="desc">Flow diagram for exposed-bigquery showing Exposed query construction, local SQL generation, query request options, BigQuery jobs.query execution, pageToken pagination, and BigQueryResultRow consumption.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .layer-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:21px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .step{font-family:"Comic Mono";font-size:13px;fill:#FFFFFF;font-weight:700}
      .shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .alt{stroke-dasharray:8 6}
      .badge{fill:#4F83BF}
      .note{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1180"/>
  <rect class="decor" x="44" y="36" width="1672" height="1108" rx="34"/>
  <text class="title" x="72" y="88">BigQuery Query Job Lifecycle</text>
  <text class="subtitle" x="76" y="121">The normal path is a left-to-right REST query job; dry-run and pageToken handling are explicit branches.</text>

  <g id="layer-build">
    <rect class="layer" x="82" y="164" width="330" height="840" rx="18"/>
    <text class="layer-title" x="112" y="190" dominant-baseline="middle">Build Exposed query</text>
  </g>
  <g id="layer-sql">
    <rect class="layer" x="452" y="164" width="350" height="840" rx="18"/>
    <text class="layer-title" x="482" y="190" dominant-baseline="middle">Generate SQL locally</text>
  </g>
  <g id="layer-rest">
    <rect class="layer" x="842" y="164" width="390" height="840" rx="18"/>
    <text class="layer-title" x="872" y="190" dominant-baseline="middle">Submit BigQuery job</text>
  </g>
  <g id="layer-consume">
    <rect class="layer" x="1272" y="164" width="400" height="840" rx="18"/>
    <text class="layer-title" x="1302" y="190" dominant-baseline="middle">Consume rows</text>
  </g>

  <path data-edge="query-&gt;with-bigquery" class="connector" d="M 247 325 L 247 400" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="with-bigquery-&gt;prepare" class="connector" d="M 412 450 L 482 450" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="prepare-&gt;request" class="connector" d="M 772 450 L 872 450" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="options-&gt;request" class="connector" d="M 627 648 L 627 700 L 1042 700 L 1042 552" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="request-&gt;dry-run" class="connector alt" d="M 1042 552 L 1042 604" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="request-&gt;jobs-query" class="connector" d="M 1140 552 L 1228 552 L 1228 760 L 1042 760 L 1042 790" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="jobs-query-&gt;check-errors" class="connector" d="M 1042 882 L 1042 928" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="check-errors-&gt;page-loop" class="connector" d="M 1232 968 L 1260 968 L 1260 732 L 1472 732" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="page-loop-&gt;result-row" class="connector" d="M 1472 732 L 1472 790" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="result-row-&gt;list-flow" class="connector" d="M 1472 882 L 1472 928" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="page-loop-&gt;jobs-query" class="connector alt" d="M 1302 682 L 1238 682 L 1238 836 L 1212 836" stroke="#B9851B" marker-end="url(#arrow-gold)"/>

  <g id="node-query" data-node="query" transform="translate(112,245)">
    <rect class="shape" x="0" y="0" width="270" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">1</text>
    <text class="card-title" x="150" y="29" text-anchor="middle" dominant-baseline="middle">Exposed Query</text>
    <text class="detail" x="150" y="53" text-anchor="middle" dominant-baseline="middle">selectAll().where { ... }</text>
  </g>
  <g id="node-with-bigquery" data-node="with-bigquery" transform="translate(112,400)">
    <rect class="shape" x="0" y="0" width="300" height="100" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">2</text>
    <text class="card-title" x="165" y="31" text-anchor="middle" dominant-baseline="middle">withBigQuery(options)</text>
    <text class="detail" x="165" y="57" text-anchor="middle" dominant-baseline="middle">wraps Query in executor</text>
    <text class="detail" x="165" y="77" text-anchor="middle" dominant-baseline="middle">toList / toFlow / dryRun</text>
  </g>

  <g id="node-prepare" data-node="prepare" transform="translate(482,388)">
    <rect class="shape" x="0" y="0" width="290" height="124" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">3</text>
    <text class="card-title" x="160" y="31" text-anchor="middle" dominant-baseline="middle">prepareSQL</text>
    <text class="detail" x="160" y="57" text-anchor="middle" dominant-baseline="middle">transaction(sqlGenDb)</text>
    <text class="detail" x="160" y="77" text-anchor="middle" dominant-baseline="middle">prepared=false</text>
    <text class="detail" x="160" y="97" text-anchor="middle" dominant-baseline="middle">no application data stored</text>
  </g>
  <g id="node-options" data-node="options" transform="translate(482,560)">
    <rect class="shape" x="0" y="0" width="290" height="88" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">4</text>
    <text class="card-title" x="160" y="31" text-anchor="middle" dominant-baseline="middle">Apply options</text>
    <text class="detail" x="160" y="57" text-anchor="middle" dominant-baseline="middle">cost, labels, priority, timeout</text>
  </g>

  <g id="node-request" data-node="request" transform="translate(872,432)">
    <rect class="shape" x="0" y="0" width="340" height="120" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">5</text>
    <text class="card-title" x="180" y="31" text-anchor="middle" dominant-baseline="middle">QueryRequest</text>
    <text class="detail" x="180" y="57" text-anchor="middle" dominant-baseline="middle">useLegacySql=false</text>
    <text class="detail" x="180" y="77" text-anchor="middle" dominant-baseline="middle">defaultDataset + timeout</text>
    <text class="detail" x="180" y="97" text-anchor="middle" dominant-baseline="middle">dryRun when validating</text>
  </g>
  <g id="node-dry-run" data-node="dry-run" transform="translate(872,604)">
    <rect class="shape" x="0" y="0" width="340" height="88" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">6</text>
    <text class="card-title" x="180" y="31" text-anchor="middle" dominant-baseline="middle">validateQuery / dryRun</text>
    <text class="detail" x="180" y="57" text-anchor="middle" dominant-baseline="middle">server-side syntax, auth, cost check</text>
  </g>
  <g id="node-jobs-query" data-node="jobs-query" transform="translate(872,790)">
    <rect class="shape" x="0" y="0" width="340" height="92" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">7</text>
    <text class="card-title" x="180" y="31" text-anchor="middle" dominant-baseline="middle">jobs.query</text>
    <text class="detail" x="180" y="57" text-anchor="middle" dominant-baseline="middle">QueryResponse + jobReference</text>
  </g>
  <g id="node-check-errors" data-node="check-errors" transform="translate(872,928)">
    <rect class="shape" x="0" y="0" width="360" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">8</text>
    <text class="card-title" x="190" y="29" text-anchor="middle" dominant-baseline="middle">checkErrors(sql)</text>
    <text class="detail" x="190" y="53" text-anchor="middle" dominant-baseline="middle">throws BigQueryQueryException</text>
  </g>

  <g id="node-page-loop" data-node="page-loop" transform="translate(1302,600)">
    <rect class="shape" x="0" y="0" width="340" height="132" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">9</text>
    <text class="card-title" x="180" y="31" text-anchor="middle" dominant-baseline="middle">pageToken loop</text>
    <text class="detail" x="180" y="57" text-anchor="middle" dominant-baseline="middle">getQueryResults(projectId, jobId)</text>
    <text class="detail" x="180" y="77" text-anchor="middle" dominant-baseline="middle">continue while token or incomplete</text>
    <text class="detail" x="180" y="97" text-anchor="middle" dominant-baseline="middle">Flow checks coroutine cancellation</text>
  </g>
  <g id="node-result-row" data-node="result-row" transform="translate(1302,790)">
    <rect class="shape" x="0" y="0" width="340" height="92" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">10</text>
    <text class="card-title" x="180" y="31" text-anchor="middle" dominant-baseline="middle">BigQueryResultRow</text>
    <text class="detail" x="180" y="57" text-anchor="middle" dominant-baseline="middle">schema fields zip row cells</text>
  </g>
  <g id="node-list-flow" data-node="list-flow" transform="translate(1302,928)">
    <rect class="shape" x="0" y="0" width="340" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <circle class="badge" cx="24" cy="24" r="14"/><text class="step" x="24" y="24" text-anchor="middle" dominant-baseline="middle">11</text>
    <text class="card-title" x="180" y="29" text-anchor="middle" dominant-baseline="middle">List or Flow</text>
    <text class="detail" x="180" y="53" text-anchor="middle" dominant-baseline="middle">all rows in memory or page-by-page</text>
  </g>

  <g transform="translate(112,1056)">
    <rect class="note" x="0" y="0" width="1496" height="54" rx="10"/>
    <text class="small" x="748" y="21" text-anchor="middle" dominant-baseline="middle">Dry run validates SQL, permissions, and estimated cost without billable execution; normal execution still uses one BigQuery REST query job per call.</text>
    <text class="small" x="748" y="39" text-anchor="middle" dominant-baseline="middle">Multiple DML calls can partially succeed because this module does not provide JDBC rollback or savepoint semantics.</text>
  </g>
</svg>
