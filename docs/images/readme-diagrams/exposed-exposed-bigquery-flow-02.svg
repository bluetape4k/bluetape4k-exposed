<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180" role="img" aria-labelledby="title desc">
  <title id="title">BigQuery Query Job Lifecycle</title>
  <desc id="desc">Flow diagram for exposed-bigquery showing Exposed query construction, H2 SQL generation, BigQuery jobs.query options, dry run or execution, pageToken pagination, and BigQueryResultRow conversion.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#b9851b" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755bc6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#bd5d6b" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:13px}.label{font-size:12px;fill:#315664}.step{font-size:12px;font-weight:700}.lane{stroke-width:2.5}.card{fill:#fffdf8;stroke-width:2.2}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.red{stroke:#d58b96}.line{fill:none;stroke-width:4.0;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}.lineRed{stroke:#bd5d6b;marker-end:url(#arrow-red)}.dash{stroke-dasharray:10 8}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}.fail{fill:#a94452;font-weight:700}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1180"/>
  <rect class="frame" x="38" y="32" width="1684" height="1116" rx="24"/>
  <text class="title" x="86" y="96">BigQuery Query Job Lifecycle</text>
  <text class="subtitle" x="90" y="132">Generated SQL becomes one REST query job; pagination and row conversion are explicit module behavior.</text>

  <rect class="lane" x="92" y="176" width="1576" height="250" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="124" y="224">Build and submit</text>
  <g transform="translate(138 274)">
    <rect class="card blue" width="254" height="92" rx="12"/>
    <text class="step" x="22" y="27">1</text>
    <text class="cardTitle code" x="142" y="32" text-anchor="middle">Exposed DSL</text>
    <text class="cardText" x="142" y="58" text-anchor="middle">Query or DML statement</text>
    <text class="cardText" x="142" y="76" text-anchor="middle">Column references stay typed</text>
  </g>
  <g transform="translate(492 274)">
    <rect class="card green" width="286" height="92" rx="12"/><image data-bluetape4k-icon="generic.database" x="24" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="step" x="22" y="27">2</text>
    <text class="cardTitle type" x="158" y="32" text-anchor="middle">sqlGenDb transaction</text>
    <text class="cardText" x="158" y="58" text-anchor="middle">prepareSQL / expandArgs</text>
    <text class="cardText" x="158" y="76" text-anchor="middle">H2 PostgreSQL mode only</text>
  </g>
  <g transform="translate(878 274)">
    <rect class="card gold" width="286" height="92" rx="12"/>
    <text class="step" x="22" y="27">3</text>
    <text class="cardTitle" x="158" y="32" text-anchor="middle">QueryRequest</text>
    <text class="cardText" x="158" y="58" text-anchor="middle">Standard SQL + dataset</text>
    <text class="cardText" x="158" y="76" text-anchor="middle">options applied</text>
  </g>
  <g transform="translate(1264 274)">
    <rect class="card gold" width="260" height="92" rx="12"/>
    <text class="step" x="22" y="27">4</text>

    <text class="cardTitle" x="156" y="32" text-anchor="middle">jobs.query</text>
    <text class="cardText" x="146" y="58" text-anchor="middle">REST API call</text>
    <text class="cardText" x="146" y="76" text-anchor="middle">returns QueryResponse</text>
  </g>

  <rect class="lane" x="92" y="478" width="1576" height="286" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="124" y="526">Execution branch</text>
  <g transform="translate(170 576)">
    <rect class="card green" width="300" height="94" rx="12"/>
    <text class="cardTitle code" x="150" y="31" text-anchor="middle">validateQuery()</text>
    <text class="cardText" x="150" y="58" text-anchor="middle">forces dryRun = true</text>
    <text class="cardText type" x="150" y="78" text-anchor="middle">no billable execution</text>
  </g>
  <g transform="translate(580 546)">
    <rect class="card gold" width="330" height="132" rx="12"/>
    <text class="cardTitle" x="165" y="31" text-anchor="middle">runQuery() / toList()</text>
    <text class="cardText" x="165" y="58" text-anchor="middle">normal execution path</text>
    <text class="cardText" x="165" y="80" text-anchor="middle">collectAllRows follows pages</text>
    <text class="cardText" x="165" y="102" text-anchor="middle">toFlow emits page rows</text>
  </g>
  <g transform="translate(1020 546)">
    <rect class="card purple" width="330" height="132" rx="12"/>
    <text class="cardTitle" x="165" y="31" text-anchor="middle">Page loop</text>
    <text class="cardText" x="165" y="58" text-anchor="middle">jobComplete or pageToken</text>
    <text class="cardText" x="165" y="80" text-anchor="middle">getQueryResults(jobId)</text>
    <text class="cardText" x="165" y="102" text-anchor="middle">Flow checks cancellation</text>
  </g>
  <g transform="translate(1452 562)">
    <rect class="card red" width="150" height="100" rx="12"/>
    <text class="cardTitle fail" x="75" y="31" text-anchor="middle">Errors</text>
    <text class="cardText" x="75" y="58" text-anchor="middle">errors[]</text>
    <text class="cardText" x="75" y="78" text-anchor="middle">throw typed</text>
  </g>

  <rect class="lane" x="92" y="816" width="1576" height="212" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="124" y="864">Rows and reader contract</text>
  <g transform="translate(170 910)">
    <rect class="card gold" width="310" height="80" rx="12"/>
    <text class="cardTitle" x="155" y="31" text-anchor="middle">TableSchema + TableRow</text>
    <text class="cardText" x="155" y="58" text-anchor="middle">field order maps response cells</text>
  </g>
  <g transform="translate(618 886)">
    <rect class="card purple" width="330" height="128" rx="12"/><image data-bluetape4k-icon="google.bigquery" x="24" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle code" x="165" y="31" text-anchor="middle">BigQueryResultRow</text>
    <text class="cardText" x="165" y="58" text-anchor="middle">case-insensitive keys</text>
    <text class="cardText" x="165" y="80" text-anchor="middle">String / Long / BigDecimal</text>
    <text class="cardText" x="165" y="102" text-anchor="middle">TIMESTAMP seconds -> Instant</text>
  </g>
  <g transform="translate(1086 900)">
    <rect class="card blue" width="330" height="100" rx="12"/>
    <text class="cardTitle" x="165" y="31" text-anchor="middle">Reader API</text>
    <text class="cardText" x="165" y="58" text-anchor="middle">row[Events.region]</text>
    <text class="cardText" x="165" y="78" text-anchor="middle">single / firstOrNull / Flow</text>
  </g>

  <path class="line lineBlue" d="M392 320 H492"/>
  <path class="line lineGreen" d="M778 320 H878"/>
  <path class="line lineGold" d="M1164 320 H1264"/>
  <path class="line lineGreen" d="M 1000 366 L 1000 500 Q 1000 512 988 512 L 332 512 Q 320 512 320 524 L 320 576"/>
  <path class="line lineGold" d="M 1394 366 L 1394 500 Q 1394 512 1382 512 L 757 512 Q 745 512 745 524 L 745 546"/>
  <path class="line linePurple" d="M910 612 H1020"/>
  <path class="line linePurple" d="M1350 612 H1452"/>
  <path class="line lineGreen" d="M 1350 640 L 1404 640 Q 1416 640 1416 652 L 1416 718 Q 1416 730 1404 730 L 1297 730 Q 1285 730 1285 718 L 1285 678"/>
  <path class="line lineGold" d="M 1185 678 L 1185 778 Q 1185 790 1173 790 L 532 790 Q 520 790 520 802 L 520 938 Q 520 950 508 950 L 480 950"/>
  <path class="line linePurple" d="M480 950 H618"/>
  <path class="line lineBlue" d="M948 950 H1086"/>
  <text class="label" x="408" y="304">DSL</text>
  <text class="label" x="796" y="304">SQL</text>
  <text class="label" x="1182" y="304">request</text>
  <text class="label" x="342" y="556">dry run</text>
  <text class="label" x="768" y="526">execute</text>
  <text class="label" x="934" y="594">rows</text>
  <text class="label" x="1304" y="718">next page</text>
  <text class="label" x="538" y="830">schema + rows</text>
  <text class="label" x="504" y="934">convert</text>
  <text class="label" x="970" y="934">consume</text>

  <rect x="126" y="1082" width="1508" height="28" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="880" y="1101" text-anchor="middle">Dry run validates SQL, permissions, and estimated cost; normal calls still execute independent BigQuery REST query jobs.</text>
</svg>
