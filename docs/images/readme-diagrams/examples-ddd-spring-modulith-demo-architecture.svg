<svg data-diagram-kind="architecture" data-source-read="examples/ddd-spring-modulith-demo/README.md; examples/ddd-spring-modulith-demo/src/main/kotlin/io/bluetape4k/exposed/examples/modulith/orders/OrderApplicationService.kt; spring-boot/jdbc/src/main/kotlin/io/bluetape4k/spring/data/exposed/jdbc/ddd/ExposedAggregateEventPublisher.kt" xmlns="http://www.w3.org/2000/svg" width="1640" height="900" viewBox="0 0 1640 900" role="img" aria-labelledby="title desc">
  <title id="title">DDD Spring Modulith Exposed demo architecture</title>
  <desc id="desc">The orders module saves an aggregate and hands its immutable event snapshot to Spring through ExposedAggregateEventPublisher inside the command transaction. The exported event is tracked by Spring Modulith and consumed by shipping after commit.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#536C85" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#3E9868" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
      .boundary{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .boundary-accent{fill:#F0F8F7;stroke:#C7E2DF;stroke-width:2}
      .store{fill:#FBFDFF;stroke:#D7E2EC;stroke-width:2}
      .card{stroke-width:2;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .boundary-title{font-family:"Architects Daughter";font-size:25px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .table-title{font-family:"Architects Daughter";font-size:19px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:12px;fill:#627184;font-weight:400}
      .connector{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .replay{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect class="canvas" width="1640" height="900"/>
  <rect class="frame" x="30" y="24" width="1580" height="852" rx="30"/>
  <text class="title" x="66" y="74">DDD + Spring Modulith + Exposed</text>
  <text class="subtitle" x="70" y="110">Save, publish, track, and consume domain events across explicit JDBC module boundaries</text>

  <rect class="boundary" x="60" y="140" width="340" height="450" rx="20"/>
  <rect class="boundary-accent" x="440" y="140" width="340" height="450" rx="20"/>
  <rect class="boundary" x="820" y="140" width="300" height="450" rx="20"/>
  <rect class="boundary" x="1160" y="140" width="380" height="450" rx="20"/>
  <rect class="store" x="60" y="660" width="1480" height="180" rx="20"/>

  <path id="handoff-service-publisher" data-edge="service-&gt;publisher" class="connector" d="M 370 407 H 470" stroke="#536C85" marker-end="url(#arrow-slate)"/>
  <path id="handoff-publisher-event" data-edge="publisher-&gt;event" class="connector" d="M 750 407 H 850" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path id="handoff-event-listener" data-edge="event-&gt;listener" class="connector" d="M 1090 407 H 1190" stroke="#3E9868" marker-end="url(#arrow-green)"/>
  <path id="persist-order" data-edge="repository-&gt;orders-table" class="connector" d="M 230 560 V 720" stroke="#536C85" marker-end="url(#arrow-slate)"/>
  <path id="publisher-completion" data-edge="publisher-&gt;completion" class="connector" d="M 610 470 V 495" stroke="#B9851B" marker-end="url(#arrow-amber)"/>
  <path id="persist-publication" data-edge="publisher-&gt;publication-table" class="connector" d="M 750 433 H 784 Q 798 433 798 447 V 621 Q 798 635 784 635 H 624 Q 610 635 610 649 V 720" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path id="listener-reservation" data-edge="listener-&gt;reservation" class="connector" d="M 1350 460 V 490" stroke="#3E9868" marker-end="url(#arrow-green)"/>
  <path id="persist-reservation" data-edge="reservation-&gt;reservation-table" class="connector" d="M 1350 560 V 720" stroke="#3E9868" marker-end="url(#arrow-green)"/>
  <path id="restart-replay" data-edge="publication-table-&gt;listener" class="connector replay" d="M 610 800 V 806 Q 610 820 624 820 H 1568 Q 1582 820 1582 806 V 421 Q 1582 407 1568 407 H 1510" stroke="#B9851B" marker-end="url(#arrow-amber)"/>

  <text class="boundary-title" x="90" y="182">orders</text>
  <text class="detail" x="90" y="212">Owns the command transaction.</text>
  <rect class="card" x="90" y="248" width="280" height="92" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="230" y="278" text-anchor="middle">Order aggregate</text>
  <text class="detail" x="230" y="304" text-anchor="middle">records OrderAcceptedEvent</text>
  <text class="small" x="230" y="324" text-anchor="middle">minimal immutable payload</text>
  <rect class="card" x="90" y="350" width="280" height="114" rx="12" fill="#FFFFFF" stroke="#9AA8B8"/>
  <text class="card-title" x="230" y="379" text-anchor="middle">OrderApplicationService</text>
  <text class="detail" x="230" y="404" text-anchor="middle">save(order), then</text>
  <text class="detail" x="230" y="426" text-anchor="middle">publishAfterSave(order)</text>
  <text class="small" x="230" y="448" text-anchor="middle">exactly once in the active transaction</text>
  <rect class="card" x="90" y="490" width="280" height="70" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="230" y="519" text-anchor="middle">OrderRepository</text>
  <text class="detail" x="230" y="543" text-anchor="middle">Exposed JDBC save</text>

  <text class="boundary-title" x="470" y="182">Spring JDBC handoff</text>
  <text class="detail" x="470" y="212">Issue #323 integration boundary.</text>
  <rect class="card" x="470" y="345" width="280" height="125" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="card-title" x="610" y="375" text-anchor="middle">ExposedAggregate</text>
  <text class="card-title" x="610" y="398" text-anchor="middle">EventPublisher</text>
  <text class="detail" x="610" y="425" text-anchor="middle">hands the snapshot to Spring now</text>
  <text class="small" x="610" y="448" text-anchor="middle">Modulith enlists publication tracking</text>
  <rect class="card" x="470" y="495" width="280" height="70" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="610" y="524" text-anchor="middle">Transaction completion</text>
  <text class="small" x="610" y="548" text-anchor="middle">commit clears; rollback keeps events</text>

  <text class="boundary-title" x="850" y="182">orders :: events</text>
  <text class="detail" x="850" y="212">Exported named interface.</text>
  <rect class="card" x="850" y="355" width="240" height="105" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="card-title" x="970" y="385" text-anchor="middle">OrderAcceptedEvent</text>
  <text class="detail" x="970" y="411" text-anchor="middle">aggregateId, eventId</text>
  <text class="detail" x="970" y="433" text-anchor="middle">occurredAt</text>
  <text class="small" x="970" y="520" text-anchor="middle">shipping depends only on this contract</text>

  <text class="boundary-title" x="1190" y="182">shipping</text>
  <text class="detail" x="1190" y="212">Consumes the exported event only.</text>
  <rect class="card" x="1190" y="355" width="320" height="105" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="card-title" x="1350" y="385" text-anchor="middle">Reservation listener</text>
  <text class="detail" x="1350" y="411" text-anchor="middle">stable @ApplicationModuleListener id</text>
  <text class="small" x="1350" y="433" text-anchor="middle">runs after commit; replay-safe</text>
  <rect class="card" x="1190" y="490" width="320" height="70" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="card-title" x="1350" y="519" text-anchor="middle">Idempotent reservation</text>
  <text class="detail" x="1350" y="543" text-anchor="middle">deduplicates by order id</text>

  <text class="boundary-title" x="90" y="700">Exposed JDBC + Spring Modulith publication store</text>
  <rect x="90" y="720" width="280" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="2"/>
  <text class="table-title" x="230" y="752" text-anchor="middle">DDD_MODULITH_ORDERS</text>
  <text class="small" x="230" y="779" text-anchor="middle">aggregate rows</text>
  <rect x="470" y="720" width="280" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1" stroke-width="2"/>
  <text class="table-title" x="610" y="752" text-anchor="middle">EVENT_PUBLICATION</text>
  <text class="small" x="610" y="779" text-anchor="middle">durable incomplete/completed rows</text>
  <rect x="1190" y="720" width="320" height="80" rx="12" fill="#EAF7EF" stroke="#58A978" stroke-width="2"/>
  <text class="table-title" x="1350" y="744" text-anchor="middle">DDD_MODULITH_</text>
  <text class="table-title" x="1350" y="766" text-anchor="middle">SHIPPING_RESERVATIONS</text>
  <text class="small" x="1350" y="790" text-anchor="middle">one row per order id</text>

  <line x1="830" y1="742" x2="880" y2="742" stroke="#536C85" stroke-width="2.6" stroke-linecap="round"/>
  <text class="small" x="892" y="746">in-transaction / committed flow</text>
  <line x1="830" y1="776" x2="880" y2="776" stroke="#B9851B" stroke-width="2.6" stroke-dasharray="8 7" stroke-linecap="round"/>
  <text class="small" x="892" y="780">restart replay of incomplete publication</text>
</svg>
