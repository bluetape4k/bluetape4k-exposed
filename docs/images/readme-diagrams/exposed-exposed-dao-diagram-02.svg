<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1530" viewBox="0 0 1760 1530" role="img" aria-labelledby="title desc">
  <title id="title">DAO Generated-ID Entity Families</title>
  <desc id="desc">Class-oriented DAO generated-ID entity hierarchy rebuilt from exposed-dao README and dao/id source files.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1760" height="1530"/>
  <rect class="decor" x="44" y="36" width="1672" height="1458" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1596" height="1234" rx="24"/>
  <text class="title" x="72" y="88">DAO Generated-ID Entity Families</text>
  <text class="subtitle" x="76" y="121">DAO entity classes pair with core generated-ID tables; soft-delete remains table-only support.</text>
  <g id="group-string">
    <rect class="group" x="92" y="156" width="1576" height="610" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">String ID DAO families</text>
  </g>
  <g id="group-typed">
    <rect class="group" x="92" y="806" width="1576" height="300" rx="18"/>
    <text class="group-title" x="122" y="830" dominant-baseline="middle">Long and UUID DAO families</text>
  </g>
  <g id="group-support">
    <rect class="group" x="92" y="1146" width="1576" height="210" rx="18"/>
    <text class="group-title" x="122" y="1170" dominant-baseline="middle">Core table-only support</text>
  </g>
  <path id="route-ksuid-string-base" data-edge="ksuid-&gt;string-base" data-label="extends StringEntity" class="connector generalization" d="M 367 430 L 367 331" stroke="#4F83BF"/>
  <path id="route-ksuid-millis-string-base" data-edge="ksuid-millis-&gt;string-base" data-label="extends StringEntity" class="connector generalization" d="M 787 430 L 787 331" stroke="#2E8F89"/>
  <path id="route-ulid-string-base" data-edge="ulid-&gt;string-base" data-label="extends StringEntity" class="connector generalization" d="M 1217 430 L 1217 331" stroke="#755BC6"/>
  <path id="route-uuid-base62-string-base" data-edge="uuid-base62-&gt;string-base" data-label="extends StringEntity" class="connector generalization" d="M 562 590 L 562 331" stroke="#B9851B"/>
  <path id="route-uuid-base62-mysql-string-base" data-edge="uuid-base62-mysql-&gt;string-base" data-label="extends StringEntity" class="connector generalization" d="M 1012 590 L 1012 331" stroke="#B9851B"/>
  <path id="route-snowflake-long-base" data-edge="snowflake-&gt;long-base" data-label="extends LongEntity" class="connector generalization" d="M 512 1000 L 512 981" stroke="#3E9868"/>
  <path id="route-timeuuid-uuid-base" data-edge="timeuuid-&gt;uuid-base" data-label="extends UUIDEntity" class="connector generalization" d="M 1352 1000 L 1352 981" stroke="#2E8F89"/>
  <g id="node-string-base" data-node="string-base" transform="translate(337,245)">
    <rect class="shape" x="0" y="0" width="1040" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="520" y="24" text-anchor="middle" dominant-baseline="middle">StringEntity + StringEntityClass</text>
    <text class="detail" x="520" y="43" text-anchor="middle" dominant-baseline="middle">EntityID&lt;String&gt;</text>
    <text class="detail" x="520" y="62" text-anchor="middle" dominant-baseline="middle">generated string IDs</text>
  </g>
  <g id="node-ksuid" data-node="ksuid" transform="translate(192,430)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">KsuidEntity + Class</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">KsuidTable</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">varchar(27) generated</text>
  </g>
  <g id="node-ksuid-millis" data-node="ksuid-millis" transform="translate(592,430)">
    <rect class="shape" x="0" y="0" width="390" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="195" y="24" text-anchor="middle" dominant-baseline="middle">KsuidMillisEntity + Class</text>
    <text class="detail" x="195" y="43" text-anchor="middle" dominant-baseline="middle">KsuidMillisTable</text>
    <text class="detail" x="195" y="62" text-anchor="middle" dominant-baseline="middle">time-sortable varchar(27)</text>
  </g>
  <g id="node-ulid" data-node="ulid" transform="translate(1042,430)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">UlidEntity + Class</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">UlidTable</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">monotonic varchar(26)</text>
  </g>
  <g id="node-uuid-base62" data-node="uuid-base62" transform="translate(412,590)">
    <rect class="shape" x="0" y="0" width="420" height="86" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="210" y="24" text-anchor="middle" dominant-baseline="middle">TimebasedUUIDBase62Entity</text>
    <text class="detail" x="210" y="43" text-anchor="middle" dominant-baseline="middle">Base62 table</text>
    <text class="detail" x="210" y="62" text-anchor="middle" dominant-baseline="middle">UUIDv7 encoded string &lt;= 24</text>
  </g>
  <g id="node-uuid-base62-mysql" data-node="uuid-base62-mysql" transform="translate(982,590)">
    <rect class="shape" x="0" y="0" width="435" height="86" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="217.5" y="24" text-anchor="middle" dominant-baseline="middle">TimebasedUUIDBase62EntityMySql</text>
    <text class="detail" x="217.5" y="43" text-anchor="middle" dominant-baseline="middle">MySQL Base62 table</text>
    <text class="detail" x="217.5" y="62" text-anchor="middle" dominant-baseline="middle">binary collation variant</text>
  </g>
  <g id="node-long-base" data-node="long-base" transform="translate(307,895)">
    <rect class="shape" x="0" y="0" width="380" height="86" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="190" y="24" text-anchor="middle" dominant-baseline="middle">LongEntity + LongEntityClass</text>
    <text class="detail" x="190" y="43" text-anchor="middle" dominant-baseline="middle">EntityID&lt;Long&gt;</text>
    <text class="detail" x="190" y="62" text-anchor="middle" dominant-baseline="middle">numeric generated ID</text>
  </g>
  <g id="node-uuid-base" data-node="uuid-base" transform="translate(1187,895)">
    <rect class="shape" x="0" y="0" width="380" height="86" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="190" y="24" text-anchor="middle" dominant-baseline="middle">UUIDEntity + UUIDEntityClass</text>
    <text class="detail" x="190" y="43" text-anchor="middle" dominant-baseline="middle">EntityID&lt;UUID&gt;</text>
    <text class="detail" x="190" y="62" text-anchor="middle" dominant-baseline="middle">UUID storage family</text>
  </g>
  <g id="node-snowflake" data-node="snowflake" transform="translate(307,1000)">
    <rect class="shape" x="0" y="0" width="410" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="205" y="24" text-anchor="middle" dominant-baseline="middle">SnowflakeIdEntity + Class</text>
    <text class="detail" x="205" y="43" text-anchor="middle" dominant-baseline="middle">SnowflakeIdTable</text>
    <text class="detail" x="205" y="62" text-anchor="middle" dominant-baseline="middle">Long snowflakeGenerated()</text>
  </g>
  <g id="node-timeuuid" data-node="timeuuid" transform="translate(1137,1000)">
    <rect class="shape" x="0" y="0" width="430" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="215" y="24" text-anchor="middle" dominant-baseline="middle">TimebasedUUIDEntity + Class</text>
    <text class="detail" x="215" y="43" text-anchor="middle" dominant-baseline="middle">TimebasedUUIDTable</text>
    <text class="detail" x="215" y="62" text-anchor="middle" dominant-baseline="middle">UUIDv7 javaUUID id</text>
  </g>
  <g id="node-soft-delete" data-node="soft-delete" transform="translate(277,1230)">
    <rect class="shape" x="0" y="0" width="430" height="86" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="215" y="14.5" text-anchor="middle" dominant-baseline="middle">SoftDeletedIdTable&lt;T&gt;</text>
    <text class="detail" x="215" y="33.5" text-anchor="middle" dominant-baseline="middle">core table helper</text>
    <text class="detail" x="215" y="52.5" text-anchor="middle" dominant-baseline="middle">adds is_deleted flag</text>
    <text class="detail" x="215" y="71.5" text-anchor="middle" dominant-baseline="middle">no DAO entity base here</text>
  </g>
  <g id="node-selection-note" data-node="selection-note" transform="translate(877,1230)">
    <rect class="shape" x="0" y="0" width="650" height="86" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="325" y="24" text-anchor="middle" dominant-baseline="middle">Choose by ID contract</text>
    <text class="detail" x="325" y="43" text-anchor="middle" dominant-baseline="middle">DAO entity family follows table ID type</text>
    <text class="detail" x="325" y="62" text-anchor="middle" dominant-baseline="middle">string variants use paired EntityClass helpers</text>
  </g>
  <g transform="translate(76,1438)" data-footer="reader-contract">
    <rect class="pill" x="0" y="0" width="1608" height="48" rx="10"/>
    <text class="small" x="804" y="18" text-anchor="middle" dominant-baseline="middle">exposed-dao provides DAO entity/helper pairs; generated-ID table definitions remain in exposed-core.</text>
    <text class="small" x="804" y="35" text-anchor="middle" dominant-baseline="middle">SoftDeletedIdTable can be used explicitly, but there is no dedicated SoftDeletedEntity base.</text>
  </g>
</svg>
