<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1220" viewBox="0 0 1640 1220" role="img" aria-labelledby="title desc">
  <title id="title">IdTable Hierarchy by ID Generation Strategy</title>
  <desc id="desc">Class-oriented IdTable hierarchy rebuilt from exposed-core README and dao/id source files.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1640" height="1220"/>
  <rect class="decor" x="44" y="36" width="1552" height="1148" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1476" height="924" rx="24"/>
  <text class="title" x="72" y="88">IdTable Hierarchy by ID Generation Strategy</text>
  <text class="subtitle" x="76" y="121">Custom IdTable bases choose client-side ID generators or soft-delete state while keeping a single primary key contract.</text>
  <g id="group-base">
    <rect class="group" x="92" y="156" width="1456" height="215" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Exposed base contract</text>
  </g>
  <g id="group-generated">
    <rect class="group" x="92" y="411" width="1456" height="430" rx="18"/>
    <text class="group-title" x="122" y="435" dominant-baseline="middle">Client-generated ID table bases</text>
  </g>
  <g id="group-state">
    <rect class="group" x="92" y="861" width="1456" height="230" rx="18"/>
    <text class="group-title" x="122" y="885" dominant-baseline="middle">State flag extension</text>
  </g>
  <path id="route-ksuid-id-table" data-edge="ksuid-&gt;id-table" data-label="extends IdTable&lt;String&gt;" class="connector generalization" d="M 420 525 L 420 332" stroke="#4F83BF"/>
  <path id="route-ulid-id-table" data-edge="ulid-&gt;id-table" data-label="extends IdTable&lt;String&gt;" class="connector generalization" d="M 780 525 L 780 332" stroke="#755BC6"/>
  <path id="route-uuidv7-id-table" data-edge="uuidv7-&gt;id-table" data-label="extends IdTable&lt;UUID/String&gt;" class="connector generalization" d="M 1160 525 L 1160 332" stroke="#2E8F89"/>
  <path id="route-snowflake-id-table" data-edge="snowflake-&gt;id-table" data-label="extends IdTable&lt;Long&gt;" class="connector generalization" d="M 585 705 L 585 332" stroke="#3E9868"/>
  <path id="route-uuid-core-id-table" data-edge="uuid-core-&gt;id-table" data-label="extends IdTable&lt;UUID&gt;" class="connector generalization" d="M 965 705 L 965 332" stroke="#B9851B"/>
  <g id="node-id-table" data-node="id-table" transform="translate(380,240)">
    <rect class="shape" x="0" y="0" width="860" height="92" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="430" y="27" text-anchor="middle" dominant-baseline="middle">IdTable&lt;T&gt;</text>
    <text class="detail" x="430" y="46" text-anchor="middle" dominant-baseline="middle">Exposed base class</text>
    <text class="detail" x="430" y="65" text-anchor="middle" dominant-baseline="middle">single id primary key</text>
  </g>
  <g id="node-ksuid" data-node="ksuid" transform="translate(220,525)">
    <rect class="shape" x="0" y="0" width="340" height="96" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="170" y="19.5" text-anchor="middle" dominant-baseline="middle">KSUID string tables</text>
    <text class="detail" x="170" y="38.5" text-anchor="middle" dominant-baseline="middle">KsuidTable</text>
    <text class="detail" x="170" y="57.5" text-anchor="middle" dominant-baseline="middle">KsuidMillisTable</text>
    <text class="detail" x="170" y="76.5" text-anchor="middle" dominant-baseline="middle">varchar(27) generated</text>
  </g>
  <g id="node-ulid" data-node="ulid" transform="translate(610,525)">
    <rect class="shape" x="0" y="0" width="340" height="96" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="170" y="19.5" text-anchor="middle" dominant-baseline="middle">ULID string table</text>
    <text class="detail" x="170" y="38.5" text-anchor="middle" dominant-baseline="middle">UlidTable</text>
    <text class="detail" x="170" y="57.5" text-anchor="middle" dominant-baseline="middle">varchar(26)</text>
    <text class="detail" x="170" y="76.5" text-anchor="middle" dominant-baseline="middle">stateful monotonic ULID</text>
  </g>
  <g id="node-uuidv7" data-node="uuidv7" transform="translate(1000,525)">
    <rect class="shape" x="0" y="0" width="390" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="195" y="19.5" text-anchor="middle" dominant-baseline="middle">UUIDv7 table variants</text>
    <text class="detail" x="195" y="38.5" text-anchor="middle" dominant-baseline="middle">TimebasedUUIDTable</text>
    <text class="detail" x="195" y="57.5" text-anchor="middle" dominant-baseline="middle">Base62 and MySQL collation</text>
    <text class="detail" x="195" y="76.5" text-anchor="middle" dominant-baseline="middle">client-side generated</text>
  </g>
  <g id="node-snowflake" data-node="snowflake" transform="translate(410,705)">
    <rect class="shape" x="0" y="0" width="360" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="180" y="19.5" text-anchor="middle" dominant-baseline="middle">SnowflakeIdTable</text>
    <text class="detail" x="180" y="38.5" text-anchor="middle" dominant-baseline="middle">Long ID</text>
    <text class="detail" x="180" y="57.5" text-anchor="middle" dominant-baseline="middle">snowflakeGenerated()</text>
    <text class="detail" x="180" y="76.5" text-anchor="middle" dominant-baseline="middle">single primary key</text>
  </g>
  <g id="node-uuid-core" data-node="uuid-core" transform="translate(790,705)">
    <rect class="shape" x="0" y="0" width="360" height="96" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="19.5" text-anchor="middle" dominant-baseline="middle">Timebased UUID storage</text>
    <text class="detail" x="180" y="38.5" text-anchor="middle" dominant-baseline="middle">javaUUID id</text>
    <text class="detail" x="180" y="57.5" text-anchor="middle" dominant-baseline="middle">UUIDv7 value</text>
    <text class="detail" x="180" y="76.5" text-anchor="middle" dominant-baseline="middle">EntityID&lt;UUID&gt;</text>
  </g>
  <g id="node-soft-delete" data-node="soft-delete" transform="translate(610,940)">
    <rect class="shape" x="0" y="0" width="420" height="92" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="210" y="17.5" text-anchor="middle" dominant-baseline="middle">SoftDeletedIdTable&lt;T&gt;</text>
    <text class="detail" x="210" y="36.5" text-anchor="middle" dominant-baseline="middle">extends IdTable&lt;T&gt;</text>
    <text class="detail" x="210" y="55.5" text-anchor="middle" dominant-baseline="middle">adds is_deleted default false</text>
    <text class="detail" x="210" y="74.5" text-anchor="middle" dominant-baseline="middle">does not choose generator</text>
  </g>
  <g transform="translate(76,1128)" data-footer="reader-contract">
    <rect class="pill" x="0" y="0" width="1488" height="48" rx="10"/>
    <text class="small" x="744" y="18" text-anchor="middle" dominant-baseline="middle">Choose the IdTable base that matches the ID source: KSUID, ULID, UUIDv7, Snowflake, or soft-delete state.</text>
    <text class="small" x="744" y="35" text-anchor="middle" dominant-baseline="middle">All table bases keep Exposed's single id primary-key contract.</text>
  </g>
</svg>
