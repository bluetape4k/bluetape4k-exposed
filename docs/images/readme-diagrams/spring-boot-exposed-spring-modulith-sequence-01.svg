<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1126" viewBox="0 0 1960 1126" role="img" aria-labelledby="title desc">
<title id="title">Spring Modulith publication lifecycle</title>
<desc id="desc">Sequence view of Spring Modulith event publication creation, processing, completion modes, archive savepoint behavior, and resubmission tracking through the Exposed JDBC repository.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6 L 1 11" fill="none" stroke="#5d6f83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="writeArrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6 L 1 11" fill="none" stroke="#dc6b82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="readArrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6 L 1 11" fill="none" stroke="#5b8def" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:43px;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:16px;fill:#536273}
    .participant{stroke-width:2.1;filter:url(#shadow)}
    .partText{font-family:"Architects Daughter","Comic Mono",monospace;font-size:24px;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:14px;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:14px;fill:#102033}
    .lifeline{stroke:#b7c2d1;stroke-width:2;stroke-dasharray:10 10}
    .msg{stroke:#5d6f83;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    .write{stroke:#dc6b82;stroke-width:2.4;fill:none;marker-end:url(#writeArrow)}
    .read{stroke:#5b8def;stroke-width:2.4;fill:none;marker-end:url(#readArrow)}
    .region{fill:#fbfdff;stroke:#d8e0ea;stroke-width:1.4}
    .alt{fill:#fff7e8;fill-opacity:.12;stroke:#d99a36;stroke-opacity:0.72;stroke-width:1.4}
    .retry{fill:#f1ecff;fill-opacity:0.16;stroke:#8a72d6;stroke-opacity:0.72;stroke-width:1.4}
    .regionTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:22px;fill:#243447}
    .labelBox{fill:#ffffff;stroke:#d8e0ea;stroke-width:1;rx:8}
    .label{font-family:"Comic Mono",monospace;font-size:14px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="1960" height="1126"/>
<rect class="frame" x="32" y="28" width="1896" height="1070" rx="28"/>
<text class="title" x="66" y="82">Spring Modulith Publication Lifecycle</text>
<text class="subtitle" x="70" y="118">The repository is synchronous and JDBC-only; completion mode decides whether rows are updated, deleted, or moved to an archive table.</text>

<g transform="translate(96,166)">
  <rect class="participant" x="0" y="0" width="260" height="78" rx="12" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="partText" x="130" y="34" text-anchor="middle">Application Service</text>
  <text class="small" x="130" y="60" text-anchor="middle">business transaction</text>
</g>
<g transform="translate(452,166)">
  <rect class="participant" x="0" y="0" width="270" height="78" rx="12" fill="#eaf7ef" stroke="#58a978"/>
  <text class="partText" x="135" y="34" text-anchor="middle">Spring Modulith</text>
  <text class="small" x="135" y="60" text-anchor="middle">event publication SPI</text>
</g>
<g transform="translate(818,166)">
  <rect class="participant" x="0" y="0" width="306" height="78" rx="12" fill="#fff3d9" stroke="#d6a441"/>
  <text class="partText" x="153" y="34" text-anchor="middle">Exposed Repository</text>
  <text class="small" x="153" y="60" text-anchor="middle">springTransactionManager</text>
</g>
<g transform="translate(1230,166)">
  <rect class="participant" x="0" y="0" width="276" height="78" rx="12" fill="#fdecef" stroke="#dc6b82"/>
  <text class="partText" x="138" y="34" text-anchor="middle">EVENT_PUBLICATION</text>
  <text class="small" x="138" y="60" text-anchor="middle">active table</text>
</g>
<g transform="translate(1610,166)">
  <rect class="participant" x="0" y="0" width="276" height="78" rx="12" fill="#f1ecff" stroke="#8a72d6"/>
  <text class="partText" x="138" y="34" text-anchor="middle">ARCHIVE Table</text>
  <text class="small" x="138" y="60" text-anchor="middle">only in ARCHIVE mode</text>
</g>

