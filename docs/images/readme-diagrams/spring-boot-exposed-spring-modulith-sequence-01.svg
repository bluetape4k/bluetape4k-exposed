<svg data-sequence-style="wiki-best-practices" data-source-read="spring-boot/exposed-spring-modulith/README.md; spring-boot/exposed-spring-modulith/src/main/kotlin/io/bluetape4k/spring/modulith/exposed/ExposedEventPublicationRepository.kt; spring-boot/exposed-spring-modulith/src/main/kotlin/io/bluetape4k/spring/modulith/exposed/ExposedEventPublicationTable.kt" xmlns="http://www.w3.org/2000/svg" width="1960" height="1540" viewBox="0 0 1960 1540" role="img" aria-labelledby="title desc">
<title id="title">Spring Modulith publication lifecycle</title>
<desc id="desc">Sequence view of Spring Modulith event publication creation, processing, completion modes, archive savepoint behavior, and retry status tracking through the Exposed JDBC repository.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868" stroke="#3E9868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B" stroke="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-rose" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#DC6B82" stroke="#DC6B82" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-purple" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#263238}
    .subtitle,.msg,.role,.footer,.detail{font-family:"Comic Mono",monospace;fill:#36464F}
    .subtitle{font-size:16px}
    .participantTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:24px;fill:#1F3138}
    .role{font-size:13px;fill:#546A73}
    .header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2;filter:url(#shadow)}
    .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}
    .activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}
    .call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .return{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
    .alt{fill:#EEF7F0;fill-opacity:.12;stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 7}
    .opt{fill:#F3ECFF;fill-opacity:.14;stroke:#7C5AA6;stroke-width:2.2;stroke-dasharray:12 7}
    .divider{stroke:#78909C;stroke-width:2.2;stroke-dasharray:12 8}
    .pill{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.3}
    .badgeText{font-family:"Comic Mono",monospace;font-size:12px;font-weight:700}
    .msg{font-size:14px;font-weight:700}
    .regionText{font-family:"Comic Mono",monospace;font-size:13px;font-weight:700;fill:#60727D}
    .footer{font-size:14px;fill:#60727D}
  </style>
