<text class="label" x="1176" y="858" text-anchor="middle">UPDATE: set COMPLETED + date</text>
<path class="write" d="M971 918 H1368"/>
<rect class="labelBox" x="1055" y="878" width="242" height="34"/>
<text class="label" x="1176" y="900" text-anchor="middle">DELETE: remove row</text>
