<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
  <title id="title">Jackson 2 JSON Column Boundary</title>
  <desc id="desc">Responsibility map for exposed-jackson2 showing table APIs, serializer boundary, Exposed column types, JSON SQL helpers, and ResultRow or R2DBC Readable readback helpers.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .lane{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.card{filter:url(#shadow);stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .lane-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1000"/>
  <rect class="frame" x="44" y="36" width="1592" height="928" rx="34"/>
  <text class="title" x="72" y="88">Jackson 2 JSON Column Boundary</text>
  <text class="subtitle" x="76" y="121">Small Exposed adapters keep JSON columns, SQL JSON helpers, and row readers tied to one Jackson 2 serializer boundary.</text>

  <rect class="lane" x="82" y="160" width="348" height="620" rx="18"/><text class="lane-title" x="112" y="190" dominant-baseline="middle">1. Table API</text>
  <rect class="lane" x="466" y="160" width="348" height="620" rx="18"/><text class="lane-title" x="496" y="190" dominant-baseline="middle">2. Serializer boundary</text>
  <rect class="lane" x="850" y="160" width="348" height="620" rx="18"/><text class="lane-title" x="880" y="190" dominant-baseline="middle">3. Exposed column + SQL</text>
  <rect class="lane" x="1234" y="160" width="348" height="620" rx="18"/><text class="lane-title" x="1264" y="190" dominant-baseline="middle">4. Readback API</text>

  <path data-edge="api-json-&gt;serializer" class="connector" d="M 386 276 L 448 276 Q 460 276 460 288 L 460 304 Q 460 316 472 316 L 510 316" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="api-jsonb-&gt;serializer" class="connector" d="M 386 420 L 510 420" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="api-query-&gt;sql" class="connector" d="M 386 620 L 910 620" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="serializer-&gt;columns" class="connector" d="M 770 348 L 910 348" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="columns-&gt;sql" class="connector" d="M 1024 452 L 1024 548" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="sql-&gt;readers" class="connector" d="M 1138 620 L 1294 620" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="serializer-&gt;readers" class="connector" d="M 640 276 L 640 222 Q 640 210 652 210 L 1396 210 Q 1408 210 1408 222 L 1408 572" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>

  <g id="node-api-json" data-node="api-json" transform="translate(126,236)"><rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="card-title" x="130" y="28" text-anchor="middle" dominant-baseline="middle">jackson()</text><text class="detail" x="130" y="54" text-anchor="middle" dominant-baseline="middle">JSON column registration</text></g>
  <g id="node-api-jsonb" data-node="api-jsonb" transform="translate(126,380)"><rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="card-title" x="130" y="28" text-anchor="middle" dominant-baseline="middle">jacksonb()</text><text class="detail" x="130" y="54" text-anchor="middle" dominant-baseline="middle">JSONB column registration</text></g>
  <g id="node-api-query" data-node="api-query" transform="translate(126,560)"><rect class="card" x="0" y="0" width="260" height="120" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="card-title" x="130" y="30" text-anchor="middle" dominant-baseline="middle">Query helpers</text><text class="detail" x="130" y="56" text-anchor="middle" dominant-baseline="middle">extract()</text><text class="detail" x="130" y="78" text-anchor="middle" dominant-baseline="middle">contains()</text><text class="detail" x="130" y="100" text-anchor="middle" dominant-baseline="middle">exists()</text></g>

  <g id="node-serializer" data-node="serializer" transform="translate(510,276)"><rect class="card" x="0" y="0" width="260" height="240" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="card-title" x="130" y="32" text-anchor="middle" dominant-baseline="middle">DefaultJacksonSerializer</text><text class="detail" x="130" y="66" text-anchor="middle" dominant-baseline="middle">lazy JacksonSerializer()</text><text class="detail" x="130" y="94" text-anchor="middle" dominant-baseline="middle">serializeAsString()</text><text class="detail" x="130" y="122" text-anchor="middle" dominant-baseline="middle">deserializeFromString()</text><text class="detail" x="130" y="150" text-anchor="middle" dominant-baseline="middle">deserialize(ByteArray)</text><text class="detail" x="130" y="188" text-anchor="middle" dominant-baseline="middle">custom serializer overloads</text></g>

  <g id="node-columns" data-node="columns" transform="translate(910,288)"><rect class="card" x="0" y="0" width="228" height="164" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="card-title" x="114" y="30" text-anchor="middle" dominant-baseline="middle">Column types</text><text class="detail" x="114" y="58" text-anchor="middle" dominant-baseline="middle">JacksonColumnType</text><text class="detail" x="114" y="82" text-anchor="middle" dominant-baseline="middle">JacksonBColumnType</text><text class="detail" x="114" y="114" text-anchor="middle" dominant-baseline="middle">dialect JSON markers</text><text class="detail" x="114" y="138" text-anchor="middle" dominant-baseline="middle">String / ByteArray read</text></g>
  <g id="node-sql" data-node="sql" transform="translate(910,548)"><rect class="card" x="0" y="0" width="228" height="144" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="card-title" x="114" y="30" text-anchor="middle" dominant-baseline="middle">JSON SQL expressions</text><text class="detail" x="114" y="58" text-anchor="middle" dominant-baseline="middle">jsonExtract()</text><text class="detail" x="114" y="82" text-anchor="middle" dominant-baseline="middle">jsonContains()</text><text class="detail" x="114" y="106" text-anchor="middle" dominant-baseline="middle">jsonExists()</text></g>

  <g id="node-readers" data-node="readers" transform="translate(1294,572)"><rect class="card" x="0" y="0" width="228" height="152" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="card-title" x="114" y="30" text-anchor="middle" dominant-baseline="middle">Row readers</text><text class="detail" x="114" y="58" text-anchor="middle" dominant-baseline="middle">ResultRow.getJackson</text><text class="detail" x="114" y="82" text-anchor="middle" dominant-baseline="middle">Readable.getJackson</text><text class="detail" x="114" y="106" text-anchor="middle" dominant-baseline="middle">JsonNode readers</text><text class="detail" x="114" y="130" text-anchor="middle" dominant-baseline="middle">nullable variants</text></g>

  <g transform="translate(112,842)"><rect class="constraint" x="0" y="0" width="1456" height="40" rx="10"/><text class="small" x="728" y="22" text-anchor="middle" dominant-baseline="middle">Use custom serializers when Jackson 2 features, filters, or type handling must differ from the shared default serializer.</text></g>
</svg>
