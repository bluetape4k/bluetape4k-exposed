<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1540" viewBox="0 0 1720 1540" role="img" aria-labelledby="title desc">
  <title id="title">JDBC Lettuce Redis Cache Architecture</title>
  <desc id="desc">JDBC Lettuce architecture rebuilt from exposed-jdbc-lettuce README, repository, loader, and writer source files.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 9 5 L 0.8 9.2 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.4" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1720" height="1540"/>
  <rect class="decor" x="44" y="36" width="1632" height="1468" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1556" height="1244" rx="24"/>
  <text class="title" x="72" y="88">JDBC Lettuce Redis Cache Architecture</text>
  <text class="subtitle" x="76" y="121">A JDBC repository pair coordinates Lettuce Redis loaded maps, optional suspend NearCache, and Exposed transaction loaders/writers.</text>
  <g id="group-api">
    <rect class="group" x="92" y="156" width="1536" height="310" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">JDBC cache repository surfaces</text>
  </g>
  <g id="group-cache">
    <rect class="group" x="92" y="506" width="1536" height="300" rx="18"/>
    <text class="group-title" x="122" y="530" dominant-baseline="middle">Lettuce Redis cache maps</text>
  </g>
  <g id="group-persistence">
    <rect class="group" x="92" y="846" width="1536" height="330" rx="18"/>
    <text class="group-title" x="122" y="870" dominant-baseline="middle">Exposed JDBC loader and writer path</text>
  </g>
  <g id="group-modes">
    <rect class="group" x="92" y="1216" width="1536" height="175" rx="18"/>
    <text class="group-title" x="122" y="1240" dominant-baseline="middle">Write modes and module boundary</text>
  </g>
  <path id="route-caller-sync-contract" data-edge="caller-&gt;sync-contract" data-label="blocking calls" class="connector" d="M 430 304 L 476 304 L 476 268 L 520 268" stroke="#4F83BF"/>
  <path id="route-caller-suspend-contract" data-edge="caller-&gt;suspend-contract" data-label="suspend calls" class="connector" d="M 430 356 L 520 356" stroke="#2E8F89"/>
  <path id="route-sync-contract-sync-base" data-edge="sync-contract-&gt;sync-base" data-label="implemented by" class="connector" d="M 880 268 L 1030 268" stroke="#755BC6"/>
  <path id="route-suspend-contract-suspend-base" data-edge="suspend-contract-&gt;suspend-base" data-label="implemented by" class="connector" d="M 880 383 L 1030 383" stroke="#755BC6"/>
  <path id="route-sync-base-redis-sync" data-edge="sync-base-&gt;redis-sync" data-label="owns sync map" class="connector" d="M 1460 268 L 1505 268 L 1505 618 L 1430 618" stroke="#2E8F89"/>
  <path id="route-suspend-base-redis-suspend" data-edge="suspend-base-&gt;redis-suspend" data-label="owns suspend map" class="connector" d="M 1460 383 L 1510 383 L 1510 728 L 1430 728" stroke="#2E8F89"/>
  <path id="route-suspend-base-near-cache" data-edge="suspend-base-&gt;near-cache" data-label="optional local front" class="connector" d="M 1120 431 L 1120 492 L 715 492 L 715 595" stroke="#3E9868"/>
  <path id="route-config-near-cache" data-edge="config-&gt;near-cache" data-label="enables local front" class="connector" d="M 480 644 L 550 644" stroke="#3E9868"/>
  <path id="route-redis-sync-loader-sync" data-edge="redis-sync-&gt;loader-sync" data-label="miss loads" class="connector" d="M 970 618 L 910 618 L 910 824 L 500 824 L 500 900 L 305 900 L 305 930" stroke="#755BC6"/>
  <path id="route-loader-sync-tx-sync" data-edge="loader-sync-&gt;tx-sync" data-label="SELECT" class="connector" d="M 480 973 L 500 973 L 500 902 L 1145 902 L 1145 920" stroke="#755BC6"/>
  <path id="route-writer-sync-tx-sync" data-edge="writer-sync-&gt;tx-sync" data-label="UPDATE/INSERT/DELETE" class="connector" d="M 890 972 L 1010 972" stroke="#C94D68"/>
  <path id="route-writer-suspend-database" data-edge="writer-suspend-&gt;database" data-label="JDBC DSL writer" class="connector" d="M 890 1092 L 930 1092 L 930 1152 L 1490 1152 L 1490 1077" stroke="#C94D68"/>
  <path id="route-tx-sync-database" data-edge="tx-sync-&gt;database" data-label="JDBC statements" class="connector" d="M 1280 963 L 1335 963 L 1335 1031 L 1390 1031" stroke="#C94D68"/>
  <path id="route-tx-suspend-database" data-edge="tx-suspend-&gt;database" data-label="JDBC statements" class="connector" d="M 1320 1083 L 1360 1083 L 1360 1031 L 1390 1031" stroke="#C94D68"/>
  <g id="node-caller" data-node="caller" transform="translate(130,280)">
    <rect class="shape" x="0" y="0" width="300" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Application repository code</text>
    <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">findById, save, delete</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">clear, invalidateByPattern</text>
  </g>
  <g id="node-sync-contract" data-node="sync-contract" transform="translate(520,220)">
    <rect class="shape" x="0" y="0" width="360" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="180" y="29" text-anchor="middle" dominant-baseline="middle">JdbcLettuceRepository</text>
    <text class="detail" x="180" y="48" text-anchor="middle" dominant-baseline="middle">blocking cache contract</text>
    <text class="detail" x="180" y="67" text-anchor="middle" dominant-baseline="middle">JdbcRedisRepository</text>
  </g>
  <g id="node-suspend-contract" data-node="suspend-contract" transform="translate(520,335)">
    <rect class="shape" x="0" y="0" width="360" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="180" y="29" text-anchor="middle" dominant-baseline="middle">SuspendedJdbcLettuceRepo</text>
    <text class="detail" x="180" y="48" text-anchor="middle" dominant-baseline="middle">suspend cache contract</text>
    <text class="detail" x="180" y="67" text-anchor="middle" dominant-baseline="middle">SuspendJdbcRedisRepository</text>
  </g>
  <g id="node-sync-base" data-node="sync-base" transform="translate(1030,220)">
    <rect class="shape" x="0" y="0" width="430" height="96" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="215" y="29" text-anchor="middle" dominant-baseline="middle">AbstractJdbcLettuceRepo</text>
    <text class="detail" x="215" y="48" text-anchor="middle" dominant-baseline="middle">LettuceLoadedMap</text>
    <text class="detail" x="215" y="67" text-anchor="middle" dominant-baseline="middle">transaction { }</text>
  </g>
  <g id="node-suspend-base" data-node="suspend-base" transform="translate(1030,335)">
    <rect class="shape" x="0" y="0" width="430" height="96" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="215" y="29" text-anchor="middle" dominant-baseline="middle">AbstractSuspendedJdbcLettuceRepo</text>
    <text class="detail" x="215" y="48" text-anchor="middle" dominant-baseline="middle">LettuceSuspendedLoadedMap</text>
    <text class="detail" x="215" y="67" text-anchor="middle" dominant-baseline="middle">suspendedTransactionAsync(IO)</text>
  </g>
  <g id="node-config" data-node="config" transform="translate(130,590)">
    <rect class="shape" x="0" y="0" width="350" height="108" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="175" y="25.5" text-anchor="middle" dominant-baseline="middle">LettuceCacheConfig</text>
    <text class="detail" x="175" y="44.5" text-anchor="middle" dominant-baseline="middle">writeMode</text>
    <text class="detail" x="175" y="63.5" text-anchor="middle" dominant-baseline="middle">nearCacheEnabled</text>
    <text class="detail" x="175" y="82.5" text-anchor="middle" dominant-baseline="middle">retry/chunk settings</text>
  </g>
  <g id="node-near-cache" data-node="near-cache" transform="translate(550,595)">
    <rect class="shape" x="0" y="0" width="330" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="165" y="29" text-anchor="middle" dominant-baseline="middle">Suspend NearCache</text>
    <text class="detail" x="165" y="48" text-anchor="middle" dominant-baseline="middle">optional Caffeine front</text>
    <text class="detail" x="165" y="67" text-anchor="middle" dominant-baseline="middle">suspend repository only</text>
  </g>
  <g id="node-redis-sync" data-node="redis-sync" transform="translate(970,570)">
    <rect class="shape" x="0" y="0" width="460" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="230" y="29" text-anchor="middle" dominant-baseline="middle">LettuceLoadedMap</text>
    <text class="detail" x="230" y="48" text-anchor="middle" dominant-baseline="middle">sync read-through map</text>
    <text class="detail" x="230" y="67" text-anchor="middle" dominant-baseline="middle">Redis remote cache</text>
  </g>
  <g id="node-redis-suspend" data-node="redis-suspend" transform="translate(970,680)">
    <rect class="shape" x="0" y="0" width="460" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="230" y="29" text-anchor="middle" dominant-baseline="middle">LettuceSuspendedLoadedMap</text>
    <text class="detail" x="230" y="48" text-anchor="middle" dominant-baseline="middle">coroutine read-through map</text>
    <text class="detail" x="230" y="67" text-anchor="middle" dominant-baseline="middle">Redis remote cache</text>
  </g>
  <g id="node-loader-sync" data-node="loader-sync" transform="translate(130,930)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">ExposedEntityMapLoader</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">loadById, loadAllIds</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">PK ascending batches</text>
  </g>
  <g id="node-writer-sync" data-node="writer-sync" transform="translate(530,920)">
    <rect class="shape" x="0" y="0" width="360" height="104" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="180" y="33" text-anchor="middle" dominant-baseline="middle">ExposedEntityMapWriter</text>
    <text class="detail" x="180" y="52" text-anchor="middle" dominant-baseline="middle">upsert/delete</text>
    <text class="detail" x="180" y="71" text-anchor="middle" dominant-baseline="middle">Resilience4j retry</text>
  </g>
  <g id="node-tx-sync" data-node="tx-sync" transform="translate(1010,920)">
    <rect class="shape" x="0" y="0" width="270" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="135" y="24" text-anchor="middle" dominant-baseline="middle">Exposed transaction</text>
    <text class="detail" x="135" y="43" text-anchor="middle" dominant-baseline="middle">select, update</text>
    <text class="detail" x="135" y="62" text-anchor="middle" dominant-baseline="middle">batchInsert/deleteWhere</text>
  </g>
  <g id="node-loader-suspend" data-node="loader-suspend" transform="translate(130,1040)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">SuspendedEntityMapLoader</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">suspend map loader</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">JDBC DSL query body</text>
  </g>
  <g id="node-writer-suspend" data-node="writer-suspend" transform="translate(530,1040)">
    <rect class="shape" x="0" y="0" width="360" height="104" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="180" y="33" text-anchor="middle" dominant-baseline="middle">SuspendedEntityMapWriter</text>
    <text class="detail" x="180" y="52" text-anchor="middle" dominant-baseline="middle">suspend map writer</text>
    <text class="detail" x="180" y="71" text-anchor="middle" dominant-baseline="middle">same upsert policy</text>
  </g>
  <g id="node-tx-suspend" data-node="tx-suspend" transform="translate(1010,1040)">
    <rect class="shape" x="0" y="0" width="310" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="155" y="24" text-anchor="middle" dominant-baseline="middle">suspended tx async</text>
    <text class="detail" x="155" y="43" text-anchor="middle" dominant-baseline="middle">direct DB reads</text>
    <text class="detail" x="155" y="62" text-anchor="middle" dominant-baseline="middle">findAllFromDb/count</text>
  </g>
  <g id="node-database" data-node="database" transform="translate(1390,985)">
    <rect class="shape" x="0" y="0" width="200" height="92" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="100" y="27" text-anchor="middle" dominant-baseline="middle">JDBC database</text>
    <text class="detail" x="100" y="46" text-anchor="middle" dominant-baseline="middle">Exposed IdTable</text>
    <text class="detail" x="100" y="65" text-anchor="middle" dominant-baseline="middle">Serializable DTO</text>
  </g>
  <g id="node-read-order" data-node="read-order" transform="translate(130,1300)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="150" y="16" text-anchor="middle" dominant-baseline="middle">Read-through order</text>
    <text class="detail" x="150" y="35" text-anchor="middle" dominant-baseline="middle">Suspend NearCache only</text>
    <text class="detail" x="150" y="54" text-anchor="middle" dominant-baseline="middle">Redis -&gt; DB on miss</text>
  </g>
  <g id="node-write-through" data-node="write-through" transform="translate(500,1300)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="25.5" text-anchor="middle" dominant-baseline="middle">WRITE_THROUGH</text>
    <text class="detail" x="150" y="44.5" text-anchor="middle" dominant-baseline="middle">Redis + DB before return</text>
  </g>
  <g id="node-write-behind" data-node="write-behind" transform="translate(880,1300)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="150" y="16" text-anchor="middle" dominant-baseline="middle">WRITE_BEHIND</text>
    <text class="detail" x="150" y="35" text-anchor="middle" dominant-baseline="middle">Redis first</text>
    <text class="detail" x="150" y="54" text-anchor="middle" dominant-baseline="middle">DB flush behind</text>
  </g>
  <g id="node-boundary" data-node="boundary" transform="translate(1260,1300)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="150" y="16" text-anchor="middle" dominant-baseline="middle">Not R2DBC</text>
    <text class="detail" x="150" y="35" text-anchor="middle" dominant-baseline="middle">JDBC transaction APIs</text>
    <text class="detail" x="150" y="54" text-anchor="middle" dominant-baseline="middle">no R2DBC driver path</text>
  </g>
  <g transform="translate(76,1448)">
    <rect class="pill" x="0" y="0" width="1568" height="48" rx="10"/>
    <text class="small" x="784" y="18" text-anchor="middle" dominant-baseline="middle">Use this view to locate cache ownership: sync goes through LettuceLoadedMap; suspend may add a local NearCache front.</text>
    <text class="small" x="784" y="35" text-anchor="middle" dominant-baseline="middle">Loader and writer cards are the Exposed JDBC bridge used when Redis misses, writes through, writes behind, or deletes rows.</text>
  </g>
</svg>
