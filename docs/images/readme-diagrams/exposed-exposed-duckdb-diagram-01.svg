<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc">
  <title id="title">DuckDB Exposed Integration Boundary</title>
  <desc id="desc">Vertical architecture diagram for exposed-duckdb showing Exposed usage, DuckDB connection modes, compatibility adapters, PostgreSQL-based dialect registration, and embedded DuckDB execution.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.card{filter:url(#shadow);stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .layer-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1240"/>
  <rect class="frame" x="44" y="36" width="1592" height="1168" rx="34"/>
  <text class="title" x="72" y="88">DuckDB Exposed Integration Boundary</text>
  <text class="subtitle" x="76" y="121">Embedded analytics backend support through DuckDB JDBC, PostgreSQL-style SQL generation, and small compatibility adapters.</text>

  <rect class="layer" x="82" y="160" width="1516" height="174" rx="18"/><text class="layer-title" x="112" y="188" dominant-baseline="middle">1. Exposed caller surface</text>
  <rect class="layer" x="82" y="376" width="1516" height="238" rx="18"/><text class="layer-title" x="112" y="404" dominant-baseline="middle">2. DuckDB module boundary</text>
  <rect class="layer" x="82" y="656" width="1516" height="190" rx="18"/><text class="layer-title" x="112" y="684" dominant-baseline="middle">3. Exposed JDBC compatibility</text>
  <rect class="layer" x="82" y="888" width="1516" height="180" rx="18"/><text class="layer-title" x="112" y="916" dominant-baseline="middle">4. DuckDB execution target</text>

  <path data-edge="app-&gt;database" class="connector" d="M 340 282 L 340 454" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="analytics-&gt;extensions" class="connector" d="M 840 282 L 840 454" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="storage-&gt;modes" class="connector" d="M 1340 282 L 1340 454" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="database-&gt;wrapper" class="connector" d="M 340 574 L 340 616 Q 340 628 352 628 L 768 628 Q 780 628 780 640 L 780 724" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="extensions-&gt;dialect" class="connector" d="M 840 574 L 840 616 Q 840 628 852 628 L 1068 628 Q 1080 628 1080 640 L 1080 724" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="modes-&gt;duckdb" class="connector" d="M 1340 574 L 1340 866 Q 1340 878 1328 878 L 992 878 Q 980 878 980 890 L 980 950" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="wrapper-&gt;duckdb" class="connector" d="M 780 786 L 780 950" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="dialect-&gt;duckdb" class="connector" d="M 1080 786 L 1080 848 Q 1080 860 1068 860 L 912 860 Q 900 860 900 872 L 900 950" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>

  <g id="node-app" data-node="app" transform="translate(190,222)"><rect class="card" x="0" y="0" width="300" height="60" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="card-title" x="150" y="23" text-anchor="middle" dominant-baseline="middle">Exposed transaction</text><text class="detail" x="150" y="45" text-anchor="middle" dominant-baseline="middle">SchemaUtils, insert, select</text></g>
  <g id="node-analytics" data-node="analytics" transform="translate(690,222)"><rect class="card" x="0" y="0" width="300" height="60" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="card-title" x="150" y="23" text-anchor="middle" dominant-baseline="middle">Coroutine callers</text><text class="detail" x="150" y="45" text-anchor="middle" dominant-baseline="middle">suspendTransaction, queryFlow</text></g>
  <g id="node-storage" data-node="storage" transform="translate(1190,222)"><rect class="card" x="0" y="0" width="300" height="60" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="card-title" x="150" y="23" text-anchor="middle" dominant-baseline="middle">Storage choice</text><text class="detail" x="150" y="45" text-anchor="middle" dominant-baseline="middle">memory, file, read-only</text></g>

  <g id="node-database" data-node="database" transform="translate(200,454)"><rect class="card" x="0" y="0" width="280" height="120" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><image data-bluetape4k-icon="testcontainers.duckdb" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="card-title" x="140" y="30" text-anchor="middle" dominant-baseline="middle">DuckDBDatabase</text><text class="detail" x="140" y="56" text-anchor="middle" dominant-baseline="middle">registers jdbc:duckdb</text><text class="detail" x="140" y="78" text-anchor="middle" dominant-baseline="middle">loads DuckDBDriver</text><text class="detail" x="140" y="100" text-anchor="middle" dominant-baseline="middle">returns Exposed Database</text></g>
  <g id="node-extensions" data-node="extensions" transform="translate(640,454)"><rect class="card" x="0" y="0" width="400" height="120" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><image data-bluetape4k-icon="testcontainers.duckdb" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="card-title" x="200" y="30" text-anchor="middle" dominant-baseline="middle">DuckDBExtensions</text><text class="detail" x="200" y="56" text-anchor="middle" dominant-baseline="middle">blocking JDBC runs on dispatcher</text><text class="detail" x="200" y="78" text-anchor="middle" dominant-baseline="middle">cancellation is propagated</text><text class="detail" x="200" y="100" text-anchor="middle" dominant-baseline="middle">queryFlow materializes first</text></g>
  <g id="node-modes" data-node="modes" transform="translate(1200,454)"><rect class="card" x="0" y="0" width="280" height="120" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="card-title" x="140" y="30" text-anchor="middle" dominant-baseline="middle">Connection modes</text><text class="detail" x="140" y="56" text-anchor="middle" dominant-baseline="middle">inMemory is per connection</text><text class="detail" x="140" y="78" text-anchor="middle" dominant-baseline="middle">file is shared persistent DB</text><text class="detail" x="140" y="100" text-anchor="middle" dominant-baseline="middle">readOnly adds access_mode</text></g>

  <g id="node-wrapper" data-node="wrapper" transform="translate(640,724)"><rect class="card" x="0" y="0" width="280" height="62" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="card-title" x="140" y="24" text-anchor="middle" dominant-baseline="middle">ConnectionWrapper</text><text class="detail" x="140" y="46" text-anchor="middle" dominant-baseline="middle">generated-key overload fallback</text></g>
  <g id="node-dialect" data-node="dialect" transform="translate(940,724)"><rect class="card" x="0" y="0" width="280" height="62" rx="12" fill="#FFF3D9" stroke="#D6A441"/><image data-bluetape4k-icon="generic.database" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="card-title" x="140" y="24" text-anchor="middle" dominant-baseline="middle">DuckDBDialect</text><text class="detail" x="140" y="46" text-anchor="middle" dominant-baseline="middle">PostgreSQLDialect base</text></g>
  <g id="node-duckdb" data-node="duckdb" transform="translate(640,950)"><rect class="card" x="0" y="0" width="400" height="72" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><image data-bluetape4k-icon="testcontainers.duckdb" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="card-title" x="200" y="28" text-anchor="middle" dominant-baseline="middle">Embedded DuckDB JDBC</text><text class="detail" x="200" y="52" text-anchor="middle" dominant-baseline="middle">analytics queries, local files, temporary data</text></g>
  <g transform="translate(112,1110)"><rect class="constraint" x="0" y="0" width="1456" height="40" rx="10"/><text class="small" x="728" y="22" text-anchor="middle" dominant-baseline="middle">Use file-backed DuckDB when transactions need shared state; jdbc:duckdb: in-memory connections are independent.</text></g>
</svg>
