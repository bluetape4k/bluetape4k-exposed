<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1320" viewBox="0 0 1680 1320" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Lettuce Redis Cache Architecture</title>
  <desc id="desc">R2DBC Lettuce architecture showing the coroutine repository surface, optional NearCache, Redis loaded map, and R2DBC loader/writer path.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.4" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1320"/>
  <rect class="decor" x="44" y="36" width="1592" height="1248" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1516" height="1024" rx="24"/>
  <text class="title" x="72" y="88">R2DBC Lettuce Redis Cache Architecture</text>
  <text class="subtitle" x="76" y="121">A suspend data-access repository coordinates optional Caffeine NearCache, Redis, and R2DBC suspendTransaction loaders/writers.</text>
  <g id="group-api">
    <rect class="group" x="92" y="156" width="1496" height="210" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Coroutine Redis repository surface</text>
  </g>
  <g id="group-cache">
    <rect class="group" x="92" y="406" width="1496" height="265" rx="18"/>
    <text class="group-title" x="122" y="430" dominant-baseline="middle">NearCache and Lettuce Redis map</text>
  </g>
  <g id="group-persistence">
    <rect class="group" x="92" y="711" width="1496" height="240" rx="18"/>
    <text class="group-title" x="122" y="735" dominant-baseline="middle">R2DBC loader and writer path</text>
  </g>
  <g id="group-modes">
    <rect class="group" x="92" y="991" width="1496" height="165" rx="18"/>
    <text class="group-title" x="122" y="1015" dominant-baseline="middle">Write modes and module boundaries</text>
  </g>
  <path id="route-caller-contract" data-edge="caller-&gt;contract" data-label="suspend calls" class="connector" d="M 465 293 L 560 293" stroke="#4F83BF"/>
  <path id="route-contract-abstract" data-edge="contract-&gt;abstract" data-label="implemented by base class" class="connector" d="M 950 287 L 1070 287" stroke="#755BC6"/>
  <path id="route-abstract-config" data-edge="abstract-&gt;config" data-label="builds cache behavior" class="connector" d="M 1190 339 L 1190 376 L 320 376 L 320 494" stroke="#B9851B"/>
  <path id="route-abstract-near-cache" data-edge="abstract-&gt;near-cache" data-label="optional local front" class="connector" d="M 1190 339 L 1190 382 L 790 382 L 790 500" stroke="#3E9868"/>
  <path id="route-abstract-redis-map" data-edge="abstract-&gt;redis-map" data-label="owns Redis loaded map" class="connector" d="M 1270 339 L 1270 500" stroke="#2E8F89"/>
  <path id="route-redis-map-loader" data-edge="redis-map-&gt;loader" data-label="cache miss loads DB" class="connector" d="M 1110 552 L 1060 552 L 1060 685 L 305 685 L 305 805" stroke="#755BC6"/>
  <path id="route-redis-map-writer" data-edge="redis-map-&gt;writer" data-label="write modes call writer" class="connector" d="M 1220 604 L 1220 735 L 785 735 L 785 790" stroke="#2E8F89"/>
  <path id="route-loader-database" data-edge="loader-&gt;database" data-label="SELECT via suspendTransaction" class="connector" d="M 470 848 L 520 848 L 520 960 L 1275 960 L 1275 891" stroke="#755BC6"/>
  <path id="route-writer-database" data-edge="writer-&gt;database" data-label="UPDATE/INSERT/DELETE" class="connector" d="M 980 846 L 1110 846" stroke="#C94D68"/>
  <path id="route-write-through-writer" data-edge="write-through-&gt;writer" data-label="DB write before return" class="connector" d="M 660 1070 L 660 902" stroke="#2E8F89"/>
  <path id="route-write-behind-redis-map" data-edge="write-behind-&gt;redis-map" data-label="Redis returns first" class="connector" d="M 1050 1070 L 1050 650 L 1290 650 L 1290 604" stroke="#B9851B"/>
  <g id="node-caller" data-node="caller" transform="translate(135,250)">
    <rect class="shape" x="0" y="0" width="330" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="165" y="24" text-anchor="middle" dominant-baseline="middle">Coroutine application code</text>
    <text class="detail" x="165" y="43" text-anchor="middle" dominant-baseline="middle">findById, save, delete</text>
    <text class="detail" x="165" y="62" text-anchor="middle" dominant-baseline="middle">clearCache, invalidate</text>
  </g>
  <g id="node-contract" data-node="contract" transform="translate(560,235)">
    <rect class="shape" x="0" y="0" width="390" height="104" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="195" y="33" text-anchor="middle" dominant-baseline="middle">R2dbcLettuceRepository</text>
    <text class="detail" x="195" y="52" text-anchor="middle" dominant-baseline="middle">suspend cache contract</text>
    <text class="detail" x="195" y="71" text-anchor="middle" dominant-baseline="middle">R2dbcRedisRepository</text>
  </g>
  <g id="node-abstract" data-node="abstract" transform="translate(1070,235)">
    <rect class="shape" x="0" y="0" width="400" height="104" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="200" y="33" text-anchor="middle" dominant-baseline="middle">AbstractR2dbcLettuceRepository</text>
    <text class="detail" x="200" y="52" text-anchor="middle" dominant-baseline="middle">LettuceSuspendedLoadedMap</text>
    <text class="detail" x="200" y="71" text-anchor="middle" dominant-baseline="middle">NearCache optional</text>
  </g>
  <g id="node-config" data-node="config" transform="translate(140,494)">
    <rect class="shape" x="0" y="0" width="360" height="108" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="25.5" text-anchor="middle" dominant-baseline="middle">LettuceCacheConfig</text>
    <text class="detail" x="180" y="44.5" text-anchor="middle" dominant-baseline="middle">writeMode</text>
    <text class="detail" x="180" y="63.5" text-anchor="middle" dominant-baseline="middle">nearCacheEnabled</text>
    <text class="detail" x="180" y="82.5" text-anchor="middle" dominant-baseline="middle">batch/chunk sizes &gt; 0</text>
  </g>
  <g id="node-near-cache" data-node="near-cache" transform="translate(610,500)">
    <rect class="shape" x="0" y="0" width="360" height="104" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="180" y="33" text-anchor="middle" dominant-baseline="middle">Caffeine NearCache</text>
    <text class="detail" x="180" y="52" text-anchor="middle" dominant-baseline="middle">optional local front</text>
    <text class="detail" x="180" y="71" text-anchor="middle" dominant-baseline="middle">enabled by config</text>
  </g>
  <g id="node-redis-map" data-node="redis-map" transform="translate(1110,500)">
    <rect class="shape" x="0" y="0" width="360" height="104" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="180" y="33" text-anchor="middle" dominant-baseline="middle">Lettuce Redis map</text>
    <text class="detail" x="180" y="52" text-anchor="middle" dominant-baseline="middle">remote cache back</text>
    <text class="detail" x="180" y="71" text-anchor="middle" dominant-baseline="middle">read/write-through map</text>
  </g>
  <g id="node-loader" data-node="loader" transform="translate(140,805)">
    <rect class="shape" x="0" y="0" width="330" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="165" y="24" text-anchor="middle" dominant-baseline="middle">R2DBC MapLoader</text>
    <text class="detail" x="165" y="43" text-anchor="middle" dominant-baseline="middle">load(id), loadAllKeys</text>
    <text class="detail" x="165" y="62" text-anchor="middle" dominant-baseline="middle">PK ascending batches</text>
  </g>
  <g id="node-writer" data-node="writer" transform="translate(590,790)">
    <rect class="shape" x="0" y="0" width="390" height="112" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="195" y="37" text-anchor="middle" dominant-baseline="middle">R2DBC MapWriter</text>
    <text class="detail" x="195" y="56" text-anchor="middle" dominant-baseline="middle">upsert/delete</text>
    <text class="detail" x="195" y="75" text-anchor="middle" dominant-baseline="middle">Resilience4j retry</text>
  </g>
  <g id="node-database" data-node="database" transform="translate(1110,805)">
    <rect class="shape" x="0" y="0" width="330" height="86" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="165" y="24" text-anchor="middle" dominant-baseline="middle">R2DBC database</text>
    <text class="detail" x="165" y="43" text-anchor="middle" dominant-baseline="middle">suspendTransaction only</text>
    <text class="detail" x="165" y="62" text-anchor="middle" dominant-baseline="middle">no JDBC transaction</text>
  </g>
  <g id="node-read-order" data-node="read-order" transform="translate(140,1070)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="150" y="16" text-anchor="middle" dominant-baseline="middle">Read order</text>
    <text class="detail" x="150" y="35" text-anchor="middle" dominant-baseline="middle">NearCache -&gt; Redis -&gt; DB</text>
    <text class="detail" x="150" y="54" text-anchor="middle" dominant-baseline="middle">misses load and cache</text>
  </g>
  <g id="node-write-through" data-node="write-through" transform="translate(510,1070)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="25.5" text-anchor="middle" dominant-baseline="middle">READ_WRITE_THROUGH</text>
    <text class="detail" x="150" y="44.5" text-anchor="middle" dominant-baseline="middle">Redis + DB before return</text>
  </g>
  <g id="node-write-behind" data-node="write-behind" transform="translate(900,1070)">
    <rect class="shape" x="0" y="0" width="300" height="70" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="150" y="25.5" text-anchor="middle" dominant-baseline="middle">READ_WRITE_BEHIND</text>
    <text class="detail" x="150" y="44.5" text-anchor="middle" dominant-baseline="middle">Redis now, DB async</text>
  </g>
  <g id="node-boundary" data-node="boundary" transform="translate(1290,1070)">
    <rect class="shape" x="0" y="0" width="240" height="70" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="120" y="16" text-anchor="middle" dominant-baseline="middle">Not provided here</text>
    <text class="detail" x="120" y="35" text-anchor="middle" dominant-baseline="middle">no sync repository</text>
    <text class="detail" x="120" y="54" text-anchor="middle" dominant-baseline="middle">suspend APIs, no JDBC path</text>
  </g>
</svg>
