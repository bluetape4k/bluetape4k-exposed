<svg data-sequence-style="wiki-best-practices" data-source-read="spring-boot/spring-modulith/README.md; exposed/jdbc-caffeine/src/main/kotlin/io/bluetape4k/exposed/jdbc/caffeine/repository/AbstractJdbcCaffeineRepository.kt; spring-boot/spring-modulith/src/main/kotlin/io/bluetape4k/spring/modulith/exposed/SpringModulithJdbcCaffeineRepository.kt" xmlns="http://www.w3.org/2000/svg" width="1760" height="1220" viewBox="0 0 1760 1220" role="img" aria-labelledby="title desc">
<title id="title">Cache write event publication boundary</title>
<desc id="desc">Sequence view of JDBC Caffeine WRITE_THROUGH and WRITE_BEHIND persistence boundaries before Spring Modulith event publication.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868" stroke="#3E9868" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B" stroke="#B9851B" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-rose" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#DC6B82" stroke="#DC6B82" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#F6F9FC}
    .frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:42px;fill:#263238}
    .subtitle,.msg,.role,.footer,.detail{font-family:"Comic Mono",monospace;fill:#36464F}
    .subtitle{font-size:16px}
    .participantTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:23px;fill:#1F3138}
    .role{font-size:13px;fill:#546A73}
    .header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2;filter:url(#shadow)}
    .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}
    .activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}
    .call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .alt{fill:#EEF7F0;fill-opacity:.12;stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 7}
    .divider{stroke:#78909C;stroke-width:2.2;stroke-dasharray:12 8}
    .pill{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.3}
    .badgeText{font-family:"Comic Mono",monospace;font-size:12px;font-weight:700}
    .msg{font-size:14px;font-weight:700}
    .regionText{font-family:"Comic Mono",monospace;font-size:13px;font-weight:700;fill:#60727D}
    .footer{font-size:14px;fill:#60727D}
  </style>
</defs>
<rect class="canvas" width="1760" height="1220"/>
<rect class="frame" x="32" y="28" width="1696" height="1164" rx="30"/>
<text class="title" x="68" y="84">Cache Write Event Publication Boundary</text>
<text class="subtitle" x="72" y="116">Events are published only after JDBC persistence, never when a write-behind entry is merely enqueued.</text>

<g id="participants">
  <g id="p-caller">
    <rect class="header" x="82" y="166" width="248" height="86" rx="10"/>
    <text class="participantTitle participant" x="206" y="203" text-anchor="middle">Caller</text>
    <text class="role" x="206" y="228" text-anchor="middle">put / putAll</text>
    <line class="lifeline" x1="206" y1="252" x2="206" y2="1096"/>
  </g>
  <g id="p-cache">
    <rect class="header" x="410" y="166" width="300" height="86" rx="10"/>
    <text class="participantTitle participant" x="560" y="203" text-anchor="middle">JDBC Caffeine Repo</text>
    <text class="role" x="560" y="228" text-anchor="middle">cache + write mode</text>
    <line class="lifeline" x1="560" y1="252" x2="560" y2="1096"/>
  </g>
  <g id="p-db">
    <rect class="header" x="790" y="166" width="260" height="86" rx="10"/>
    <text class="participantTitle participant" x="920" y="203" text-anchor="middle">JDBC Database</text>
    <text class="role" x="920" y="228" text-anchor="middle">durable write</text>
    <line class="lifeline" x1="920" y1="252" x2="920" y2="1096"/>
  </g>
  <g id="p-spring">
    <rect class="header" x="1130" y="166" width="278" height="86" rx="10"/>
    <text class="participantTitle participant" x="1269" y="203" text-anchor="middle">Spring Publisher</text>
    <text class="role" x="1269" y="228" text-anchor="middle">ApplicationEventPublisher</text>
    <line class="lifeline" x1="1269" y1="252" x2="1269" y2="1096"/>
  </g>
  <g id="p-modulith">
    <rect class="header" x="1478" y="166" width="218" height="86" rx="10"/>
    <text class="participantTitle participant" x="1587" y="203" text-anchor="middle">Modulith</text>
    <text class="role" x="1587" y="228" text-anchor="middle">listener tracking</text>
    <line class="lifeline" x1="1587" y1="252" x2="1587" y2="1096"/>
  </g>
</g>

<rect class="activation" x="552" y="320" width="16" height="670" rx="5"/>
<rect class="activation" x="912" y="382" width="16" height="500" rx="5"/>
<rect class="activation" x="1261" y="548" width="16" height="368" rx="5"/>
<rect class="activation" x="1579" y="620" width="16" height="268" rx="5"/>

<g id="write-through">
  <rect class="alt" x="70" y="286" width="1620" height="326" rx="18"/>
  <rect class="pill" x="96" y="266" width="250" height="34" rx="17"/>
  <text class="regionText" x="221" y="287" text-anchor="middle">alt WRITE_THROUGH</text>
  <g id="m1">
    <rect class="pill" x="260" y="320" width="220" height="34" rx="17" stroke="#4F83BF"/>
    <circle cx="280" cy="337" r="13" fill="#EAF4F8" stroke="#4F83BF"/><text class="badgeText" x="280" y="341" text-anchor="middle" fill="#4F83BF">1</text>
    <text class="msg" x="370" y="342" text-anchor="middle" fill="#4F83BF">put(id, entity)</text>
    <path class="call" d="M 206 366 H 560" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/>
  </g>
  <g id="m2">
    <rect class="pill" x="642" y="382" width="226" height="34" rx="17" stroke="#3E9868"/>
    <circle cx="662" cy="399" r="13" fill="#EEF7F0" stroke="#3E9868"/><text class="badgeText" x="662" y="403" text-anchor="middle" fill="#3E9868">2</text>
    <text class="msg" x="760" y="404" text-anchor="middle" fill="#3E9868">writeToDb commits</text>
    <path class="call" d="M 560 428 H 920" stroke="#3E9868" marker-end="url(#seqArrow-green)"/>
  </g>
  <g id="m3">
    <rect class="pill" x="978" y="468" width="340" height="34" rx="17" stroke="#B9851B"/>
    <circle cx="998" cy="485" r="13" fill="#FFF8E8" stroke="#B9851B"/><text class="badgeText" x="998" y="489" text-anchor="middle" fill="#B9851B">3</text>
    <text class="msg" x="1160" y="490" text-anchor="middle" fill="#B9851B">map minimal event DTO</text>
    <path class="call" d="M 560 514 H 1269" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/>
  </g>
  <g id="m4">
    <rect class="pill" x="1328" y="536" width="280" height="34" rx="17" stroke="#DC6B82"/>
    <circle cx="1348" cy="553" r="13" fill="#FFF0F0" stroke="#DC6B82"/><text class="badgeText" x="1348" y="557" text-anchor="middle" fill="#DC6B82">4</text>
    <text class="msg" x="1476" y="558" text-anchor="middle" fill="#DC6B82">publishEvent(event)</text>
    <path class="call" d="M 1269 582 H 1587" stroke="#DC6B82" marker-end="url(#seqArrow-rose)"/>
  </g>
</g>

<g id="write-behind">
  <rect class="alt" x="70" y="654" width="1620" height="360" rx="18"/>
  <rect class="pill" x="96" y="634" width="244" height="34" rx="17"/>
  <text class="regionText" x="218" y="655" text-anchor="middle">else WRITE_BEHIND</text>
  <g id="m5">
    <rect class="pill" x="242" y="690" width="258" height="34" rx="17" stroke="#4F83BF"/>
    <circle cx="262" cy="707" r="13" fill="#EAF4F8" stroke="#4F83BF"/><text class="badgeText" x="262" y="711" text-anchor="middle" fill="#4F83BF">5</text>
    <text class="msg" x="382" y="712" text-anchor="middle" fill="#4F83BF">enqueue accepted write</text>
    <path class="call" d="M 206 736 H 560" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/>
  </g>
  <g id="m6">
    <rect class="pill" x="646" y="760" width="228" height="34" rx="17" stroke="#3E9868"/>
    <circle cx="666" cy="777" r="13" fill="#EEF7F0" stroke="#3E9868"/><text class="badgeText" x="666" y="781" text-anchor="middle" fill="#3E9868">6</text>
    <text class="msg" x="766" y="782" text-anchor="middle" fill="#3E9868">flush batch commits</text>
    <path class="call" d="M 560 806 H 920" stroke="#3E9868" marker-end="url(#seqArrow-green)"/>
  </g>
  <g id="m7">
    <rect class="pill" x="354" y="830" width="370" height="34" rx="17" stroke="#B9851B"/>
    <circle cx="374" cy="847" r="13" fill="#FFF8E8" stroke="#B9851B"/><text class="badgeText" x="374" y="851" text-anchor="middle" fill="#B9851B">7</text>
    <text class="msg" x="548" y="852" text-anchor="middle" fill="#B9851B">queueDepth-- and clear batch</text>
    <path class="call" d="M 920 876 H 560" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/>
  </g>
  <g id="m8">
    <rect class="pill" x="966" y="900" width="366" height="34" rx="17" stroke="#B9851B"/>
    <circle cx="986" cy="917" r="13" fill="#FFF8E8" stroke="#B9851B"/><text class="badgeText" x="986" y="921" text-anchor="middle" fill="#B9851B">8</text>
    <text class="msg" x="1154" y="922" text-anchor="middle" fill="#B9851B">map event after durability</text>
    <path class="call" d="M 560 946 H 1269" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/>
  </g>
  <g id="m9">
    <rect class="pill" x="1328" y="958" width="280" height="34" rx="17" stroke="#DC6B82"/>
    <circle cx="1348" cy="975" r="13" fill="#FFF0F0" stroke="#DC6B82"/><text class="badgeText" x="1348" y="979" text-anchor="middle" fill="#DC6B82">9</text>
    <text class="msg" x="1476" y="980" text-anchor="middle" fill="#DC6B82">publishEvent(event)</text>
    <path class="call" d="M 1269 1004 H 1587" stroke="#DC6B82" marker-end="url(#seqArrow-rose)"/>
  </g>
</g>

<g id="footer">
  <rect x="210" y="1126" width="1340" height="42" rx="12" fill="#FFFFFF" stroke="#D7E0E4" stroke-width="1.6"/>
  <text class="footer" x="880" y="1154" text-anchor="middle">Publisher failures are post-commit notification failures; they do not replay committed write-behind batches.</text>
</g>
</svg>
