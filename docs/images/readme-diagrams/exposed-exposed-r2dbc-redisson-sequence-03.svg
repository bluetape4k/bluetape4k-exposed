<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1140" viewBox="0 0 1680 1140" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Redisson Write-Behind Sequence</title>
  <desc id="desc">Sequence diagram for write-behind put and upsertAll where the repository returns after cache acceptance and Redisson invokes the R2DBC writer later for batch insertion.</desc>
  <defs>
    <marker id="arrowCall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/></marker>
    <marker id="arrowCache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/></marker>
    <marker id="arrowDb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7e6ab8" stroke-dasharray="none"/></marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b5e3b" stroke-dasharray="none"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke-dasharray="none"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/></filter>
    <style>
      .canvas { fill: #f6f0e8; } .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle, .role, .msg, .note, .footer { font-family: "Comic Mono", monospace; fill: #52636f; }
      .subtitle { font-size: 18px; } .participantText { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 20px; fill: #1f3138; }
      .role { font-size: 13px; } .msg { font-size: 13px; } .note { font-size: 13px; fill: #40515b; } .footer { font-size: 14px; }
      .participant { fill: #ffffff; stroke: #8db7c2; stroke-width: 2.2; } .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.5; } .asyncAct { fill: #fff0e6; stroke: #9b5e3b; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowCall); }
      .cache { fill: none; stroke: #6e8f4f; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowCache); }
      .db { fill: none; stroke: #7e6ab8; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowDb); }
      .async { fill: none; stroke: #9b5e3b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 9 7; marker-end: url(#arrowAsync); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-linecap: round; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .alt { fill:#FFFFFF; fill-opacity:.12; stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; } .branchDivider { stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .label { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; } .callLabel { stroke: #9cc2d1; } .cacheLabel { stroke: #b6c9a4; } .dbLabel { stroke: #b9addd; } .asyncLabel { stroke: #d4a488; } .returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.7; } .callBadge { fill: #eaf4f8; stroke: #3f7d9c; } .cacheBadge { fill: #eef7f0; stroke: #6e8f4f; } .dbBadge { fill: #f3eefb; stroke: #7e6ab8; } .asyncBadge { fill: #fff0e6; stroke: #9b5e3b; } .returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono", monospace; font-size: 11px; font-weight: 700; } .callText { fill: #2f6f8e; } .cacheText { fill: #55783f; } .dbText { fill: #6d58a8; } .asyncText { fill: #8f4f2f; } .returnText { fill: #7f6038; }
      .code { fill: #9b3d5a; font-weight: 700; } .type { fill: #176f7a; font-weight: 700; } .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1140"/><rect class="frame" x="42" y="34" width="1596" height="1060" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Redisson Write-Behind</text>
  <text class="subtitle" x="86" y="126">The caller resumes after cache acceptance; Redisson invokes the R2DBC writer later for batched database insertion.</text>
  <g id="participants">
    <rect class="participant" x="86" y="172" width="160" height="72" rx="10"/><text class="participantText" x="166" y="201" text-anchor="middle">Caller</text><text class="role" x="166" y="224" text-anchor="middle">coroutine</text>
    <rect class="participant" x="330" y="172" width="218" height="72" rx="10"/><text class="participantText" x="439" y="201" text-anchor="middle">Repository</text><text class="role" x="439" y="224" text-anchor="middle">suspend API</text>
    <rect class="participant" x="662" y="172" width="246" height="72" rx="10"/><image x="684" y="188" width="34" height="34" href="data:image/svg+xml;base64,"/><text class="participantText" x="804" y="201" text-anchor="middle">Redisson map</text><text class="role" x="804" y="224" text-anchor="middle">WRITE_BEHIND</text>
    <rect class="participant" x="1018" y="172" width="246" height="72" rx="10"/><text class="participantText" x="1141" y="201" text-anchor="middle">R2DBC writer</text><text class="role code" x="1141" y="224" text-anchor="middle">deferred callback</text>
    <rect class="participant" x="1412" y="172" width="178" height="72" rx="10"/><image x="1430" y="188" width="34" height="34" href="data:image/svg+xml;base64,"/><text class="participantText" x="1520" y="201" text-anchor="middle">DB</text><text class="role" x="1520" y="224" text-anchor="middle">R2DBC rows</text>
  </g>
  <line class="lifeline" x1="166" y1="244" x2="166" y2="1000"/><line class="lifeline" x1="439" y1="244" x2="439" y2="1000"/><line class="lifeline" x1="804" y1="244" x2="804" y2="1000"/><line class="lifeline" x1="1141" y1="244" x2="1141" y2="1000"/><line class="lifeline" x1="1520" y1="244" x2="1520" y2="1000"/>
  <rect class="activation" x="432" y="358" width="14" height="300" rx="6"/><rect class="activation" x="797" y="436" width="14" height="514" rx="6"/><rect class="asyncAct" x="1134" y="716" width="14" height="174" rx="6"/>
  <rect x="70" y="310" width="1540" height="700" rx="14" class="alt"/><rect x="94" y="328" width="320" height="30" rx="15" fill="#eef7f0" stroke="#6e8f4f" stroke-width="1.6"/><text class="note" x="118" y="348">immediate cache path</text><line class="branchDivider" x1="70" y1="660" x2="1610" y2="660"/><rect x="94" y="682" width="320" height="30" rx="15" fill="#fff0e6" stroke="#9b5e3b" stroke-width="1.6"/><text class="note" x="118" y="702">later write-behind flush</text>
  <rect x="96" y="376" width="270" height="32" rx="16" class="label callLabel"/><circle cx="119" cy="392" r="12" class="badge callBadge"/><text x="119" y="396" text-anchor="middle" class="badgeText callText">1</text><text x="146" y="397" class="msg callText"><tspan class="code">put</tspan> / <tspan class="code">upsertAll</tspan></text><path class="call" d="M166 422 L439 422"/>
  <rect x="512" y="448" width="304" height="32" rx="16" class="label cacheLabel"/><circle cx="535" cy="464" r="12" class="badge cacheBadge"/><text x="535" y="468" text-anchor="middle" class="badgeText cacheText">2</text><text x="562" y="469" class="msg cacheText"><tspan class="code">fastPutAsync</tspan> / <tspan class="code">putAllAsync</tspan></text><path class="cache" d="M439 498 L804 498"/>
  <rect x="512" y="528" width="278" height="32" rx="16" class="label returnLabel"/><circle cx="535" cy="544" r="12" class="badge returnBadge"/><text x="535" y="548" text-anchor="middle" class="badgeText returnText">3</text><text x="562" y="549" class="msg returnText">cache update accepted</text><path class="return" d="M804 578 L439 578"/>
  <rect x="188" y="590" width="236" height="32" rx="16" class="label returnLabel"/><circle cx="211" cy="606" r="12" class="badge returnBadge"/><text x="211" y="610" text-anchor="middle" class="badgeText returnText">4</text><text x="238" y="611" class="msg returnText">caller resumes</text><path class="return" d="M439 640 L166 640"/>
  <rect x="852" y="708" width="320" height="32" rx="16" class="label asyncLabel"/><circle cx="875" cy="724" r="12" class="badge asyncBadge"/><text x="875" y="728" text-anchor="middle" class="badgeText asyncText">5</text><text x="902" y="729" class="msg asyncText">deferred <tspan class="code">writer.write(map)</tspan></text><path class="async" d="M804 764 L1141 764"/>
  <rect x="1210" y="790" width="332" height="32" rx="16" class="label dbLabel"/><circle cx="1233" cy="806" r="12" class="badge dbBadge"/><text x="1233" y="810" text-anchor="middle" class="badgeText dbText">6</text><text x="1260" y="811" class="msg dbText"><tspan class="keyword">batchInsert</tspan> chunks in transaction</text><path class="db" d="M1141 840 L1520 840"/>
  <rect x="856" y="886" width="254" height="32" rx="16" class="label returnLabel"/><circle cx="879" cy="902" r="12" class="badge returnBadge"/><text x="879" y="906" text-anchor="middle" class="badgeText returnText">7</text><text x="906" y="907" class="msg returnText">flush completed</text><path class="return" d="M1141 950 L804 950"/>
  <rect x="128" y="1030" width="1424" height="42" rx="13" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/><text class="footer" x="152" y="1056">Write-behind rule: cache visibility precedes database durability, so read-after-write durability is eventual.</text>
</svg>
