<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180" role="img" aria-labelledby="title desc">
  <title id="title">withTables R2DBC Test Lifecycle</title>
  <desc id="desc">Lifecycle diagram for exposed-r2dbc-tests withTables: dialect selection, optional Testcontainers prewarm, withDb semaphore, R2DBC transaction setup, table create/drop, fallback cleanup, and semaphore release.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c94d68" stroke-dasharray="none"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/></filter>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.lane{stroke-width:2.5}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:46px;fill:#21343f}.subtitle,.cardText,.small,.label{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:24px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:16px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:13px}.label{font-size:12px;fill:#315664}.card{fill:#fffdf8;stroke-width:2.2}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.red{stroke:#dc8ea1}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}.lineRed{stroke:#c94d68;marker-end:url(#arrow-red)}.dash{stroke-dasharray:9 7}.badge{fill:#fffaf2;stroke-width:2}.num{font-family:"Comic Mono",monospace;font-size:13px;font-weight:700;fill:#21343f}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.keyword{fill:#8a5b00;font-weight:700}
    </style>
  </defs>
  <rect class="canvas" width="1760" height="1180"/>
  <rect class="frame" x="42" y="34" width="1676" height="1108" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">withTables R2DBC Test Lifecycle</text>
  <text class="subtitle" x="86" y="126">The normal path creates tables, runs the statement, commits, drops tables, and releases the per-TestDB semaphore; fallback cleanup is isolated.</text>

  <rect class="lane" x="78" y="166" width="380" height="858" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="110" y="205">Select runtime</text>
  <rect class="lane" x="502" y="166" width="392" height="858" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="534" y="205">Enter withDb</text>
  <rect class="lane" x="938" y="166" width="438" height="858" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="970" y="205">Manage tables</text>
  <rect class="lane" x="1420" y="166" width="270" height="858" rx="18" fill="#f1ecff" stroke="#b2a1dc"/>
  <text class="laneTitle" x="1452" y="205">Release</text>

  <g transform="translate(116 246)">
    <rect class="card blue" width="304" height="86" rx="12"/>
    <circle class="badge blue" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">1</text>
    <text class="cardTitle" x="166" y="30" text-anchor="middle">Test method</text>
    <text class="cardText" x="166" y="56" text-anchor="middle">runTest + withTables</text>
  </g>
  <g transform="translate(116 386)">
    <rect class="card gold" width="304" height="92" rx="12"/>
    <circle class="badge gold" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">2</text>
    <text class="cardTitle code" x="166" y="30" text-anchor="middle">enabledDialects()</text>
    <text class="cardText" x="166" y="56" text-anchor="middle">H2 only if useFastDB</text>
    <text class="cardText" x="166" y="76" text-anchor="middle">env narrows real DB</text>
  </g>
  <g transform="translate(116 536)">
    <rect class="card blue" width="304" height="104" rx="12"/>
    <image x="34" y="38" width="34" height="34" href="data:image/svg+xml;base64,"/>
    <circle class="badge blue" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">3</text>
    <text class="cardTitle" x="186" y="34" text-anchor="middle">Prewarm containers</text>
    <text class="cardText" x="186" y="60" text-anchor="middle">only selected real dialects</text>
    <text class="cardText" x="186" y="82" text-anchor="middle">before timeout-sensitive work</text>
  </g>

  <g transform="translate(544 244)">
    <rect class="card green" width="310" height="90" rx="12"/>
    <circle class="badge green" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">4</text>
    <text class="cardTitle code" x="170" y="30" text-anchor="middle">withTables()</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">delegates to withDb</text>
  </g>
  <g transform="translate(544 388)">
    <rect class="card green" width="310" height="96" rx="12"/>
    <circle class="badge green" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">5</text>
    <text class="cardTitle" x="170" y="30" text-anchor="middle">Acquire semaphore</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">one permit per TestDB</text>
    <text class="cardText" x="170" y="78" text-anchor="middle">fair Semaphore(1)</text>
  </g>
  <g transform="translate(544 536)">
    <rect class="card green" width="310" height="116" rx="12"/>
    <circle class="badge green" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">6</text>
    <text class="cardTitle code" x="170" y="30" text-anchor="middle">connect()</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">beforeConnection hook</text>
    <text class="cardText" x="170" y="80" text-anchor="middle">R2dbcDatabaseConfig</text>
    <text class="cardText" x="170" y="100" text-anchor="middle">shutdown cleanup hook</text>
  </g>
  <g transform="translate(544 720)">
    <rect class="card green" width="310" height="106" rx="12"/>
    <circle class="badge green" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">7</text>
    <text class="cardTitle code" x="170" y="30" text-anchor="middle">suspendTransaction</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">maxAttempts = 1</text>
    <text class="cardText" x="170" y="80" text-anchor="middle">currentTestDB set</text>
  </g>

  <g transform="translate(984 238)">
    <rect class="card gold" width="340" height="92" rx="12"/>
    <circle class="badge gold" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">8</text>
    <text class="cardTitle" x="190" y="30" text-anchor="middle">Reset old tables</text>
    <text class="cardText" x="190" y="58" text-anchor="middle">runCatching SchemaUtils.drop</text>
  </g>
  <g transform="translate(984 378)">
    <rect class="card gold" width="340" height="92" rx="12"/>
    <circle class="badge gold" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">9</text>
    <text class="cardTitle" x="190" y="30" text-anchor="middle">Create tables</text>
    <text class="cardText" x="190" y="58" text-anchor="middle">SchemaUtils.create(*tables)</text>
  </g>
  <g transform="translate(984 520)">
    <rect class="card gold" width="340" height="98" rx="12"/>
    <circle class="badge gold" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">10</text>
    <text class="cardTitle" x="190" y="30" text-anchor="middle">Run test statement</text>
    <text class="cardText" x="190" y="58" text-anchor="middle">caller assertions execute</text>
    <text class="cardText" x="190" y="78" text-anchor="middle">commit before cleanup</text>
  </g>
  <g transform="translate(984 672)">
    <rect class="card gold" width="340" height="98" rx="12"/>
    <circle class="badge gold" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">11</text>
    <text class="cardTitle" x="190" y="30" text-anchor="middle">Normal drop</text>
    <text class="cardText" x="190" y="58" text-anchor="middle">dropTables defaults true</text>
    <text class="cardText" x="190" y="78" text-anchor="middle">drop + commit</text>
  </g>
  <g transform="translate(984 844)">
    <rect class="card red" width="340" height="96" rx="12"/>
    <circle class="badge red" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">12</text>
    <text class="cardTitle" x="190" y="30" text-anchor="middle">Fallback drop</text>
    <text class="cardText" x="190" y="58" text-anchor="middle">only if normal drop fails</text>
    <text class="cardText" x="190" y="78" text-anchor="middle">top-level transaction</text>
  </g>

  <g transform="translate(1448 512)">
    <rect class="card purple" width="214" height="100" rx="12"/>
    <circle class="badge purple" cx="26" cy="26" r="15"/><text class="num" x="26" y="31" text-anchor="middle">13</text>
    <text class="cardTitle" x="122" y="30" text-anchor="middle">Release</text>
    <text class="cardText" x="122" y="58" text-anchor="middle">always in finally</text>
    <text class="cardText" x="122" y="78" text-anchor="middle">semaphore.release()</text>
  </g>

  <path class="line lineBlue" d="M268 332 V386"/>
  <path class="line lineBlue" d="M268 478 V536"/>
  <path class="line lineGreen" d="M420 588 H500 V289 H544"/>
  <path class="line lineGreen" d="M699 334 V388"/>
  <path class="line lineGreen" d="M699 484 V536"/>
  <path class="line lineGreen" d="M699 652 V720"/>
  <path class="line lineGold" d="M854 773 H918 V306 H984"/>
  <path class="line lineGold" d="M1154 330 V378"/>
  <path class="line lineGold" d="M1154 470 V520"/>
  <path class="line lineGold" d="M1154 618 V672"/>
  <path class="line linePurple" d="M1324 721 H1380 V562 H1448"/>
  <path class="line lineRed dash" d="M1154 770 V844"/>
  <path class="line linePurple" d="M1324 892 H1388 V586 H1448"/>

  <text class="label" x="446" y="572">selected real DB</text>
  <text class="label" x="1172" y="812">cleanup failure</text>

  <rect x="116" y="1056" width="1528" height="50" rx="13" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
  <text class="small" x="880" y="1076" text-anchor="middle">Normal path: create tables, run statement, commit, drop tables, release the per-TestDB semaphore.</text>
  <text class="small" x="880" y="1094" text-anchor="middle">Fallback path: when drop fails, retry SchemaUtils.drop in a top-level suspend transaction before release completes.</text>
</svg>
