<g><rect class="note" x="110" y="1722" width="1520" height="48" rx="12"/><text class="small" x="870" y="1747" text-anchor="middle" dominant-baseline="middle">Read-through awaits Redisson futures; cache misses load rows inside Exposed R2DBC suspendTransaction.</text></g>
</svg>
