  <text class="cardTitle" x="999.8000000000001" y="210" text-anchor="middle">MapLoaderAsync</text>
  <line class="lifeline" x1="999.8000000000001" y1="241" x2="999.8000000000001" y2="1746"/>
</g>
<g id="participant-tx">
  <rect class="card" x="1134.4" y="165" width="250" height="76" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1259.4" y="210" text-anchor="middle">R2DBC suspend tx</text>
  <line class="lifeline" x1="1259.4" y1="241" x2="1259.4" y2="1746"/>
</g>
<g id="participant-database">
  <rect class="card" x="1394" y="165" width="250" height="76" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1519" y="210" text-anchor="middle">R2DBC database</text>
  <line class="lifeline" x1="1519" y1="241" x2="1519" y2="1746"/>
</g>
<g>
  <rect class="branchBox" x="74" y="292" width="1592" height="48" rx="15"/>
  <rect class="labelPill" x="230.05" y="286" width="241.5" height="30" rx="8"/>
  <text class="detail" x="350.8" y="302" text-anchor="middle" dominant-baseline="middle">Read-through cache lookup</text>
</g>
<g id="m2">
  <rect class="labelPill" x="228.3" y="364" width="245" height="30" rx="7"/>
  <circle cx="247.3" cy="379" r="12" fill="#4F83BF"/>
  <text class="detail" x="247.3" y="380" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text>
  <text class="detail" x="368.8" y="380" text-anchor="middle" dominant-baseline="middle">get(id) suspends</text>
  <path class="seq" d="M221 412 L480.6 412" stroke="#4F83BF" marker-end="url(#seqArrow-call)"/>
</g>
