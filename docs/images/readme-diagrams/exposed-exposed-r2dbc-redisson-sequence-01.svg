<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1840" viewBox="0 0 1740 1840" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Redisson Read-Through Flow</title>
  <desc id="desc">Read-through sequence showing suspend get calls awaiting Redisson futures while cache misses load database rows through Exposed R2DBC suspendTransaction.</desc>
  <defs>
    <marker id="seqArrow-call" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/></marker>
    <marker id="seqArrow-scoped" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6"/></marker>
    <marker id="seqArrow-thread" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/></marker>
    <marker id="seqArrow-restore" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868"/></marker>
    <marker id="seqArrow-fallback" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/></marker>
    <marker id="seqArrow-audit" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68"/></marker>
    <marker id="seqArrow-neutral" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#758297"/></marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2.6;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B;font-weight:400}.small{font-family:"Comic Mono";font-size:12px;fill:#627184;font-weight:400}
      .seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
      .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.labelPill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
      .branchBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}.note{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1740" height="1840"/>
  <rect class="frame" x="32" y="28" width="1676" height="1784" rx="28"/>
  <text class="title" x="66" y="82">R2DBC Redisson Read-Through Flow</text>
  <text class="subtitle" x="70" y="116">The suspend repository awaits Redisson async cache reads; cache misses call MapLoaderAsync and load the row inside Exposed R2DBC suspendTransaction.</text>
<g id="participant-caller">
  <rect class="card" x="96" y="165" width="250" height="76" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="221" y="210" text-anchor="middle">Suspend caller</text>
  <line class="lifeline" x1="221" y1="241" x2="221" y2="1746"/>
</g>
<g id="participant-repo">
  <rect class="card" x="355.6" y="165" width="250" height="76" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="480.6" y="197" text-anchor="middle">R2DBC Redisson</text>
  <text class="cardTitle" x="480.6" y="220" text-anchor="middle">repo</text>
  <line class="lifeline" x1="480.6" y1="241" x2="480.6" y2="1746"/>
</g>
<g id="participant-map">
  <rect class="card" x="615.2" y="165" width="250" height="76" rx="10" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="cardTitle" x="740.2" y="210" text-anchor="middle">Async Redisson map</text>
  <line class="lifeline" x1="740.2" y1="241" x2="740.2" y2="1746"/>
</g>
