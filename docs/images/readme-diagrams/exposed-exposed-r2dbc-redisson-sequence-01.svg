<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1592" viewBox="0 0 1960 1592" role="img" aria-label="Read-Through (R2DBC + suspend)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="1592"/>
<rect class="frame" x="32" y="28" width="1896" height="1536" rx="28"/>
<text class="title" x="66" y="82">Read-Through (R2DBC + suspend)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Client (Coroutine)</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="198.5" text-anchor="middle">R2dbc Redisson</text>
<text class="smallLabel" x="560" y="219.5" text-anchor="middle">Repository</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="209" text-anchor="middle">Redisson RMap</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="198.5" text-anchor="middle">R2dbc Exposed</text>
<text class="smallLabel" x="1400" y="219.5" text-anchor="middle">Entity Map Loader</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="209" text-anchor="middle">Database (R2DBC)</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="245" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="313" text-anchor="start">1. suspend get(id)</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="635" y="396" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="653" y="423" text-anchor="start">2. cache.getAsync(id).await()</text>
<path class="line" d="M560 454 L980 454"/>
<rect x="70" y="506" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="533" text-anchor="start">ALT: RMap HIT</text>
<rect x="665" y="574" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="601" text-anchor="start">4. entity</text>
<path class="dashed" d="M980 632 L560 632"/>
<rect x="245" y="684" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="711" text-anchor="start">5. entity</text>
<path class="dashed" d="M560 742 L140 742"/>
<rect x="70" y="794" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="821" text-anchor="start">ELSE: RMap MISS</text>
<rect x="1047" y="862" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1065" y="889" text-anchor="start">7. loadAsync(id) [Read-Through]</text>
<path class="line" d="M980 920 L1400 920"/>
<rect x="1454.5" y="972" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1472.5" y="999" text-anchor="start">8. SELECT WHERE id=? (R2DBC async)</text>
<path class="line" d="M1400 1030 L1820 1030"/>
<rect x="1505" y="1082" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1523" y="1109" text-anchor="start">9. ResultRow</text>
<path class="dashed" d="M1820 1140 L1400 1140"/>
<rect x="1059" y="1192" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1077" y="1219" text-anchor="start">10. entity (stored in cache)</text>
<path class="dashed" d="M1400 1250 L980 1250"/>
<rect x="665" y="1302" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="1329" text-anchor="start">11. entity</text>
<path class="dashed" d="M980 1360 L560 1360"/>
<rect x="245" y="1412" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="1439" text-anchor="start">12. entity</text>
<path class="dashed" d="M560 1470 L140 1470"/>
</svg>
