  <rect class="labelPill" x="485.4000000000001" y="446" width="250" height="30" rx="7"/>
  <circle cx="504.4000000000001" cy="461" r="12" fill="#2E8F89"/>
  <text class="detail" x="504.4000000000001" y="462" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text>
  <text class="detail" x="628.4000000000001" y="462" text-anchor="middle" dominant-baseline="middle">cache.getAsync(id).await()</text>
  <path class="seq" d="M480.6 494 L740.2 494" stroke="#2E8F89" marker-end="url(#seqArrow-thread)"/>
</g>
<g id="m4">
  <rect class="labelPill" x="487.9000000000001" y="528" width="245" height="30" rx="7"/>
  <circle cx="506.9000000000001" cy="543" r="12" fill="#2E8F89"/>
  <text class="detail" x="506.9000000000001" y="544" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text>
  <text class="detail" x="628.4000000000001" y="544" text-anchor="middle" dominant-baseline="middle">hit returns entity</text>
  <path class="seqReturn" d="M740.2 576 L480.6 576" stroke="#2E8F89" marker-end="url(#seqArrow-thread)"/>
</g>
<g id="m5">
  <rect class="labelPill" x="747.5" y="610" width="245" height="30" rx="7"/>
  <circle cx="766.5" cy="625" r="12" fill="#755BC6"/>
  <text class="detail" x="766.5" y="626" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text>
  <text class="detail" x="888" y="626" text-anchor="middle" dominant-baseline="middle">miss: load(id)</text>
  <path class="seq" d="M740.2 658 L999.8000000000001 658" stroke="#755BC6" marker-end="url(#seqArrow-scoped)"/>
</g>
<g id="m6">
  <rect class="labelPill" x="1007.1000000000001" y="692" width="245" height="30" rx="7"/>
  <circle cx="1026.1000000000001" cy="707" r="12" fill="#C94D68"/>
  <text class="detail" x="1026.1000000000001" y="708" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text>
  <text class="detail" x="1147.6000000000001" y="708" text-anchor="middle" dominant-baseline="middle">suspendTransaction</text>
  <path class="seq" d="M999.8000000000001 740 L1259.4 740" stroke="#C94D68" marker-end="url(#seqArrow-audit)"/>
</g>
<g id="m7">
  <rect class="labelPill" x="1264.2" y="774" width="250" height="30" rx="7"/>
  <circle cx="1283.2" cy="789" r="12" fill="#C94D68"/>
  <text class="detail" x="1283.2" y="790" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text>
  <text class="detail" x="1407.2" y="790" text-anchor="middle" dominant-baseline="middle">SELECT by IdTable.id</text>
  <path class="seq" d="M1259.4 822 L1519 822" stroke="#C94D68" marker-end="url(#seqArrow-audit)"/>
</g>
<g id="m8">
  <rect class="labelPill" x="1266.7" y="856" width="245" height="30" rx="7"/>
  <circle cx="1285.7" cy="871" r="12" fill="#C94D68"/>
  <text class="detail" x="1285.7" y="872" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text>
  <text class="detail" x="1407.2" y="872" text-anchor="middle" dominant-baseline="middle">ResultRow or null</text>
  <path class="seqReturn" d="M1519 904 L1259.4 904" stroke="#C94D68" marker-end="url(#seqArrow-audit)"/>
</g>
<g id="m9">
  <rect class="labelPill" x="1007.1000000000001" y="938" width="245" height="30" rx="7"/>
  <circle cx="1026.1000000000001" cy="953" r="12" fill="#C94D68"/>
  <text class="detail" x="1026.1000000000001" y="954" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">9</text>
  <text class="detail" x="1147.6000000000001" y="954" text-anchor="middle" dominant-baseline="middle">toEntity()</text>
  <path class="seqReturn" d="M1259.4 986 L999.8000000000001 986" stroke="#C94D68" marker-end="url(#seqArrow-audit)"/>
</g>
<g id="m10">
  <rect class="labelPill" x="745" y="1020" width="250" height="30" rx="7"/>
  <circle cx="764" cy="1035" r="12" fill="#755BC6"/>
  <text class="detail" x="764" y="1036" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">10</text>
  <text class="detail" x="888" y="1036" text-anchor="middle" dominant-baseline="middle">CompletionStage completes</text>
  <path class="seqReturn" d="M999.8000000000001 1068 L740.2 1068" stroke="#755BC6" marker-end="url(#seqArrow-scoped)"/>
</g>
<g id="m11">
  <rect class="labelPill" x="487.9000000000001" y="1102" width="245" height="30" rx="7"/>
  <circle cx="506.9000000000001" cy="1117" r="12" fill="#2E8F89"/>
  <text class="detail" x="506.9000000000001" y="1118" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">11</text>
  <text class="detail" x="628.4000000000001" y="1118" text-anchor="middle" dominant-baseline="middle">await resumes</text>
  <path class="seqReturn" d="M740.2 1150 L480.6 1150" stroke="#2E8F89" marker-end="url(#seqArrow-thread)"/>
</g>
<g id="m12">
  <rect class="labelPill" x="228.3" y="1184" width="245" height="30" rx="7"/>
  <circle cx="247.3" cy="1199" r="12" fill="#B9851B"/>
  <text class="detail" x="247.3" y="1200" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">12</text>
  <text class="detail" x="368.8" y="1200" text-anchor="middle" dominant-baseline="middle">entity or null</text>
  <path class="seqReturn" d="M480.6 1232 L221 1232" stroke="#B9851B" marker-end="url(#seqArrow-fallback)"/>
</g>
<g>
  <rect class="branchBox" x="74" y="1276" width="1592" height="48" rx="15"/>
  <rect class="labelPill" x="255.8" y="1270" width="190" height="30" rx="8"/>
  <text class="detail" x="350.8" y="1286" text-anchor="middle" dominant-baseline="middle">Bulk key loading</text>
</g>
<g id="m14">
  <rect class="labelPill" x="228.3" y="1348" width="245" height="30" rx="7"/>
  <circle cx="247.3" cy="1363" r="12" fill="#4F83BF"/>
  <text class="detail" x="247.3" y="1364" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">14</text>
  <text class="detail" x="368.8" y="1364" text-anchor="middle" dominant-baseline="middle">getAll(ids)</text>
  <path class="seq" d="M221 1396 L480.6 1396" stroke="#4F83BF" marker-end="url(#seqArrow-call)"/>
</g>
<g id="m15">
  <rect class="labelPill" x="485.4000000000001" y="1430" width="250" height="30" rx="7"/>
  <circle cx="504.4000000000001" cy="1445" r="12" fill="#2E8F89"/>
  <text class="detail" x="504.4000000000001" y="1446" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">15</text>
  <text class="detail" x="628.4000000000001" y="1446" text-anchor="middle" dominant-baseline="middle">getAllAsync(chunk).await()</text>
  <path class="seq" d="M480.6 1478 L740.2 1478" stroke="#2E8F89" marker-end="url(#seqArrow-thread)"/>
</g>
<g id="m16">
  <rect class="labelPill" x="745" y="1512" width="250" height="30" rx="7"/>
  <circle cx="764" cy="1527" r="12" fill="#755BC6"/>
  <text class="detail" x="764" y="1528" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">16</text>
  <text class="detail" x="888" y="1528" text-anchor="middle" dominant-baseline="middle">loadAllKeys when needed</text>
  <path class="seq" d="M740.2 1560 L999.8000000000001 1560" stroke="#755BC6" marker-end="url(#seqArrow-scoped)"/>
</g>
<g id="m17">
  <rect class="labelPill" x="1004.6000000000001" y="1582" width="250" height="42" rx="7"/>
  <circle cx="1023.6000000000001" cy="1603" r="12" fill="#C94D68"/>
  <text class="detail" x="1023.6000000000001" y="1604" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">17</text>
  <text class="detail" x="1147.6000000000001" y="1595" text-anchor="middle" dominant-baseline="middle">Channel streams ordered</text>
