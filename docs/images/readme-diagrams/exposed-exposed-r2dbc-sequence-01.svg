<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1010" viewBox="0 0 1680 1010" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Repository Suspend Transaction Flow</title>
  <desc id="desc">Sequence diagram for calling an R2dbcRepository inside a caller-owned suspendTransaction block.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#326f8f" stroke-dasharray="none"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#20303a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 44px; fill: #21343f; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 18px; fill: #51636f; }
      .participant { fill: #fffdf8; stroke: #8db7c2; stroke-width: 2.5; }
      .participantText { font-family: "Comic Mono", monospace; font-size: 18px; font-weight: 700; fill: #20323d; }
      .life { stroke: #9eb7bf; stroke-width: 3; stroke-dasharray: 8 8; }
      .call { stroke: #326f8f; stroke-width: 4.2; marker-end: url(#arrow); fill: none; }
      .return { stroke: #7493a1; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); fill: none; }
      .label { font-family: "Comic Mono", monospace; font-size: 15px; fill: #274a5a; }
      .noteText { font-family: "Comic Mono", monospace; font-size: 15px; fill: #40535f; }
      .boxTitle { font-family: "Comic Mono", monospace; font-size: 16px; font-weight: 700; fill: #20323d; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1010"/>
  <rect class="frame" x="42" y="34" width="1596" height="938" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Repository Suspend Transaction Flow</text>
  <text class="subtitle" x="86" y="126">A repository method is small: it builds an Exposed R2DBC query, streams rows when needed, and maps ResultRow to E.</text>

  <g transform="translate(92 168)">
    <g>
      <rect class="participant" x="0" y="0" width="220" height="62" rx="14"/>
      <text class="participantText" x="28" y="39">Caller coroutine</text>
      <line class="life" x1="110" y1="62" x2="110" y2="690"/>
    </g>
    <g>
      <rect class="participant" x="330" y="0" width="250" height="62" rx="14"/>
      <text class="participantText code" x="358" y="39">suspendTransaction</text>
      <line class="life" x1="455" y1="62" x2="455" y2="690"/>
    </g>
    <g>
      <rect class="participant" x="698" y="0" width="250" height="62" rx="14"/>
      <text class="participantText type" x="726" y="39">R2dbcRepository</text>
      <line class="life" x1="823" y1="62" x2="823" y2="690"/>
    </g>
    <g>
      <rect class="participant" x="1066" y="0" width="246" height="62" rx="14"/>
      <text class="participantText" x="1094" y="39">Exposed R2DBC</text>
      <line class="life" x1="1189" y1="62" x2="1189" y2="690"/>
    </g>
    <g>
      <rect class="participant" x="1352" y="0" width="168" height="62" rx="14"/>
      <text class="participantText" x="1390" y="39">Driver</text>
      <line class="life" x1="1436" y1="62" x2="1436" y2="690"/>
    </g>

    <path class="call" d="M110 126 H438"/>
    <text class="label" x="154" y="108">open caller-owned transaction</text>
    <path class="call" d="M455 216 H806"/>
    <text class="label" x="500" y="198"><tspan class="code">findById</tspan> / <tspan class="code">findAll</tspan> / <tspan class="keyword">update</tspan> / batch</text>
    <path class="call" d="M823 306 H1172"/>
    <text class="label" x="866" y="288">build <tspan class="keyword">select</tspan>/<tspan class="keyword">update</tspan>/<tspan class="keyword">delete</tspan> or batch statement</text>
    <path class="call" d="M1189 396 H1419"/>
    <text class="label" x="1220" y="378">execute through R2DBC driver</text>
    <path class="return" d="M1436 486 H1206"/>
    <text class="label" x="1230" y="468"><tspan class="type">ResultRow</tspan> stream or <tspan class="keyword">update</tspan> count</text>
    <path class="call" d="M1189 576 H840"/>
    <text class="label" x="890" y="558">collect rows and preserve <tspan class="type">Flow</tspan> backpressure</text>
    <path class="return" d="M823 632 H472"/>
    <text class="label" x="508" y="614"><tspan class="code">toEntity()</tspan> maps <tspan class="type">ResultRow</tspan> to <tspan class="type">E</tspan></text>
    <path class="return" d="M455 676 H126"/>
    <text class="label" x="170" y="658">return <tspan class="type">E</tspan>, <tspan class="type">Flow&lt;E&gt;</tspan>, <tspan class="type">ExposedPage</tspan>, or row count</text>
  </g>

  <g transform="translate(160 916)">
    <rect x="0" y="-42" width="1360" height="50" rx="14" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
    <text class="boxTitle" x="28" y="-13">Boundary rule</text>
    <text class="noteText" x="184" y="-13">Repository methods do not open the transaction for you; examples call them inside <tspan class="code">suspendTransaction</tspan>.</text>
  </g>
</svg>
