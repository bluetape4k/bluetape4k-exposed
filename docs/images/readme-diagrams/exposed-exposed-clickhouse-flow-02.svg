<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" role="img" aria-labelledby="title desc">
  <title id="title">ClickHouse DDL Lifecycle</title>
  <desc id="desc">Flow diagram for exposed-clickhouse showing how ClickHouseTable createStatement filters Exposed DDL, strips unsupported clauses, appends a ClickHouse engine clause, and executes through an autocommit JDBC connection.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#C94D68" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .track{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .track-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1080"/>
  <rect class="frame" x="44" y="36" width="1612" height="1008" rx="34"/>
  <text class="title" x="72" y="88">ClickHouse DDL Lifecycle</text>
  <text class="subtitle" x="76" y="121">The module keeps Exposed schema declarations, then rewrites only the parts ClickHouse cannot execute safely.</text>

  <g id="track-definition">
    <rect class="track" x="82" y="162" width="1536" height="206" rx="18"/>
    <text class="track-title" x="112" y="190" dominant-baseline="middle">Table definition</text>
  </g>
  <g id="track-create">
    <rect class="track" x="82" y="410" width="1536" height="258" rx="18"/>
    <text class="track-title" x="112" y="438" dominant-baseline="middle">Create statement rewrite</text>
  </g>
  <g id="track-execute">
    <rect class="track" x="82" y="710" width="1536" height="180" rx="18"/>
    <text class="track-title" x="112" y="738" dominant-baseline="middle">Execution and unsupported paths</text>
  </g>

  <path data-edge="definition-&gt;schema" class="connector" d="M 392 264 L 502 264" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="schema-&gt;create" class="connector" d="M 792 264 L 902 264" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="create-&gt;filter" class="connector" d="M 1192 292 L 1192 480" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="filter-&gt;sanitize" class="connector" d="M 1036 540 L 854 540" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="sanitize-&gt;engine" class="connector" d="M 530 540 L 348 540" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="engine-&gt;autocommit" class="connector" d="M 212 600 L 212 788 Q 212 800 224 800 L 502 800" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="autocommit-&gt;table" class="connector" d="M 792 800 L 902 800" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="table-&gt;native" class="connector" d="M 1196 800 L 1392 800" stroke="#755BC6" marker-end="url(#arrow-purple)"/>

  <g id="node-definition" data-node="definition" transform="translate(122,222)">
    <rect class="card" x="0" y="0" width="270" height="84" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="135" y="29" text-anchor="middle" dominant-baseline="middle">ClickHouseTable</text>
    <text class="detail" x="135" y="56" text-anchor="middle" dominant-baseline="middle">columns + engine property</text>
  </g>
  <g id="node-schema" data-node="schema" transform="translate(502,222)">
    <rect class="card" x="0" y="0" width="290" height="84" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="145" y="29" text-anchor="middle" dominant-baseline="middle">SchemaUtils.create</text>
    <text class="detail" x="145" y="56" text-anchor="middle" dominant-baseline="middle">asks Table for DDL</text>
  </g>
  <g id="node-create" data-node="create" transform="translate(902,222)">
    <rect class="card" x="0" y="0" width="290" height="84" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="145" y="29" text-anchor="middle" dominant-baseline="middle">createStatement()</text>
    <text class="detail" x="145" y="56" text-anchor="middle" dominant-baseline="middle">overrides Exposed DDL</text>
  </g>

  <g id="node-filter" data-node="filter" transform="translate(1036,480)">
    <rect class="card" x="0" y="0" width="312" height="120" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="156" y="30" text-anchor="middle" dominant-baseline="middle">Keep CREATE TABLE</text>
    <text class="detail" x="156" y="56" text-anchor="middle" dominant-baseline="middle">drop COMMENT ON COLUMN</text>
    <text class="detail" x="156" y="78" text-anchor="middle" dominant-baseline="middle">ignore secondary DDL lines</text>
    <text class="detail" x="156" y="100" text-anchor="middle" dominant-baseline="middle">avoid unsupported statements</text>
  </g>
  <g id="node-sanitize" data-node="sanitize" transform="translate(530,480)">
    <rect class="card" x="0" y="0" width="324" height="120" rx="12" fill="#FFF3D9" stroke="#D6A441"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="162" y="30" text-anchor="middle" dominant-baseline="middle">sanitizeForClickHouse</text>
    <text class="detail" x="162" y="56" text-anchor="middle" dominant-baseline="middle">strip PRIMARY KEY</text>
    <text class="detail" x="162" y="78" text-anchor="middle" dominant-baseline="middle">strip CONSTRAINT / REFERENCES</text>
    <text class="detail" x="162" y="100" text-anchor="middle" dominant-baseline="middle">remove NOT NULL / NULL suffixes</text>
  </g>
  <g id="node-engine" data-node="engine" transform="translate(122,480)">
    <rect class="card" x="0" y="0" width="226" height="120" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="113" y="30" text-anchor="middle" dominant-baseline="middle">Append ENGINE</text>
    <text class="detail" x="113" y="56" text-anchor="middle" dominant-baseline="middle">MergeTree()</text>
    <text class="detail" x="113" y="78" text-anchor="middle" dominant-baseline="middle">ORDER BY ...</text>
    <text class="detail" x="113" y="100" text-anchor="middle" dominant-baseline="middle">settings and partition</text>
  </g>

  <g id="node-autocommit" data-node="autocommit" transform="translate(502,755)">
    <rect class="card" x="0" y="0" width="290" height="90" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="145" y="29" text-anchor="middle" dominant-baseline="middle">Autocommit execution</text>
    <text class="detail" x="145" y="55" text-anchor="middle" dominant-baseline="middle">commit and rollback do nothing</text>
    <text class="detail" x="145" y="75" text-anchor="middle" dominant-baseline="middle">failure cannot undo prior DDL/DML</text>
  </g>
  <g id="node-table" data-node="table" transform="translate(902,755)">
    <rect class="card" x="0" y="0" width="294" height="90" rx="12" fill="#EAF7EF" stroke="#58A978"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="147" y="29" text-anchor="middle" dominant-baseline="middle">ClickHouse table</text>
    <text class="detail" x="147" y="55" text-anchor="middle" dominant-baseline="middle">physical sort key from engine</text>
    <text class="detail" x="147" y="75" text-anchor="middle" dominant-baseline="middle">use idempotent load design</text>
  </g>
  <g id="node-native" data-node="native" transform="translate(1392,755)">
    <rect class="card" x="0" y="0" width="174" height="90" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="87" y="29" text-anchor="middle" dominant-baseline="middle">Manual DDL</text>
    <text class="detail" x="87" y="55" text-anchor="middle" dominant-baseline="middle">modifyColumn</text>
    <text class="detail" x="87" y="75" text-anchor="middle" dominant-baseline="middle">returns empty list</text>
  </g>

  <g transform="translate(112,930)">
    <rect class="constraint" x="0" y="0" width="1476" height="72" rx="10"/>
    <text class="small" x="738" y="24" text-anchor="middle" dominant-baseline="middle">The diagram is intentionally DDL-focused: reads and inserts still use Exposed queries, but transaction atomicity is not provided by ClickHouse.</text>
    <text class="small" x="738" y="48" text-anchor="middle" dominant-baseline="middle">Model schema evolution with native ClickHouse migrations when ALTER COLUMN semantics are required.</text>
  </g>
</svg>
