<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1180" viewBox="0 0 1580 1180" role="img" aria-labelledby="title desc">
  <title id="title">exposed-dao Generated ID Support Matrix</title>
  <desc id="desc">Matrix mapping exposed-core generated ID tables to exposed-dao Entity and EntityClass helper pairs.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.12"/></filter>
    <style>
      .canvas{fill:#F6F9FC}.panel{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476}
      .head{fill:#EAF7EF;stroke:#58A978;stroke-width:2}.row-a{fill:#FBFDFF;stroke:#D7E2EC;stroke-width:1.5}.row-b{fill:#F6F9FC;stroke:#D7E2EC;stroke-width:1.5}
      .header{font-family:"Architects Daughter";font-size:20px;fill:#22344A;font-weight:400}.strong{font-family:"Architects Daughter";font-size:20px;fill:#22344A;font-weight:400}.cell{font-family:"Comic Mono";font-size:14px;fill:#34485E}.small{font-family:"Comic Mono";font-size:13px;fill:#627184}
      .yes{fill:#EAF7EF;stroke:#58A978}.no{fill:#FDECEF;stroke:#DC6B82}.badge{font-family:"Comic Mono";font-size:13px;fill:#34485E}
    </style>
  </defs>
  <rect class="canvas" width="1580" height="1180"/>
  <rect class="panel" x="42" y="36" width="1496" height="1108" rx="30"/>
  <text class="title" x="72" y="88">Generated ID DAO Support Matrix</text>
  <text class="subtitle" x="76" y="121">Developers can see which Entity and EntityClass helper pair matches each exposed-core table base.</text>
  <g transform="translate(90 170)">
    <rect class="head" x="0" y="0" width="1400" height="58" rx="12"/>
    <text class="header" x="150" y="36" text-anchor="middle">Core table</text>
    <text class="header" x="420" y="36" text-anchor="middle">DAO Entity</text>
    <text class="header" x="735" y="36" text-anchor="middle">EntityClass</text>
    <text class="header" x="1025" y="36" text-anchor="middle">PK type</text>
    <text class="header" x="1260" y="36" text-anchor="middle">Support</text>

    <g transform="translate(0 78)">
      <rect class="row-a" x="0" y="0" width="1400" height="82" rx="10"/>
      <text class="strong" x="150" y="50" text-anchor="middle">KsuidTable</text><text class="cell" x="420" y="50" text-anchor="middle">KsuidEntity</text><text class="cell" x="735" y="50" text-anchor="middle">KsuidEntityClass</text><text class="cell" x="1025" y="50" text-anchor="middle">String / 27</text><rect class="yes" x="1185" y="25" width="150" height="34" rx="17"/><text class="badge" x="1260" y="47" text-anchor="middle">stable</text>
    </g>
    <g transform="translate(0 180)">
      <rect class="row-b" x="0" y="0" width="1400" height="82" rx="10"/>
      <text class="strong" x="150" y="50" text-anchor="middle">KsuidMillisTable</text><text class="cell" x="420" y="50" text-anchor="middle">KsuidMillisEntity</text><text class="cell" x="735" y="50" text-anchor="middle">KsuidMillisEntityClass</text><text class="cell" x="1025" y="50" text-anchor="middle">String / 27</text><rect class="yes" x="1185" y="25" width="150" height="34" rx="17"/><text class="badge" x="1260" y="47" text-anchor="middle">stable</text>
    </g>
    <g transform="translate(0 282)">
      <rect class="row-a" x="0" y="0" width="1400" height="82" rx="10"/>
      <text class="strong" x="150" y="50" text-anchor="middle">UlidTable</text><text class="cell" x="420" y="50" text-anchor="middle">UlidEntity</text><text class="cell" x="735" y="50" text-anchor="middle">UlidEntityClass</text><text class="cell" x="1025" y="50" text-anchor="middle">String / 26</text><rect class="yes" x="1185" y="25" width="150" height="34" rx="17"/><text class="badge" x="1260" y="47" text-anchor="middle">stable</text>
    </g>
    <g transform="translate(0 384)">
      <rect class="row-b" x="0" y="0" width="1400" height="82" rx="10"/>
      <text class="strong" x="150" y="50" text-anchor="middle">SnowflakeIdTable</text><text class="cell" x="420" y="50" text-anchor="middle">SnowflakeIdEntity</text><text class="cell" x="735" y="50" text-anchor="middle">SnowflakeIdEntityClass</text><text class="cell" x="1025" y="50" text-anchor="middle">Long</text><rect class="yes" x="1185" y="25" width="150" height="34" rx="17"/><text class="badge" x="1260" y="47" text-anchor="middle">stable</text>
    </g>
    <g transform="translate(0 486)">
      <rect class="row-a" x="0" y="0" width="1400" height="82" rx="10"/>
      <text class="strong" x="150" y="50" text-anchor="middle">TimebasedUUIDTable</text><text class="cell" x="420" y="50" text-anchor="middle">TimebasedUUIDEntity</text><text class="cell" x="735" y="50" text-anchor="middle">TimebasedUUIDEntityClass</text><text class="cell" x="1025" y="50" text-anchor="middle">UUID</text><rect class="yes" x="1185" y="25" width="150" height="34" rx="17"/><text class="badge" x="1260" y="47" text-anchor="middle">stable</text>
    </g>
    <g transform="translate(0 588)">
      <rect class="row-b" x="0" y="0" width="1400" height="96" rx="10"/>
      <text class="strong" x="150" y="42" text-anchor="middle">TimebasedUUID</text><text class="strong" x="150" y="66" text-anchor="middle">Base62Table</text>
      <text class="cell" x="420" y="55" text-anchor="middle">TimebasedUUIDBase62Entity</text><text class="cell" x="735" y="55" text-anchor="middle">TimebasedUUIDBase62EntityClass</text><text class="cell" x="1025" y="55" text-anchor="middle">String / &lt;= 24</text><rect class="yes" x="1185" y="38" width="150" height="34" rx="17"/><text class="badge" x="1260" y="60" text-anchor="middle">stable</text>
    </g>
    <g transform="translate(0 704)">
      <rect class="row-a" x="0" y="0" width="1400" height="96" rx="10"/>
      <text class="strong" x="150" y="42" text-anchor="middle">Base62Table</text><text class="strong" x="150" y="66" text-anchor="middle">MySQL</text>
      <text class="cell" x="420" y="55" text-anchor="middle">TimebasedUUIDBase62EntityMySql</text><text class="cell" x="735" y="55" text-anchor="middle">TimebasedUUIDBase62EntityClassMySql</text><text class="cell" x="1025" y="55" text-anchor="middle">String / binary collation</text><rect class="yes" x="1185" y="38" width="150" height="34" rx="17"/><text class="badge" x="1260" y="60" text-anchor="middle">stable</text>
    </g>
  </g>
  <g transform="translate(76 1060)">
    <rect x="0" y="0" width="1428" height="48" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="small" x="714" y="19" text-anchor="middle">This is a support matrix: every listed generated-ID table has a matching DAO Entity and EntityClass pair.</text>
    <text class="small" x="714" y="36" text-anchor="middle">SoftDeletedIdTable remains table-only support in exposed-core and is intentionally not listed here.</text>
  </g>
</svg>
