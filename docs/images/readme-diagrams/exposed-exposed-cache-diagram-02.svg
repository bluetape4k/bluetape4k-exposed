<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1275" viewBox="0 0 1640 1275" role="img" aria-labelledby="title desc">
  <title id="title">Cache Configuration Decision Map</title>
  <desc id="desc">Decision map for choosing cache topology, write timing, local cache limits, and optional Redis resilience settings.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1640" height="1275"/>
  <rect class="decor" x="44" y="36" width="1552" height="1203" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1476" height="979" rx="24"/>
  <text class="title" x="72" y="88">Cache Configuration Decision Map</text>
  <text class="subtitle" x="76" y="121">CacheMode chooses local, remote, or near-cache topology; LocalCacheConfig and RedisRepositoryResilienceConfig tune write strategy and failure handling.</text>
  <g id="group-modes">
    <rect class="group" x="92" y="156" width="1456" height="300" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Reader choices</text>
  </g>
  <g id="group-configs">
    <rect class="group" x="92" y="496" width="1456" height="360" rx="18"/>
    <text class="group-title" x="122" y="520" dominant-baseline="middle">Configuration inputs</text>
  </g>
  <g id="group-reader">
    <rect class="group" x="92" y="896" width="1456" height="170" rx="18"/>
    <text class="group-title" x="122" y="920" dominant-baseline="middle">Module selection result</text>
  </g>
  <path id="route-local-config-write-mode" data-edge="local-config-&gt;write-mode" data-label="writeMode property" class="connector" d="M 445 610 L 445 381" stroke="#755BC6"/>
  <path id="route-local-readme-local-config" data-edge="local-readme-&gt;local-config" data-label="uses local limits and TTL" class="connector" d="M 440 965 L 440 742" stroke="#3E9868"/>
  <path id="route-redis-readme-redis-resilience" data-edge="redis-readme-&gt;redis-resilience" data-label="optional wrapper config" class="connector" d="M 1200 965 L 1200 742" stroke="#B9851B"/>
  <g id="node-write-mode" data-node="write-mode" transform="translate(210,265)">
    <rect class="shape" x="0" y="0" width="470" height="116" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="235" y="29.5" text-anchor="middle" dominant-baseline="middle">CacheWriteMode</text>
    <text class="detail" x="235" y="48.5" text-anchor="middle" dominant-baseline="middle">READ_ONLY: read-through only</text>
    <text class="detail" x="235" y="67.5" text-anchor="middle" dominant-baseline="middle">WRITE_THROUGH: cache + DB sync</text>
    <text class="detail" x="235" y="86.5" text-anchor="middle" dominant-baseline="middle">WRITE_BEHIND: async DB batch</text>
  </g>
  <g id="node-cache-mode" data-node="cache-mode" transform="translate(960,265)">
    <rect class="shape" x="0" y="0" width="470" height="116" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="235" y="29.5" text-anchor="middle" dominant-baseline="middle">CacheMode</text>
    <text class="detail" x="235" y="48.5" text-anchor="middle" dominant-baseline="middle">LOCAL: in-process cache</text>
    <text class="detail" x="235" y="67.5" text-anchor="middle" dominant-baseline="middle">REMOTE: Redis only</text>
    <text class="detail" x="235" y="86.5" text-anchor="middle" dominant-baseline="middle">NEAR_CACHE: L1 local + L2 Redis</text>
  </g>
  <g id="node-local-config" data-node="local-config" transform="translate(210,610)">
    <rect class="shape" x="0" y="0" width="470" height="132" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="235" y="37.5" text-anchor="middle" dominant-baseline="middle">LocalCacheConfig</text>
    <text class="detail" x="235" y="56.5" text-anchor="middle" dominant-baseline="middle">keyPrefix, maximumSize</text>
    <text class="detail" x="235" y="75.5" text-anchor="middle" dominant-baseline="middle">expireAfterWrite / Access</text>
    <text class="detail" x="235" y="94.5" text-anchor="middle" dominant-baseline="middle">writeMode + bounded queue</text>
  </g>
  <g id="node-redis-resilience" data-node="redis-resilience" transform="translate(960,610)">
    <rect class="shape" x="0" y="0" width="470" height="132" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="235" y="37.5" text-anchor="middle" dominant-baseline="middle">RedisRepositoryResilienceConfig</text>
    <text class="detail" x="235" y="56.5" text-anchor="middle" dominant-baseline="middle">retry attempts + wait</text>
    <text class="detail" x="235" y="75.5" text-anchor="middle" dominant-baseline="middle">optional circuit breaker</text>
    <text class="detail" x="235" y="94.5" text-anchor="middle" dominant-baseline="middle">positive timeout validation</text>
  </g>
  <g id="node-local-readme" data-node="local-readme" transform="translate(180,965)">
    <rect class="shape" x="0" y="0" width="520" height="78" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="260" y="20" text-anchor="middle" dominant-baseline="middle">Local cache modules</text>
    <text class="detail" x="260" y="39" text-anchor="middle" dominant-baseline="middle">Caffeine uses CacheMode.LOCAL</text>
    <text class="detail" x="260" y="58" text-anchor="middle" dominant-baseline="middle">near-cache uses LocalCacheConfig as L1</text>
  </g>
  <g id="node-redis-readme" data-node="redis-readme" transform="translate(940,965)">
    <rect class="shape" x="0" y="0" width="520" height="78" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="260" y="20" text-anchor="middle" dominant-baseline="middle">Redis-backed modules</text>
    <text class="detail" x="260" y="39" text-anchor="middle" dominant-baseline="middle">REMOTE or NEAR_CACHE</text>
    <text class="detail" x="260" y="58" text-anchor="middle" dominant-baseline="middle">resilience config may be null</text>
  </g>
  <g transform="translate(76,1183)" data-footer="reader-contract">
    <rect class="pill" x="0" y="0" width="1488" height="48" rx="10"/>
    <text class="small" x="744" y="18" text-anchor="middle" dominant-baseline="middle">Use CacheMode for topology and CacheWriteMode for DB write timing; keep those choices separate.</text>
    <text class="small" x="744" y="35" text-anchor="middle" dominant-baseline="middle">LocalCacheConfig also bounds write-behind queue capacity; Redis resilience is optional and nullable.</text>
  </g>
</svg>
