<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1660" viewBox="0 0 1740 1660" role="img" aria-labelledby="title desc">
  <title id="title">Suspended JDBC Redisson Write-Behind Flow</title>
  <desc id="desc">Sequence diagram rebuilt from exposed-jdbc-redisson README, SuspendedJdbcRedissonRepository, SuspendedEntityMapWriter, and suspended write-behind tests.</desc>
  <defs>
    <marker id="seqArrow-call" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/></marker>
    <marker id="seqArrow-scoped" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6"/></marker>
    <marker id="seqArrow-thread" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/></marker>
    <marker id="seqArrow-restore" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868"/></marker>
    <marker id="seqArrow-fallback" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/></marker>
    <marker id="seqArrow-audit" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68"/></marker>
    <marker id="seqArrow-neutral" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#758297"/></marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2.6;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B;font-weight:400}.small{font-family:"Comic Mono";font-size:12px;fill:#627184;font-weight:400}
      .seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
      .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.labelPill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
      .branchBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}.note{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1740" height="1660"/>
  <rect class="frame" x="32" y="28" width="1676" height="1604" rx="28"/>
  <text class="title" x="66" y="82">Suspended JDBC Redisson Write-Behind Flow</text>
  <text class="subtitle" x="70" y="116">The suspended call awaits the async cache write, but the database write still happens later through Redisson write-behind.</text>
<g id="participant-caller">
  <rect class="card" x="96" y="165" width="250" height="76" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="221" y="210" text-anchor="middle">Suspend caller</text>
  <line class="lifeline" x1="221" y1="241" x2="221" y2="1566"/>
</g>
<g id="participant-repo">
  <rect class="card" x="355.6" y="165" width="250" height="76" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="480.6" y="210" text-anchor="middle">Suspended repo</text>
  <line class="lifeline" x1="480.6" y1="241" x2="480.6" y2="1566"/>
</g>
<g id="participant-map">
  <rect class="card" x="615.2" y="165" width="250" height="76" rx="10" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="cardTitle" x="740.2" y="210" text-anchor="middle">Async Redisson map</text>
  <line class="lifeline" x1="740.2" y1="241" x2="740.2" y2="1566"/>
</g>
<g id="participant-queue">
  <rect class="card" x="874.8000000000001" y="165" width="250" height="76" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="999.8000000000001" y="210" text-anchor="middle">Write-behind queue</text>
  <line class="lifeline" x1="999.8000000000001" y1="241" x2="999.8000000000001" y2="1566"/>
</g>
<g id="participant-writer">
  <rect class="card" x="1134.4" y="165" width="250" height="76" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="1259.4" y="210" text-anchor="middle">WriterAsync</text>
  <line class="lifeline" x1="1259.4" y1="241" x2="1259.4" y2="1566"/>
</g>
<g id="participant-database">
  <rect class="card" x="1394" y="165" width="250" height="76" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1519" y="210" text-anchor="middle">JDBC database</text>
  <line class="lifeline" x1="1519" y1="241" x2="1519" y2="1566"/>
</g>
<g>
  <rect class="branchBox" x="74" y="292" width="1592" height="48" rx="15"/>
  <rect class="labelPill" x="241.3" y="286" width="219" height="30" rx="8"/>
  <text class="detail" x="350.8" y="302" text-anchor="middle" dominant-baseline="middle">Coroutine-facing write</text>
</g>
<g id="m2">
  <rect class="labelPill" x="225.8" y="364" width="250" height="30" rx="7"/>
  <circle cx="244.8" cy="379" r="12" fill="#4F83BF"/>
  <text class="detail" x="244.8" y="380" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text>
  <text class="detail" x="368.8" y="380" text-anchor="middle" dominant-baseline="middle">putAll(entities) suspends</text>
  <path class="seq" d="M221 412 L480.6 412" stroke="#4F83BF" marker-end="url(#seqArrow-call)"/>
</g>
<g id="m3">
  <rect class="labelPill" x="485.4000000000001" y="446" width="250" height="30" rx="7"/>
  <circle cx="504.4000000000001" cy="461" r="12" fill="#2E8F89"/>
  <text class="detail" x="504.4000000000001" y="462" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text>
  <text class="detail" x="628.4000000000001" y="462" text-anchor="middle" dominant-baseline="middle">putAllAsync(batch).await()</text>
  <path class="seq" d="M480.6 494 L740.2 494" stroke="#2E8F89" marker-end="url(#seqArrow-thread)"/>
</g>
<g id="m4">
  <rect class="labelPill" x="745" y="528" width="250" height="30" rx="7"/>
  <circle cx="764" cy="543" r="12" fill="#755BC6"/>
  <text class="detail" x="764" y="544" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text>
  <text class="detail" x="888" y="544" text-anchor="middle" dominant-baseline="middle">enqueue write-behind batch</text>
  <path class="seq" d="M740.2 576 L999.8000000000001 576" stroke="#755BC6" marker-end="url(#seqArrow-scoped)"/>
</g>
<g id="m5">
  <rect class="labelPill" x="747.5" y="610" width="245" height="30" rx="7"/>
  <circle cx="766.5" cy="625" r="12" fill="#755BC6"/>
  <text class="detail" x="766.5" y="626" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text>
  <text class="detail" x="888" y="626" text-anchor="middle" dominant-baseline="middle">queue accepted</text>
  <path class="seqReturn" d="M999.8000000000001 658 L740.2 658" stroke="#755BC6" marker-end="url(#seqArrow-scoped)"/>
</g>
<g id="m6">
  <rect class="labelPill" x="485.4000000000001" y="680" width="250" height="42" rx="7"/>
  <circle cx="504.4000000000001" cy="701" r="12" fill="#2E8F89"/>
  <text class="detail" x="504.4000000000001" y="702" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text>
  <text class="detail" x="628.4000000000001" y="693" text-anchor="middle" dominant-baseline="middle">await resumes after cache</text>
  <text class="detail" x="628.4000000000001" y="708" text-anchor="middle" dominant-baseline="middle">write</text>
  <path class="seqReturn" d="M740.2 740 L480.6 740" stroke="#2E8F89" marker-end="url(#seqArrow-thread)"/>
</g>
<g id="m7">
  <rect class="labelPill" x="225.8" y="774" width="250" height="30" rx="7"/>
  <circle cx="244.8" cy="789" r="12" fill="#B9851B"/>
  <text class="detail" x="244.8" y="790" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text>
  <text class="detail" x="368.8" y="790" text-anchor="middle" dominant-baseline="middle">return before DB flush</text>
  <path class="seqReturn" d="M480.6 822 L221 822" stroke="#B9851B" marker-end="url(#seqArrow-fallback)"/>
</g>
<g>
  <rect class="branchBox" x="74" y="866" width="1592" height="48" rx="15"/>
  <rect class="labelPill" x="222.55" y="860" width="256.5" height="30" rx="8"/>
  <text class="detail" x="350.8" y="876" text-anchor="middle" dominant-baseline="middle">Eventual suspended DB write</text>
</g>
<g id="m9">
  <rect class="labelPill" x="1004.6000000000001" y="938" width="250" height="30" rx="7"/>
  <circle cx="1023.6000000000001" cy="953" r="12" fill="#755BC6"/>
  <text class="detail" x="1023.6000000000001" y="954" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">9</text>
  <text class="detail" x="1147.6000000000001" y="954" text-anchor="middle" dominant-baseline="middle">delayed writerAsync batch</text>
  <path class="seq" d="M999.8000000000001 986 L1259.4 986" stroke="#755BC6" marker-end="url(#seqArrow-scoped)"/>
</g>
<g id="m10">
  <rect class="labelPill" x="1264.2" y="1008" width="250" height="42" rx="7"/>
  <circle cx="1283.2" cy="1029" r="12" fill="#C94D68"/>
  <text class="detail" x="1283.2" y="1030" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">10</text>
  <text class="detail" x="1407.2" y="1021" text-anchor="middle" dominant-baseline="middle">newSuspendedTransaction</text>
  <text class="detail" x="1407.2" y="1036" text-anchor="middle" dominant-baseline="middle">writeToDB</text>
  <path class="seq" d="M1259.4 1068 L1519 1068" stroke="#C94D68" marker-end="url(#seqArrow-audit)"/>
</g>
<g id="m11">
  <rect class="labelPill" x="1264.2" y="1102" width="250" height="30" rx="7"/>
  <circle cx="1283.2" cy="1117" r="12" fill="#C94D68"/>
  <text class="detail" x="1283.2" y="1118" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">11</text>
  <text class="detail" x="1407.2" y="1118" text-anchor="middle" dominant-baseline="middle">commit persisted rows</text>
  <path class="seqReturn" d="M1519 1150 L1259.4 1150" stroke="#C94D68" marker-end="url(#seqArrow-audit)"/>
</g>
<g id="m12">
  <rect class="labelPill" x="1007.1000000000001" y="1184" width="245" height="30" rx="7"/>
  <circle cx="1026.1000000000001" cy="1199" r="12" fill="#755BC6"/>
  <text class="detail" x="1026.1000000000001" y="1200" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">12</text>
  <text class="detail" x="1147.6000000000001" y="1200" text-anchor="middle" dominant-baseline="middle">flush complete</text>
  <path class="seqReturn" d="M1259.4 1232 L999.8000000000001 1232" stroke="#755BC6" marker-end="url(#seqArrow-scoped)"/>
</g>
<g id="m13">
  <rect class="labelPill" x="713.2" y="1266" width="313.6" height="30" rx="7"/>
  <circle cx="732.2" cy="1281" r="12" fill="#B9851B"/>
  <text class="detail" x="732.2" y="1282" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">13</text>
  <text class="detail" x="888" y="1282" text-anchor="middle" dominant-baseline="middle">scenario awaits count growth</text>
  <path class="seq" d="M221 1314 L1519 1314" stroke="#B9851B" marker-end="url(#seqArrow-fallback)"/>
</g>
<g id="m14">
  <rect class="labelPill" x="734.8" y="1348" width="270.4" height="30" rx="7"/>
  <circle cx="753.8" cy="1363" r="12" fill="#B9851B"/>
  <text class="detail" x="753.8" y="1364" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">14</text>
  <text class="detail" x="888" y="1364" text-anchor="middle" dominant-baseline="middle">eventual DB visibility</text>
  <path class="seqReturn" d="M1519 1396 L221 1396" stroke="#B9851B" marker-end="url(#seqArrow-fallback)"/>
</g>
<g><rect class="note" x="110" y="1542" width="1520" height="48" rx="12"/><text class="small" x="870" y="1559" text-anchor="middle" dominant-baseline="middle">Suspend WRITE_BEHIND resumes after Redis accepts the write; JDBC persistence remains eventual through the async writer.</text><text class="small" x="870" y="1576" text-anchor="middle" dominant-baseline="middle">Use this flow when caller latency matters more than immediate database durability.</text></g>
</svg>
