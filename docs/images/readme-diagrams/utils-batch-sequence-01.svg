<rect x="817.5" y="1574" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="835.5" y="1601" text-anchor="start">15. read()</text>
<path class="line" d="M531.25 1632 L1313.75 1632"/>
