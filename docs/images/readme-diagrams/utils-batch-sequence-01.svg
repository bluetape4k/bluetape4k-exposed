<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Batch Chunk Checkpoint Flow</title>
  <desc id="desc">Flow diagram for exposed-batch showing restart lookup, completed step skip, checkpoint restore, chunk collection, writer retry, checkpoint persistence, and terminal status handling.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b55353"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.lane{stroke-width:2.4}.card{fill:#fffdf8;stroke-width:2.2}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:12px}.label{font-size:12px;fill:#315664}.step{font-size:12px;font-weight:700}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}.bad{fill:#8b3c3c;font-weight:700}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.red{stroke:#cf8b83}.purple{stroke:#b2a1dc}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.lineRed{stroke:#b55353;marker-end:url(#arrow-red)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1280"/>
  <rect class="frame" x="36" y="30" width="1728" height="1220" rx="24"/>
  <text class="title" x="86" y="96">Batch Chunk Checkpoint Flow</text>
  <text class="subtitle" x="90" y="132">StepRunner persists progress only after a chunk write succeeds, so restarts resume from the last committed key.</text>

  <rect class="lane" x="92" y="176" width="1576" height="278" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="124" y="224">Restart lookup</text>
  <g transform="translate(138 288)">
    <rect class="card blue" width="280" height="104" rx="12"/>
    <text class="step" x="22" y="28">1</text>
    <text class="cardTitle code" x="150" y="34" text-anchor="middle">BatchJob.run()</text>
    <text class="cardText" x="150" y="62" text-anchor="middle">find or create JobExecution</text>
    <text class="cardText" x="150" y="84" text-anchor="middle">RUNNING / FAILED / STOPPED reused</text>
  </g>
  <g transform="translate(528 288)">
    <rect class="card blue" width="280" height="104" rx="12"/>
    <text class="step" x="22" y="28">2</text>
    <text class="cardTitle" x="150" y="34" text-anchor="middle">StepExecution</text>
    <text class="cardText" x="150" y="62" text-anchor="middle">findOrCreateStepExecution</text>
    <text class="cardText" x="150" y="84" text-anchor="middle">status decides next branch</text>
  </g>
  <g transform="translate(918 288)">
    <rect class="card green" width="280" height="104" rx="12"/>
    <text class="step" x="22" y="28">3a</text>
    <text class="cardTitle type" x="150" y="34" text-anchor="middle">Already complete</text>
    <text class="cardText" x="150" y="62" text-anchor="middle">return StepReport</text>
    <text class="cardText" x="150" y="84" text-anchor="middle">do not open reader/writer</text>
  </g>
  <g transform="translate(1308 288)">
    <rect class="card gold" width="280" height="104" rx="12"/>
    <text class="step" x="22" y="28">3b</text>
    <text class="cardTitle warn" x="150" y="34" text-anchor="middle">Needs run</text>
    <text class="cardText" x="150" y="62" text-anchor="middle">open reader and writer</text>
    <text class="cardText" x="150" y="84" text-anchor="middle">load checkpoint if present</text>
  </g>

  <rect class="lane" x="92" y="514" width="1576" height="376" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="124" y="562">Chunk loop</text>
  <g transform="translate(138 640)">
    <rect class="card gold" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">4</text>
    <text class="cardTitle warn" x="140" y="34" text-anchor="middle">restoreFrom()</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">only when checkpoint exists</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">keyset starts after saved key</text>
  </g>
  <g transform="translate(500 640)">
    <rect class="card gold" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">5</text>
    <text class="cardTitle" x="140" y="34" text-anchor="middle">read + process</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">collect up to chunkSize</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">null processor result filters</text>
  </g>
  <g transform="translate(862 640)">
    <rect class="card green" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">6</text>
    <text class="cardTitle type" x="140" y="34" text-anchor="middle">write chunk</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">commit timeout wrapper</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">retry with backoff on failure</text>
  </g>
  <g transform="translate(1224 640)">
    <rect class="card green" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">7</text>
    <text class="cardTitle type" x="140" y="34" text-anchor="middle">commit callback</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">reader.onChunkCommitted()</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">checkpoint() now returns key</text>
  </g>
  <g transform="translate(1224 798)">
    <rect class="card purple" width="260" height="62" rx="12"/>
    <text class="cardTitle" x="140" y="25" text-anchor="middle">saveCheckpoint()</text>
    <text class="cardText" x="140" y="47" text-anchor="middle">persist typed checkpoint JSON</text>
  </g>

  <rect class="lane" x="92" y="950" width="1576" height="176" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="124" y="998">Terminal status</text>
  <g transform="translate(188 1030)">
    <rect class="card green" width="300" height="70" rx="12"/>
    <text class="cardTitle type" x="150" y="28" text-anchor="middle">COMPLETED</text>
    <text class="cardText" x="150" y="52" text-anchor="middle">all chunks written, no skips</text>
  </g>
  <g transform="translate(584 1030)">
    <rect class="card gold" width="300" height="70" rx="12"/>
    <text class="cardTitle warn" x="150" y="28" text-anchor="middle">COMPLETED_WITH_SKIPS</text>
    <text class="cardText" x="150" y="52" text-anchor="middle">processor or chunk skip accepted</text>
  </g>
  <g transform="translate(980 1030)">
    <rect class="card red" width="300" height="70" rx="12"/>
    <text class="cardTitle bad" x="150" y="28" text-anchor="middle">FAILED</text>
    <text class="cardText" x="150" y="52" text-anchor="middle">retry exhausted and skip denied</text>
  </g>
  <g transform="translate(1376 1030)">
    <rect class="card red" width="230" height="70" rx="12"/>
    <text class="cardTitle bad" x="115" y="28" text-anchor="middle">STOPPED</text>
    <text class="cardText" x="115" y="52" text-anchor="middle">cancellation rethrown</text>
  </g>

  <path class="line lineBlue" d="M418 340 H528"/>
  <path class="line lineGreen" d="M808 340 H918"/>
  <path class="line lineGold" d="M808 340 V454 H1448 V392"/>
  <path class="line lineGold" d="M1448 392 V580 H268 V640"/>
  <path class="line lineGold" d="M398 696 H500"/>
  <path class="line lineGreen" d="M760 696 H862"/>
  <path class="line lineGreen" d="M1122 696 H1224"/>
  <path class="line linePurple" d="M1354 752 V798"/>
  <path class="line linePurple" d="M1354 860 V914 H338 V1030"/>
  <path class="line lineGold" d="M1354 860 V914 H734 V1030"/>
  <path class="line lineRed" d="M992 752 V914 H1130 V1030"/>
  <path class="line lineRed" d="M1448 392 V914 H1491 V1030"/>

  <text class="label" x="438" y="324">job state</text>
  <text class="label" x="826" y="324">skip branch</text>
  <text class="label" x="432" y="680">next chunk</text>
  <text class="label" x="782" y="680">processed chunk</text>
  <text class="label" x="1144" y="680">successful write</text>
  <text class="label" x="1014" y="894">hard failure</text>
  <text class="label" x="1392" y="888">cancellation</text>

  <rect x="128" y="1172" width="1544" height="34" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="900" y="1194" text-anchor="middle">Restart safety depends on one rule: checkpoint is saved only after writer success and reader commit notification.</text>
</svg>
