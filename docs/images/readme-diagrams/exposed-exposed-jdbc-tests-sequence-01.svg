<svg xmlns="http://www.w3.org/2000/svg" width="1435" height="700" viewBox="0 0 1435 700" role="img" aria-label="JDBC Test Execution Flow"><defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><style>
.canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#D7E2EC;stroke-width:2}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:16px;fill:#536476;font-weight:400}.label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#22344A;font-weight:400}.small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;fill:#536476;font-weight:400}.tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476;font-weight:400}.mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#22344A;font-weight:400}.card{filter:url(#shadow);stroke-width:2}.line{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.soft{stroke:#AAB6C5;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.axis{stroke:#B8C4D3;stroke-width:1.3}.barText{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#22344A;font-weight:400}</style></defs><rect class="canvas" width="1435" height="700"/><rect class="frame" x="34" y="28" width="1367" height="644" rx="24"/><text class="title" x="72" y="82">JDBC Test Execution Flow</text><text class="subtitle" x="76" y="114">Lifecycle order for withDb and withTables based integration tests.</text><rect class="card" x="95" y="170" width="240" height="74" rx="14" fill="#E8F3FF" stroke="#75A9E8"/><text class="label" x="215" y="207" text-anchor="middle" dominant-baseline="middle">JUnit test</text><rect class="card" x="430" y="170" width="240" height="74" rx="14" fill="#FFF3D9" stroke="#D9AA4D"/><text class="label" x="550" y="207" text-anchor="middle" dominant-baseline="middle">withTables</text><rect class="card" x="765" y="170" width="240" height="74" rx="14" fill="#EAF7EF" stroke="#69B888"/><text class="label" x="885" y="207" text-anchor="middle" dominant-baseline="middle">SchemaUtils</text><rect class="card" x="1100" y="170" width="240" height="74" rx="14" fill="#F1ECFF" stroke="#9478D6"/><text class="label" x="1220" y="207" text-anchor="middle" dominant-baseline="middle">Assertions</text><rect class="card" x="430" y="355" width="240" height="74" rx="14" fill="#E9F7F6" stroke="#55B5AF"/><text class="label" x="550" y="392" text-anchor="middle" dominant-baseline="middle">withDb</text><rect class="card" x="765" y="355" width="240" height="74" rx="14" fill="#FDECEF" stroke="#DB7890"/><text class="label" x="885" y="392" text-anchor="middle" dominant-baseline="middle">transaction</text><rect class="card" x="765" y="540" width="240" height="74" rx="14" fill="#F7F1E7" stroke="#B98C50"/><text class="label" x="885" y="577" text-anchor="middle" dominant-baseline="middle">drop tables</text><path class="line" d="M335 207 C382.5 207 382.5 207 430 207"/><path class="line" d="M670 207 C717.5 207 717.5 207 765 207"/><path class="line" d="M1005 207 C1052.5 207 1052.5 207 1100 207"/><path class="line" d="M550 244 C550 244 550 355 550 355"/><path class="line" d="M670 392 C717.5 392 717.5 392 765 392"/><path class="line" d="M885 429 C885 429 885 540 885 540"/><path class="soft" d="M885 540 C885 540 885 244 885 244"/><text class="small" x="95" y="298">1. Select dialect from ENABLE_DIALECTS_METHOD</text><text class="small" x="95" y="322">2. Open DB and create test tables</text><text class="small" x="95" y="346">3. Execute assertions inside transaction</text><text class="small" x="95" y="370">4. Drop tables, then release the scoped database state</text></svg>