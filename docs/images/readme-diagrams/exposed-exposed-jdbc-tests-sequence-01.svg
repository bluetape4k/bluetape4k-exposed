<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220" role="img" aria-labelledby="title desc">
  <title id="title">JDBC Test Lifecycle</title>
  <desc id="desc">Sequence diagram for exposed-jdbc-tests showing JUnit parameterization, TestDB selection, connection setup, transaction-scoped helpers, fixture creation, cleanup, and shutdown handling.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .band{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .actor{filter:url(#shadow);stroke-width:2}
      .lifeline{stroke:#B8C8D8;stroke-width:2;stroke-dasharray:8 8}
      .call{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
      .label-box{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.2}
      .note{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .actor-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .step{font-family:"Comic Mono";font-size:14px;fill:#31465E;font-weight:400}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1220"/>
  <rect class="frame" x="44" y="36" width="1592" height="1148" rx="34"/>
  <text class="title" x="72" y="88">JDBC Test Lifecycle</text>
  <text class="subtitle" x="76" y="121">A parameterized test receives a TestDB, opens one serialized transaction scope, creates fixtures, runs assertions, and cleans up deterministically.</text>

  <rect class="band" x="82" y="160" width="1516" height="890" rx="20"/>

  <g id="actors">
    <g id="actor-junit" data-node="junit" transform="translate(120,190)">
      <rect class="actor" x="0" y="0" width="210" height="78" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
      <text class="actor-title" x="105" y="28" text-anchor="middle" dominant-baseline="middle">JUnit test</text>
      <text class="detail" x="105" y="52" text-anchor="middle" dominant-baseline="middle">@MethodSource</text>
    </g>
    <g id="actor-testdb" data-node="testdb" transform="translate(390,190)">
      <rect class="actor" x="0" y="0" width="220" height="78" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
      <text class="actor-title" x="110" y="28" text-anchor="middle" dominant-baseline="middle">TestDB</text>
      <text class="detail" x="110" y="52" text-anchor="middle" dominant-baseline="middle">dialect selector</text>
    </g>
    <g id="actor-helper" data-node="helper" transform="translate(680,190)">
      <rect class="actor" x="0" y="0" width="250" height="78" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
      <text class="actor-title" x="125" y="28" text-anchor="middle" dominant-baseline="middle">withDb / withTables</text>
      <text class="detail" x="125" y="52" text-anchor="middle" dominant-baseline="middle">serialized helper scope</text>
    </g>
    <g id="actor-exposed" data-node="exposed" transform="translate(1000,190)">
      <rect class="actor" x="0" y="0" width="220" height="78" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
      <text class="actor-title" x="110" y="28" text-anchor="middle" dominant-baseline="middle">Exposed JDBC</text>
      <text class="detail" x="110" y="52" text-anchor="middle" dominant-baseline="middle">transaction + schema</text>
    </g>
    <g id="actor-db" data-node="db" transform="translate(1290,190)">
      <rect class="actor" x="0" y="0" width="230" height="78" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
      <text class="actor-title" x="115" y="28" text-anchor="middle" dominant-baseline="middle">JDBC database</text>
      <text class="detail" x="115" y="52" text-anchor="middle" dominant-baseline="middle">H2 or real server</text>
    </g>
  </g>

  <line class="lifeline" x1="225" y1="282" x2="225" y2="1004"/>
  <line class="lifeline" x1="500" y1="282" x2="500" y2="1004"/>
  <line class="lifeline" x1="805" y1="282" x2="805" y2="1004"/>
  <line class="lifeline" x1="1110" y1="282" x2="1110" y2="1004"/>
  <line class="lifeline" x1="1405" y1="282" x2="1405" y2="1004"/>

  <path class="call" data-edge="junit-&gt;testdb" d="M 225 330 L 500 330" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <rect class="label-box" x="286" y="302" width="154" height="26" rx="8"/>
  <text class="step" x="363" y="316" text-anchor="middle" dominant-baseline="middle">enableDialects()</text>

  <path class="return" data-edge="testdb-&gt;junit" d="M 500 382 L 225 382" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <rect class="label-box" x="296" y="392" width="134" height="26" rx="8"/>
  <text class="step" x="363" y="406" text-anchor="middle" dominant-baseline="middle">TestDB set</text>

  <path class="call" data-edge="junit-&gt;helper" d="M 225 462 L 805 462" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <rect class="label-box" x="430" y="434" width="170" height="26" rx="8"/>
  <text class="step" x="515" y="448" text-anchor="middle" dominant-baseline="middle">withTables(testDB)</text>

  <path class="call" data-edge="helper-&gt;testdb" d="M 805 522 L 500 522" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <rect class="label-box" x="590" y="494" width="126" height="26" rx="8"/>
  <text class="step" x="653" y="508" text-anchor="middle" dominant-baseline="middle">connect()</text>

  <path class="call" data-edge="testdb-&gt;db" d="M 500 584 L 1405 584" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <rect class="label-box" x="840" y="556" width="224" height="26" rx="8"/>
  <text class="step" x="952" y="570" text-anchor="middle" dominant-baseline="middle">JDBC URL, driver, credentials</text>

  <path class="return" data-edge="db-&gt;helper" d="M 1405 640 L 805 640" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <rect class="label-box" x="1036" y="650" width="138" height="26" rx="8"/>
  <text class="step" x="1105" y="664" text-anchor="middle" dominant-baseline="middle">Database handle</text>

  <path class="call" data-edge="helper-&gt;exposed" d="M 805 716 L 1110 716" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <rect class="label-box" x="872" y="688" width="170" height="26" rx="8"/>
  <text class="step" x="957" y="702" text-anchor="middle" dominant-baseline="middle">transaction(maxAttempts=1)</text>

  <path class="call" data-edge="exposed-&gt;db" d="M 1110 776 L 1405 776" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <rect class="label-box" x="1176" y="748" width="164" height="26" rx="8"/>
  <text class="step" x="1258" y="762" text-anchor="middle" dominant-baseline="middle">drop/create fixtures</text>

  <path class="call" data-edge="junit-&gt;exposed" d="M 225 846 L 1110 846" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <rect class="label-box" x="560" y="818" width="214" height="26" rx="8"/>
  <text class="step" x="667" y="832" text-anchor="middle" dominant-baseline="middle">test statement + assertions</text>

  <path class="call" data-edge="exposed-&gt;db" d="M 1110 916 L 1405 916" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <rect class="label-box" x="1175" y="888" width="166" height="26" rx="8"/>
  <text class="step" x="1258" y="902" text-anchor="middle" dominant-baseline="middle">commit then cleanup</text>

  <path class="return" data-edge="helper-&gt;junit" d="M 805 982 L 225 982" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <rect class="label-box" x="440" y="992" width="150" height="26" rx="8"/>
  <text class="step" x="515" y="1006" text-anchor="middle" dominant-baseline="middle">release semaphore</text>

  <g id="note" transform="translate(112,1080)">
    <rect class="note" x="0" y="0" width="1456" height="54" rx="12"/>
    <text class="small" x="728" y="20" text-anchor="middle" dominant-baseline="middle">The same lifecycle is used by withDb, withTables, withSchemas, and their suspending variants; table/schema helpers add fixture create/drop around the user statement.</text>
    <text class="small" x="728" y="39" text-anchor="middle" dominant-baseline="middle">Real DB containers are lazy; AbstractExposedTest prewarms PostgreSQL and MySQL 8 only when those dialects are enabled.</text>
  </g>
</svg>
