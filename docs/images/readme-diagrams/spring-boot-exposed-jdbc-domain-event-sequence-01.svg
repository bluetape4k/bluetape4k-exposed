<svg data-sequence-style="wiki-best-practices" data-source-read="spring-boot/jdbc/src/main/kotlin/io/bluetape4k/spring/data/exposed/jdbc/ddd/ExposedAggregateEventPublisher.kt; spring-boot/jdbc/README.md; examples/ddd-spring-modulith-demo/src/main/kotlin/io/bluetape4k/exposed/examples/modulith/orders/OrderApplicationService.kt" xmlns="http://www.w3.org/2000/svg" width="2180" height="1680" viewBox="0 0 2180 1680" role="img" aria-labelledby="title desc">
  <title id="title">Transaction-aware aggregate domain event handoff</title>
  <desc id="desc">Sequence view of saving an aggregate, handing immutable domain events to Spring, optional Spring Modulith publication storage, default after-commit listener execution, committed buffer cleanup, and rollback preservation.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868" stroke="#3E9868" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B" stroke="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F918C" stroke="#2F918C" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-rose" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C75B70" stroke="#C75B70" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#263238}
      .subtitle,.msg,.role,.footer{font-family:"Comic Mono",monospace;fill:#36464F}
      .subtitle{font-size:16px}
      .participantTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:22px;fill:#1F3138}
      .role{font-size:13px;fill:#546A73}
      .header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2;filter:url(#shadow)}
      .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}
      .activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}
      .call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
      .alt{fill:none;fill-opacity:0;stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 7}
      .opt{fill:none;fill-opacity:0;stroke:#A37A26;stroke-width:2.2;stroke-dasharray:12 7}
      .divider{stroke:#78909C;stroke-width:2.2;stroke-dasharray:12 8}
      .pill{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.3}
      .badgeText{font-family:"Comic Mono",monospace;font-size:12px;font-weight:700}
      .msg{font-size:14px;font-weight:700}
      .regionText{font-family:"Comic Mono",monospace;font-size:13px;font-weight:700;fill:#60727D}
      .stateNote{fill:#FFF7F8;stroke:#C75B70;stroke-width:1.8;stroke-dasharray:8 6}
      .footer{font-size:14px;fill:#60727D}
    </style>
  </defs>

  <rect class="canvas" width="2180" height="1680"/>
  <rect class="frame" x="32" y="28" width="2116" height="1624" rx="30"/>
  <text class="title" x="68" y="84">Transaction-Aware Aggregate Event Handoff</text>
  <text class="subtitle" x="72" y="116">Save and hand off inside one JDBC command transaction; clear only after committed completion.</text>

  <g id="participants">
    <g id="p-transaction">
      <rect class="header" x="70" y="170" width="280" height="86" rx="10"/>
      <text class="participant participantTitle" x="210" y="207" text-anchor="middle">Spring Transaction</text>
      <text class="role" x="210" y="232" text-anchor="middle">command boundary</text>
      <line class="lifeline" x1="210" y1="256" x2="210" y2="1560"/>
    </g>
    <g id="p-aggregate">
      <rect class="header" x="420" y="170" width="280" height="86" rx="10"/>
      <text class="participant participantTitle" x="560" y="207" text-anchor="middle">Aggregate Root</text>
      <text class="role" x="560" y="232" text-anchor="middle">immutable event buffer</text>
      <line class="lifeline" x1="560" y1="256" x2="560" y2="1560"/>
    </g>
    <g id="p-repository">
      <rect class="header" x="770" y="170" width="280" height="86" rx="10"/>
      <text class="participant participantTitle" x="910" y="207" text-anchor="middle">Exposed Repository</text>
      <text class="role" x="910" y="232" text-anchor="middle">JDBC persistence</text>
      <line class="lifeline" x1="910" y1="256" x2="910" y2="1560"/>
    </g>
    <g id="p-publisher">
      <rect class="header" x="1120" y="170" width="280" height="86" rx="10"/>
      <text class="participant participantTitle" x="1260" y="204" text-anchor="middle">Aggregate Event</text>
      <text class="participant participantTitle" x="1260" y="229" text-anchor="middle">Publisher</text>
      <text class="role" x="1260" y="248" text-anchor="middle">transaction synchronization</text>
      <line class="lifeline" x1="1260" y1="256" x2="1260" y2="1560"/>
    </g>
    <g id="p-listener">
      <rect class="header" x="1470" y="170" width="280" height="86" rx="10"/>
      <text class="participant participantTitle" x="1610" y="204" text-anchor="middle">Transactional</text>
      <text class="participant participantTitle" x="1610" y="229" text-anchor="middle">Listener</text>
      <text class="role" x="1610" y="248" text-anchor="middle">default AFTER_COMMIT</text>
      <line class="lifeline" x1="1610" y1="256" x2="1610" y2="1560"/>
    </g>
    <g id="p-modulith">
      <rect class="header" x="1820" y="170" width="280" height="86" rx="10"/>
      <text class="participant participantTitle" x="1960" y="207" text-anchor="middle">Spring Modulith</text>
      <text class="role" x="1960" y="232" text-anchor="middle">optional publication store</text>
      <line class="lifeline" x1="1960" y1="256" x2="1960" y2="1560"/>
    </g>
  </g>

  <rect class="activation" x="202" y="322" width="16" height="1200" rx="5"/>
  <rect class="activation" x="552" y="322" width="16" height="48" rx="5"/>
  <rect class="activation" x="552" y="628" width="16" height="116" rx="5"/>
  <rect class="activation" x="552" y="1312" width="16" height="42" rx="5"/>
  <rect class="activation" x="902" y="430" width="16" height="88" rx="5"/>
  <rect class="activation" x="1252" y="532" width="16" height="500" rx="5"/>
  <rect class="activation" x="1252" y="1228" width="16" height="112" rx="5"/>
  <rect class="activation" x="1252" y="1422" width="16" height="42" rx="5"/>
  <rect class="activation" x="1602" y="832" width="16" height="48" rx="5"/>
  <rect class="activation" x="1602" y="1144" width="16" height="48" rx="5"/>
  <rect class="activation" x="1952" y="942" width="16" height="84" rx="5"/>

  <g id="m1">
    <rect class="pill" x="276" y="284" width="218" height="34" rx="17" stroke="#4F83BF"/>
    <circle cx="296" cy="301" r="13" fill="#EAF4F8" stroke="#4F83BF"/>
    <text class="badgeText" x="296" y="305" text-anchor="middle" fill="#4F83BF">1</text>
    <text class="msg" x="392" y="306" text-anchor="middle" fill="#4F83BF">record domain event</text>
    <path class="call" d="M 210 330 H 560" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/>
  </g>

  <g id="m2">
    <rect class="pill" x="522" y="386" width="250" height="34" rx="17" stroke="#3E9868"/>
    <circle cx="542" cy="403" r="13" fill="#EEF7F0" stroke="#3E9868"/>
    <text class="badgeText" x="542" y="407" text-anchor="middle" fill="#3E9868">2</text>
    <text class="msg" x="654" y="408" text-anchor="middle" fill="#3E9868">save aggregate state</text>
    <path class="call" d="M 210 432 H 910" stroke="#3E9868" marker-end="url(#seqArrow-green)"/>
  </g>

  <g id="m3">
    <rect class="pill" x="638" y="488" width="312" height="34" rx="17" stroke="#4F83BF"/>
    <circle cx="658" cy="505" r="13" fill="#EAF4F8" stroke="#4F83BF"/>
    <text class="badgeText" x="658" y="509" text-anchor="middle" fill="#4F83BF">3</text>
    <text class="msg" x="808" y="510" text-anchor="middle" fill="#4F83BF">publishAfterSave(aggregate)</text>
    <path class="call" d="M 210 534 H 1260" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/>
  </g>

  <g id="m4">
    <rect class="pill" x="748" y="590" width="302" height="34" rx="17" stroke="#B9851B"/>
    <circle cx="768" cy="607" r="13" fill="#FFF7E7" stroke="#B9851B"/>
    <text class="badgeText" x="768" y="611" text-anchor="middle" fill="#B9851B">4</text>
    <text class="msg" x="912" y="612" text-anchor="middle" fill="#B9851B">snapshot domainEvents()</text>
    <path class="call" d="M 1260 636 H 560" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/>
  </g>

  <g id="m5">
    <rect class="pill" x="752" y="692" width="296" height="34" rx="17" stroke="#2F918C"/>
    <circle cx="772" cy="709" r="13" fill="#E8F7F5" stroke="#2F918C"/>
    <text class="badgeText" x="772" y="713" text-anchor="middle" fill="#2F918C">5</text>
    <text class="msg" x="912" y="714" text-anchor="middle" fill="#2F918C">stable event references</text>
    <path class="return" d="M 560 738 H 1260" stroke="#2F918C" marker-end="url(#seqArrow-teal)"/>
  </g>

  <g id="m6">
    <rect class="pill" x="1292" y="794" width="286" height="34" rx="17" stroke="#4F83BF"/>
    <circle cx="1312" cy="811" r="13" fill="#EAF4F8" stroke="#4F83BF"/>
    <text class="badgeText" x="1312" y="815" text-anchor="middle" fill="#4F83BF">6</text>
    <text class="msg" x="1446" y="816" text-anchor="middle" fill="#4F83BF">register AFTER_COMMIT</text>
    <path class="call" d="M 1260 840 H 1610" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/>
  </g>

  <g id="modulith-opt">
    <rect class="opt" x="1168" y="884" width="864" height="154" rx="18"/>
    <rect class="pill" x="1192" y="864" width="208" height="34" rx="17"/>
    <text class="regionText" x="1296" y="885" text-anchor="middle">opt Spring Modulith</text>
    <g id="m7">
      <rect class="pill" x="1454" y="902" width="318" height="34" rx="17" stroke="#B9851B"/>
      <circle cx="1506" cy="919" r="13" fill="#FFF7E7" stroke="#B9851B"/>
      <text class="badgeText" x="1506" y="923" text-anchor="middle" fill="#B9851B">7</text>
      <text class="msg" x="1622" y="924" text-anchor="middle" fill="#B9851B">store publication (same tx)</text>
      <path class="call" d="M 1260 948 H 1960" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/>
    </g>
  </g>

  <g id="completion-alt">
    <rect class="alt" x="74" y="1080" width="2032" height="460" rx="18"/>
    <rect class="pill" x="100" y="1060" width="252" height="34" rx="17"/>
    <text class="regionText" x="226" y="1081" text-anchor="middle">alt transaction outcome</text>

    <g id="m8">
      <rect class="pill" x="724" y="1106" width="366" height="34" rx="17" stroke="#3E9868"/>
      <circle cx="744" cy="1123" r="13" fill="#EEF7F0" stroke="#3E9868"/>
      <text class="badgeText" x="744" y="1127" text-anchor="middle" fill="#3E9868">8</text>
      <text class="msg" x="920" y="1128" text-anchor="middle" fill="#3E9868">deliver event AFTER_COMMIT</text>
      <path class="call" d="M 210 1152 H 1610" stroke="#3E9868" marker-end="url(#seqArrow-green)"/>
    </g>

    <g id="m9">
      <rect class="pill" x="674" y="1190" width="286" height="34" rx="17" stroke="#3E9868"/>
      <circle cx="694" cy="1207" r="13" fill="#EEF7F0" stroke="#3E9868"/>
      <text class="badgeText" x="694" y="1211" text-anchor="middle" fill="#3E9868">9</text>
      <text class="msg" x="828" y="1212" text-anchor="middle" fill="#3E9868">afterCompletion(COMMITTED)</text>
      <path class="call" d="M 210 1236 H 1260" stroke="#3E9868" marker-end="url(#seqArrow-green)"/>
    </g>

    <g id="m10">
      <rect class="pill" x="748" y="1274" width="302" height="34" rx="17" stroke="#B9851B"/>
      <circle cx="768" cy="1291" r="13" fill="#FFF7E7" stroke="#B9851B"/>
      <text class="badgeText" x="768" y="1295" text-anchor="middle" fill="#B9851B">10</text>
      <text class="msg" x="912" y="1296" text-anchor="middle" fill="#B9851B">clear committed buffer</text>
      <path class="call" d="M 1260 1320 H 560" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/>
    </g>

    <line class="divider" x1="92" y1="1360" x2="2088" y2="1360"/>
    <rect class="pill" x="100" y="1339" width="176" height="34" rx="17"/>
    <text class="regionText" x="188" y="1360" text-anchor="middle">else rollback</text>

    <g id="m11">
      <rect class="pill" x="674" y="1384" width="286" height="34" rx="17" stroke="#C75B70"/>
      <circle cx="694" cy="1401" r="13" fill="#FFF0F0" stroke="#C75B70"/>
      <text class="badgeText" x="694" y="1405" text-anchor="middle" fill="#C75B70">11</text>
      <text class="msg" x="828" y="1406" text-anchor="middle" fill="#C75B70">afterCompletion(ROLLED_BACK)</text>
      <path class="call" d="M 210 1430 H 1260" stroke="#C75B70" marker-end="url(#seqArrow-rose)"/>
    </g>

    <g id="m12">
      <rect class="stateNote" x="720" y="1460" width="380" height="54" rx="16"/>
      <circle cx="774" cy="1477" r="13" fill="#FFF0F0" stroke="#C75B70"/>
      <text class="badgeText" x="774" y="1481" text-anchor="middle" fill="#C75B70">12</text>
      <text class="msg" x="918" y="1482" text-anchor="middle" fill="#C75B70">rollback leaves buffer unchanged</text>
      <text class="role" x="910" y="1503" text-anchor="middle">no clearDomainEvents() call</text>
    </g>
  </g>

  <g id="footer">
    <rect x="300" y="1582" width="1580" height="42" rx="12" fill="#FFFFFF" stroke="#D7E0E4" stroke-width="1.6"/>
    <text class="footer" x="1090" y="1610" text-anchor="middle">Publication or snapshot failure poisons commit; STATUS_UNKNOWN preserves the buffer and requires reconciliation.</text>
  </g>
</svg>
