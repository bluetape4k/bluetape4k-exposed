<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1072" viewBox="0 0 1754 1072" role="img" aria-label="Core API Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1072"/>
<rect class="frame" x="32" y="28" width="1690" height="1016" rx="28"/>
<text class="title" x="66" y="82">Core API Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="implLine" d="M467 668 C467 476 262 476 262 284"/>
<path class="dashed" d="M1492 356 C1492 512 467 512 467 668"/>
<path class="inheritLine" d="M1287 668 C1287 476 1082 476 1082 284"/>
<path class="inheritLine" d="M877 668 C877 476 672 476 672 284"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Connection</text>

</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">PostgreSQLDialect</text>

</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">PostgreSQLDialectMetadata</text>

</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«factory»</text>
  <text class="label" x="170" y="57" text-anchor="middle">TrinoDatabase</text>
  <text class="mono" x="18" y="108">+DRIVER: String</text>
<text class="mono" x="18" y="132">+connect(host, port, catalog, schema, user): Datab.</text>
<text class="mono" x="18" y="156">+connect(jdbcUrl, user): Database</text>
</g>
<g transform="translate(707,422)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="170" y="57" text-anchor="middle">TrinoExtensions</text>
  <text class="mono" x="18" y="108">+suspendTransaction~T~(db, dispatcher, block): T</text>
<text class="mono" x="18" y="132">+queryFlow~T~(db, dispatcher, block): Flow~T~</text>
<text class="mono" x="18" y="156">+trinoBatchInsert~E~(data, options, body): List~Re.</text>
</g>
<g transform="translate(297,676)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">TrinoConnectionWrapper</text>
  <text class="mono" x="18" y="108">-conn: Connection</text>
<text class="mono" x="18" y="132">+getAutoCommit(): Boolean</text>
<text class="mono" x="18" y="156">+setAutoCommit(autoCommit): Unit</text>
<text class="mono" x="18" y="180">+commit(): Unit</text>
<text class="mono" x="18" y="204">+rollback(): Unit</text>
<text class="mono" x="18" y="228">+prepareStatement(sql, autoGeneratedKeys): Prepare.</text>
</g>
<g transform="translate(707,676)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">TrinoDialect</text>
  <text class="mono" x="18" y="108">+dialectName: String</text>
<text class="mono" x="18" y="132">+supportsColumnTypeChange: Boolean</text>
<text class="mono" x="18" y="156">+supportsMultipleGeneratedKeys: Boolean</text>
<text class="mono" x="18" y="180">+supportsWindowFrameGroupsMode: Boolean</text>
</g>
<g transform="translate(1117,676)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">TrinoDialectMetadata</text>
  <text class="mono" x="18" y="108">+fillConstraintCacheForTables(tables): Unit</text>
</g>
</svg>
