<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">Trino JDBC Compatibility Boundary</title>
  <desc id="desc">Architecture diagram for exposed-trino showing Exposed-facing APIs, Trino adapters, JDBC compatibility wrapper, and Trino coordinator execution boundary.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:13px}.label{font-size:12px;fill:#315664}.step{font-size:12px;font-weight:700}.lane{stroke-width:2.5}.card{fill:#fffdf8;stroke-width:2.2}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.red{stroke:#d58b96}.line{fill:none;stroke-width:4.0;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1120"/>
  <rect class="frame" x="38" y="32" width="1624" height="1056" rx="24"/>
  <text class="title" x="86" y="96">Trino JDBC Compatibility Boundary</text>
  <text class="subtitle" x="90" y="132">Exposed keeps its DSL boundary while Trino-specific adapters remove unsupported JDBC, DDL, and transaction assumptions.</text>

  <rect class="lane" x="92" y="180" width="340" height="740" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="124" y="230">Exposed-facing API</text>
  <g transform="translate(122 280)">
    <rect class="card blue" width="280" height="100" rx="12"/>
    <text class="cardTitle code" x="140" y="31" text-anchor="middle">Query DSL</text>
    <text class="cardText" x="140" y="58" text-anchor="middle">select / where / orderBy</text>
    <text class="cardText" x="140" y="78" text-anchor="middle">PostgreSQL-based SQL generation</text>
  </g>
  <g transform="translate(122 430)">
    <rect class="card blue" width="280" height="100" rx="12"/>
    <text class="cardTitle code" x="140" y="31" text-anchor="middle">transaction APIs</text>
    <text class="cardText" x="140" y="58" text-anchor="middle">transaction(db)</text>
    <text class="cardText" x="140" y="78" text-anchor="middle">suspendTransaction(db)</text>
  </g>
  <g transform="translate(122 580)">
    <rect class="card blue" width="280" height="112" rx="12"/>
    <text class="cardTitle code" x="140" y="31" text-anchor="middle">Flow helpers</text>
    <text class="cardText" x="140" y="58" text-anchor="middle">queryFlow materializes List</text>
    <text class="cardText" x="140" y="78" text-anchor="middle">pagedQueryFlow bounds pages</text>
  </g>
  <g transform="translate(122 752)">
    <rect class="card blue" width="280" height="96" rx="12"/>
    <text class="cardTitle code" x="140" y="31" text-anchor="middle">trinoBatchInsert</text>
    <text class="cardText" x="140" y="58" text-anchor="middle">chunked Exposed batchInsert</text>
    <text class="cardText" x="140" y="78" text-anchor="middle">connector-dependent writes</text>
  </g>

  <rect class="lane" x="500" y="180" width="460" height="740" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="532" y="230">Trino adapters</text>
  <g transform="translate(540 270)">
    <rect class="card green" width="340" height="110" rx="12"/>
    <text class="cardTitle type" x="170" y="31" text-anchor="middle">TrinoDatabase</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">registers driver + dialect</text>
    <text class="cardText" x="170" y="78" text-anchor="middle">host/url/DataSource connect</text>
    <text class="cardText" x="170" y="98" text-anchor="middle">wraps every raw connection</text>
  </g>
  <g transform="translate(540 430)">
    <rect class="card green" width="340" height="96" rx="12"/>
    <text class="cardTitle type" x="170" y="31" text-anchor="middle">TrinoConnectionOptions</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">explicitPrepare / encoding</text>
    <text class="cardText" x="170" y="78" text-anchor="middle">source / tags / session props</text>
  </g>
  <g transform="translate(540 580)">
    <rect class="card green" width="340" height="116" rx="12"/>
    <text class="cardTitle type" x="170" y="31" text-anchor="middle">TrinoDialect + metadata</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">PostgreSQLDialect base</text>
    <text class="cardText" x="170" y="78" text-anchor="middle">OFFSET before LIMIT</text>
    <text class="cardText" x="170" y="98" text-anchor="middle">FK cache lookup no-op</text>
  </g>
  <g transform="translate(540 750)">
    <rect class="card green" width="340" height="104" rx="12"/>
    <text class="cardTitle type" x="170" y="31" text-anchor="middle">TrinoTable</text>
    <text class="cardText" x="170" y="58" text-anchor="middle">strips PRIMARY KEY syntax</text>
    <text class="cardText" x="170" y="78" text-anchor="middle">removes explicit NULL</text>
  </g>

  <rect class="lane" x="1018" y="180" width="280" height="740" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="1050" y="230">JDBC boundary</text>
  <g transform="translate(1040 340)">
    <rect class="card gold" width="236" height="142" rx="12"/>
    <text class="cardTitle warn" x="118" y="31" text-anchor="middle">Connection wrapper</text>
    <text class="cardText" x="118" y="58" text-anchor="middle">autoCommit always true</text>
    <text class="cardText" x="118" y="78" text-anchor="middle">commit / rollback no-op</text>
    <text class="cardText" x="118" y="98" text-anchor="middle">prepareStatement overloads</text>
    <text class="cardText" x="118" y="118" text-anchor="middle">delegate to prepare(sql)</text>
  </g>
  <g transform="translate(1040 620)">
    <rect class="card gold" width="236" height="106" rx="12"/>
    <text class="cardTitle warn" x="118" y="31" text-anchor="middle">JDBC execution</text>
    <text class="cardText" x="118" y="58" text-anchor="middle">blocking driver call</text>
    <text class="cardText" x="118" y="78" text-anchor="middle">Dispatchers.IO for suspend</text>
  </g>

  <rect class="lane" x="1368" y="180" width="240" height="740" rx="18" fill="#f2edf8" stroke="#b2a1dc"/>
  <text class="laneTitle" x="1400" y="230">Trino service</text>
  <g transform="translate(1388 360)">
    <rect class="card purple" width="200" height="136" rx="12"/>
    <image x="80" y="18" width="40" height="40" href="data:image/svg+xml;base64,"/>
    <text class="cardTitle" x="100" y="78" text-anchor="middle">Coordinator</text>
    <text class="cardText" x="100" y="104" text-anchor="middle">plans and dispatches</text>
    <text class="cardText" x="100" y="124" text-anchor="middle">catalog connector work</text>
  </g>
  <g transform="translate(1388 600)">
    <rect class="card purple" width="200" height="116" rx="12"/>
    <text class="cardTitle" x="100" y="31" text-anchor="middle">Catalog connector</text>
    <text class="cardText" x="100" y="58" text-anchor="middle">read/write support varies</text>
    <text class="cardText" x="100" y="78" text-anchor="middle">pushdown must be tested</text>
    <text class="cardText" x="100" y="98" text-anchor="middle">no ACID guarantee here</text>
  </g>

  <path class="line lineBlue" d="M402 480 H540"/>
  <path class="line lineBlue" d="M402 636 H500 V673 H540"/>
  <path class="line lineBlue" d="M402 800 H500 V802 H540"/>
  <path class="line lineGreen" d="M710 430 V380"/>
  <path class="line lineGreen" d="M880 325 H998 V411 H1040"/>
  <path class="line lineGold" d="M1158 482 V620"/>
  <path class="line lineGold" d="M1276 673 H1388"/>
  <path class="line linePurple" d="M1488 496 V600"/>
  <path class="line lineGreen" d="M710 696 V750"/>
  <path class="line lineGreen" d="M402 330 H500 V638 H540"/>

  <text class="label" x="424" y="464">execute</text>
  <text class="label" x="424" y="620">Flow API</text>
  <text class="label" x="424" y="784">batch write</text>
  <text class="label" x="904" y="310">wrap</text>
  <text class="label" x="1180" y="558">JDBC call</text>
  <text class="label" x="1300" y="654">query</text>
  <text class="label" x="1502" y="552">connector</text>

  <rect x="122" y="986" width="1456" height="28" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="850" y="1005" text-anchor="middle">Reader contract: exposed-trino adapts Exposed JDBC usage to Trino semantics; it does not add ACID rollback or connector-independent writes.</text>
</svg>
