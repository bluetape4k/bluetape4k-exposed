<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180" role="img" aria-labelledby="title desc">
  <title id="title">Trino Flow Materialization Contract</title>
  <desc id="desc">Flow diagram for exposed-trino showing queryFlow materialization, pagedQueryFlow page boundaries, chunked batch insert, cancellation checks, and Trino connector-dependent execution.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5d6b" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:13px}.label{font-size:12px;fill:#315664}.step{font-size:12px;font-weight:700}.lane{stroke-width:2.5}.card{fill:#fffdf8;stroke-width:2.2}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.red{stroke:#d58b96}.line{fill:none;stroke-width:4.0;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}.lineRed{stroke:#bd5d6b;marker-end:url(#arrow-red)}.dash{stroke-dasharray:10 8}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}.fail{fill:#a94452;font-weight:700}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1180"/>
  <rect class="frame" x="38" y="32" width="1684" height="1116" rx="24"/>
  <text class="title" x="86" y="96">Trino Flow Materialization Contract</text>
  <text class="subtitle" x="90" y="132">Flow APIs close JDBC transactions before emission; paged Flow bounds materialization without exposing a live cursor.</text>

  <rect class="lane" x="92" y="176" width="1576" height="244" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="124" y="224">Build and execute query</text>
  <g transform="translate(140 274)">
    <rect class="card blue" width="260" height="92" rx="12"/>
    <text class="step" x="22" y="27">1</text>
    <text class="cardTitle code" x="146" y="32" text-anchor="middle">Caller block</text>
    <text class="cardText" x="146" y="58" text-anchor="middle">Exposed Query / DML</text>
    <text class="cardText" x="146" y="76" text-anchor="middle">typed table references</text>
  </g>
  <g transform="translate(510 274)">
    <rect class="card green" width="300" height="92" rx="12"/>
    <text class="step" x="22" y="27">2</text>
    <text class="cardTitle type" x="160" y="32" text-anchor="middle">transaction(db)</text>
    <text class="cardText" x="160" y="58" text-anchor="middle">JDBC ResultSet lifetime</text>
    <text class="cardText" x="160" y="76" text-anchor="middle">bounded by transaction</text>
  </g>
  <g transform="translate(920 274)">
    <rect class="card gold" width="300" height="92" rx="12"/>
    <text class="step" x="22" y="27">3</text>
    <text class="cardTitle warn" x="160" y="32" text-anchor="middle">Trino JDBC</text>
    <text class="cardText" x="160" y="58" text-anchor="middle">blocking execute</text>
    <text class="cardText" x="160" y="76" text-anchor="middle">autoCommit semantics</text>
  </g>
  <g transform="translate(1300 274)">
    <rect class="card purple" width="310" height="92" rx="12"/>
    <image x="30" y="21" width="40" height="40" href="data:image/svg+xml;base64,"/>
    <text class="step" x="22" y="27">4</text>
    <text class="cardTitle" x="180" y="32" text-anchor="middle">Trino coordinator</text>
    <text class="cardText" x="180" y="58" text-anchor="middle">catalog connector executes</text>
    <text class="cardText" x="180" y="76" text-anchor="middle">support is connector-specific</text>
  </g>

  <rect class="lane" x="92" y="482" width="1576" height="356" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="124" y="530">Flow modes</text>
  <g transform="translate(150 590)">
    <rect class="card green" width="310" height="112" rx="12"/>
    <text class="cardTitle type" x="155" y="31" text-anchor="middle">queryFlow</text>
    <text class="cardText" x="155" y="58" text-anchor="middle">materialize full List</text>
    <text class="cardText" x="155" y="78" text-anchor="middle">inside one transaction</text>
    <text class="cardText" x="155" y="98" text-anchor="middle">then close transaction</text>
  </g>
  <g transform="translate(600 570)">
    <rect class="card purple" width="330" height="144" rx="12"/>
    <text class="cardTitle type" x="165" y="31" text-anchor="middle">pagedQueryFlow</text>
    <text class="cardText" x="165" y="58" text-anchor="middle">fetch page in transaction</text>
    <text class="cardText" x="165" y="80" text-anchor="middle">emit after close</text>
    <text class="cardText" x="165" y="102" text-anchor="middle">check cancellation</text>
    <text class="cardText" x="165" y="124" text-anchor="middle">advance offset by page size</text>
  </g>
  <g transform="translate(1060 590)">
    <rect class="card gold" width="300" height="112" rx="12"/>
    <text class="cardTitle warn" x="150" y="31" text-anchor="middle">trinoBatchInsert</text>
    <text class="cardText" x="150" y="58" text-anchor="middle">chunk Iterable rows</text>
    <text class="cardText" x="150" y="78" text-anchor="middle">batchInsert per chunk</text>
    <text class="cardText" x="150" y="98" text-anchor="middle">generated keys off by default</text>
  </g>
  <g transform="translate(1450 590)">
    <rect class="card red" width="150" height="112" rx="12"/>
    <text class="cardTitle fail" x="75" y="31" text-anchor="middle">Limits</text>
    <text class="cardText" x="75" y="58" text-anchor="middle">no rollback</text>
    <text class="cardText" x="75" y="78" text-anchor="middle">partial writes</text>
    <text class="cardText" x="75" y="98" text-anchor="middle">no live cursor</text>
  </g>

  <rect class="lane" x="92" y="890" width="1576" height="148" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="124" y="938">Reader-facing contract</text>
  <g transform="translate(310 950)">
    <rect class="card gold" width="320" height="70" rx="12"/>
    <text class="cardTitle" x="160" y="30" text-anchor="middle">Flow collector</text>
    <text class="cardText" x="160" y="52" text-anchor="middle">receives already materialized rows</text>
  </g>
  <g transform="translate(760 950)">
    <rect class="card gold" width="320" height="70" rx="12"/>
    <text class="cardTitle" x="160" y="30" text-anchor="middle">Large result sets</text>
    <text class="cardText" x="160" y="52" text-anchor="middle">prefer deterministic paged query</text>
  </g>
  <g transform="translate(1210 950)">
    <rect class="card gold" width="320" height="70" rx="12"/>
    <text class="cardTitle" x="160" y="30" text-anchor="middle">Connector writes</text>
    <text class="cardText" x="160" y="52" text-anchor="middle">test catalog support explicitly</text>
  </g>

  <path class="line lineBlue" d="M400 320 H510"/>
  <path class="line lineGreen" d="M810 320 H920"/>
  <path class="line lineGold" d="M1220 320 H1300"/>
  <path class="line lineGreen" d="M660 366 V520 H305 V590"/>
  <path class="line linePurple" d="M660 366 V520 H765 V570"/>
  <path class="line lineGold" d="M1070 366 V520 H1210 V590"/>
  <path class="line lineRed" d="M1610 366 V520 H1525 V590"/>
  <path class="line lineGreen" d="M460 646 H600"/>
  <path class="line linePurple" d="M930 642 H1060"/>
  <path class="line lineRed" d="M1360 646 H1450"/>
  <path class="line linePurple" d="M930 686 H974 V768 H815 V714"/>
  <path class="line lineGreen" d="M305 702 V950 H310"/>
  <path class="line linePurple" d="M765 714 V950 H760"/>
  <path class="line lineGold" d="M1210 702 V950"/>

  <text class="label" x="416" y="304">DSL</text>
  <text class="label" x="828" y="304">SQL</text>
  <text class="label" x="1238" y="304">execute</text>
  <text class="label" x="326" y="570">single transaction</text>
  <text class="label" x="790" y="548">page transaction</text>
  <text class="label" x="1228" y="570">chunks</text>
  <text class="label" x="1380" y="630">risk</text>
  <text class="label" x="826" y="760">next page</text>

  <rect x="126" y="1082" width="1508" height="28" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="880" y="1101" text-anchor="middle">Cancellation is checked before each page and emitted item; an in-flight JDBC page still closes its transaction before collection stops.</text>
</svg>
