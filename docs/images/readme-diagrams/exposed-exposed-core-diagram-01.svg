<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680" role="img" aria-label="Core Auditable Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
  </style>
</defs>
<rect class="canvas" width="1360" height="680"/>
<rect class="frame" x="32" y="28" width="1296" height="624" rx="28"/>
<text class="title" x="66" y="82">Core Auditable Structure</text>
<text class="subtitle" x="70" y="118">Auditable table bases and UserContext from current source</text>
<path class="inheritLine" d="M680 330 C680 270 258 270 258 210"/>
<path class="inheritLine" d="M680 330 C680 270 680 270 680 210"/>
<path class="inheritLine" d="M680 330 C680 270 1102 270 1102 210"/>
<path class="dashed" d="M1102 430 C1102 500 680 500 680 542"/>
<g transform="translate(118,172)">
  <rect class="card" x="0" y="0" width="280" height="120" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="74" x2="280" y2="74" stroke="#5B8DEF"/>
  <text class="small" x="140" y="24" text-anchor="middle">abstract table</text>
  <text class="label" x="140" y="56" text-anchor="middle">AuditableIntIdTable</text>
  <text class="mono" x="18" y="102">ID type: Int</text>
</g>
<g transform="translate(540,172)">
  <rect class="card" x="0" y="0" width="280" height="120" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="74" x2="280" y2="74" stroke="#58A978"/>
  <text class="small" x="140" y="24" text-anchor="middle">abstract table</text>
  <text class="label" x="140" y="56" text-anchor="middle">AuditableLongIdTable</text>
  <text class="mono" x="18" y="102">ID type: Long</text>
</g>
<g transform="translate(962,172)">
  <rect class="card" x="0" y="0" width="280" height="120" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="74" x2="280" y2="74" stroke="#D6A441"/>
  <text class="small" x="140" y="24" text-anchor="middle">abstract table</text>
  <text class="label" x="140" y="56" text-anchor="middle">AuditableUUIDTable</text>
  <text class="mono" x="18" y="102">ID type: UUID</text>
</g>
<g transform="translate(470,340)">
  <rect class="card" x="0" y="0" width="420" height="150" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="74" x2="420" y2="74" stroke="#DC6B82"/>
  <text class="small" x="210" y="24" text-anchor="middle">abstract base</text>
  <text class="label" x="210" y="56" text-anchor="middle">AuditableIdTable&lt;ID&gt;</text>
  <text class="mono" x="18" y="102">+createdBy / createdAt</text>
  <text class="mono" x="18" y="123">+updatedBy / updatedAt</text>
</g>
<g transform="translate(470,542)">
  <rect class="card" x="0" y="0" width="420" height="70" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="210" y="44" text-anchor="middle">UserContext</text>
</g>
</svg>
