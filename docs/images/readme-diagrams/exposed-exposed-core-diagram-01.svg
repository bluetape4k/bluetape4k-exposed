<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1180" viewBox="0 0 1520 1180" role="img" aria-labelledby="title desc">
  <title id="title">Core Auditable Table Structure</title>
  <desc id="desc">Class-oriented auditable structure rebuilt from exposed-core README and auditable source files.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1520" height="1180"/>
  <rect class="decor" x="44" y="36" width="1432" height="1108" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1356" height="884" rx="24"/>
  <text class="title" x="72" y="88">Core Auditable Table Structure</text>
  <text class="subtitle" x="76" y="121">Auditable fields, Exposed IdTable columns, concrete ID bases, and UserContext are mapped directly from source classes.</text>
  <g id="group-contracts">
    <rect class="group" x="92" y="156" width="1336" height="225" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Audit contracts and context</text>
  </g>
  <g id="group-base">
    <rect class="group" x="92" y="420" width="1336" height="295" rx="18"/>
    <text class="group-title" x="122" y="444" dominant-baseline="middle">Exposed table base</text>
  </g>
  <g id="group-concrete">
    <rect class="group" x="92" y="755" width="1336" height="250" rx="18"/>
    <text class="group-title" x="122" y="779" dominant-baseline="middle">Concrete ID table bases</text>
  </g>
  <path id="route-auditable-id-table-idtable" data-edge="auditable-id-table-&gt;idtable" data-label="extends" class="connector generalization" d="M 770 480 L 770 325" stroke="#3E9868"/>
  <path id="route-int-table-auditable-id-table" data-edge="int-table-&gt;auditable-id-table" data-label="inherits audit columns" class="connector generalization" d="M 295 865 L 295 735 L 660 735 L 660 605" stroke="#755BC6"/>
  <path id="route-long-table-auditable-id-table" data-edge="long-table-&gt;auditable-id-table" data-label="inherits audit columns" class="connector generalization" d="M 760 865 L 760 605" stroke="#755BC6"/>
  <path id="route-uuid-table-auditable-id-table" data-edge="uuid-table-&gt;auditable-id-table" data-label="inherits audit columns" class="connector generalization" d="M 1225 865 L 1225 735 L 860 735 L 860 605" stroke="#755BC6"/>
  <path id="route-user-context-auditable-id-table" data-edge="user-context-&gt;auditable-id-table" data-label="current user defaults" class="connector" d="M 1045 525 L 960 525" stroke="#2E8F89"/>
  <path id="route-audit-columns-auditable-id-table" data-edge="audit-columns-&gt;auditable-id-table" data-label="column contract" class="connector" d="M 505 550 L 580 550" stroke="#B9851B"/>
  <path id="route-repository-update-auditable-id-table" data-edge="repository-update-&gt;auditable-id-table" data-label="update audit values" class="connector" d="M 1080 648 L 1020 648 L 1020 580 L 960 580" stroke="#758297"/>
  <g id="node-auditable" data-node="auditable" transform="translate(130,245)">
    <rect class="shape" x="0" y="0" width="320" height="100" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="160" y="21.5" text-anchor="middle" dominant-baseline="middle">Auditable</text>
    <text class="detail" x="160" y="40.5" text-anchor="middle" dominant-baseline="middle">interface</text>
    <text class="detail" x="160" y="59.5" text-anchor="middle" dominant-baseline="middle">createdBy, createdAt</text>
    <text class="detail" x="160" y="78.5" text-anchor="middle" dominant-baseline="middle">updatedBy, updatedAt</text>
  </g>
  <g id="node-idtable" data-node="idtable" transform="translate(610,235)">
    <rect class="shape" x="0" y="0" width="300" height="90" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="150" y="26" text-anchor="middle" dominant-baseline="middle">Exposed IdTable&lt;ID&gt;</text>
    <text class="detail" x="150" y="45" text-anchor="middle" dominant-baseline="middle">framework parent</text>
    <text class="detail" x="150" y="64" text-anchor="middle" dominant-baseline="middle">declares id contract</text>
  </g>
  <g id="node-user-context" data-node="user-context" transform="translate(1045,480)">
    <rect class="shape" x="0" y="0" width="330" height="90" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="165" y="26" text-anchor="middle" dominant-baseline="middle">UserContext</text>
    <text class="detail" x="165" y="45" text-anchor="middle" dominant-baseline="middle">ScopedValue &gt; ThreadLocal</text>
    <text class="detail" x="165" y="64" text-anchor="middle" dominant-baseline="middle">fallback: system</text>
  </g>
  <g id="node-audit-columns" data-node="audit-columns" transform="translate(145,500)">
    <rect class="shape" x="0" y="0" width="360" height="100" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="21.5" text-anchor="middle" dominant-baseline="middle">Audit columns</text>
    <text class="detail" x="180" y="40.5" text-anchor="middle" dominant-baseline="middle">created_by default user</text>
    <text class="detail" x="180" y="59.5" text-anchor="middle" dominant-baseline="middle">created_at current timestamp</text>
    <text class="detail" x="180" y="78.5" text-anchor="middle" dominant-baseline="middle">updated_* set by repository</text>
  </g>
  <g id="node-auditable-id-table" data-node="auditable-id-table" transform="translate(580,480)">
    <rect class="shape" x="0" y="0" width="380" height="125" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="190" y="34" text-anchor="middle" dominant-baseline="middle">AuditableIdTable&lt;ID&gt;</text>
    <text class="detail" x="190" y="53" text-anchor="middle" dominant-baseline="middle">extends IdTable&lt;ID&gt;</text>
    <text class="detail" x="190" y="72" text-anchor="middle" dominant-baseline="middle">stores audit columns</text>
    <text class="detail" x="190" y="91" text-anchor="middle" dominant-baseline="middle">uses UserContext</text>
  </g>
  <g id="node-repository-update" data-node="repository-update" transform="translate(1080,610)">
    <rect class="shape" x="0" y="0" width="300" height="76" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="150" y="19" text-anchor="middle" dominant-baseline="middle">Repository update path</text>
    <text class="detail" x="150" y="38" text-anchor="middle" dominant-baseline="middle">sets updatedBy</text>
    <text class="detail" x="150" y="57" text-anchor="middle" dominant-baseline="middle">sets updatedAt</text>
  </g>
  <g id="node-int-table" data-node="int-table" transform="translate(135,865)">
    <rect class="shape" x="0" y="0" width="320" height="94" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="160" y="28" text-anchor="middle" dominant-baseline="middle">AuditableIntIdTable</text>
    <text class="detail" x="160" y="47" text-anchor="middle" dominant-baseline="middle">Int auto-increment id</text>
    <text class="detail" x="160" y="66" text-anchor="middle" dominant-baseline="middle">single id primary key</text>
  </g>
  <g id="node-long-table" data-node="long-table" transform="translate(600,865)">
    <rect class="shape" x="0" y="0" width="320" height="94" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="160" y="28" text-anchor="middle" dominant-baseline="middle">AuditableLongIdTable</text>
    <text class="detail" x="160" y="47" text-anchor="middle" dominant-baseline="middle">Long auto-increment id</text>
    <text class="detail" x="160" y="66" text-anchor="middle" dominant-baseline="middle">single id primary key</text>
  </g>
  <g id="node-uuid-table" data-node="uuid-table" transform="translate(1065,865)">
    <rect class="shape" x="0" y="0" width="320" height="94" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="160" y="28" text-anchor="middle" dominant-baseline="middle">AuditableUUIDTable</text>
    <text class="detail" x="160" y="47" text-anchor="middle" dominant-baseline="middle">UUID client default</text>
    <text class="detail" x="160" y="66" text-anchor="middle" dominant-baseline="middle">single id primary key</text>
  </g>
  <g transform="translate(76,1088)" data-footer="reader-contract">
    <rect class="pill" x="0" y="0" width="1368" height="48" rx="10"/>
    <text class="small" x="684" y="18" text-anchor="middle" dominant-baseline="middle">AuditableIdTable owns audit columns; UserContext supplies createdBy and updatedBy values.</text>
    <text class="small" x="684" y="35" text-anchor="middle" dominant-baseline="middle">Repository update helpers set updated_* fields; table definitions define created_* defaults.</text>
  </g>
</svg>
