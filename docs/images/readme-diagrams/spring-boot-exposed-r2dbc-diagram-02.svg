<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000" role="img" aria-labelledby="title desc">
<title id="title">Spring Boot Exposed R2DBC suspend query flow</title>
<desc id="desc">Suspend and Flow repository calls flow through a direct proxy into default operations, declared SQL, PartTree queries, and Exposed R2DBC transaction execution.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M 1 1 L 12 6 L 1 11" fill="none" stroke="#5d6f83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .band{fill:#fbfdff;stroke:#d8e0ea;stroke-width:1.4}
    .bandTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:24px;fill:#243447}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:17px;fill:#536273}
    .card{stroke-width:2.2;filter:url(#shadow)}
    .label{font-family:"Architects Daughter","Comic Mono",monospace;font-size:25px;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:15px;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:15px;fill:#102033}
    .line{stroke:#5d6f83;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .sql{stroke:#dc6b82;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .part{stroke:#d99a36;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .repo{stroke:#5b8def;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1640" height="1000"/>
<rect class="frame" x="32" y="28" width="1576" height="944" rx="26"/>
<text class="title" x="68" y="86">Suspend Query and Flow Execution</text>
<text class="subtitle" x="72" y="120">The direct proxy keeps coroutine signatures intact while Exposed R2DBC owns transaction execution.</text>

<rect class="band" x="64" y="158" width="1512" height="152" rx="18"/>
<text class="bandTitle" x="90" y="198">Coroutine caller and proxy</text>
<rect class="band" x="64" y="360" width="1512" height="214" rx="18"/>
<text class="bandTitle" x="90" y="400">Dispatch decision</text>
<rect class="band" x="64" y="624" width="1512" height="330" rx="18"/>
<text class="bandTitle" x="90" y="664">R2DBC execution boundary</text>

<path class="repo" d="M390 236 H506"/>
<path class="repo" d="M790 236 H906"/>
<path class="line" d="M1070 308 V360 H390 V430"/>
<path class="line" d="M1070 308 V360 H820 V430"/>
<path class="line" d="M1070 308 V360 H1250 V430"/>
<path class="sql" d="M390 490 V654"/>
<path class="part" d="M820 490 V654"/>
<path class="repo" d="M1250 490 V654"/>
<path class="sql" d="M390 790 V834 H740 V880"/>
<path class="part" d="M820 790 V880"/>
<path class="repo" d="M1250 790 V834 H900 V880"/>

<g transform="translate(96,190)">
  <rect class="card" x="0" y="0" width="294" height="92" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="147" y="35" text-anchor="middle">Coroutine Service</text>
  <text class="mono" x="147" y="64" text-anchor="middle">suspend findByName(...)</text>
</g>
<g transform="translate(506,190)">
  <rect class="card" x="0" y="0" width="284" height="92" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="142" y="35" text-anchor="middle">Direct Proxy</text>
  <text class="small" x="142" y="64" text-anchor="middle">Continuation-aware dispatch</text>
</g>
<g transform="translate(906,190)">
  <rect class="card" x="0" y="0" width="328" height="118" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="164" y="34" text-anchor="middle">Method Handler</text>
  <text class="small" x="164" y="64" text-anchor="middle">impl method, default method,</text>
  <text class="small" x="164" y="88" text-anchor="middle">or query object</text>
</g>

<g transform="translate(260,430)">
  <rect class="card" x="0" y="0" width="260" height="60" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="130" y="38" text-anchor="middle">@Query method?</text>
</g>
<g transform="translate(690,430)">
  <rect class="card" x="0" y="0" width="260" height="60" rx="8" fill="#fff7e8" stroke="#d99a36"/>
  <text class="label" x="130" y="38" text-anchor="middle">PartTree method?</text>
</g>
<g transform="translate(1120,430)">
  <rect class="card" x="0" y="0" width="260" height="60" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="130" y="38" text-anchor="middle">Base operation?</text>
</g>

<g transform="translate(240,654)">
  <rect class="card" x="0" y="0" width="300" height="136" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="150" y="34" text-anchor="middle">DeclaredR2dbcQuery</text>
  <text class="small" x="150" y="64" text-anchor="middle">requires active transaction</text>
  <text class="mono" x="150" y="92" text-anchor="middle">tx.exec(sql, args)</text>
  <text class="small" x="150" y="118" text-anchor="middle">reloads rows by id list</text>
</g>
<g transform="translate(670,654)">
  <rect class="card" x="0" y="0" width="300" height="136" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="150" y="34" text-anchor="middle">PartTreeR2dbcQuery</text>
  <text class="small" x="150" y="64" text-anchor="middle">builds Op&lt;Boolean&gt;</text>
  <text class="mono" x="150" y="92" text-anchor="middle">selectAll().where { op }</text>
  <text class="small" x="150" y="118" text-anchor="middle">List, Page, Slice, Flow</text>
</g>
<g transform="translate(1100,654)">
  <rect class="card" x="0" y="0" width="300" height="136" rx="8" fill="#e9f7f6" stroke="#45a7a1"/>
  <text class="label" x="150" y="34" text-anchor="middle">Simple Repository</text>
  <text class="small" x="150" y="64" text-anchor="middle">save, page, streamAll</text>
  <text class="mono" x="150" y="92" text-anchor="middle">channelFlow + suspendTx</text>
  <text class="small" x="150" y="118" text-anchor="middle">maps ResultRow to domain</text>
</g>

<g transform="translate(670,880)">
  <rect class="card" x="0" y="0" width="300" height="70" rx="8" fill="#f8fbff" stroke="#6b7f93"/>
  <image x="28" y="12" width="46" height="46" href="data:image/svg+xml;base64,"/>
  <text class="label" x="188" y="30" text-anchor="middle">Exposed R2DBC + DB</text>
  <text class="small" x="188" y="55" text-anchor="middle">non-blocking transactional rows</text>
</g>
</svg>
