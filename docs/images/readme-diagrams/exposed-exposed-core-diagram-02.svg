<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">exposed-core Column Type Pipeline Map</title>
  <desc id="desc">Pipeline map showing how exposed-core column extension functions connect Kotlin values, transformers, and SQL storage types.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 6.5 3.2 Q 11 5 6.5 6.8 L 1 9" fill="#536C85" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .panel{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476}
      .lane-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .box-title{font-family:"Architects Daughter";font-size:21px;fill:#22344A;font-weight:400}
      .text{font-family:"Comic Mono";font-size:14px;fill:#34485E}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184}
      .lane{fill:#F3F7FB;stroke:#D9E4EF;stroke-width:2}
      .box{stroke-width:2;filter:url(#shadow)}
      .value{fill:#E8F3FF;stroke:#4F83BF}
      .transform{fill:#FFF3D9;stroke:#D6A441}
      .storage{fill:#EAF7EF;stroke:#58A978}
      .direct{fill:#F1ECFF;stroke:#755BC6}
      .arrow{fill:none;stroke:#536C85;stroke-width:2.4;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .bidir{fill:none;stroke:#536C85;stroke-width:2.4;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow-536c85" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 6.5 3.2 Q 11 5 6.5 6.8 L 1 9" fill="#536C85" style="stroke-dasharray:none!important" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect class="canvas" width="1600" height="1120"/>
  <rect class="panel" x="42" y="36" width="1516" height="1048" rx="30"/>
  <text class="title" x="72" y="88">Column Type Pipeline Map</text>
  <text class="subtitle" x="76" y="121">Each row answers how a Kotlin value becomes a database value and which extension function registers it.</text>

  <rect class="lane" x="92" y="170" width="1416" height="130" rx="18"/>
  <text class="lane-title" x="122" y="198">Compressed bytes</text>
  <path class="arrow" d="M420 235 L535 235" style="marker-end:url(#arrow-536c85)"/>
  <path class="arrow" d="M810 235 L925 235" style="marker-end:url(#arrow-536c85)"/>
  <g transform="translate(150 208)">
    <rect class="box value" x="0" y="0" width="270" height="70" rx="10"/>
    <text class="box-title" x="135" y="24" text-anchor="middle">ByteArray</text>
    <text class="text" x="135" y="47" text-anchor="middle">application payload</text>
  </g>
  <g transform="translate(535 195)">
    <rect class="box transform" x="0" y="0" width="275" height="96" rx="10"/>
    <text class="box-title" x="137.5" y="24" text-anchor="middle">Compression</text>
    <text class="text" x="137.5" y="47" text-anchor="middle">LZ4 / Snappy / Zstd</text>
    <text class="text" x="137.5" y="70" text-anchor="middle">rethrows cancellation</text>
  </g>
  <g transform="translate(925 208)">
    <rect class="box storage" x="0" y="0" width="430" height="70" rx="10"/>
    <text class="box-title" x="215" y="24" text-anchor="middle">compressedBinary / compressedBlob</text>
    <text class="text" x="215" y="47" text-anchor="middle">VARBINARY(length) or BLOB</text>
  </g>

  <rect class="lane" x="92" y="330" width="1416" height="130" rx="18"/>
  <text class="lane-title" x="122" y="358">Serialized objects</text>
  <path class="arrow" d="M420 395 L535 395" style="marker-end:url(#arrow-536c85)"/>
  <path class="arrow" d="M810 395 L925 395" style="marker-end:url(#arrow-536c85)"/>
  <g transform="translate(150 368)">
    <rect class="box value" x="0" y="0" width="270" height="70" rx="10"/>
    <text class="box-title" x="135" y="24" text-anchor="middle">T : Any</text>
    <text class="text" x="135" y="47" text-anchor="middle">domain object</text>
  </g>
  <g transform="translate(535 355)">
    <rect class="box transform" x="0" y="0" width="275" height="96" rx="10"/>
    <text class="box-title" x="137.5" y="24" text-anchor="middle">BinarySerializer</text>
    <text class="text" x="137.5" y="47" text-anchor="middle">Kryo / Fory family</text>
    <text class="text" x="137.5" y="70" text-anchor="middle">null deserialize fails</text>
  </g>
  <g transform="translate(925 368)">
    <rect class="box storage" x="0" y="0" width="430" height="70" rx="10"/>
    <text class="box-title" x="215" y="24" text-anchor="middle">binarySerializedBinary / Blob</text>
    <text class="text" x="215" y="47" text-anchor="middle">VARBINARY(length) or BLOB</text>
  </g>

  <rect class="lane" x="92" y="490" width="1416" height="155" rx="18"/>
  <text class="lane-title" x="122" y="518">Network addresses</text>
  <path class="arrow" d="M500 568 L615 568" style="marker-end:url(#arrow-536c85)"/>
  <path class="arrow" d="M935 568 L1050 568" style="marker-end:url(#arrow-536c85)"/>
  <g transform="translate(150 535)">
    <rect class="box direct" x="0" y="0" width="350" height="94" rx="10"/>
    <text class="box-title" x="175" y="24" text-anchor="middle">InetAddress / CIDR text</text>
    <text class="text" x="175" y="47" text-anchor="middle">inetAddress(), cidr()</text>
    <text class="text" x="175" y="70" text-anchor="middle">PostgreSQL operator: &lt;&lt;</text>
  </g>
  <g transform="translate(615 535)">
    <rect class="box transform" x="0" y="0" width="320" height="94" rx="10"/>
    <text class="box-title" x="160" y="24" text-anchor="middle">Direct ColumnType</text>
    <text class="text" x="160" y="47" text-anchor="middle">no ColumnWithTransform</text>
    <text class="text" x="160" y="70" text-anchor="middle">custom SQL type binding</text>
  </g>
  <g transform="translate(1050 535)">
    <rect class="box storage" x="0" y="0" width="320" height="94" rx="10"/>
    <text class="box-title" x="160" y="24" text-anchor="middle">INET / CIDR fallback</text>
    <text class="text" x="160" y="47" text-anchor="middle">PostgreSQL native types</text>
    <text class="text" x="160" y="70" text-anchor="middle">VARCHAR on other dialects</text>
  </g>

  <rect class="lane" x="92" y="675" width="1416" height="155" rx="18"/>
  <text class="lane-title" x="122" y="703">Phone numbers</text>
  <path class="arrow" d="M500 753 L615 753" style="marker-end:url(#arrow-536c85)"/>
  <path class="arrow" d="M935 753 L1050 753" style="marker-end:url(#arrow-536c85)"/>
  <g transform="translate(150 720)">
    <rect class="box value" x="0" y="0" width="350" height="94" rx="10"/>
    <text class="box-title" x="175" y="24" text-anchor="middle">PhoneNumber or String</text>
    <text class="text" x="175" y="47" text-anchor="middle">phoneNumber()</text>
    <text class="text" x="175" y="70" text-anchor="middle">phoneNumberString()</text>
  </g>
  <g transform="translate(615 720)">
    <rect class="box transform" x="0" y="0" width="320" height="94" rx="10"/>
    <text class="box-title" x="160" y="24" text-anchor="middle">libphonenumber</text>
    <text class="text" x="160" y="47" text-anchor="middle">parse / validate</text>
    <text class="text" x="160" y="70" text-anchor="middle">normalize to E.164</text>
  </g>
  <g transform="translate(1050 720)">
    <rect class="box storage" x="0" y="0" width="320" height="94" rx="10"/>
    <text class="box-title" x="160" y="24" text-anchor="middle">VARCHAR(20)</text>
    <text class="text" x="160" y="47" text-anchor="middle">stores E.164 string</text>
    <text class="text" x="160" y="70" text-anchor="middle">object or string API</text>
  </g>

  <g transform="translate(150 882)">
    <rect class="box" x="0" y="0" width="1200" height="98" rx="12" fill="#FBFDFF" stroke="#D7E2EC"/>
    <text class="box-title" x="600" y="31" text-anchor="middle">Reader rule</text>
    <text class="text" x="600" y="58" text-anchor="middle">Use transformed column families when a reversible value mapping is needed.</text>
    <text class="text" x="600" y="80" text-anchor="middle">Use direct ColumnType families when SQL binding or dialect fallback is the main concern.</text>
  </g>

  <g transform="translate(76 1010)">
    <rect x="0" y="0" width="1448" height="48" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="small" x="724" y="19" text-anchor="middle">This is a pipeline map, not a class hierarchy: arrows show value conversion from Kotlin API to SQL storage.</text>
    <text class="small" x="724" y="36" text-anchor="middle">Tink encryption lives in exposed-tink; exposed-core covers compression, serialization, inet/CIDR, and phone values.</text>
  </g>
</svg>
