<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1170" viewBox="0 0 1754 1170" role="img" aria-label="Custom Column Type Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1170"/>
<rect class="frame" x="32" y="28" width="1690" height="1114" rx="28"/>
<text class="title" x="66" y="82">Custom Column Type Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1082 172 C1082 257 672 257 672 342"/>
<path class="inheritLine" d="M672 476 C672 409 1082 409 1082 342"/>
<path class="inheritLine" d="M262 476 C262 409 1082 409 1082 342"/>
<path class="inheritLine" d="M1082 772 C1082 557 1082 557 1082 342"/>
<path class="inheritLine" d="M672 772 C672 557 1082 557 1082 342"/>
<path class="inheritLine" d="M1492 476 C1492 409 1082 409 1082 342"/>
<path class="inheritLine" d="M1082 476 C1082 409 1082 409 1082 342"/>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ColumnTransformer</text>
  <text class="mono" x="18" y="108">+wrap(value) T</text>
<text class="mono" x="18" y="129">+unwrap(value) T</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«ExposedCore»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ColumnWithTransform</text>
  <text class="mono" x="18" y="108">+delegate: ColumnType</text>
<text class="mono" x="18" y="129">+transformer: ColumnTransformer</text>
</g>
<g transform="translate(92,484)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Binary Serialized Binary</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Column Type</text>
  <text class="mono" x="18" y="124">+serializer: BinarySerializer</text>
<text class="mono" x="18" y="145">+length: Int</text>
</g>
<g transform="translate(502,484)">
  <rect class="card" x="0" y="0" width="340" height="149" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Binary Serialized Blob</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Column Type</text>
  <text class="mono" x="18" y="124">+serializer: BinarySerializer</text>
</g>
<g transform="translate(912,484)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Compressed Binary Column</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Type</text>
  <text class="mono" x="18" y="124">+compressor: Compressor</text>
<text class="mono" x="18" y="145">+length: Int</text>
</g>
<g transform="translate(1322,484)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">CompressedBlobColumnType</text>
  <text class="mono" x="18" y="108">+compressor: Compressor</text>
</g>
<g transform="translate(502,780)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Encrypted Binary Column</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Type</text>
  <text class="mono" x="18" y="124">+encryptor: Encryptor</text>
<text class="mono" x="18" y="145">+length: Int</text>
</g>
<g transform="translate(912,780)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Encrypted Var Char</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Column Type</text>
  <text class="mono" x="18" y="124">+encryptor: Encryptor</text>
<text class="mono" x="18" y="145">+colLength: Int</text>
</g>
</svg>
