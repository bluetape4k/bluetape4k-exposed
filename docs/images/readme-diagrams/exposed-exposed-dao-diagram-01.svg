<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">exposed-dao AuditableEntity UML Class Diagram</title>
  <desc id="desc">UML class diagram for AuditableEntity, typed auditable DAO entities, EntityClass helpers, and the Auditable contract.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.12"/></filter>
    <marker id="generalization" viewBox="0 0 16 12" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L15 6 L1 11 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.5"/></marker>
    <marker id="dependency" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.panel{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476}
      .uml{fill:#FBFDFF;stroke:#5F7895;stroke-width:2.2;filter:url(#shadow)}.base{fill:#EAF7EF;stroke:#3E9868}.typed{fill:#F1ECFF;stroke:#755BC6}.factory{fill:#E8F3FF;stroke:#4F83BF}.note{fill:#FFF3D9;stroke:#D6A441}
      .name{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.stereo{font-family:"Comic Mono";font-size:13px;fill:#627184}.member{font-family:"Comic Mono";font-size:14px;fill:#34485E}.small{font-family:"Comic Mono";font-size:13px;fill:#627184}
      .divider{stroke:#86A0B8;stroke-width:1.4}.inherit{fill:none;stroke:#755BC6;stroke-width:2.4;marker-end:url(#generalization);stroke-linecap:round;stroke-linejoin:round}.dep{fill:none;stroke:#2E8F89;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#dependency);stroke-linecap:round;stroke-linejoin:round}.factory-line{fill:none;stroke:#4F83BF;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#dependency);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="1080"/>
  <rect class="panel" x="42" y="36" width="1416" height="1008" rx="30"/>
  <text class="title" x="72" y="88">AuditableEntity UML</text>
  <text class="subtitle" x="76" y="121">DAO audit classes are shown as inheritance; table defaults and flush timing stay outside the class tree.</text>

  <path class="inherit" d="M760 360 L760 280"/>
  <path class="dep" d="M430 245 L565 420"/>
  <path class="dep" d="M1060 420 L955 455"/>
  <path class="inherit" d="M310 690 L310 610 L670 610 L670 535"/>
  <path class="inherit" d="M760 690 L760 535"/>
  <path class="inherit" d="M1210 690 L1210 610 L850 610 L850 535"/>
  <path class="factory-line" d="M310 842 L310 815"/>
  <path class="factory-line" d="M760 842 L760 815"/>
  <path class="factory-line" d="M1210 842 L1210 815"/>

  <g transform="translate(575 180)">
    <rect class="uml" x="0" y="0" width="370" height="100" rx="8"/>
    <text class="name" x="185" y="31" text-anchor="middle">Entity&lt;ID&gt;</text>
    <line class="divider" x1="0" y1="50" x2="370" y2="50"/>
    <text class="member" x="18" y="76">+ flush(batch): Boolean</text>
  </g>
  <g transform="translate(150 190)">
    <rect class="uml factory" x="0" y="0" width="280" height="145" rx="8"/>
    <text class="stereo" x="140" y="24" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="name" x="140" y="50" text-anchor="middle">Auditable</text>
    <line class="divider" x1="0" y1="68" x2="280" y2="68"/>
    <text class="member" x="16" y="94">createdBy / createdAt</text>
    <text class="member" x="16" y="118">updatedBy / updatedAt</text>
  </g>
  <g transform="translate(1060 360)">
    <rect class="uml note" x="0" y="0" width="300" height="125" rx="8"/>
    <text class="name" x="150" y="31" text-anchor="middle">UserContext</text>
    <line class="divider" x1="0" y1="50" x2="300" y2="50"/>
    <text class="member" x="18" y="76">getCurrentUser()</text>
    <text class="member" x="18" y="100">ScopedValue &gt; ThreadLocal</text>
  </g>
  <g transform="translate(565 390)">
    <rect class="uml base" x="0" y="0" width="390" height="145" rx="8"/>
    <text class="stereo" x="195" y="24" text-anchor="middle">abstract class</text>
    <text class="name" x="195" y="50" text-anchor="middle">AuditableEntity&lt;ID&gt;</text>
    <line class="divider" x1="0" y1="68" x2="390" y2="68"/>
    <text class="member" x="18" y="94">+ flush(batch): Boolean</text>
    <text class="member" x="18" y="118">+ idEquals / idHashCode</text>
    <text class="member" x="18" y="140">+ created/updated audit vars</text>
  </g>

  <g transform="translate(130 690)">
    <rect class="uml typed" x="0" y="0" width="360" height="125" rx="8"/>
    <text class="stereo" x="180" y="24" text-anchor="middle">abstract class</text>
    <text class="name" x="180" y="50" text-anchor="middle">AuditableIntEntity</text>
    <line class="divider" x1="0" y1="68" x2="360" y2="68"/>
    <text class="member" x="18" y="96">EntityID&lt;Int&gt;</text>
  </g>
  <g transform="translate(580 690)">
    <rect class="uml typed" x="0" y="0" width="360" height="125" rx="8"/>
    <text class="stereo" x="180" y="24" text-anchor="middle">abstract class</text>
    <text class="name" x="180" y="50" text-anchor="middle">AuditableLongEntity</text>
    <line class="divider" x1="0" y1="68" x2="360" y2="68"/>
    <text class="member" x="18" y="96">EntityID&lt;Long&gt;</text>
  </g>
  <g transform="translate(1030 690)">
    <rect class="uml typed" x="0" y="0" width="360" height="125" rx="8"/>
    <text class="stereo" x="180" y="24" text-anchor="middle">abstract class</text>
    <text class="name" x="180" y="50" text-anchor="middle">AuditableUUIDEntity</text>
    <line class="divider" x1="0" y1="68" x2="360" y2="68"/>
    <text class="member" x="18" y="96">EntityID&lt;UUID&gt;</text>
  </g>

  <g transform="translate(130 842)">
    <rect class="uml factory" x="0" y="0" width="360" height="86" rx="8"/>
    <text class="name" x="180" y="31" text-anchor="middle">AuditableIntEntityClass</text>
    <text class="member" x="18" y="62">uses AuditableIntIdTable</text>
  </g>
  <g transform="translate(580 842)">
    <rect class="uml factory" x="0" y="0" width="360" height="86" rx="8"/>
    <text class="name" x="180" y="31" text-anchor="middle">AuditableLongEntityClass</text>
    <text class="member" x="18" y="62">uses AuditableLongIdTable</text>
  </g>
  <g transform="translate(1030 842)">
    <rect class="uml factory" x="0" y="0" width="360" height="86" rx="8"/>
    <text class="name" x="180" y="31" text-anchor="middle">AuditableUUIDEntityClass</text>
    <text class="member" x="18" y="62">uses AuditableUUIDTable</text>
  </g>

  <g transform="translate(76 970)">
    <rect x="0" y="0" width="1348" height="48" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="small" x="674" y="19" text-anchor="middle">This is a UML class diagram: hollow arrows show inheritance; dashed arrows show dependencies.</text>
    <text class="small" x="674" y="36" text-anchor="middle">flush() sets createdBy for new entities and updatedBy for dirty existing entities; updatedAt is repository-owned.</text>
  </g>
</svg>
