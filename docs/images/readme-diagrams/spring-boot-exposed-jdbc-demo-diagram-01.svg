<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc">
<title id="title">Spring Boot JDBC demo structure</title>
<desc id="desc">Spring MVC product API structure with controller, Exposed JDBC repository, DAO entity, startup initializer, transaction manager, and H2 database.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5d6f83" stroke="#5d6f83" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .layer{fill:#fbfdff;stroke:#d8e0ea;stroke-width:1.4}
    .layerTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:25px;fill:#243447}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:17px;fill:#536273}
    .card{stroke-width:2.2;filter:url(#shadow)}
    .label{font-family:"Architects Daughter","Comic Mono",monospace;font-size:22px;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:14px;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:13px;fill:#102033}
    .line{stroke:#5d6f83;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1540" height="900"/>
<rect class="frame" x="32" y="28" width="1476" height="844" rx="26"/>
<text class="title" x="68" y="86">Spring Boot JDBC Demo Structure</text>
<text class="subtitle" x="72" y="120">A small product API that keeps Exposed DAO entities inside request transactions.</text>

<rect class="layer" x="64" y="154" width="1412" height="160" rx="18"/>
<text class="layerTitle" x="90" y="196">HTTP API</text>
<rect class="layer" x="64" y="364" width="1412" height="176" rx="18"/>
<text class="layerTitle" x="90" y="406">Repository and DAO model</text>
<rect class="layer" x="64" y="590" width="1412" height="188" rx="18"/>
<text class="layerTitle" x="90" y="632">Boot startup and database</text>

<path class="line" d="M330 234 H424"/>
<path class="line" d="M744 234 H838"/>
<path class="line" d="M1003 284 V416"/>
<path class="line" d="M744 452 H838"/>
<path class="line" d="M1168 452 H1262"/>
<path class="line" d="M330 702 H424"/>
<path class="line" d="M 744 696 L 878 696 Q 890 696 890 684 L 890 540"/>
<path class="line" d="M 1003 540 L 1003 628 Q 1003 640 1015 640 L 1335 640 Q 1347 640 1347 652 L 1347 660"/>

<g transform="translate(94,194)">
  <rect class="card" x="0" y="0" width="236" height="80" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="118" y="34" text-anchor="middle">HTTP Client</text>
  <text class="small" x="118" y="60" text-anchor="middle">/products endpoints</text>
</g>
<g transform="translate(424,194)">
  <rect class="card" x="0" y="0" width="320" height="80" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="160" y="34" text-anchor="middle">ProductController</text>
  <text class="small" x="160" y="60" text-anchor="middle">transaction { entity.toRecord() }</text>
</g>
<g transform="translate(838,194)">
  <rect class="card" x="0" y="0" width="330" height="90" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="165" y="34" text-anchor="middle">ProductJdbcRepository</text>
  <text class="small" x="165" y="61" text-anchor="middle">findByName, findByPriceLessThan</text>
</g>

<g transform="translate(424,416)">
  <rect class="card" x="0" y="0" width="320" height="90" rx="8" fill="#f1ecff" stroke="#8a72d6"/>
  <text class="label" x="160" y="34" text-anchor="middle">ProductRecord DTO</text>
  <text class="small" x="160" y="61" text-anchor="middle">id, name, price, stock</text>
</g>
<g transform="translate(838,416)">
  <rect class="card" x="0" y="0" width="330" height="124" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="165" y="34" text-anchor="middle">ProductEntity DAO</text>
  <text class="small" x="165" y="64" text-anchor="middle">LongEntity over Products</text>
  <text class="mono" x="165" y="92" text-anchor="middle">@ExposedEntity</text>
</g>
<g transform="translate(1262,416)">
  <rect class="card" x="0" y="0" width="170" height="124" rx="8" fill="#fff7e8" stroke="#d99a36"/>
  <text class="label" x="85" y="34" text-anchor="middle">Products</text>
  <text class="small" x="85" y="64" text-anchor="middle">LongIdTable</text>
  <text class="mono" x="85" y="92" text-anchor="middle">name price stock</text>
</g>

<g transform="translate(94,660)">
  <rect class="card" x="0" y="0" width="236" height="84" rx="8" fill="#e9f7f6" stroke="#45a7a1"/>
  <text class="label" x="118" y="34" text-anchor="middle">ExposedConfig</text>
  <text class="small" x="118" y="61" text-anchor="middle">SpringTransactionManager</text>
</g>
<g transform="translate(424,660)">
  <rect class="card" x="0" y="0" width="320" height="84" rx="8" fill="#f7eef8" stroke="#b879bd"/>
  <text class="label" x="160" y="34" text-anchor="middle">DataInitializer</text>
  <text class="small" x="160" y="61" text-anchor="middle">migration + sample products</text>
</g>
<g transform="translate(1262,660)">
  <rect class="card" x="0" y="0" width="170" height="84" rx="8" fill="#f8fbff" stroke="#6b7f93"/><image data-bluetape4k-icon="database.h2" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="112" y="34" text-anchor="middle">H2</text>
  <text class="small" x="112" y="61" text-anchor="middle">mvcdb</text>
</g>
</svg>
