<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1320" viewBox="0 0 1680 1320" role="img" aria-labelledby="title desc">
  <title id="title">Exposed BOM Dependency Management</title>
  <desc id="desc">BOM architecture rebuilt from the exposed-bom README and java-platform Gradle constraints.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1320"/>
  <rect class="decor" x="44" y="36" width="1592" height="1248" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1516" height="1024" rx="24"/>
  <text class="title" x="72" y="88">Exposed BOM Dependency Management</text>
  <text class="subtitle" x="76" y="121">Import-only Gradle java-platform BOM: dependencyManagement constraints for published Exposed modules; no runtime classes.</text>
  <g id="group-import">
    <rect class="group" x="92" y="156" width="1496" height="190" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Consumer import surface</text>
  </g>
  <g id="group-platform">
    <rect class="group" x="92" y="386" width="1496" height="190" rx="18"/>
    <text class="group-title" x="122" y="410" dominant-baseline="middle">java-platform publication</text>
  </g>
  <g id="group-managed">
    <rect class="group" x="92" y="616" width="1496" height="360" rx="18"/>
    <text class="group-title" x="122" y="640" dominant-baseline="middle">Managed published module families</text>
  </g>
  <g id="group-excluded">
    <rect class="group" x="92" y="1016" width="1496" height="190" rx="18"/>
    <text class="group-title" x="122" y="1040" dominant-baseline="middle">Excluded local modules</text>
  </g>
  <path id="route-consumer-bom" data-edge="consumer-&gt;bom" data-label="imports version platform" class="connector" d="M 485 273 L 665 273" stroke="#4F83BF"/>
  <path id="route-bom-dm" data-edge="bom-&gt;dm" data-label="publishes managed constraints" class="connector" d="M 1015 268 L 1195 268" stroke="#3E9868"/>
  <path id="route-bom-subprojects" data-edge="bom-&gt;subprojects" data-label="constraint source" class="connector" d="M 840 316 L 840 458" stroke="#755BC6"/>
  <path id="route-dm-aggregate" data-edge="dm-&gt;aggregate" data-label="aggregate BOM can consume it" class="connector" d="M 1375 316 L 1375 458" stroke="#B9851B"/>
  <path id="route-subprojects-published" data-edge="subprojects-&gt;published" data-label="filters published modules" class="connector" d="M 840 544 L 840 690" stroke="#755BC6"/>
  <g id="node-consumer" data-node="consumer" transform="translate(145,230)">
    <rect class="shape" x="0" y="0" width="340" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="170" y="24" text-anchor="middle" dominant-baseline="middle">Consumer project</text>
    <text class="detail" x="170" y="43" text-anchor="middle" dominant-baseline="middle">imports BOM</text>
    <text class="detail" x="170" y="62" text-anchor="middle" dominant-baseline="middle">omits per-module versions</text>
  </g>
  <g id="node-bom" data-node="bom" transform="translate(665,220)">
    <rect class="shape" x="0" y="0" width="350" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="175" y="29" text-anchor="middle" dominant-baseline="middle">bluetape4k-exposed-bom</text>
    <text class="detail" x="175" y="48" text-anchor="middle" dominant-baseline="middle">platform dependency</text>
    <text class="detail" x="175" y="67" text-anchor="middle" dominant-baseline="middle">version alignment entrypoint</text>
  </g>
  <g id="node-dm" data-node="dm" transform="translate(1195,220)">
    <rect class="shape" x="0" y="0" width="360" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="180" y="29" text-anchor="middle" dominant-baseline="middle">dependencyManagement</text>
    <text class="detail" x="180" y="48" text-anchor="middle" dominant-baseline="middle">constraints only</text>
    <text class="detail" x="180" y="67" text-anchor="middle" dominant-baseline="middle">no runtime classes</text>
  </g>
  <g id="node-java-platform" data-node="java-platform" transform="translate(145,458)">
    <rect class="shape" x="0" y="0" width="340" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="170" y="24" text-anchor="middle" dominant-baseline="middle">Gradle java-platform</text>
    <text class="detail" x="170" y="43" text-anchor="middle" dominant-baseline="middle">publishes POM metadata</text>
    <text class="detail" x="170" y="62" text-anchor="middle" dominant-baseline="middle">not a runtime library</text>
  </g>
  <g id="node-subprojects" data-node="subprojects" transform="translate(665,458)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">rootProject.subprojects</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">adds api constraints</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">published modules only</text>
  </g>
  <g id="node-aggregate" data-node="aggregate" transform="translate(1195,458)">
    <rect class="shape" x="0" y="0" width="360" height="86" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="24" text-anchor="middle" dominant-baseline="middle">bluetape4k-dependencies</text>
    <text class="detail" x="180" y="43" text-anchor="middle" dominant-baseline="middle">aggregate BOM can import it</text>
    <text class="detail" x="180" y="62" text-anchor="middle" dominant-baseline="middle">cross-ecosystem alignment</text>
  </g>
  <g id="node-published" data-node="published" transform="translate(665,690)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">Published Exposed modules</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">artifactId prefix:</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">bluetape4k-exposed-*</text>
  </g>
  <g id="node-core" data-node="core" transform="translate(145,800)">
    <rect class="shape" x="0" y="0" width="270" height="76" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="135" y="19" text-anchor="middle" dominant-baseline="middle">Core</text>
    <text class="detail" x="135" y="38" text-anchor="middle" dominant-baseline="middle">exposed-core</text>
    <text class="detail" x="135" y="57" text-anchor="middle" dominant-baseline="middle">exposed-dao</text>
  </g>
  <g id="node-drivers" data-node="drivers" transform="translate(465,800)">
    <rect class="shape" x="0" y="0" width="270" height="76" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="135" y="19" text-anchor="middle" dominant-baseline="middle">Drivers</text>
    <text class="detail" x="135" y="38" text-anchor="middle" dominant-baseline="middle">jdbc, r2dbc</text>
    <text class="detail" x="135" y="57" text-anchor="middle" dominant-baseline="middle">test fixtures</text>
  </g>
  <g id="node-cache" data-node="cache" transform="translate(785,800)">
    <rect class="shape" x="0" y="0" width="300" height="76" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="19" text-anchor="middle" dominant-baseline="middle">Cache</text>
    <text class="detail" x="150" y="38" text-anchor="middle" dominant-baseline="middle">cache API</text>
    <text class="detail" x="150" y="57" text-anchor="middle" dominant-baseline="middle">Caffeine, Redis variants</text>
  </g>
  <g id="node-serialization" data-node="serialization" transform="translate(1135,800)">
    <rect class="shape" x="0" y="0" width="270" height="76" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="135" y="19" text-anchor="middle" dominant-baseline="middle">Serialization</text>
    <text class="detail" x="135" y="38" text-anchor="middle" dominant-baseline="middle">Jackson 2/3</text>
    <text class="detail" x="135" y="57" text-anchor="middle" dominant-baseline="middle">Fastjson2</text>
  </g>
  <g id="node-db" data-node="db" transform="translate(145,884)">
    <rect class="shape" x="0" y="0" width="270" height="76" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="135" y="19" text-anchor="middle" dominant-baseline="middle">DB adapters</text>
    <text class="detail" x="135" y="38" text-anchor="middle" dominant-baseline="middle">SQL dialects</text>
    <text class="detail" x="135" y="57" text-anchor="middle" dominant-baseline="middle">analytics connectors</text>
  </g>
  <g id="node-spring" data-node="spring" transform="translate(465,884)">
    <rect class="shape" x="0" y="0" width="270" height="76" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="135" y="19" text-anchor="middle" dominant-baseline="middle">Spring Boot</text>
    <text class="detail" x="135" y="38" text-anchor="middle" dominant-baseline="middle">JDBC, R2DBC, Batch</text>
    <text class="detail" x="135" y="57" text-anchor="middle" dominant-baseline="middle">Modulith events</text>
  </g>
  <g id="node-crypto" data-node="crypto" transform="translate(785,884)">
    <rect class="shape" x="0" y="0" width="300" height="76" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="150" y="19" text-anchor="middle" dominant-baseline="middle">Crypto and values</text>
    <text class="detail" x="150" y="38" text-anchor="middle" dominant-baseline="middle">Tink, measured</text>
    <text class="detail" x="150" y="57" text-anchor="middle" dominant-baseline="middle">Timefold persistence</text>
  </g>
  <g id="node-utils" data-node="utils" transform="translate(1135,884)">
    <rect class="shape" x="0" y="0" width="270" height="76" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="135" y="19" text-anchor="middle" dominant-baseline="middle">Utils</text>
    <text class="detail" x="135" y="38" text-anchor="middle" dominant-baseline="middle">exposed-batch</text>
    <text class="detail" x="135" y="57" text-anchor="middle" dominant-baseline="middle">shared helpers</text>
  </g>
  <g id="node-examples" data-node="examples" transform="translate(160,1084)">
    <rect class="shape" x="0" y="0" width="285" height="82" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="142.5" y="22" text-anchor="middle" dominant-baseline="middle">examples/*</text>
    <text class="detail" x="142.5" y="41" text-anchor="middle" dominant-baseline="middle">not published</text>
    <text class="detail" x="142.5" y="60" text-anchor="middle" dominant-baseline="middle">not constrained</text>
  </g>
  <g id="node-demos" data-node="demos" transform="translate(505,1084)">
    <rect class="shape" x="0" y="0" width="285" height="82" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="142.5" y="22" text-anchor="middle" dominant-baseline="middle">*-demo modules</text>
    <text class="detail" x="142.5" y="41" text-anchor="middle" dominant-baseline="middle">sample apps</text>
    <text class="detail" x="142.5" y="60" text-anchor="middle" dominant-baseline="middle">excluded by name</text>
  </g>
  <g id="node-benchmarks" data-node="benchmarks" transform="translate(850,1084)">
    <rect class="shape" x="0" y="0" width="320" height="82" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="160" y="22" text-anchor="middle" dominant-baseline="middle">benchmark modules</text>
    <text class="detail" x="160" y="41" text-anchor="middle" dominant-baseline="middle">benchmark path</text>
    <text class="detail" x="160" y="60" text-anchor="middle" dominant-baseline="middle">*-benchmark suffix</text>
  </g>
  <g id="node-rule" data-node="rule" transform="translate(1230,1084)">
    <rect class="shape" x="0" y="0" width="285" height="82" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="142.5" y="31.5" text-anchor="middle" dominant-baseline="middle">Exclusion rule</text>
    <text class="detail" x="142.5" y="50.5" text-anchor="middle" dominant-baseline="middle">keeps BOM import surface clean</text>
  </g>
  <g transform="translate(76,1228)" data-footer="repository-project-module">
    <rect class="pill" x="0" y="0" width="1528" height="48" rx="10"/>
    <text class="small" x="764" y="18" text-anchor="middle" dominant-baseline="middle">Import bluetape4k-exposed-bom once, then declare managed bluetape4k-exposed-* dependencies without per-module versions.</text>
    <text class="small" x="764" y="35" text-anchor="middle" dominant-baseline="middle">Examples, demo apps, and benchmark modules stay outside the published BOM constraints.</text>
  </g>
</svg>
