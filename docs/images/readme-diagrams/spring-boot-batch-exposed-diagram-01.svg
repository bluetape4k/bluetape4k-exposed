<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Spring Batch Exposed Integration Map</title>
  <desc id="desc">Architecture map for exposed-spring-boot-batch showing auto-configuration, partition orchestration, keyset reader and writer contracts, and Exposed database tables.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#b9851b" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755bc6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.lane{stroke-width:2.4}.card{fill:#fffdf8;stroke-width:2.2}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:12px}.label{font-size:12px;fill:#315664}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1120"/>
  <rect class="frame" x="36" y="30" width="1728" height="1060" rx="24"/>
  <text class="title" x="86" y="96">Spring Batch Exposed Integration Map</text>
  <text class="subtitle" x="90" y="132">Spring Batch owns job metadata and chunk transactions; this module supplies Exposed readers, writers, partitioning, and executor defaults.</text>

  <rect class="lane" x="82" y="178" width="380" height="782" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="116" y="226">Boot setup</text>
  <g transform="translate(116 282)">
    <rect class="card blue" width="312" height="132" rx="12"/>
    <text class="cardTitle code" x="156" y="34" text-anchor="middle">ExposedBatchAutoConfiguration</text>
    <text class="cardText" x="156" y="64" text-anchor="middle">after BatchAutoConfiguration</text>
    <text class="cardText" x="156" y="86" text-anchor="middle">ConditionalOnClass(Job)</text>
    <text class="cardText" x="156" y="108" text-anchor="middle">enables properties</text>
  </g>
  <g transform="translate(116 496)">
    <rect class="card blue" width="312" height="132" rx="12"/>
    <text class="cardTitle" x="156" y="34" text-anchor="middle">batchPartitionTaskExecutor</text>
    <text class="cardText" x="156" y="64" text-anchor="middle">SimpleAsyncTaskExecutor</text>
    <text class="cardText" x="156" y="86" text-anchor="middle">virtual threads by default</text>
    <text class="cardText" x="156" y="108" text-anchor="middle">concurrency limit configured</text>
  </g>

  <rect class="lane" x="512" y="178" width="380" height="782" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="546" y="226">Partition job</text>
  <g transform="translate(546 282)">
    <rect class="card green" width="312" height="112" rx="12"/>
    <text class="cardTitle type" x="156" y="34" text-anchor="middle">partitionedBatchJob()</text>
    <text class="cardText" x="156" y="64" text-anchor="middle">thin JobBuilder DSL</text>
    <text class="cardText" x="156" y="86" text-anchor="middle">caller still owns steps</text>
  </g>
  <g transform="translate(546 456)">
    <rect class="card green" width="312" height="132" rx="12"/>
    <text class="cardTitle" x="156" y="34" text-anchor="middle">ExposedRangePartitioner</text>
    <text class="cardText" x="156" y="64" text-anchor="middle">reads MIN(id), MAX(id)</text>
    <text class="cardText" x="156" y="86" text-anchor="middle">splits by gridSize</text>
    <text class="cardText" x="156" y="108" text-anchor="middle">stores minId / maxId</text>
  </g>
  <g transform="translate(546 666)">
    <rect class="card green" width="312" height="112" rx="12"/>
    <text class="cardTitle" x="156" y="34" text-anchor="middle">PartitionHandler</text>
    <text class="cardText" x="156" y="64" text-anchor="middle">runs worker Step per range</text>
    <text class="cardText" x="156" y="86" text-anchor="middle">uses provided TaskExecutor</text>
  </g>

  <rect class="lane" x="942" y="178" width="380" height="782" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="976" y="226">Worker step I/O</text>
  <g transform="translate(976 282)">
    <rect class="card gold" width="312" height="132" rx="12"/>
    <text class="cardTitle warn" x="156" y="34" text-anchor="middle">ExposedKeysetItemReader</text>
    <text class="cardText" x="156" y="64" text-anchor="middle">WHERE key &gt; lastKey</text>
    <text class="cardText" x="156" y="86" text-anchor="middle">AND key &lt;= maxId</text>
    <text class="cardText" x="156" y="108" text-anchor="middle">saves lastKey for restart</text>
  </g>
  <g transform="translate(976 474)">
    <rect class="card gold" width="312" height="150" rx="12"/>
    <text class="cardTitle" x="156" y="34" text-anchor="middle">Exposed writers</text>
    <text class="cardText" x="156" y="64" text-anchor="middle">ExposedItemWriter: batchInsert</text>
    <text class="cardText" x="156" y="86" text-anchor="middle">ExposedUpdateItemWriter: update</text>
    <text class="cardText" x="156" y="108" text-anchor="middle">ExposedUpsertItemWriter: batchUpsert</text>
    <text class="cardText" x="156" y="130" text-anchor="middle">participate in chunk transaction</text>
  </g>
  <g transform="translate(976 692)">
    <rect class="card gold" width="312" height="96" rx="12"/>
    <text class="cardTitle" x="156" y="32" text-anchor="middle">Spring Batch metadata</text>
    <text class="cardText" x="156" y="60" text-anchor="middle">ExecutionContext carries</text>
    <text class="cardText" x="156" y="80" text-anchor="middle">minId / maxId / lastKey</text>
  </g>

  <rect class="lane" x="1372" y="178" width="346" height="782" rx="18" fill="#efe9fb" stroke="#b2a1dc"/>
  <text class="laneTitle" x="1406" y="226">Exposed database</text>
  <g transform="translate(1410 298)">
    <rect class="card purple" width="270" height="170" rx="12"/>
    <image data-bluetape4k-icon="database.generic" x="115" y="20" width="40" height="40" href="data:image/svg+xml;base64,"/>
    <text class="cardTitle" x="135" y="82" text-anchor="middle">Source table</text>
    <text class="cardText" x="135" y="112" text-anchor="middle">monotonic Long key</text>
    <text class="cardText" x="135" y="134" text-anchor="middle">min/max partition source</text>
  </g>
  <g transform="translate(1410 590)">
    <rect class="card purple" width="270" height="170" rx="12"/>
    <image data-bluetape4k-icon="database.generic" x="115" y="20" width="40" height="40" href="data:image/svg+xml;base64,"/>
    <text class="cardTitle" x="135" y="82" text-anchor="middle">Target table</text>
    <text class="cardText" x="135" y="112" text-anchor="middle">insert / update / upsert</text>
    <text class="cardText" x="135" y="134" text-anchor="middle">inside Spring Batch chunk</text>
  </g>

  <path class="line lineBlue" d="M272 414 V496"/>
  <path class="line lineGreen" d="M428 562 H546"/>
  <path class="line lineGreen" d="M702 394 V456"/>
  <path class="line lineGreen" d="M702 588 V666"/>
  <path class="line lineGold" d="M858 722 H976"/>
  <path class="line linePurple" d="M 858 522 L 902 522 Q 914 522 914 510 L 914 256 Q 914 244 926 244 L 1533 244 Q 1545 244 1545 256 L 1545 298"/>
  <path class="line lineGold" d="M1288 348 H1410"/>
  <path class="line linePurple" d="M 1288 549 L 1356 549 Q 1368 549 1368 561 L 1368 663 Q 1368 675 1380 675 L 1410 675"/>
  <path class="line lineGold" d="M1132 624 V692"/>

  <text class="label" x="446" y="546">executor bean</text>
  <text class="label" x="1032" y="262">min/max query</text>
  <text class="label" x="1304" y="332">keyset pages</text>
  <text class="label" x="1302" y="532">chunk writes</text>

  <rect x="128" y="1012" width="1544" height="34" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="900" y="1034" text-anchor="middle">Do not add @EnableBatchProcessing with this module; Spring Boot batch auto-configuration should remain active.</text>
</svg>
