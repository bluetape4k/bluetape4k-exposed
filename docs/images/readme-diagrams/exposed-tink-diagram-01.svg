<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">Tink Encrypted Column Boundary</title>
  <desc id="desc">Architecture boundary for exposed-tink: table extension functions register Exposed transform column types, Tink primitives encrypt values, and the database stores ciphertext.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#b9851b" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755bc6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#758297" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/></filter>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:13px}.label{font-size:12px;fill:#315664}.lane{stroke-width:2.5}.card{fill:#fffdf8;stroke-width:2.2}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.gray{stroke:#9fb0bc}.line{fill:none;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}.lineGray{stroke:#758297;marker-end:url(#arrow-gray)}.dash{stroke-dasharray:9 7}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1120"/>
  <rect class="frame" x="42" y="34" width="1616" height="1048" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="92">Tink Encrypted Column Boundary</text>
  <text class="subtitle" x="86" y="128">Table extensions hide encryption at the Exposed column boundary; only ciphertext reaches the database.</text>

  <rect class="lane" x="92" y="168" width="1516" height="166" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="124" y="213">Application table DSL</text>
  <g transform="translate(146 234)">
    <rect class="card blue" width="430" height="72" rx="12"/>
    <text class="cardTitle code" x="215" y="29" text-anchor="middle">AEAD extensions</text>
    <text class="cardText" x="215" y="54" text-anchor="middle">tinkAeadVarChar / Binary / Blob</text>
  </g>
  <g transform="translate(634 224)">
    <rect class="card gray" width="420" height="92" rx="12"/>
    <text class="cardTitle code" x="210" y="30" text-anchor="middle">Table.registerColumn()</text>
    <text class="cardText" x="210" y="56" text-anchor="middle">validates name and length</text>
    <text class="cardText" x="210" y="76" text-anchor="middle">returns Column&lt;String|ByteArray&gt;</text>
  </g>
  <g transform="translate(1114 234)">
    <rect class="card purple" width="430" height="72" rx="12"/>
    <text class="cardTitle code" x="215" y="29" text-anchor="middle">DAEAD extensions</text>
    <text class="cardText" x="215" y="54" text-anchor="middle">tinkDaeadVarChar / Binary / Blob</text>
  </g>

  <rect class="lane" x="92" y="386" width="1516" height="230" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="124" y="431">Exposed transform columns</text>
  <g transform="translate(140 476)">
    <rect class="card green" width="378" height="96" rx="12"/>
    <text class="cardTitle code" x="189" y="30" text-anchor="middle">AEAD ColumnTypes</text>
    <text class="cardText" x="189" y="57" text-anchor="middle">VarCharColumnType, BinaryColumnType</text>
    <text class="cardText" x="189" y="77" text-anchor="middle">BlobColumnType with transformers</text>
  </g>
  <g transform="translate(660 454)">
    <rect class="card gray" width="380" height="138" rx="12"/>
    <text class="cardTitle type" x="190" y="31" text-anchor="middle">ColumnWithTransform</text>
    <line x1="0" y1="49" x2="380" y2="49" stroke="#c8d7dd"/>
    <text class="cardText" x="190" y="76" text-anchor="middle">unwrap(value) before DB write</text>
    <text class="cardText" x="190" y="98" text-anchor="middle">wrap(value) after DB read</text>
    <text class="cardText" x="190" y="120" text-anchor="middle">nullable/index stay Exposed-native</text>
  </g>
  <g transform="translate(1182 476)">
    <rect class="card purple" width="378" height="96" rx="12"/>
    <text class="cardTitle code" x="189" y="30" text-anchor="middle">DAEAD ColumnTypes</text>
    <text class="cardText" x="189" y="57" text-anchor="middle">VarCharColumnType, BinaryColumnType</text>
    <text class="cardText" x="189" y="77" text-anchor="middle">BlobColumnType with transformers</text>
  </g>

  <rect class="lane" x="92" y="668" width="1516" height="206" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="124" y="713">Tink encryption primitives</text>
  <g transform="translate(164 754)">
    <rect class="card gold" width="418" height="90" rx="12"/>
    <text class="cardTitle code" x="209" y="30" text-anchor="middle">TinkAead</text>
    <text class="cardText" x="209" y="56" text-anchor="middle">AES-GCM / ChaCha20-Poly1305</text>
    <text class="cardText warn" x="209" y="76" text-anchor="middle">new ciphertext per write</text>
  </g>
  <g transform="translate(680 750)">
    <rect class="card gold" width="340" height="98" rx="12"/>
    <text class="cardTitle" x="170" y="30" text-anchor="middle">Value formats</text>
    <text class="cardText" x="170" y="56" text-anchor="middle">String -> Base64 ciphertext</text>
    <text class="cardText" x="170" y="78" text-anchor="middle">ByteArray/Blob -> ciphertext bytes</text>
  </g>
  <g transform="translate(1118 754)">
    <rect class="card gold" width="418" height="90" rx="12"/>
    <text class="cardTitle code" x="209" y="30" text-anchor="middle">TinkDeterministicAead</text>
    <text class="cardText" x="209" y="56" text-anchor="middle">AES-256-SIV</text>
    <text class="cardText type" x="209" y="76" text-anchor="middle">same plaintext, same ciphertext</text>
  </g>

  <rect class="lane" x="92" y="926" width="1516" height="110" rx="18" fill="#edf4f8" stroke="#9fb0bc"/>
  <text class="laneTitle" x="124" y="980">Database storage</text>
  <g transform="translate(610 946)">
    <rect class="card gray" width="520" height="72" rx="12"/>
    <image data-bluetape4k-icon="database.generic" x="34" y="16" width="40" height="40" href="data:image/svg+xml;base64,"/>
    <text class="cardTitle" x="298" y="30" text-anchor="middle">Ciphertext columns</text>
    <text class="cardText" x="298" y="54" text-anchor="middle">VARCHAR, VARBINARY, and BLOB keep encrypted values only</text>
  </g>

  <path class="line lineBlue" d="M576 270 H634"/>
  <path class="line linePurple" d="M1114 270 H1054"/>
  <path class="line lineBlue" d="M 360 306 L 360 414 Q 360 426 348 426 L 342 426 Q 330 426 330 438 L 330 476"/>
  <path class="line linePurple" d="M 1330 306 L 1330 414 Q 1330 426 1342 426 L 1360 426 Q 1372 426 1372 438 L 1372 476"/>
  <path class="line lineGreen" d="M518 524 H660"/>
  <path class="line linePurple" d="M1182 524 H1040"/>
  <path class="line lineGold" d="M330 572 V754"/>
  <path class="line lineGold" d="M850 592 V750"/>
  <path class="line lineGold" d="M1372 572 V754"/>
  <path class="line lineGray" d="M850 848 V946"/>
  <text class="label" x="596" y="244">register</text>
  <text class="label" x="1076" y="244">register</text>
  <text class="label" x="542" y="508">unwrap/wrap</text>
  <text class="label" x="1058" y="508">unwrap/wrap</text>
  <text class="label" x="866" y="904">store/read</text>

  <rect x="126" y="1052" width="1448" height="24" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="850" y="1069" text-anchor="middle">Choose AEAD for non-searchable secrets and DAEAD only when equality search or indexing is required.</text>
</svg>
