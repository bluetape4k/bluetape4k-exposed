<svg xmlns="http://www.w3.org/2000/svg" width="2296" height="1632" viewBox="0 0 2296 1632" role="img" aria-label="batch exposed Sequence Flow 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2296" height="1632"/>
<rect class="frame" x="32" y="28" width="2232" height="1576" rx="28"/>
<text class="title" x="66" y="82">batch exposed Sequence Flow 2</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="198.5" text-anchor="middle">Partition Manager</text>
<text class="smallLabel" x="140" y="219.5" text-anchor="middle">Step</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1572" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="393.20000000000005" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="543.2" y="198.5" text-anchor="middle">Exposed Range</text>
<text class="smallLabel" x="543.2" y="219.5" text-anchor="middle">Partitioner</text>
<line class="lifeline" x1="543.2" y1="252" x2="543.2" y2="1572" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="796.4" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="946.4" y="198.5" text-anchor="middle">Task Executor</text>
<text class="smallLabel" x="946.4" y="219.5" text-anchor="middle">Partition Handler</text>
<line class="lifeline" x1="946.4" y1="252" x2="946.4" y2="1572" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1199.6" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1349.6" y="198.5" text-anchor="middle">Worker Step (×N</text>
<text class="smallLabel" x="1349.6" y="219.5" text-anchor="middle">VirtualThread)</text>
<line class="lifeline" x1="1349.6" y1="252" x2="1349.6" y2="1572" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1602.8" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1752.8" y="198.5" text-anchor="middle">Exposed Keyset Item</text>
<text class="smallLabel" x="1752.8" y="219.5" text-anchor="middle">Reader</text>
<line class="lifeline" x1="1752.8" y1="252" x2="1752.8" y2="1572" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2006" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2156" y="209" text-anchor="middle">ExposedItemWriter</text>
<line class="lifeline" x1="2156" y1="252" x2="2156" y2="1572" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="234.60000000000002" y="286" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="252.60000000000002" y="313" text-anchor="start">1. partition(gridSize)</text>
<path class="line" d="M140 344 L543.2 344"/>
<rect x="81.60000000000002" y="396" width="520" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="99.60000000000002" y="423" text-anchor="start">2. Map&lt;String, ExecutionContext&gt; (minId/maxId per partition)</text>
<path class="dashed" d="M543.2 454 L140 454"/>
<rect x="371.70000000000005" y="506" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="389.70000000000005" y="533" text-anchor="start">3. handle(stepSplitter, stepExecution)</text>
<path class="line" d="M140 564 L946.4 564"/>
<rect x="70" y="616" width="2156" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="643" text-anchor="start">LOOP: each partition (VirtualThread)</text>
<rect x="1017" y="684" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1035" y="711" text-anchor="start">5. execute(executionContext)</text>
<path class="line" d="M946.4 742 L1349.6 742"/>
<rect x="1323.1999999999998" y="794" width="456" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1341.1999999999998" y="821" text-anchor="start">6. open(executionContext) — sets minId/maxId/lastKey</text>
<path class="line" d="M1349.6 852 L1752.8 852"/>
<rect x="70" y="904" width="2156" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="931" text-anchor="start">LOOP: pages</text>
<rect x="1446.1999999999998" y="972" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1464.1999999999998" y="999" text-anchor="start">8. read() → T</text>
<path class="line" d="M1349.6 1030 L1752.8 1030"/>
<rect x="1540.8" y="1082" width="520" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1558.8" y="1109" text-anchor="start">9. fetchNextPage (keyset WHERE id &gt; lastKey AND id &lt;= maxId)</text>
<path class="line" d="M1752.8 1140 C1816.8 1140 1816.8 1174 1752.8 1174"/>
<rect x="1647.8" y="1212" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1665.8" y="1239" text-anchor="start">10. write(chunk)</text>
<path class="line" d="M1349.6 1270 L2156 1270"/>
<rect x="1982" y="1322" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2000" y="1349" text-anchor="start">11. batchInsert via Exposed</text>
<path class="line" d="M2156 1380 C2220 1380 2220 1414 2156 1414"/>
<rect x="1307.1999999999998" y="1452" width="488" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1325.1999999999998" y="1479" text-anchor="start">12. update(executionContext) — saves lastKey for restart</text>
<path class="line" d="M1349.6 1510 L1752.8 1510"/>
</svg>
