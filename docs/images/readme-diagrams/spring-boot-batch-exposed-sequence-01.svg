<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Partitioned Keyset Restart Flow</title>
  <desc id="desc">Flow diagram for exposed-spring-boot-batch showing range partitioning, worker step execution, keyset reader restart state, Exposed writer chunk transaction, and restart resume behavior.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b55353"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.lane{stroke-width:2.4}.card{fill:#fffdf8;stroke-width:2.2}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:12px}.label{font-size:12px;fill:#315664}.step{font-size:12px;font-weight:700}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}.bad{fill:#8b3c3c;font-weight:700}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.red{stroke:#cf8b83}.purple{stroke:#b2a1dc}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.lineRed{stroke:#b55353;marker-end:url(#arrow-red)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1260"/>
  <rect class="frame" x="36" y="30" width="1728" height="1200" rx="24"/>
  <text class="title" x="86" y="96">Partitioned Keyset Restart Flow</text>
  <text class="subtitle" x="90" y="132">Each partition receives a min/max range; the reader persists lastKey in ExecutionContext so a failed job resumes inside that range.</text>

  <rect class="lane" x="92" y="176" width="1576" height="260" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="124" y="224">Partition setup</text>
  <g transform="translate(140 282)">
    <rect class="card blue" width="270" height="100" rx="12"/>
    <text class="step" x="22" y="28">1</text>
    <text class="cardTitle code" x="145" y="34" text-anchor="middle">Launch Job</text>
    <text class="cardText" x="145" y="62" text-anchor="middle">JobRepository + params</text>
    <text class="cardText" x="145" y="82" text-anchor="middle">Spring Batch metadata</text>
  </g>
  <g transform="translate(525 282)">
    <rect class="card green" width="270" height="100" rx="12"/>
    <text class="step" x="22" y="28">2</text>
    <text class="cardTitle type" x="145" y="34" text-anchor="middle">Range partitioner</text>
    <text class="cardText" x="145" y="62" text-anchor="middle">query MIN(id), MAX(id)</text>
    <text class="cardText" x="145" y="82" text-anchor="middle">split by gridSize</text>
  </g>
  <g transform="translate(910 282)">
    <rect class="card green" width="270" height="100" rx="12"/>
    <text class="step" x="22" y="28">3</text>
    <text class="cardTitle" x="145" y="34" text-anchor="middle">ExecutionContext</text>
    <text class="cardText" x="145" y="62" text-anchor="middle">partition-N</text>
    <text class="cardText" x="145" y="82" text-anchor="middle">minId + maxId</text>
  </g>
  <g transform="translate(1295 282)">
    <rect class="card blue" width="270" height="100" rx="12"/>
    <text class="step" x="22" y="28">4</text>
    <text class="cardTitle" x="145" y="34" text-anchor="middle">PartitionHandler</text>
    <text class="cardText" x="145" y="62" text-anchor="middle">dispatch worker steps</text>
    <text class="cardText" x="145" y="82" text-anchor="middle">TaskExecutor controls parallelism</text>
  </g>

  <rect class="lane" x="92" y="498" width="1576" height="366" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="124" y="546">Worker step</text>
  <g transform="translate(140 624)">
    <rect class="card gold" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">5</text>
    <text class="cardTitle warn" x="140" y="34" text-anchor="middle">open(reader)</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">load minId / maxId</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">lastKey or minId - 1</text>
  </g>
  <g transform="translate(500 624)">
    <rect class="card gold" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">6</text>
    <text class="cardTitle" x="140" y="34" text-anchor="middle">read keyset page</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">key &gt; lastKey</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">key &lt;= maxId</text>
  </g>
  <g transform="translate(860 624)">
    <rect class="card green" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">7</text>
    <text class="cardTitle type" x="140" y="34" text-anchor="middle">process chunk</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">Spring Batch processor</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">chunk transaction active</text>
  </g>
  <g transform="translate(1220 624)">
    <rect class="card purple" width="260" height="112" rx="12"/>
    <text class="step" x="22" y="29">8</text>
    <text class="cardTitle" x="140" y="34" text-anchor="middle">Exposed writer</text>
    <text class="cardText" x="140" y="62" text-anchor="middle">batchInsert / update / upsert</text>
    <text class="cardText" x="140" y="84" text-anchor="middle">joins chunk transaction</text>
  </g>
  <g transform="translate(1220 784)">
    <rect class="card gold" width="260" height="52" rx="12"/>
    <text class="cardTitle warn" x="140" y="32" text-anchor="middle">update lastKey</text>
  </g>

  <rect class="lane" x="92" y="924" width="1576" height="176" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="124" y="972">Restart behavior</text>
  <g transform="translate(214 1004)">
    <rect class="card green" width="330" height="68" rx="12"/>
    <text class="cardTitle type" x="165" y="28" text-anchor="middle">COMPLETED partition</text>
    <text class="cardText" x="165" y="50" text-anchor="middle">no additional rows are read</text>
  </g>
  <g transform="translate(734 1004)">
    <rect class="card gold" width="330" height="68" rx="12"/>
    <text class="cardTitle warn" x="165" y="28" text-anchor="middle">FAILED then rerun</text>
    <text class="cardText" x="165" y="50" text-anchor="middle">reader resumes from lastKey</text>
  </g>
  <g transform="translate(1254 1004)">
    <rect class="card red" width="280" height="68" rx="12"/>
    <text class="cardTitle bad" x="140" y="28" text-anchor="middle">Bad key contract</text>
    <text class="cardText" x="140" y="50" text-anchor="middle">non-monotonic ids risk gaps</text>
  </g>

  <path class="line lineBlue" d="M410 332 H525"/>
  <path class="line lineGreen" d="M795 332 H910"/>
  <path class="line lineBlue" d="M1180 332 H1295"/>
  <path class="line lineGold" d="M1430 382 V554 H270 V624"/>
  <path class="line lineGold" d="M400 680 H500"/>
  <path class="line lineGreen" d="M760 680 H860"/>
  <path class="line linePurple" d="M1120 680 H1220"/>
  <path class="line lineGold" d="M1350 736 V784"/>
  <path class="line lineGold" d="M1350 836 V892 H899 V1004"/>
  <path class="line lineGreen" d="M1350 836 V892 H379 V1004"/>
  <path class="line lineRed" d="M1000 736 V892 H1394 V1004"/>

  <text class="label" x="430" y="316">job params</text>
  <text class="label" x="815" y="316">ranges</text>
  <text class="label" x="420" y="664">next item</text>
  <text class="label" x="780" y="664">chunk</text>
  <text class="label" x="1138" y="664">write</text>
  <text class="label" x="1368" y="768">ExecutionContext</text>

  <rect x="128" y="1160" width="1544" height="34" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="900" y="1182" text-anchor="middle">The reader is lock-protected for worker access, but partition parallelism should still use one reader instance per partition.</text>
</svg>
