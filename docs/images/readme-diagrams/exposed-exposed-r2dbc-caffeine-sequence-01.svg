  <text class="title" x="84" y="105.56">R2DBC Caffeine Cache Sequence</text>
  <text class="subtitle" x="86" y="146.16">Read misses enter Exposed R2DBC; write-through waits for DB; write-behind returns after queueing and close drains the tail.</text>

