<svg data-sequence-spacing-scale="1.16" xmlns="http://www.w3.org/2000/svg" width="1680" height="1832.8" viewBox="0 0 1680 1832.8" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Caffeine Cache Sequence</title>
  <desc id="desc">Sequence diagram for read-through cache hit and miss, write-through database writes, write-behind queueing, and close-time final flush in AbstractR2dbcCaffeineRepository.</desc>
