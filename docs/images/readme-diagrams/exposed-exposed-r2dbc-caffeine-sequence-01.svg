<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1580" viewBox="0 0 1680 1580" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Caffeine Cache Sequence</title>
  <desc id="desc">Sequence diagram for read-through cache hit and miss, write-through database writes, write-behind queueing, and close-time final flush in AbstractR2dbcCaffeineRepository.</desc>
  <defs>
    <marker id="arrowCall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowWork" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7e6ab8" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke-dasharray="none"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle, .role, .msg, .note, .footer { font-family: "Comic Mono", monospace; fill: #52636f; }
      .subtitle { font-size: 18px; }
      .participantText { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 20px; fill: #1f3138; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; }
      .note { font-size: 13px; fill: #40515b; }
      .footer { font-size: 14px; }
      .participant { fill: #ffffff; stroke: #8db7c2; stroke-width: 2.2; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowCall); }
      .work { fill: none; stroke: #6e8f4f; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowWork); }
      .async { fill: none; stroke: #7e6ab8; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#arrowAsync); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-linecap: round; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .alt { fill:#FFFFFF; fill-opacity:.12; stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .opt { fill: none; stroke: #7e6ab8; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .branchDivider { stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .branchHit { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.6; }
      .branchMiss { fill: #eaf4f8; stroke: #3f7d9c; stroke-width: 1.6; }
      .branchClose { fill: #f3eefb; stroke: #7e6ab8; stroke-width: 1.6; }
      .label { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; }
      .callLabel { stroke: #9cc2d1; }
      .workLabel { stroke: #b6c9a4; }
      .asyncLabel { stroke: #b9addd; }
      .returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.7; }
      .callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .workBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .asyncBadge { fill: #f3eefb; stroke: #7e6ab8; }
      .returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono", monospace; font-size: 11px; font-weight: 700; }
      .callText { fill: #2f6f8e; }
      .workText { fill: #55783f; }
      .asyncText { fill: #6d58a8; }
      .returnText { fill: #7f6038; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="1580"/>
  <rect class="frame" x="42" y="34" width="1596" height="1494" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Caffeine Cache Sequence</text>
  <text class="subtitle" x="86" y="126">Read misses enter Exposed R2DBC; write-through waits for DB; write-behind returns after queueing and close drains the tail.</text>

  <g id="participants">
    <rect class="participant" x="78" y="170" width="178" height="68" rx="10"/>
    <text class="participantText" x="167" y="198" text-anchor="middle">Caller</text>
    <text class="role" x="167" y="220" text-anchor="middle">coroutine</text>
    <rect class="participant" x="318" y="170" width="226" height="68" rx="10"/>
    <text class="participantText" x="431" y="198" text-anchor="middle">Repository</text>
    <text class="role" x="431" y="220" text-anchor="middle">R2dbcCaffeine</text>
    <rect class="participant" x="626" y="170" width="210" height="68" rx="10"/>
    <text class="participantText" x="731" y="198" text-anchor="middle">AsyncCache</text>
    <text class="role" x="731" y="220" text-anchor="middle">local Caffeine</text>
    <rect class="participant" x="918" y="170" width="212" height="68" rx="10"/>
    <text class="participantText" x="1024" y="198" text-anchor="middle">Queue</text>
    <text class="role" x="1024" y="220" text-anchor="middle">write-behind channel</text>
    <rect class="participant" x="1210" y="170" width="232" height="68" rx="10"/>
    <text class="participantText" x="1326" y="198" text-anchor="middle">Transaction</text>
    <text class="role code" x="1326" y="220" text-anchor="middle">suspendTransaction</text>
    <rect class="participant" x="1508" y="170" width="110" height="68" rx="10"/>
    <text class="participantText" x="1563" y="198" text-anchor="middle">DB</text>
    <text class="role" x="1563" y="220" text-anchor="middle">rows</text>
  </g>

  <line class="lifeline" x1="167" y1="238" x2="167" y2="1452"/>
  <line class="lifeline" x1="431" y1="238" x2="431" y2="1452"/>
  <line class="lifeline" x1="731" y1="238" x2="731" y2="1452"/>
  <line class="lifeline" x1="1024" y1="238" x2="1024" y2="1452"/>
  <line class="lifeline" x1="1326" y1="238" x2="1326" y2="1452"/>
  <line class="lifeline" x1="1563" y1="238" x2="1563" y2="1452"/>
  <rect class="activation" x="424" y="308" width="14" height="1142" rx="6"/>
  <rect class="activation" x="724" y="368" width="14" height="138" rx="6"/>
  <rect class="activation" x="1319" y="548" width="14" height="902" rx="6"/>

  <rect x="70" y="286" width="1538" height="326" rx="14" class="alt"/>
  <rect x="94" y="306" width="260" height="30" rx="15" class="branchHit"/>
  <text class="note" x="118" y="326">alt cache hit</text>
  <line class="branchDivider" x1="70" y1="462" x2="1608" y2="462"/>
  <rect x="94" y="480" width="286" height="30" rx="15" class="branchMiss"/>
  <text class="note" x="118" y="500">else cache miss</text>

  <rect x="96" y="266" width="192" height="32" rx="16" class="label callLabel"/>
  <circle cx="119" cy="282" r="12" class="badge callBadge"/><text x="119" y="286" text-anchor="middle" class="badgeText callText">1</text>
  <text x="146" y="287" class="msg callText"><tspan class="code">get(id)</tspan></text>
  <path class="call" d="M167 316 L431 316"/>

  <rect x="468" y="330" width="256" height="32" rx="16" class="label callLabel"/>
  <circle cx="491" cy="346" r="12" class="badge callBadge"/><text x="491" y="350" text-anchor="middle" class="badgeText callText">2</text>
  <text x="518" y="351" class="msg callText"><tspan class="code">cache.get(key, loader)</tspan></text>
  <path class="call" d="M431 380 L731 380"/>

  <rect x="486" y="394" width="188" height="32" rx="16" class="label returnLabel"/>
  <circle cx="509" cy="410" r="12" class="badge returnBadge"/><text x="509" y="414" text-anchor="middle" class="badgeText returnText">3</text>
  <text x="536" y="415" class="msg returnText">cached <tspan class="type">E</tspan></text>
  <path class="return" d="M731 442 L431 442"/>

  <rect x="202" y="398" width="186" height="32" rx="16" class="label returnLabel"/>
  <circle cx="225" cy="414" r="12" class="badge returnBadge"/><text x="225" y="418" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="252" y="419" class="msg returnText">return <tspan class="type">E?</tspan></text>
  <path class="return" d="M431 454 L167 454"/>

  <rect x="704" y="512" width="354" height="32" rx="16" class="label callLabel"/>
  <circle cx="727" cy="528" r="12" class="badge callBadge"/><text x="727" y="532" text-anchor="middle" class="badgeText callText">3</text>
  <text x="754" y="533" class="msg callText">loader future calls <tspan class="code">findByIdFromDb</tspan></text>
  <path class="call" d="M431 560 L1326 560"/>

  <rect x="1362" y="574" width="188" height="32" rx="16" class="label workLabel"/>
  <circle cx="1385" cy="590" r="12" class="badge workBadge"/><text x="1385" y="594" text-anchor="middle" class="badgeText workText">4</text>
  <text x="1412" y="595" class="msg workText"><tspan class="keyword">SELECT</tspan> by id</text>
  <path class="work" d="M1326 606 L1563 606"/>

  <rect x="1378" y="626" width="172" height="32" rx="16" class="label returnLabel"/>
  <circle cx="1401" cy="642" r="12" class="badge returnBadge"/><text x="1401" y="646" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="1428" y="647" class="msg returnText"><tspan class="type">ResultRow?</tspan></text>
  <path class="return" d="M1563 676 L1326 676"/>

  <rect x="688" y="628" width="284" height="32" rx="16" class="label returnLabel"/>
  <circle cx="711" cy="644" r="12" class="badge returnBadge"/><text x="711" y="648" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="738" y="649" class="msg returnText"><tspan class="code">toEntity()</tspan> and cache value</text>
  <path class="return" d="M1326 682 L431 682"/>

  <rect x="70" y="704" width="1538" height="310" rx="14" class="alt"/>
  <rect x="350" y="724" width="306" height="30" rx="15" class="branchHit"/>
  <text class="note" x="374" y="744">write-through branch</text>

  <rect x="96" y="726" width="234" height="32" rx="16" class="label callLabel"/>
  <circle cx="119" cy="742" r="12" class="badge callBadge"/><text x="119" y="746" text-anchor="middle" class="badgeText callText">7</text>
  <text x="146" y="747" class="msg callText"><tspan class="code">put(id, entity)</tspan></text>
  <path class="call" d="M167 776 L431 776"/>

  <rect x="486" y="768" width="174" height="32" rx="16" class="label callLabel"/>
  <circle cx="509" cy="784" r="12" class="badge callBadge"/><text x="509" y="788" text-anchor="middle" class="badgeText callText">8</text>
  <text x="536" y="789" class="msg callText"><tspan class="code">cache.put</tspan></text>
  <path class="call" d="M431 818 L731 818"/>

  <rect x="702" y="812" width="398" height="32" rx="16" class="label workLabel"/>
  <circle cx="725" cy="828" r="12" class="badge workBadge"/><text x="725" y="832" text-anchor="middle" class="badgeText workText">9</text>
  <text x="752" y="833" class="msg workText"><tspan class="code">writeToDb</tspan> for <tspan class="type">WRITE_THROUGH</tspan></text>
  <path class="work" d="M431 860 L1326 860"/>

  <rect x="1348" y="854" width="238" height="32" rx="16" class="label workLabel"/>
  <circle cx="1371" cy="870" r="12" class="badge workBadge"/><text x="1371" y="874" text-anchor="middle" class="badgeText workText">10</text>
  <text x="1398" y="875" class="msg workText"><tspan class="keyword">UPDATE</tspan>; maybe insert</text>
  <path class="work" d="M1326 902 L1563 902"/>

  <rect x="762" y="912" width="226" height="32" rx="16" class="label returnLabel"/>
  <circle cx="785" cy="928" r="12" class="badge returnBadge"/><text x="785" y="932" text-anchor="middle" class="badgeText returnText">11</text>
  <text x="812" y="933" class="msg returnText">DB write complete</text>
  <path class="return" d="M1326 952 L431 952"/>

  <rect x="192" y="934" width="232" height="32" rx="16" class="label returnLabel"/>
  <circle cx="215" cy="950" r="12" class="badge returnBadge"/><text x="215" y="954" text-anchor="middle" class="badgeText returnText">12</text>
  <text x="242" y="955" class="msg returnText">return after DB</text>
  <path class="return" d="M431 984 L167 984"/>

  <rect x="70" y="1036" width="1538" height="308" rx="14" class="opt"/>
  <rect x="94" y="1056" width="328" height="30" rx="15" class="branchClose"/>
  <text class="note" x="118" y="1076">write-behind branch</text>

  <rect x="494" y="1100" width="488" height="32" rx="16" class="label asyncLabel"/>
  <circle cx="517" cy="1116" r="12" class="badge asyncBadge"/><text x="517" y="1120" text-anchor="middle" class="badgeText asyncText">13</text>
  <text x="544" y="1121" class="msg asyncText"><tspan class="type">WRITE_BEHIND</tspan>: start job + <tspan class="code">send(id to entity)</tspan></text>
  <path class="async" d="M431 1150 L1024 1150"/>

  <rect x="188" y="1152" width="282" height="32" rx="16" class="label returnLabel"/>
  <circle cx="211" cy="1168" r="12" class="badge returnBadge"/><text x="211" y="1172" text-anchor="middle" class="badgeText returnText">14</text>
  <text x="238" y="1173" class="msg returnText">return after queue send</text>
  <path class="return" d="M431 1196 L167 1196"/>

  <rect x="1056" y="1174" width="226" height="32" rx="16" class="label asyncLabel"/>
  <circle cx="1079" cy="1190" r="12" class="badge asyncBadge"/><text x="1079" y="1194" text-anchor="middle" class="badgeText asyncText">15</text>
  <text x="1106" y="1195" class="msg asyncText">consumer drains batch</text>
  <path class="async" d="M1024 1228 L1326 1228"/>

  <rect x="1350" y="1226" width="244" height="32" rx="16" class="label workLabel"/>
  <circle cx="1373" cy="1242" r="12" class="badge workBadge"/><text x="1373" y="1246" text-anchor="middle" class="badgeText workText">16</text>
  <text x="1400" y="1247" class="msg workText"><tspan class="keyword">UPDATE</tspan>; client-ID insert</text>
  <path class="work" d="M1326 1272 L1563 1272"/>

  <rect x="678" y="1260" width="394" height="32" rx="16" class="label returnLabel"/>
  <circle cx="701" cy="1276" r="12" class="badge returnBadge"/><text x="701" y="1280" text-anchor="middle" class="badgeText returnText">17</text>
  <text x="728" y="1281" class="msg returnText">flush result; decrement queue depth</text>
  <path class="return" d="M1326 1314 L1024 1314"/>

  <rect x="70" y="1360" width="1538" height="84" rx="14" class="opt"/>
  <rect x="94" y="1380" width="396" height="30" rx="15" class="branchClose"/>
  <text class="note" x="118" y="1400">opt close waits for final flush</text>
  <rect x="506" y="1392" width="470" height="32" rx="16" class="label asyncLabel"/>
  <circle cx="529" cy="1408" r="12" class="badge asyncBadge"/><text x="529" y="1412" text-anchor="middle" class="badgeText asyncText">18</text>
  <text x="556" y="1413" class="msg asyncText">close channel; remaining batch in <tspan class="type">NonCancellable</tspan></text>
  <path class="async" d="M431 1450 L1326 1450"/>

  <rect x="128" y="1470" width="1424" height="42" rx="13" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
  <text class="footer" x="152" y="1496">Boundary rule: Caffeine is local only; database effects happen through Exposed R2DBC suspend transactions.</text>
</svg>
