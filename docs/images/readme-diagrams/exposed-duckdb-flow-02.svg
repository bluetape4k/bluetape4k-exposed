<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1168" viewBox="0 0 1680 1168" role="img" aria-labelledby="title desc">
  <title id="title">DuckDB Query Flow Materialization</title>
  <desc id="desc">Vertical flow diagram showing how suspendTransaction and queryFlow run blocking DuckDB JDBC work on a dispatcher, materialize queryFlow results inside the Exposed transaction, then emit items with cancellation checks.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#C94D68" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.card{filter:url(#shadow);stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .layer-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1168"/>
  <rect class="frame" x="44" y="36" width="1592" height="1096" rx="34"/>
  <text class="title" x="72" y="88">DuckDB Query Flow Materialization</text>
  <text class="subtitle" x="76" y="121">Flow is the consumer API; JDBC rows are collected inside the transaction before emission starts.</text>
  <rect class="layer" x="82" y="160" width="1516" height="172" rx="18"/><text class="layer-title" x="112" y="188" dominant-baseline="middle">1. Coroutine caller</text>
  <rect class="layer" x="82" y="374" width="1516" height="260" rx="18"/><text class="layer-title" x="112" y="402" dominant-baseline="middle">2. Blocking JDBC section</text>
  <rect class="layer" x="82" y="676" width="1516" height="268" rx="18"/><text class="layer-title" x="112" y="704" dominant-baseline="middle">3. Safe emission outside transaction</text>
  <rect class="layer" x="82" y="986" width="1516" height="110" rx="18"/><text class="layer-title" x="112" y="1014" dominant-baseline="middle">4. Reader contract</text>
  <path data-edge="caller-&gt;dispatcher" class="connector" d="M 540 260 L 660 260" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="dispatcher-&gt;transaction" class="connector" d="M 840 302 L 840 454" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="transaction-&gt;materialize" class="connector" d="M 840 544 L 840 714" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="materialize-&gt;emit" class="connector" d="M 840 774 L 840 844" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="emit-&gt;cancel" class="connector" d="M 1010 884 L 1180 884" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <g id="node-caller" data-node="caller" transform="translate(340,220)"><rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="card-title" x="100" y="28" text-anchor="middle" dominant-baseline="middle">Caller</text><text class="detail" x="100" y="54" text-anchor="middle" dominant-baseline="middle">suspend or Flow API</text></g>
  <g id="node-dispatcher" data-node="dispatcher" transform="translate(660,220)"><rect class="card" x="0" y="0" width="360" height="82" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="card-title" x="180" y="29" text-anchor="middle" dominant-baseline="middle">withContext(dispatcher)</text><text class="detail" x="180" y="56" text-anchor="middle" dominant-baseline="middle">Dispatchers.IO by default</text></g>
  <g id="node-transaction" data-node="transaction" transform="translate(620,454)"><rect class="card" x="0" y="0" width="440" height="90" rx="12" fill="#FFF3D9" stroke="#D6A441"/><image data-bluetape4k-icon="testcontainers.duckdb" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="card-title" x="220" y="29" text-anchor="middle" dominant-baseline="middle">Exposed transaction(db)</text><text class="detail" x="220" y="55" text-anchor="middle" dominant-baseline="middle">DuckDB JDBC ResultSet stays inside boundary</text><text class="detail" x="220" y="75" text-anchor="middle" dominant-baseline="middle">suspendTransaction returns block result directly</text></g>
  <g id="node-materialize" data-node="materialize" transform="translate(620,714)"><rect class="card" x="0" y="0" width="440" height="60" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="card-title" x="220" y="23" text-anchor="middle" dominant-baseline="middle">queryFlow materializes block().toList()</text><text class="detail" x="220" y="45" text-anchor="middle" dominant-baseline="middle">List is complete before transaction closes</text></g>
  <g id="node-emit" data-node="emit" transform="translate(670,844)"><rect class="card" x="0" y="0" width="340" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="card-title" x="170" y="28" text-anchor="middle" dominant-baseline="middle">Emit item by item</text><text class="detail" x="170" y="54" text-anchor="middle" dominant-baseline="middle">ensureActive before each emit</text></g>
  <g id="node-cancel" data-node="cancel" transform="translate(1180,844)"><rect class="card" x="0" y="0" width="240" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/><text class="card-title" x="120" y="28" text-anchor="middle" dominant-baseline="middle">Cancellation</text><text class="detail" x="120" y="54" text-anchor="middle" dominant-baseline="middle">propagates immediately</text></g>
  <g transform="translate(112,1030)"><rect class="constraint" x="0" y="0" width="1456" height="40" rx="10"/><text class="small" x="728" y="22" text-anchor="middle" dominant-baseline="middle">This Flow API is not row-by-row cursor streaming; use pagination or batching for very large result sets.</text></g>
</svg>
