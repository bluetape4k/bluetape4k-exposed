<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Test Support Architecture</title>
  <desc id="desc">Architecture diagram for exposed-r2dbc-tests showing test classes, coroutine helpers, TestDB dialect selection, Testcontainers, Exposed R2DBC transactions, and shared schema fixtures.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#758297"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .inner{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .layer-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1700" height="1200"/>
  <rect class="decor" x="44" y="36" width="1612" height="1128" rx="34"/>
  <rect class="inner" x="82" y="154" width="1536" height="930" rx="24"/>
  <text class="title" x="72" y="88">R2DBC Test Support Architecture</text>
  <text class="subtitle" x="76" y="121">Parameterized tests call coroutine helpers; TestDB selects a dialect and the helpers manage R2DBC transactions, cleanup, and shared fixtures.</text>

  <g id="layer-tests">
    <rect class="layer" x="92" y="150" width="1516" height="190" rx="18"/>
    <text class="layer-title" x="122" y="174" dominant-baseline="middle">Test author surface</text>
  </g>
  <g id="layer-helpers">
    <rect class="layer" x="92" y="380" width="1516" height="190" rx="18"/>
    <text class="layer-title" x="122" y="404" dominant-baseline="middle">Coroutine test helpers</text>
  </g>
  <g id="layer-runtime">
    <rect class="layer" x="92" y="610" width="1516" height="250" rx="18"/>
    <text class="layer-title" x="122" y="634" dominant-baseline="middle">Dialect selection and runtime resources</text>
  </g>
  <g id="layer-fixtures">
    <rect class="layer" x="92" y="900" width="1516" height="140" rx="18"/>
    <text class="layer-title" x="122" y="924" dominant-baseline="middle">Shared schema and data fixtures</text>
  </g>

  <path id="route-author-base" data-edge="author-&gt;base" class="connector" d="M 410 244 L 520 244" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path id="route-base-db" data-edge="base-&gt;with-db" class="connector" d="M 820 292 L 820 430" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path id="route-base-tables" data-edge="base-&gt;with-tables" class="connector" d="M 970 292 L 970 360 L 1270 360 L 1270 430" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path id="route-base-schemas" data-edge="base-&gt;with-schemas" class="connector" d="M 640 292 L 640 360 L 330 360 L 330 430" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path id="route-with-tables-db" data-edge="with-tables-&gt;with-db" class="connector" d="M 1070 478 L 1000 478" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path id="route-with-schemas-db" data-edge="with-schemas-&gt;with-db" class="connector" d="M 530 478 L 650 478" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path id="route-with-db-testdb" data-edge="with-db-&gt;testdb" class="connector" d="M 825 526 L 825 665" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path id="route-testdb-config" data-edge="config-&gt;testdb" class="connector" d="M 500 738 L 590 738" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path id="route-testdb-containers" data-edge="testdb-&gt;containers" class="connector" d="M 1100 738 L 1160 738" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path id="route-testdb-r2dbc" data-edge="testdb-&gt;r2dbc" class="connector" d="M 845 811 L 845 935" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path id="route-fixtures-tables" data-edge="fixtures-&gt;with-tables" class="connector" d="M 1290 935 L 1290 590 L 1270 590 L 1270 526" stroke="#758297" marker-end="url(#arrow-gray)"/>
  <path id="route-r2dbc-fixtures" data-edge="r2dbc-&gt;fixtures" class="connector" d="M 1020 982 L 1090 982" stroke="#758297" marker-end="url(#arrow-gray)"/>

  <g id="node-author" data-node="author" transform="translate(130,210)">
    <rect class="shape" x="0" y="0" width="280" height="84" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="140" y="24" text-anchor="middle" dominant-baseline="middle">Parameterized test</text>
    <text class="detail" x="140" y="43" text-anchor="middle" dominant-baseline="middle">@MethodSource</text>
    <text class="detail" x="140" y="62" text-anchor="middle" dominant-baseline="middle">runTest coroutine body</text>
  </g>
  <g id="node-base" data-node="base" transform="translate(520,196)">
    <rect class="shape" x="0" y="0" width="450" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="225" y="29" text-anchor="middle" dominant-baseline="middle">AbstractExposedR2dbcTest</text>
    <text class="detail" x="225" y="48" text-anchor="middle" dominant-baseline="middle">UTC timezone + faker</text>
    <text class="detail" x="225" y="67" text-anchor="middle" dominant-baseline="middle">ENABLE_DIALECTS_METHOD</text>
  </g>
  <g id="node-dialect-source" data-node="dialect-source" transform="translate(1080,210)">
    <rect class="shape" x="0" y="0" width="360" height="84" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="24" text-anchor="middle" dominant-baseline="middle">enabledDialects()</text>
    <text class="detail" x="180" y="43" text-anchor="middle" dominant-baseline="middle">H2 fast path by default</text>
    <text class="detail" x="180" y="62" text-anchor="middle" dominant-baseline="middle">env-driven CI matrix</text>
  </g>

  <g id="node-with-schemas" data-node="with-schemas" transform="translate(130,430)">
    <rect class="shape" x="0" y="0" width="400" height="92" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="200" y="27" text-anchor="middle" dominant-baseline="middle">withSchemas()</text>
    <text class="detail" x="200" y="46" text-anchor="middle" dominant-baseline="middle">create/drop schema when supported</text>
    <text class="detail" x="200" y="65" text-anchor="middle" dominant-baseline="middle">suppresses cleanup failure on test failure</text>
  </g>
  <g id="node-with-db" data-node="with-db" transform="translate(650,430)">
    <rect class="shape" x="0" y="0" width="350" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="175" y="29" text-anchor="middle" dominant-baseline="middle">withDb()</text>
    <text class="detail" x="175" y="48" text-anchor="middle" dominant-baseline="middle">per-TestDB semaphore</text>
    <text class="detail" x="175" y="67" text-anchor="middle" dominant-baseline="middle">suspendTransaction maxAttempts=1</text>
  </g>
  <g id="node-with-tables" data-node="with-tables" transform="translate(1070,430)">
    <rect class="shape" x="0" y="0" width="400" height="96" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="200" y="29" text-anchor="middle" dominant-baseline="middle">withTables()</text>
    <text class="detail" x="200" y="48" text-anchor="middle" dominant-baseline="middle">drop/create before statement</text>
    <text class="detail" x="200" y="67" text-anchor="middle" dominant-baseline="middle">drop after commit or top-level retry</text>
  </g>

  <g id="node-config" data-node="config" transform="translate(220,690)">
    <rect class="shape" x="0" y="0" width="280" height="96" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="140" y="29" text-anchor="middle" dominant-baseline="middle">TestDBConfig</text>
    <text class="detail" x="140" y="48" text-anchor="middle" dominant-baseline="middle">useFastDB</text>
    <text class="detail" x="140" y="67" text-anchor="middle" dominant-baseline="middle">useTestcontainers</text>
  </g>
  <g id="node-testdb" data-node="testdb" transform="translate(590,665)">
    <rect class="shape" x="0" y="0" width="510" height="146" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="255" y="28" text-anchor="middle" dominant-baseline="middle">TestDB</text>
    <text class="detail" x="255" y="50" text-anchor="middle" dominant-baseline="middle">H2, H2_MYSQL, H2_MARIADB, H2_PSQL</text>
    <text class="detail" x="255" y="70" text-anchor="middle" dominant-baseline="middle">MARIADB, MYSQL_V8, POSTGRESQL</text>
    <text class="detail" x="255" y="91" text-anchor="middle" dominant-baseline="middle">connect() builds R2dbcDatabaseConfig</text>
    <text class="detail" x="255" y="112" text-anchor="middle" dominant-baseline="middle">MYSQL_V5 exists but is not in enabledDialects()</text>
  </g>
  <g id="node-containers" data-node="containers" transform="translate(1160,690)">
    <rect class="shape" x="0" y="0" width="330" height="96" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="165" y="29" text-anchor="middle" dominant-baseline="middle">Containers</text>
    <text class="detail" x="165" y="48" text-anchor="middle" dominant-baseline="middle">lazy MariaDB/MySQL/Postgres</text>
    <text class="detail" x="165" y="67" text-anchor="middle" dominant-baseline="middle">prewarmed in @BeforeAll</text>
  </g>

  <g id="node-r2dbc" data-node="r2dbc" transform="translate(670,935)">
    <rect class="shape" x="0" y="0" width="350" height="84" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">Exposed R2DBC</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">R2dbcTransaction</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">SchemaUtils + DSL</text>
  </g>
  <g id="node-fixtures" data-node="fixtures" transform="translate(1090,935)">
    <rect class="shape" x="0" y="0" width="400" height="84" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="200" y="24" text-anchor="middle" dominant-baseline="middle">Shared fixtures</text>
    <text class="detail" x="200" y="43" text-anchor="middle" dominant-baseline="middle">Board, Person, Order, Bank</text>
    <text class="detail" x="200" y="62" text-anchor="middle" dominant-baseline="middle">DMLTestData and sample schemas</text>
  </g>

  <g transform="translate(76,1098)">
    <rect class="pill" x="0" y="0" width="1548" height="48" rx="10"/>
    <text class="small" x="774" y="18" text-anchor="middle" dominant-baseline="middle">Use H2 for fast feedback; set EXPOSED_TEST_DB or useFastDB=false when real R2DBC dialect coverage is required.</text>
    <text class="small" x="774" y="35" text-anchor="middle" dominant-baseline="middle">withDb serializes per TestDB, registers currentTestDB, and restores temporary configuration after each scoped call.</text>
  </g>
</svg>
