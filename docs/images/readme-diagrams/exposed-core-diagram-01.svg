<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">exposed-core Auditable UML Class Diagram</title>
  <desc id="desc">UML class diagram for AuditableIdTable, concrete auditable table bases, Auditable, and UserContext.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.12"/>
    </filter>
    <marker id="generalization-purple" viewBox="0 0 16 12" markerWidth="18" markerHeight="16" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8.5 3.7 Q 15 6 8.5 8.3 L 1 11" fill="#FFFFFF" stroke="#755BC6" stroke-width="1.5" style="stroke-dasharray:none!important" stroke-dasharray="none"/>
    </marker>
    <marker id="generalization-green" viewBox="0 0 16 12" markerWidth="18" markerHeight="16" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8.5 3.7 Q 15 6 8.5 8.3 L 1 11" fill="#FFFFFF" stroke="#3E9868" stroke-width="1.5" style="stroke-dasharray:none!important" stroke-dasharray="none"/>
    </marker>
    <marker id="dependency-teal" viewBox="0 0 12 10" markerWidth="10" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 6.5 3.2 Q 11 5 6.5 6.8 L 1 9" fill="none" stroke="#2E8F89" stroke-width="1.5" style="stroke-dasharray:none!important" stroke-dasharray="none"/>
    </marker>
    <marker id="dependency-gold" viewBox="0 0 12 10" markerWidth="10" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 6.5 3.2 Q 11 5 6.5 6.8 L 1 9" fill="none" stroke="#B9851B" stroke-width="1.5" style="stroke-dasharray:none!important" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .panel{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476}
      .uml{fill:#FBFDFF;stroke:#5F7895;stroke-width:2.2;filter:url(#shadow)}
      .uml-base{fill:#EAF7EF;stroke:#3E9868}
      .uml-concrete{fill:#F1ECFF;stroke:#755BC6}
      .uml-note{fill:#FFF5D8;stroke:#C99726}
      .uml-interface{fill:#E8F3FF;stroke:#4F83BF}
      .class-name{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo{font-family:"Comic Mono";font-size:13px;fill:#627184}
      .member{font-family:"Comic Mono";font-size:14px;fill:#34485E}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184}
      .divider{stroke:#7E92A8;stroke-width:1.3}
      .inherit{fill:none;stroke:#755BC6;stroke-width:2.4;marker-end:url(#generalization-purple);stroke-linecap:round;stroke-linejoin:round}
      .inherit-base{fill:none;stroke:#3E9868;stroke-width:2.4;marker-end:url(#generalization-green);stroke-linecap:round;stroke-linejoin:round}
      .dep{fill:none;stroke:#2E8F89;stroke-width:2.2;stroke-dasharray:7 6;stroke-linecap:round;stroke-linejoin:round}
      .note-line{fill:none;stroke:#B9851B;stroke-width:2.2;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1080"/>
  <rect class="panel" x="42" y="36" width="1416" height="1008" rx="30"/>
  <text class="title" x="72" y="88">Auditable Table UML</text>
  <text class="subtitle" x="76" y="121">Class inheritance is separated from runtime user propagation and repository update behavior.</text>

  <path id="edge-auditable-idtable-idtable" class="inherit-base" d="M750 380 L750 270"/>
  <path id="edge-int-auditable" class="inherit" d="M305 680 L305 622 Q305 610 317 610 L648 610 Q660 610 660 598 L660 520"/>
  <path id="edge-long-auditable" class="inherit" d="M750 680 L750 520"/>
  <path id="edge-uuid-auditable" class="inherit" d="M1195 680 L1195 622 Q1195 610 1183 610 L852 610 Q840 610 840 598 L840 520"/>
<path id="edge-interface-contract" class="dep" d="M425 278 L520 278 Q532 278 532 290 L532 430 Q532 442 544 442 L555 442"/>
<polyline points="545,437 555,442 545,447" fill="none" stroke="#2E8F89" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path id="edge-user-context" class="dep" d="M1080 420 L980 420 Q968 420 968 432 L968 462 Q968 474 956 474 L945 474"/>
<polyline points="955,469 945,474 955,479" fill="none" stroke="#2E8F89" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path id="edge-update-note" class="note-line" d="M405 820 L553 820 Q565 820 565 808 L565 520"/>
<polyline points="560,530 565,520 570,530" fill="none" stroke="#B9851B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g id="class-idtable" transform="translate(555 170)">
    <rect class="uml" x="0" y="0" width="390" height="100" rx="8"/>
    <text class="class-name" x="195" y="30" text-anchor="middle">IdTable&lt;ID&gt;</text>
    <line class="divider" x1="0" y1="48" x2="390" y2="48"/>
    <text class="member" x="18" y="72">+ id: Column&lt;EntityID&lt;ID&gt;&gt;</text>
  </g>

  <g id="class-auditable" transform="translate(145 205)">
    <rect class="uml uml-interface" x="0" y="0" width="280" height="150" rx="8"/>
    <text class="stereo" x="140" y="24" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="class-name" x="140" y="50" text-anchor="middle">Auditable</text>
    <line class="divider" x1="0" y1="68" x2="280" y2="68"/>
    <text class="member" x="16" y="94">+ createdBy: String</text>
    <text class="member" x="16" y="116">+ createdAt: Instant?</text>
    <text class="member" x="16" y="138">+ updatedBy / updatedAt</text>
  </g>

  <g id="class-user-context" transform="translate(1080 335)">
    <rect class="uml uml-note" x="0" y="0" width="300" height="170" rx="8"/>
    <text class="class-name" x="150" y="30" text-anchor="middle">UserContext</text>
    <line class="divider" x1="0" y1="48" x2="300" y2="48"/>
    <text class="member" x="16" y="74">+ DEFAULT_USERNAME = system</text>
    <text class="member" x="16" y="96">+ withUser(username)</text>
    <text class="member" x="16" y="118">+ withThreadLocalUser(...)</text>
    <text class="member" x="16" y="140">+ getCurrentUser(): String</text>
  </g>

  <g id="class-auditable-idtable" transform="translate(555 380)">
    <rect class="uml uml-base" x="0" y="0" width="390" height="140" rx="8"/>
    <text class="stereo" x="195" y="24" text-anchor="middle">abstract class</text>
    <text class="class-name" x="195" y="50" text-anchor="middle">AuditableIdTable&lt;ID&gt;</text>
    <line class="divider" x1="0" y1="68" x2="390" y2="68"/>
    <text class="member" x="18" y="92">+ createdBy: Column&lt;String&gt;</text>
    <text class="member" x="18" y="114">+ createdAt: Column&lt;Instant?&gt;</text>
    <text class="member" x="18" y="136">+ updatedBy / updatedAt columns</text>
  </g>

  <g id="class-int" transform="translate(130 680)">
    <rect class="uml uml-concrete" x="0" y="0" width="350" height="126" rx="8"/>
    <text class="stereo" x="175" y="24" text-anchor="middle">abstract class</text>
    <text class="class-name" x="175" y="50" text-anchor="middle">AuditableIntIdTable</text>
    <line class="divider" x1="0" y1="68" x2="350" y2="68"/>
    <text class="member" x="18" y="94">+ id: EntityID&lt;Int&gt;</text>
    <text class="member" x="18" y="116">+ primaryKey: PrimaryKey(id)</text>
  </g>

  <g id="class-long" transform="translate(575 680)">
    <rect class="uml uml-concrete" x="0" y="0" width="350" height="126" rx="8"/>
    <text class="stereo" x="175" y="24" text-anchor="middle">abstract class</text>
    <text class="class-name" x="175" y="50" text-anchor="middle">AuditableLongIdTable</text>
    <line class="divider" x1="0" y1="68" x2="350" y2="68"/>
    <text class="member" x="18" y="94">+ id: EntityID&lt;Long&gt;</text>
    <text class="member" x="18" y="116">+ primaryKey: PrimaryKey(id)</text>
  </g>

  <g id="class-uuid" transform="translate(1020 680)">
    <rect class="uml uml-concrete" x="0" y="0" width="350" height="126" rx="8"/>
    <text class="stereo" x="175" y="24" text-anchor="middle">abstract class</text>
    <text class="class-name" x="175" y="50" text-anchor="middle">AuditableUUIDTable</text>
    <line class="divider" x1="0" y1="68" x2="350" y2="68"/>
    <text class="member" x="18" y="94">+ id: EntityID&lt;UUID&gt;</text>
    <text class="member" x="18" y="116">+ clientDefault UUID.randomUUID()</text>
  </g>

  <g id="note-repository-update" transform="translate(130 820)">
    <rect class="uml uml-note" x="0" y="0" width="275" height="92" rx="8"/>
    <text class="class-name" x="137.5" y="30" text-anchor="middle">Update helpers</text>
    <line class="divider" x1="0" y1="48" x2="275" y2="48"/>
    <text class="member" x="16" y="74">set updatedBy / updatedAt</text>
  </g>

  <g transform="translate(76 970)">
    <rect x="0" y="0" width="1348" height="48" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="small" x="674" y="19" text-anchor="middle">This is a UML class diagram: solid hollow arrows mean inheritance; dashed arrows mean dependency.</text>
    <text class="small" x="674" y="36" text-anchor="middle">Auditable fields are table columns; UserContext only supplies current-user defaults.</text>
  </g>
</svg>
