<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="620" viewBox="0 0 1460 620" role="img" aria-label="Batch benchmark comparison map"><defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><style>.canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#D7E2EC;stroke-width:2}.title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Mono",Arial,sans-serif;font-size:16px;fill:#536476;font-weight:400}.label{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}.small{font-family:"Comic Mono",Arial,sans-serif;font-size:14px;fill:#536476;font-weight:400}.mono{font-family:"Comic Mono",Arial,sans-serif;font-size:13px;fill:#22344A;font-weight:400}.tiny{font-family:"Comic Mono",Arial,sans-serif;font-size:12px;fill:#536476;font-weight:400}.card{filter:url(#shadow);stroke-width:2}.line{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.axis{stroke:#B8C4D3;stroke-width:1.3}.barText{font-family:"Comic Mono",Arial,sans-serif;font-size:13px;fill:#22344A}</style></defs><rect class="canvas" width="1460" height="620"/><rect class="frame" x="34" y="28" width="1392" height="564" rx="24"/><text class="title" x="72" y="82">Batch benchmark comparison map</text><text class="subtitle" x="76" y="114">Profile, driver, and scenario structure for generated benchmark docs.</text><rect class="card" x="90" y="180" width="260" height="86" rx="14" fill="#E8F3FF" stroke="#75A9E8"/><text class="label" x="220" y="209" text-anchor="middle" dominant-baseline="middle">Benchmark</text><text class="label" x="220" y="237" text-anchor="middle" dominant-baseline="midd