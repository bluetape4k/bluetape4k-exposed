<svg data-sequence-spacing-scale="1.25" xmlns="http://www.w3.org/2000/svg" width="1680" height="2200" viewBox="0 0 1680 2200" role="img" aria-labelledby="title desc">
  <title id="title">Ktor Order Confirmation Sequence</title>
  <desc id="desc">Sequence diagram showing order lookup cache hit and miss, non-atomic Caffeine then PostgreSQL persistence, compensation invalidation on failure, and event buffer clearing only after publisher success.</desc>
  <defs>
    <marker id="seqArrow" viewBox="0 0 13.3333 13.3333" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#327d91" stroke-dasharray="none"/>
    </marker>
    <marker id="returnArrow" viewBox="0 0 13.3333 13.3333" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke-dasharray="none"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20303a" flood-opacity="0.13"/>
    </filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle, .actorTitle, .role, .seqText, .note, .footer { font-family: "Comic Mono", "Noto Sans KR", monospace; }
      .subtitle { font-size: 20px; fill: #51636f; }
      .actor { fill: #fffdf8; stroke: #8db7c2; stroke-width: 2.4; }
      .actorTitle { font-size: 20px; font-weight: 700; fill: #20323d; }
      .role { font-size: 15px; fill: #52636f; }
      .lifeline { stroke: #98a9b1; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.6; }
      .seq { fill: none; stroke: #327d91; stroke-width: 3.5; stroke-linecap: round; marker-end: url(#seqArrow); }
      .ret { fill: none; stroke: #9b7d54; stroke-width: 3; stroke-dasharray: 8 6; stroke-linecap: round; marker-end: url(#returnArrow); }
      .alt { fill: #ffffff; fill-opacity: 0.12; stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .branchDivider { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 11 7; }
      .branchHit { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.6; }
      .branchMiss { fill: #eaf4f8; stroke: #3f7d9c; stroke-width: 1.6; }
      .branchFail { fill: #fff0e8; stroke: #c2765b; stroke-width: 1.6; }
      .pill { fill: #ffffff; stroke: #9cc2d1; stroke-width: 1.6; }
      .seqText { font-size: 17px; fill: #2f6f8e; }
      .note { font-size: 17px; fill: #40515b; }
      .badge { fill: #eaf4f8; stroke: #3f7d9c; stroke-width: 1.6; }
      .badgeText { font-family: "Comic Mono", monospace; font-size: 13px; font-weight: 700; fill: #2f6f8e; }
      .footer { font-size: 18px; fill: #40515b; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="2200"/>
  <rect class="frame" x="42" y="34" width="1596" height="2124" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="94">Ktor Order Confirmation — Sequence</text>
  <text class="subtitle" x="86" y="132">Persistence returns before event handoff; failed writes invalidate Caffeine, while failed publishing retains the event.</text>

  <g id="actors">
    <rect class="actor" x="66" y="180" width="176" height="82" rx="12"/>
    <text class="actorTitle" x="154" y="214" text-anchor="middle">Client</text><text class="role" x="154" y="242" text-anchor="middle">HTTP</text>
    <rect class="actor" x="286" y="180" width="176" height="82" rx="12"/>
    <text class="actorTitle" x="374" y="214" text-anchor="middle">Routes</text><text class="role" x="374" y="242" text-anchor="middle">Ktor</text>
    <rect class="actor" x="506" y="180" width="196" height="82" rx="12"/>
    <text class="actorTitle" x="604" y="214" text-anchor="middle">CommandService</text><text class="role" x="604" y="242" text-anchor="middle">application</text>
    <rect class="actor" x="746" y="180" width="176" height="82" rx="12"/>
    <text class="actorTitle" x="834" y="214" text-anchor="middle">Repository</text><text class="role" x="834" y="242" text-anchor="middle">R2DBC</text>
    <rect class="actor" x="966" y="180" width="176" height="82" rx="12"/>
    <text class="actorTitle" x="1054" y="214" text-anchor="middle">Caffeine</text><text class="role" x="1054" y="242" text-anchor="middle">local cache</text>
    <rect class="actor" x="1186" y="180" width="176" height="82" rx="12"/>
    <text class="actorTitle" x="1274" y="214" text-anchor="middle">PostgreSQL</text><text class="role" x="1274" y="242" text-anchor="middle">DemoOrders</text>
    <rect class="actor" x="1406" y="180" width="208" height="82" rx="12"/>
    <text class="actorTitle" x="1510" y="214" text-anchor="middle">EventPublisher</text><text class="role" x="1510" y="242" text-anchor="middle">non-durable</text>
  </g>

  <line class="lifeline" x1="154" y1="262" x2="154" y2="2040"/>
  <line class="lifeline" x1="374" y1="262" x2="374" y2="2040"/>
  <line class="lifeline" x1="604" y1="262" x2="604" y2="2040"/>
  <line class="lifeline" x1="834" y1="262" x2="834" y2="2040"/>
  <line class="lifeline" x1="1054" y1="262" x2="1054" y2="2040"/>
  <line class="lifeline" x1="1274" y1="262" x2="1274" y2="2040"/>
  <line class="lifeline" x1="1510" y1="262" x2="1510" y2="2040"/>
  <rect class="activation" x="367" y="320" width="14" height="1660" rx="6"/>
  <rect class="activation" x="597" y="410" width="14" height="1480" rx="6"/>
  <rect class="activation" x="827" y="500" width="14" height="1080" rx="6"/>

  <g>
    <rect class="pill" x="174" y="296" width="192" height="38" rx="16"/><circle class="badge" cx="198" cy="315" r="12"/><text class="badgeText" x="198" y="320" text-anchor="middle">1</text><text class="seqText" x="222" y="321">POST confirm</text>
    <path class="seq call" d="M154 340 H374"/>
    <rect class="pill" x="404" y="386" width="192" height="38" rx="16"/><circle class="badge" cx="428" cy="405" r="12"/><text class="badgeText" x="428" y="410" text-anchor="middle">2</text><text class="seqText" x="452" y="411">confirm(id)</text>
    <path class="seq call" d="M374 430 H604"/>
    <rect class="pill" x="634" y="476" width="192" height="38" rx="16"/><circle class="badge" cx="658" cy="495" r="12"/><text class="badgeText" x="658" y="500" text-anchor="middle">3</text><text class="seqText" x="682" y="501">get(id)</text>
    <path class="seq call" d="M604 520 H834"/>
    <rect class="pill" x="864" y="566" width="182" height="38" rx="16"/><circle class="badge" cx="888" cy="585" r="12"/><text class="badgeText" x="888" y="590" text-anchor="middle">4</text><text class="seqText" x="912" y="591">cache.get</text>
    <path class="seq call" d="M834 610 H1054"/>
  </g>

  <rect class="alt" x="714" y="636" width="676" height="386" rx="16"/>
  <rect class="branchHit" x="734" y="650" width="170" height="36" rx="15"/><text class="note" x="756" y="675">alt cache hit</text>
  <rect class="pill" x="866" y="704" width="180" height="38" rx="16"/><circle class="badge" cx="890" cy="723" r="12"/><text class="badgeText" x="890" y="728" text-anchor="middle">5</text><text class="seqText" x="916" y="729">record</text>
  <path class="ret return" d="M1054 748 H834"/>
  <line class="branchDivider" x1="714" y1="788" x2="1390" y2="788"/>
  <rect class="branchMiss" x="734" y="802" width="184" height="36" rx="15"/><text class="note" x="756" y="827">else cache miss</text>
  <rect class="pill" x="874" y="852" width="386" height="38" rx="16"/><circle class="badge" cx="898" cy="871" r="12"/><text class="badgeText" x="898" y="876" text-anchor="middle">6</text><text class="seqText" x="926" y="877">SELECT by client UUID</text>
  <path class="seq call" d="M834 896 H1274"/>
  <rect class="pill" x="1068" y="928" width="194" height="38" rx="16"/><circle class="badge" cx="1092" cy="947" r="12"/><text class="badgeText" x="1092" y="952" text-anchor="middle">7</text><text class="seqText" x="1116" y="953">row or null</text>
  <path class="ret return" d="M1274 972 H834"/>
  <path class="seq call" d="M834 996 H1054"/>
  <text class="note" x="864" y="988">populate cache</text>

  <rect class="pill" x="626" y="1042" width="200" height="38" rx="16"/><circle class="badge" cx="650" cy="1061" r="12"/><text class="badgeText" x="650" y="1066" text-anchor="middle">8</text><text class="seqText" x="674" y="1067">put(record)</text>
  <path class="seq call" d="M604 1086 H834"/>
  <rect class="pill" x="862" y="1112" width="190" height="38" rx="16"/><circle class="badge" cx="886" cy="1131" r="12"/><text class="badgeText" x="886" y="1136" text-anchor="middle">9</text><text class="seqText" x="910" y="1137">cache.put</text>
  <path class="seq call" d="M834 1156 H1054"/>
  <text class="note" x="854" y="1184">Non-atomic boundary: local cache changes before PostgreSQL.</text>
  <rect class="pill" x="872" y="1204" width="388" height="38" rx="16"/><circle class="badge" cx="896" cy="1223" r="12"/><text class="badgeText" x="896" y="1228" text-anchor="middle">10</text><text class="seqText" x="920" y="1229">UPDATE, then client-ID INSERT</text>
  <path class="seq call" d="M834 1248 H1274"/>

  <rect class="alt" x="484" y="1278" width="906" height="342" rx="16"/>
  <rect class="branchHit" x="504" y="1292" width="222" height="36" rx="15"/><text class="note" x="526" y="1317">alt persistence success</text>
  <rect class="pill" x="862" y="1340" width="392" height="38" rx="16"/><circle class="badge" cx="886" cy="1359" r="12"/><text class="badgeText" x="886" y="1364" text-anchor="middle">11</text><text class="seqText" x="916" y="1365">database write returns</text>
  <path class="ret return" d="M1274 1384 H834"/>
  <path class="ret return" d="M834 1420 H604"/>
  <line class="branchDivider" x1="484" y1="1450" x2="1390" y2="1450"/>
  <rect class="branchFail" x="504" y="1464" width="252" height="36" rx="15"/><text class="note" x="526" y="1489">else failure + invalidate</text>
  <rect class="pill" x="628" y="1510" width="196" height="38" rx="16"/><circle class="badge" cx="652" cy="1529" r="12"/><text class="badgeText" x="652" y="1534" text-anchor="middle">12</text><text class="seqText" x="680" y="1535">invalidate(id)</text>
  <path class="seq call" d="M604 1554 H834"/>
  <path class="seq call" d="M834 1582 H1054"/>
  <text class="note" x="870" y="1574">cache invalidate</text>
  <text class="note" x="510" y="1608">Return sanitized 503 and stop; steps 13–14 are persistence-success only.</text>

  <rect class="pill" x="832" y="1642" width="408" height="38" rx="16"/><circle class="badge" cx="856" cy="1661" r="12"/><text class="badgeText" x="856" y="1666" text-anchor="middle">13</text><text class="seqText" x="882" y="1667">publish OrderConfirmed</text>
  <path class="seq call" d="M604 1686 H1510"/>

  <rect class="alt" x="264" y="1716" width="1290" height="322" rx="16"/>
  <rect class="branchHit" x="284" y="1730" width="210" height="36" rx="15"/><text class="note" x="306" y="1755">alt publisher success</text>
  <rect class="pill" x="1190" y="1780" width="300" height="38" rx="16"/><circle class="badge" cx="1214" cy="1799" r="12"/><text class="badgeText" x="1214" y="1804" text-anchor="middle">14</text><text class="seqText" x="1244" y="1805">handoff returns</text>
  <path class="ret return" d="M1510 1824 H604"/>
  <text class="note" x="622" y="1854">clear event buffer, return 200</text>
  <path class="ret return" d="M604 1872 H374"/>
  <path class="ret return" d="M374 1900 H154"/>
  <line class="branchDivider" x1="264" y1="1922" x2="1554" y2="1922"/>
  <rect class="branchFail" x="284" y="1936" width="262" height="36" rx="15"/><text class="note" x="306" y="1961">else retain event buffer</text>
  <text class="note" x="574" y="1961">sanitized 503; production needs a durable outbox or equivalent boundary</text>
  <path class="ret return" d="M604 1988 H374"/>
  <path class="ret return" d="M374 2016 H154"/>

  <rect x="90" y="2072" width="1500" height="54" rx="14" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
  <text class="footer" x="116" y="2106">Cancellation after an ambiguous database commit is reconciled with GET; repeating POST cannot recover a lost event.</text>
</svg>
