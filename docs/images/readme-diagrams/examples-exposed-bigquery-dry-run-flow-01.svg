<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">BigQuery Dry-Run Example Flow</title>
  <desc id="desc">Flow diagram for the examples-exposed-bigquery-dry-run test: H2 builds SQL locally, BigQueryContext sends a dry-run QueryRequest to a mocked BigQuery REST client, and assertions inspect captured job options.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68"/></marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity=".10"/></filter>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2.4;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#536476;font-weight:400}
      .laneTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A;font-weight:400}.cardTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B;font-weight:400}.small{font-family:"Comic Mono";font-size:12px;fill:#627184;font-weight:400}.label{font-family:"Comic Mono";font-size:12px;fill:#315664;font-weight:400}
      .lane{stroke-width:2}.card{stroke-width:2;filter:url(#shadow)}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .blue{stroke:#75A9E8}.green{stroke:#55B5AF}.gold{stroke:#D9AA4D}.red{stroke:#DB7890}.neutral{stroke:#9FB0BC}
      .lineBlue{stroke:#4F83BF;marker-end:url(#arrow-blue)}.lineGreen{stroke:#2E8F89;marker-end:url(#arrow-green)}.lineGold{stroke:#B9851B;marker-end:url(#arrow-gold)}.lineRed{stroke:#C94D68;marker-end:url(#arrow-red)}
    </style>
  </defs>
  <rect class="canvas" width="1320" height="760"/>
  <rect class="frame" x="28" y="24" width="1264" height="712" rx="26"/>
  <text class="title" x="64" y="82">BigQuery Dry-Run Example Flow</text>
  <text class="subtitle" x="68" y="112">The example validates SQL and query-job options without Google Cloud credentials.</text>

  <rect class="lane neutral" x="64" y="154" width="1192" height="416" rx="18" fill="#F0F5F8"/>
  <text class="laneTitle" x="92" y="198">Credential-free validation path</text>

  <g id="test" transform="translate(94 244)">
    <rect class="card blue" width="230" height="118" rx="12" fill="#E8F3FF"/>
    <text class="cardTitle" x="115" y="32" text-anchor="middle">Example test</text>
    <text class="detail" x="115" y="62" text-anchor="middle">creates QueryRequest slot</text>
    <text class="detail" x="115" y="82" text-anchor="middle">mocks jobs().query()</text>
    <text class="detail" x="115" y="102" text-anchor="middle">expects QueryResponse</text>
  </g>

  <g id="context" transform="translate(394 244)">
    <rect class="card green" width="230" height="118" rx="12" fill="#E9F7F6"/>
    <text class="cardTitle" x="115" y="32" text-anchor="middle">BigQueryContext</text>
    <text class="detail" x="115" y="62" text-anchor="middle">project analytics-project</text>
    <text class="detail" x="115" y="82" text-anchor="middle">dataset events</text>
    <text class="detail" x="115" y="102" text-anchor="middle">validateRawQuery()</text>
  </g>

  <g id="h2" transform="translate(394 408)">
    <rect class="card gold" width="230" height="88" rx="12" fill="#FFF3D9"/>
    <text class="cardTitle" x="115" y="32" text-anchor="middle">H2 SQL generator</text>
    <text class="detail" x="115" y="60" text-anchor="middle">PostgreSQL mode only</text>
  </g>

  <g id="request" transform="translate(700 244)">
    <rect class="card gold" width="238" height="118" rx="12" fill="#FFF7E5"/>
    <text class="cardTitle" x="119" y="32" text-anchor="middle">QueryRequest</text>
    <text class="detail" x="119" y="62" text-anchor="middle">dryRun = true</text>
    <text class="detail" x="119" y="82" text-anchor="middle">max bytes, labels, BATCH</text>
    <text class="detail" x="119" y="102" text-anchor="middle">US location, timeout</text>
  </g>

  <g id="mock" transform="translate(982 244)">
    <rect class="card red" width="244" height="118" rx="12" fill="#FDECEF"/>
    <text class="cardTitle" x="122" y="32" text-anchor="middle">Mock BigQuery REST</text>
    <text class="detail" x="122" y="62" text-anchor="middle">jobs.query(project, request)</text>
    <text class="detail" x="122" y="82" text-anchor="middle">captures request</text>
    <text class="detail" x="122" y="102" text-anchor="middle">returns jobComplete</text>
  </g>

  <g id="assertions" transform="translate(700 408)">
    <rect class="card blue" width="526" height="88" rx="12" fill="#EDF5FF"/>
    <text class="cardTitle" x="263" y="32" text-anchor="middle">Assertions</text>
    <text class="detail" x="263" y="54" text-anchor="middle">captured request carries dryRun, byte cap, labels,</text>
    <text class="detail" x="263" y="74" text-anchor="middle">priority, location, and timeout</text>
  </g>

  <path id="edge-test-context" data-edge="test-&gt;context" class="line lineBlue" d="M324 303 L394 303"/>
  <path id="edge-context-h2" data-edge="context-&gt;h2" class="line lineGold" d="M509 362 L509 408"/>
  <path id="edge-context-request" data-edge="context-&gt;request" class="line lineGreen" d="M624 303 L700 303"/>
  <path id="edge-request-mock" data-edge="request-&gt;mock" class="line lineRed" d="M938 303 L982 303"/>
  <path id="edge-mock-assertions" data-edge="mock-&gt;assertions" class="line lineRed" d="M1104 362 L1104 408"/>
  <path id="edge-request-assertions" data-edge="request-&gt;assertions" class="line lineBlue" d="M819 362 L819 408"/>
  <text class="label" x="338" y="288">builds context</text>
  <text class="label" x="532" y="386">local SQL</text>
  <text class="label" x="646" y="288">submit SQL + options</text>
  <text class="label" x="952" y="288">dry-run call</text>
  <text class="label" x="839" y="386">captured options</text>

  <rect x="96" y="638" width="1128" height="32" rx="11" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/>
  <text class="small" x="660" y="659" text-anchor="middle">Reader contract: this is a test fixture for BigQuery REST query-job option mapping, not a live BigQuery execution guide.</text>
</svg>
