<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1110" viewBox="0 0 1700 1110" role="img" aria-labelledby="title desc">
  <title id="title">ClickHouse Exposed Integration Architecture</title>
  <desc id="desc">Architecture diagram for exposed-clickhouse showing Exposed DSL usage, ClickHouse-specific dialect/table/type/function extensions, coroutine helpers, JDBC autocommit boundary, and ClickHouse server execution.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#C94D68" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .layer-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1110"/>
  <rect class="frame" x="44" y="36" width="1612" height="1038" rx="34"/>
  <text class="title" x="72" y="88">ClickHouse Exposed Integration Architecture</text>
  <text class="subtitle" x="76" y="121">A JDBC compatibility layer that keeps Exposed syntax while making ClickHouse DDL, types, functions, and autocommit behavior explicit.</text>

  <g id="layer-exposed">
    <rect class="layer" x="82" y="162" width="1536" height="178" rx="18"/>
    <text class="layer-title" x="112" y="190" dominant-baseline="middle">Application and Exposed DSL</text>
  </g>
  <g id="layer-clickhouse-api">
    <rect class="layer" x="82" y="382" width="1536" height="264" rx="18"/>
    <text class="layer-title" x="112" y="410" dominant-baseline="middle">ClickHouse-specific API surface</text>
  </g>
  <g id="layer-jdbc">
    <rect class="layer" x="82" y="688" width="1536" height="160" rx="18"/>
    <text class="layer-title" x="112" y="716" dominant-baseline="middle">JDBC execution boundary</text>
  </g>
  <g id="layer-server">
    <rect class="layer" x="82" y="890" width="1536" height="96" rx="18"/>
    <text class="layer-title" x="112" y="918" dominant-baseline="middle">ClickHouse server</text>
  </g>

  <path data-edge="app-&gt;table" class="connector" d="M 252 302 L 252 454" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="dsl-&gt;engine" class="connector" d="M 630 302 L 630 454" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="helpers-&gt;types" class="connector" d="M 1010 302 L 1010 454" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="table-&gt;engine" class="connector" d="M 445 514 L 508 514" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="engine-&gt;dialect" class="connector" d="M 630 574 L 630 728" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="types-&gt;dialect" class="connector" d="M 1056 574 L 1056 638 Q 1056 650 1044 650 L 772 650 Q 760 650 760 662 L 760 728" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="database-&gt;wrapper" class="connector" d="M 1445 574 L 1445 728" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="dialect-&gt;driver" class="connector" d="M 788 773 L 998 773" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="wrapper-&gt;driver" class="connector" d="M 1288 773 L 1245 773" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="driver-&gt;server" class="connector" d="M 1122 818 L 1122 926" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>

  <g id="node-app" data-node="app" transform="translate(122,222)">
    <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="130" y="28" text-anchor="middle" dominant-baseline="middle">Application code</text>
    <text class="detail" x="130" y="54" text-anchor="middle" dominant-baseline="middle">schema, batch insert, analytics</text>
  </g>
  <g id="node-dsl" data-node="dsl" transform="translate(500,222)">
    <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="130" y="28" text-anchor="middle" dominant-baseline="middle">Exposed DSL</text>
    <text class="detail" x="130" y="54" text-anchor="middle" dominant-baseline="middle">Table, transaction, Query</text>
  </g>
  <g id="node-helpers" data-node="helpers" transform="translate(878,222)">
    <rect class="card" x="0" y="0" width="264" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="132" y="28" text-anchor="middle" dominant-baseline="middle">Coroutine helpers</text>
    <text class="detail" x="132" y="54" text-anchor="middle" dominant-baseline="middle">suspendTransaction, queryFlow</text>
  </g>
  <g id="node-table" data-node="table" transform="translate(122,454)">
    <rect class="card" x="0" y="0" width="323" height="120" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="161.5" y="30" text-anchor="middle" dominant-baseline="middle">ClickHouseTable</text>
    <text class="detail" x="161.5" y="56" text-anchor="middle" dominant-baseline="middle">abstract Table with engine</text>
    <text class="detail" x="161.5" y="78" text-anchor="middle" dominant-baseline="middle">filters CREATE TABLE only</text>
    <text class="detail" x="161.5" y="100" text-anchor="middle" dominant-baseline="middle">sanitizes PK/FK/null clauses</text>
  </g>
  <g id="node-engine" data-node="engine" transform="translate(508,454)">
    <rect class="card" x="0" y="0" width="323" height="120" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="161.5" y="30" text-anchor="middle" dominant-baseline="middle">Engine DSL</text>
    <text class="detail" x="161.5" y="56" text-anchor="middle" dominant-baseline="middle">MergeTree variants</text>
    <text class="detail" x="161.5" y="78" text-anchor="middle" dominant-baseline="middle">ORDER BY is required</text>
    <text class="detail" x="161.5" y="100" text-anchor="middle" dominant-baseline="middle">Log, TinyLog, Memory</text>
  </g>
  <g id="node-types" data-node="types" transform="translate(894,454)">
    <rect class="card" x="0" y="0" width="323" height="120" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="161.5" y="30" text-anchor="middle" dominant-baseline="middle">Types and functions</text>
    <text class="detail" x="161.5" y="56" text-anchor="middle" dominant-baseline="middle">UInt, Date32, DateTime64</text>
    <text class="detail" x="161.5" y="78" text-anchor="middle" dominant-baseline="middle">LowCardinality, Array</text>
    <text class="detail" x="161.5" y="100" text-anchor="middle" dominant-baseline="middle">toYYYYMM, argMax, uniq</text>
  </g>
  <g id="node-database" data-node="database" transform="translate(1280,454)">
    <rect class="card" x="0" y="0" width="323" height="120" rx="12" fill="#FDECEF" stroke="#DC6B82"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="161.5" y="30" text-anchor="middle" dominant-baseline="middle">ClickHouseDatabase</text>
    <text class="detail" x="161.5" y="56" text-anchor="middle" dominant-baseline="middle">host/port/database factory</text>
    <text class="detail" x="161.5" y="78" text-anchor="middle" dominant-baseline="middle">jdbc:clickhouse URL guard</text>
    <text class="detail" x="161.5" y="100" text-anchor="middle" dominant-baseline="middle">registers dialect and metadata</text>
  </g>

  <g id="node-dialect" data-node="dialect" transform="translate(472,728)">
    <rect class="card" x="0" y="0" width="316" height="90" rx="12" fill="#FFF3D9" stroke="#D6A441"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="158" y="28" text-anchor="middle" dominant-baseline="middle">ClickHouseDialect</text>
    <text class="detail" x="158" y="54" text-anchor="middle" dominant-baseline="middle">PostgreSQL dialect base</text>
    <text class="detail" x="158" y="74" text-anchor="middle" dominant-baseline="middle">no modifyColumn support</text>
  </g>
  <g id="node-driver" data-node="driver" transform="translate(998,728)">
    <rect class="card" x="0" y="0" width="247" height="90" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="123.5" y="28" text-anchor="middle" dominant-baseline="middle">clickhouse-jdbc</text>
    <text class="detail" x="123.5" y="54" text-anchor="middle" dominant-baseline="middle">blocking JDBC driver</text>
    <text class="detail" x="123.5" y="74" text-anchor="middle" dominant-baseline="middle">HTTP/native transport</text>
  </g>
  <g id="node-wrapper" data-node="wrapper" transform="translate(1288,728)">
    <rect class="card" x="0" y="0" width="315" height="90" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="157.5" y="28" text-anchor="middle" dominant-baseline="middle">ConnectionWrapper</text>
    <text class="detail" x="157.5" y="54" text-anchor="middle" dominant-baseline="middle">autoCommit is always true</text>
    <text class="detail" x="157.5" y="74" text-anchor="middle" dominant-baseline="middle">commit/rollback are no-ops</text>
  </g>

  <g id="node-server" data-node="server" transform="translate(820,926)">
    <rect class="card" x="0" y="0" width="604" height="46" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="302" y="23" text-anchor="middle" dominant-baseline="middle">ClickHouse tables execute each statement independently</text>
  </g>

  <g transform="translate(112,1014)">
    <rect class="constraint" x="0" y="0" width="1476" height="40" rx="10"/>
    <text class="small" x="738" y="22" text-anchor="middle" dominant-baseline="middle">Use Exposed for typed SQL and schema declarations; use ClickHouse engine/order-by semantics for storage layout, idempotency, and failure recovery.</text>
  </g>
</svg>
