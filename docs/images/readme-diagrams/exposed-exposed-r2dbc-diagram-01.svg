<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1340" viewBox="0 0 1700 1340" role="img" aria-labelledby="title desc">
  <title id="title">Core R2dbcRepository Structure</title>
  <desc id="desc">R2DBC architecture rebuilt from exposed-r2dbc README, R2dbcRepository, AuditableR2dbcRepository, and SoftDeletedR2dbcRepository source.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.4" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1700" height="1340"/>
  <rect class="decor" x="44" y="36" width="1612" height="1268" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1536" height="1044" rx="24"/>
  <text class="title" x="72" y="88">Core R2dbcRepository Structure</text>
  <text class="subtitle" x="76" y="121">Coroutine repositories map IdTable rows to entities and run Exposed R2DBC calls inside suspendTransaction.</text>
  <g id="group-surface">
    <rect class="group" x="92" y="156" width="1516" height="235" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Repository implementation surface</text>
  </g>
  <g id="group-coroutines">
    <rect class="group" x="92" y="431" width="1516" height="300" rx="18"/>
    <text class="group-title" x="122" y="455" dominant-baseline="middle">Coroutine and repository method path</text>
  </g>
  <g id="group-runtime">
    <rect class="group" x="92" y="771" width="1516" height="250" rx="18"/>
    <text class="group-title" x="122" y="795" dominant-baseline="middle">Exposed R2DBC runtime and database</text>
  </g>
  <g id="group-variants">
    <rect class="group" x="92" y="1061" width="1516" height="150" rx="18"/>
    <text class="group-title" x="122" y="1085" dominant-baseline="middle">Current extensions and legacy boundary</text>
  </g>
  <path id="route-caller-repo" data-edge="caller-&gt;repo" data-label="implements and calls" class="connector" d="M 450 288 L 550 288" stroke="#4F83BF"/>
  <path id="route-repo-entity" data-edge="repo-&gt;entity" data-label="maps rows" class="connector" d="M 1000 288 L 1125 288" stroke="#2E8F89"/>
  <path id="route-caller-tx" data-edge="caller-&gt;tx" data-label="enters coroutine transaction" class="connector" d="M 290 331 L 290 535" stroke="#3E9868"/>
  <path id="route-repo-reads" data-edge="repo-&gt;reads" data-label="default read helpers" class="connector" d="M 750 351 L 750 520" stroke="#4F83BF"/>
  <path id="route-repo-writes" data-edge="repo-&gt;writes" data-label="default write helpers" class="connector" d="M 930 351 L 930 402 L 1345 402 L 1345 535" stroke="#B9851B"/>
  <path id="route-tx-dsl" data-edge="tx-&gt;dsl" data-label="runs repository calls" class="connector" d="M 355 627 L 355 740 L 760 740 L 760 835" stroke="#3E9868"/>
  <path id="route-reads-dsl" data-edge="reads-&gt;dsl" data-label="select + Flow mapping" class="connector" d="M 845 626 L 845 835" stroke="#4F83BF"/>
  <path id="route-writes-dsl" data-edge="writes-&gt;dsl" data-label="R2DBC statements" class="connector" d="M 1345 627 L 1345 740 L 935 740 L 935 835" stroke="#B9851B"/>
  <path id="route-dsl-table" data-edge="dsl-&gt;table" data-label="uses table metadata" class="connector" d="M 630 893 L 505 893" stroke="#755BC6"/>
  <path id="route-dsl-database" data-edge="dsl-&gt;database" data-label="executes R2DBC SQL" class="connector" d="M 1070 893 L 1190 893" stroke="#3E9868"/>
  <g id="node-caller" data-node="caller" transform="translate(130,245)">
    <rect class="shape" x="0" y="0" width="320" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="160" y="24" text-anchor="middle" dominant-baseline="middle">Application code</text>
    <text class="detail" x="160" y="43" text-anchor="middle" dominant-baseline="middle">suspendTransaction { ... }</text>
    <text class="detail" x="160" y="62" text-anchor="middle" dominant-baseline="middle">repo.findById / saveAll</text>
  </g>
  <g id="node-repo" data-node="repo" transform="translate(550,225)">
    <rect class="shape" x="0" y="0" width="450" height="126" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="225" y="34.5" text-anchor="middle" dominant-baseline="middle">R2dbcRepository&lt;ID, E&gt;</text>
    <text class="detail" x="225" y="53.5" text-anchor="middle" dominant-baseline="middle">table: IdTable&lt;ID&gt;</text>
    <text class="detail" x="225" y="72.5" text-anchor="middle" dominant-baseline="middle">extractId(entity)</text>
    <text class="detail" x="225" y="91.5" text-anchor="middle" dominant-baseline="middle">suspend ResultRow.toEntity()</text>
  </g>
  <g id="node-entity" data-node="entity" transform="translate(1125,236)">
    <rect class="shape" x="0" y="0" width="370" height="104" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="185" y="33" text-anchor="middle" dominant-baseline="middle">Entity mapping hook</text>
    <text class="detail" x="185" y="52" text-anchor="middle" dominant-baseline="middle">ResultRow -&gt; E</text>
    <text class="detail" x="185" y="71" text-anchor="middle" dominant-baseline="middle">implementation-owned DTO</text>
  </g>
  <g id="node-tx" data-node="tx" transform="translate(170,535)">
    <rect class="shape" x="0" y="0" width="370" height="92" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="185" y="27" text-anchor="middle" dominant-baseline="middle">suspendTransaction</text>
    <text class="detail" x="185" y="46" text-anchor="middle" dominant-baseline="middle">caller-managed boundary</text>
    <text class="detail" x="185" y="65" text-anchor="middle" dominant-baseline="middle">R2DBC transaction context</text>
  </g>
  <g id="node-reads" data-node="reads" transform="translate(650,520)">
    <rect class="shape" x="0" y="0" width="390" height="106" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="195" y="34" text-anchor="middle" dominant-baseline="middle">Read methods</text>
    <text class="detail" x="195" y="53" text-anchor="middle" dominant-baseline="middle">findById / findAll</text>
    <text class="detail" x="195" y="72" text-anchor="middle" dominant-baseline="middle">Flow&lt;E&gt; and ExposedPage&lt;E&gt;</text>
  </g>
  <g id="node-writes" data-node="writes" transform="translate(1165,535)">
    <rect class="shape" x="0" y="0" width="360" height="92" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="180" y="27" text-anchor="middle" dominant-baseline="middle">Write methods</text>
    <text class="detail" x="180" y="46" text-anchor="middle" dominant-baseline="middle">saveAll, updateById</text>
    <text class="detail" x="180" y="65" text-anchor="middle" dominant-baseline="middle">delete*, batchUpsert</text>
  </g>
  <g id="node-table" data-node="table" transform="translate(155,850)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">IdTable&lt;ID&gt;</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">repository table</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">primary key source</text>
  </g>
  <g id="node-dsl" data-node="dsl" transform="translate(630,835)">
    <rect class="shape" x="0" y="0" width="440" height="116" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="220" y="39" text-anchor="middle" dominant-baseline="middle">Exposed R2DBC DSL</text>
    <text class="detail" x="220" y="58" text-anchor="middle" dominant-baseline="middle">selectAll, update, deleteWhere</text>
    <text class="detail" x="220" y="77" text-anchor="middle" dominant-baseline="middle">batchInsert, batchUpsert</text>
  </g>
  <g id="node-database" data-node="database" transform="translate(1190,850)">
    <rect class="shape" x="0" y="0" width="350" height="86" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="175" y="24" text-anchor="middle" dominant-baseline="middle">R2DBC database</text>
    <text class="detail" x="175" y="43" text-anchor="middle" dominant-baseline="middle">non-blocking driver path</text>
    <text class="detail" x="175" y="62" text-anchor="middle" dominant-baseline="middle">H2/PostgreSQL/MySQL tested</text>
  </g>
  <g id="node-extensions" data-node="extensions" transform="translate(165,1124)">
    <rect class="shape" x="0" y="0" width="430" height="64" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="215" y="13" text-anchor="middle" dominant-baseline="middle">Current extension repositories</text>
    <text class="detail" x="215" y="32" text-anchor="middle" dominant-baseline="middle">AuditableR2dbcRepository</text>
    <text class="detail" x="215" y="51" text-anchor="middle" dominant-baseline="middle">SoftDeletedR2dbcRepository</text>
  </g>
  <g id="node-aliases" data-node="aliases" transform="translate(650,1124)">
    <rect class="shape" x="0" y="0" width="390" height="64" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="195" y="22.5" text-anchor="middle" dominant-baseline="middle">Key-type convenience interfaces</text>
    <text class="detail" x="195" y="41.5" text-anchor="middle" dominant-baseline="middle">Int, Long, Uuid, UUID, String</text>
  </g>
  <g id="node-legacy" data-node="legacy" transform="translate(1095,1124)">
    <rect class="shape" x="0" y="0" width="420" height="64" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="210" y="13" text-anchor="middle" dominant-baseline="middle">R2DBC helper APIs</text>
    <text class="detail" x="210" y="32" text-anchor="middle" dominant-baseline="middle">CTE, readable, metadata</text>
    <text class="detail" x="210" y="51" text-anchor="middle" dominant-baseline="middle">virtualThreadTransaction</text>
  </g>
  <g transform="translate(76,1248)">
    <rect class="pill" x="0" y="0" width="1548" height="48" rx="10"/>
    <text class="small" x="774" y="18" text-anchor="middle" dominant-baseline="middle">R2dbcRepository owns the table mapping and exposes suspend CRUD plus Flow reads.</text>
    <text class="small" x="774" y="35" text-anchor="middle" dominant-baseline="middle">Auditing, soft delete, CTE, readable extensions, and virtual-thread helpers stay as focused source-backed helpers.</text>
  </g>
</svg>
