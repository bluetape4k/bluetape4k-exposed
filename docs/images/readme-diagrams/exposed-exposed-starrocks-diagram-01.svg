<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-label="StarRocks Exposed Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#5B8DEF"/></marker>
  <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#45A7A1"/></marker>
  <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/></marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .layer{stroke-width:2;fill-opacity:.72}.card{stroke-width:2.1;filter:url(#shadow)}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:44px;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS";font-size:15px;fill:#536273}
    .layerLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:25px;fill:#102033}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#102033}
    .detail{font-family:"Comic Mono","Comic Sans MS";font-size:14px;fill:#536273}
    .small{font-family:"Comic Mono","Comic Sans MS";font-size:12px;fill:#536273}
    .routeBlue{stroke:#5B8DEF;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}
    .routeTeal{stroke:#45A7A1;stroke-width:3;fill:none;marker-end:url(#arrow-teal)}
    .routeAmber{stroke:#D6A441;stroke-width:3;fill:none;marker-end:url(#arrow-amber)}
    .routeGray{stroke:#758297;stroke-width:2.6;fill:none;marker-end:url(#arrow-gray)}
    .routeLabel{font-family:"Comic Mono","Comic Sans MS";font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="1800" height="1220"/>
<rect class="frame" x="36" y="32" width="1728" height="1156" rx="26"/>
<text class="title" x="72" y="88">StarRocks Exposed Architecture</text>
<text class="subtitle" x="76" y="122">Narrow local-first OLAP connector path for Exposed and StarRocks Connector/J</text>

<rect class="layer" x="88" y="180" width="1624" height="172" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="layerLabel" x="116" y="220">Application Layer</text>
<g transform="translate(210,240)">
  <rect class="card" x="0" y="0" width="330" height="82" rx="8" fill="#ffffff" stroke="#5B8DEF"/>
  <text class="label" x="165" y="37" text-anchor="middle">Kotlin Application</text>
  <text class="detail" x="165" y="60" text-anchor="middle">calls Exposed transactions</text>
</g>
<g transform="translate(720,240)">
  <rect class="card" x="0" y="0" width="330" height="82" rx="8" fill="#ffffff" stroke="#58A978"/>
  <text class="label" x="165" y="37" text-anchor="middle">Exposed DSL</text>
  <text class="detail" x="165" y="60" text-anchor="middle">query, insert, metadata usage</text>
</g>

<rect class="layer" x="88" y="412" width="1624" height="280" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="layerLabel" x="116" y="452">bluetape4k-exposed-starrocks Module</text>
<g transform="translate(148,490)">
  <rect class="card" x="0" y="0" width="300" height="122" rx="8" fill="#ffffff" stroke="#DC6B82"/>
  <text class="label" x="150" y="38" text-anchor="middle">StarRocksDatabase</text>
  <text class="detail" x="150" y="64" text-anchor="middle">registers driver and dialect</text>
  <text class="detail" x="150" y="86" text-anchor="middle">builds catalog.database URL</text>
</g>
<g transform="translate(540,490)">
  <rect class="card" x="0" y="0" width="300" height="122" rx="8" fill="#ffffff" stroke="#8A72D6"/>
  <text class="label" x="150" y="38" text-anchor="middle">StarRocksDialect</text>
  <text class="detail" x="150" y="64" text-anchor="middle">minimal MySQL wire reuse</text>
  <text class="detail" x="150" y="86" text-anchor="middle">disables unproven DDL</text>
</g>
<g transform="translate(932,490)">
  <rect class="card" x="0" y="0" width="300" height="122" rx="8" fill="#ffffff" stroke="#45A7A1"/>
  <text class="label" x="150" y="38" text-anchor="middle">DialectMetadata</text>
  <text class="detail" x="150" y="64" text-anchor="middle">keeps DatabaseMetaData</text>
  <text class="detail" x="150" y="86" text-anchor="middle">table and column discovery</text>
</g>
<g transform="translate(1324,490)">
  <rect class="card" x="0" y="0" width="300" height="122" rx="8" fill="#ffffff" stroke="#D6A441"/>
  <text class="label" x="150" y="38" text-anchor="middle">StarRocksTable</text>
  <text class="detail" x="150" y="64" text-anchor="middle">fixture-oriented OLAP DDL</text>
  <text class="detail" x="150" y="86" text-anchor="middle">replication_num = 1</text>
</g>
<g transform="translate(344,622)">
  <rect class="card" x="0" y="0" width="300" height="54" rx="8" fill="#ffffff" stroke="#B88A44"/>
  <text class="label" x="150" y="34" text-anchor="middle">ConnectionWrapper</text>
</g>
<g transform="translate(736,622)">
  <rect class="card" x="0" y="0" width="300" height="54" rx="8" fill="#ffffff" stroke="#8BA84D"/>
  <text class="label" x="150" y="34" text-anchor="middle">ConnectionOptions</text>
</g>

<rect class="layer" x="88" y="752" width="1624" height="150" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="layerLabel" x="116" y="792">JDBC Driver Layer</text>
<g transform="translate(620,810)">
  <rect class="card" x="0" y="0" width="430" height="64" rx="8" fill="#ffffff" stroke="#5B8DEF"/>
  <text class="label" x="215" y="39" text-anchor="middle">StarRocks Connector/J 1.1.1</text>
</g>

<rect class="layer" x="88" y="962" width="1624" height="150" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="layerLabel" x="116" y="1002">StarRocks Runtime Layer</text>
<g transform="translate(208,1020)">
  <rect class="card" x="0" y="0" width="330" height="64" rx="8" fill="#ffffff" stroke="#45A7A1"/>
  <text class="label" x="165" y="39" text-anchor="middle">FE Query Port 9030</text>
</g>
<g transform="translate(720,1020)">
  <rect class="card" x="0" y="0" width="330" height="64" rx="8" fill="#ffffff" stroke="#D6A441"/>
  <text class="label" x="165" y="39" text-anchor="middle">default_catalog.database</text>
</g>
<g transform="translate(1232,1020)">
  <rect class="card" x="0" y="0" width="330" height="64" rx="8" fill="#ffffff" stroke="#DC6B82"/>
  <text class="label" x="165" y="39" text-anchor="middle">OLAP Fixture Table</text>
</g>

<path class="routeBlue" d="M540 281 L720 281"/>
<text class="routeLabel" x="591" y="266">query</text>
<path class="routeGray" d="M885 322 L885 390 L298 390 L298 490"/>
<text class="routeLabel" x="590" y="378">connect/register</text>
<path class="routeGray" d="M448 548 L540 548"/>
<text class="routeLabel" x="466" y="532">dialect</text>
<path class="routeTeal" d="M840 548 L932 548"/>
<text class="routeLabel" x="860" y="532">metadata</text>
<path class="routeAmber" d="M1232 548 L1324 548"/>
<text class="routeLabel" x="1252" y="532">DDL</text>
<path class="routeGray" d="M298 612 L298 649 L344 649"/>
<path class="routeGray" d="M298 490 L298 468 L886 468 L886 622"/>
<path class="routeBlue" d="M494 676 L494 736 L835 736 L835 810"/>
<text class="routeLabel" x="630" y="722">autocommit JDBC</text>
<path class="routeBlue" d="M835 874 L835 932 L373 932 L373 1020"/>
<text class="routeLabel" x="544" y="920">jdbc:starrocks</text>
<path class="routeTeal" d="M373 1084 L373 1140 L885 1140 L885 1084"/>
<text class="routeLabel" x="570" y="1162">catalog metadata</text>
<path class="routeAmber" d="M885 1020 L885 944 L1397 944 L1397 1020"/>
<text class="routeLabel" x="1080" y="932">create/drop fixture</text>
</svg>
