<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">Timefold Score Column Families</title>
  <desc id="desc">Architecture diagram for exposed-timefold-solver-persistence showing Timefold score families, Exposed extension columns, transformer storage forms, and relational database portability.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9851b" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755bc6" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:13px}.label{font-size:12px;fill:#315664}.step{font-size:12px;font-weight:700}.lane{stroke-width:2.5}.card{fill:#fffdf8;stroke-width:2.2}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1120"/>
  <rect class="frame" x="38" y="32" width="1624" height="1056" rx="24"/>
  <text class="title" x="86" y="96">Timefold Score Column Families</text>
  <text class="subtitle" x="90" y="132">Eight Timefold Score types become typed Exposed columns backed by either BIGINT or VARCHAR storage.</text>

  <rect class="lane" x="92" y="176" width="390" height="750" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="124" y="226">Timefold Score API</text>
  <g transform="translate(128 286)">
    <rect class="card blue" width="318" height="100" rx="12"/>
    <text class="cardTitle code" x="159" y="31" text-anchor="middle">Simple family</text>
    <text class="cardText" x="159" y="58" text-anchor="middle">SimpleScore</text>
    <text class="cardText" x="159" y="78" text-anchor="middle">SimpleBigDecimalScore</text>
  </g>
  <g transform="translate(128 446)">
    <rect class="card blue" width="318" height="118" rx="12"/>
    <text class="cardTitle code" x="159" y="31" text-anchor="middle">Hard / Soft families</text>
    <text class="cardText" x="159" y="58" text-anchor="middle">HardSoftScore</text>
    <text class="cardText" x="159" y="78" text-anchor="middle">HardMediumSoftScore</text>
    <text class="cardText" x="159" y="98" text-anchor="middle">BigDecimal variants</text>
  </g>
  <g transform="translate(128 636)">
    <rect class="card blue" width="318" height="110" rx="12"/>
    <text class="cardTitle code" x="159" y="31" text-anchor="middle">Bendable family</text>
    <text class="cardText" x="159" y="58" text-anchor="middle">BendableScore</text>
    <text class="cardText" x="159" y="78" text-anchor="middle">BendableBigDecimalScore</text>
    <text class="cardText" x="159" y="98" text-anchor="middle">variable hard / soft levels</text>
  </g>

  <rect class="lane" x="548" y="176" width="390" height="750" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="580" y="226">Exposed extension columns</text>
  <g transform="translate(586 286)">
    <rect class="card green" width="314" height="100" rx="12"/>
    <text class="cardTitle type" x="157" y="31" text-anchor="middle">simpleScore()</text>
    <text class="cardText" x="157" y="58" text-anchor="middle">ColumnWithTransform</text>
    <text class="cardText" x="157" y="78" text-anchor="middle">LongColumnType</text>
  </g>
  <g transform="translate(586 446)">
    <rect class="card green" width="314" height="118" rx="12"/>
    <text class="cardTitle type" x="157" y="31" text-anchor="middle">hardSoftScore()</text>
    <text class="cardText" x="157" y="58" text-anchor="middle">hardMediumSoftScore()</text>
    <text class="cardText" x="157" y="78" text-anchor="middle">BigDecimal variants</text>
    <text class="cardText" x="157" y="98" text-anchor="middle">VarCharColumnType(length)</text>
  </g>
  <g transform="translate(586 636)">
    <rect class="card green" width="314" height="110" rx="12"/>
    <text class="cardTitle type" x="157" y="31" text-anchor="middle">bendableScore()</text>
    <text class="cardText" x="157" y="58" text-anchor="middle">bendableBigDecimalScore()</text>
    <text class="cardText" x="157" y="78" text-anchor="middle">length should fit level arrays</text>
  </g>

  <rect class="lane" x="1004" y="176" width="300" height="750" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="1036" y="226">Transformers</text>
  <g transform="translate(1030 298)">
    <rect class="card gold" width="248" height="112" rx="12"/>
    <text class="cardTitle warn" x="124" y="31" text-anchor="middle">Long storage</text>
    <text class="cardText" x="124" y="58" text-anchor="middle">unwrap: score.score()</text>
    <text class="cardText" x="124" y="78" text-anchor="middle">wrap: SimpleScore.of()</text>
    <text class="cardText" x="124" y="98" text-anchor="middle">BIGINT column</text>
  </g>
  <g transform="translate(1030 508)">
    <rect class="card gold" width="248" height="126" rx="12"/>
    <text class="cardTitle warn" x="124" y="31" text-anchor="middle">String storage</text>
    <text class="cardText" x="124" y="58" text-anchor="middle">unwrap: score.toString()</text>
    <text class="cardText" x="124" y="78" text-anchor="middle">wrap: parseScore()</text>
    <text class="cardText" x="124" y="98" text-anchor="middle">VARCHAR column</text>
    <text class="cardText" x="124" y="118" text-anchor="middle">length configurable</text>
  </g>

  <rect class="lane" x="1370" y="176" width="238" height="750" rx="18" fill="#f2edf8" stroke="#b2a1dc"/>
  <text class="laneTitle" x="1402" y="226">RDB storage</text>
  <g transform="translate(1390 354)">
    <rect class="card purple" width="198" height="138" rx="12"/>
    <image x="79" y="18" width="40" height="40" href="data:image/svg+xml;base64,"/>
    <text class="cardTitle" x="99" y="78" text-anchor="middle">Database column</text>
    <text class="cardText" x="99" y="104" text-anchor="middle">H2 / MySQL / MariaDB</text>
    <text class="cardText" x="99" y="124" text-anchor="middle">PostgreSQL test surface</text>
  </g>

  <path class="line lineBlue" d="M446 336 H586"/>
  <path class="line lineBlue" d="M446 505 H586"/>
  <path class="line lineBlue" d="M446 691 H586"/>
  <path class="line lineGreen" d="M900 336 H1030"/>
  <path class="line lineGreen" d="M900 505 H970 V571 H1030"/>
  <path class="line lineGreen" d="M900 691 H970 V598 H1030"/>
  <path class="line lineGold" d="M1278 354 H1390"/>
  <path class="line lineGold" d="M1278 571 H1340 V423 H1390"/>

  <text class="label" x="462" y="320">typed column</text>
  <text class="label" x="462" y="489">typed column</text>
  <text class="label" x="462" y="675">typed column</text>
  <text class="label" x="918" y="320">Long</text>
  <text class="label" x="918" y="489">String</text>
  <text class="label" x="1302" y="338">BIGINT</text>
  <text class="label" x="1302" y="552">VARCHAR</text>

  <rect x="122" y="986" width="1456" height="28" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="850" y="1005" text-anchor="middle">Reader contract: the module stores Timefold Score values through Exposed typed columns; SimpleScore is BIGINT, all other score families round-trip through parseable VARCHAR text.</text>
</svg>
