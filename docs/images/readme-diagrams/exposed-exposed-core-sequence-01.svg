<g data-footer="reader-contract"><rect class="note" x="110" y="1862" width="1480" height="48" rx="12"/><text class="small" x="850" y="1879" text-anchor="middle" dominant-baseline="middle">Use withUser for virtual-thread scopes; use withThreadLocalUser for coroutine or general-thread scopes.</text><text class="small" x="850" y="1896" text-anchor="middle" dominant-baseline="middle">getCurrentUser resolves ScopedValue first, then ThreadLocal, then the default system user.</text></g>
