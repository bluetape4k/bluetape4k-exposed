<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1010" viewBox="0 0 1680 1010" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Repository Capability Map</title>
  <desc id="desc">Capability map for repository contracts, optional repository extensions, SQL helpers, and lower-level R2DBC utilities.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#20303a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 19px; fill: #51636f; }
      .head { font-family: "Comic Mono", monospace; font-size: 18px; font-weight: 700; fill: #21343f; }
      .family { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 28px; fill: #21343f; }
      .text { font-family: "Comic Mono", monospace; font-size: 17px; fill: #293b46; }
      .small { font-family: "Comic Mono", monospace; font-size: 14px; fill: #52636f; }
      .grid { stroke: #d4cbc0; stroke-width: 2; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="1010"/>
  <rect class="frame" x="42" y="34" width="1596" height="938" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Repository Capability Map</text>
  <text class="subtitle" x="86" y="126">Use the repository layer for entity workflows, and opt into SQL/driver helpers only when the lower-level boundary is needed.</text>

  <g transform="translate(82 164)">
    <rect x="0" y="0" width="1516" height="696" rx="18" fill="#fffdf8" stroke="#28485a" stroke-width="3"/>
    <rect x="0" y="0" width="1516" height="62" rx="18" fill="#e4f0ed"/>
    <path d="M0 46 Q0 62 18 62 H1498 Q1516 62 1516 46 V62 H0 Z" fill="#e4f0ed"/>
    <text class="head" x="28" y="39">Reader question</text>
    <text class="head" x="350" y="39">Primary APIs</text>
    <text class="head" x="760" y="39">Returned shape</text>
    <text class="head" x="1046" y="39">Source-backed contract</text>
    <line class="grid" x1="316" y1="0" x2="316" y2="696"/>
    <line class="grid" x1="728" y1="0" x2="728" y2="696"/>
    <line class="grid" x1="1016" y1="0" x2="1016" y2="696"/>
    <line class="grid" x1="0" y1="62" x2="1516" y2="62"/>
    <line class="grid" x1="0" y1="200" x2="1516" y2="200"/>
    <line class="grid" x1="0" y1="338" x2="1516" y2="338"/>
    <line class="grid" x1="0" y1="476" x2="1516" y2="476"/>
    <line class="grid" x1="0" y1="586" x2="1516" y2="586"/>

    <g transform="translate(0 62)">
      <rect x="0" y="0" width="316" height="138" fill="#e7f1f4"/>
      <text class="family" x="26" y="48">CRUD repository</text>
      <text class="small" x="26" y="82">How do I read/write entities?</text>
      <text class="text type" x="344" y="38">R2dbcRepository&lt;ID, E&gt;</text>
      <text class="text" x="344" y="72">ID variants: <tspan class="type">Int</tspan>, <tspan class="type">Long</tspan>, <tspan class="type">UUID</tspan>, <tspan class="type">Uuid</tspan>, <tspan class="type">String</tspan></text>
      <text class="text" x="344" y="106"><tspan class="code">saveAll</tspan>, <tspan class="code">batchInsert</tspan>, <tspan class="code">batchUpsert</tspan></text>
      <text class="text" x="756" y="38">single rows: suspend</text>
      <text class="text" x="756" y="72">many rows: <tspan class="type">Flow&lt;E&gt;</tspan></text>
      <text class="text" x="1044" y="38"><tspan class="type">IdTable</tspan> defines key shape</text>
      <text class="text" x="1044" y="72"><tspan class="code">toEntity()</tspan> owns row mapping</text>
      <text class="text" x="1044" y="106"><tspan class="code">findPage</tspan> runs count + content</text>
    </g>

    <g transform="translate(0 200)">
      <rect x="0" y="0" width="316" height="138" fill="#eef4e6"/>
      <text class="family" x="26" y="48">State extensions</text>
      <text class="small" x="26" y="82">Audit or hide rows logically?</text>
      <text class="text type" x="344" y="38">AuditableR2dbcRepository</text>
      <text class="text type" x="344" y="72">SoftDeletedR2dbcRepository</text>
      <text class="text" x="756" y="38">audit-aware updates</text>
      <text class="text" x="756" y="72">active/deleted views</text>
      <text class="text" x="1044" y="38">audit columns need audited APIs</text>
      <text class="text" x="1044" y="72">base <tspan class="code">findAll</tspan> keeps all rows visible</text>
    </g>

    <g transform="translate(0 338)">
      <rect x="0" y="0" width="316" height="138" fill="#fff0d8"/>
      <text class="family" x="26" y="48">SQL composition</text>
      <text class="small" x="26" y="82">Need SQL shape beyond CRUD?</text>
      <text class="text" x="344" y="38"><tspan class="code">withCte()</tspan> / <tspan class="code">withCtes()</tspan></text>
      <text class="text code" x="344" y="72">selectImplicitAll()</text>
      <text class="text type" x="344" y="106">BatchInsertOnConflictDoNothing</text>
      <text class="text" x="756" y="38">Query wrappers</text>
      <text class="text" x="756" y="72">batch executable</text>
      <text class="text" x="1044" y="38"><tspan class="keyword">CTE</tspan> preserves binding order</text>
      <text class="text" x="1044" y="72"><tspan class="keyword">SELECT</tspan> list becomes <tspan class="keyword">SELECT *</tspan></text>
      <text class="text" x="1044" y="106">MySQL uses <tspan class="keyword">INSERT IGNORE</tspan></text>
    </g>

    <g transform="translate(0 476)">
      <rect x="0" y="0" width="316" height="110" fill="#ece8fb"/>
      <text class="family" x="26" y="44">Driver utilities</text>
      <text class="small" x="26" y="78">Need raw R2DBC access?</text>
      <text class="text" x="344" y="36"><tspan class="type">Readable</tspan>.<tspan class="code">getAs</tspan> / typed getters</text>
      <text class="text" x="344" y="70"><tspan class="code">getExposedBlob</tspan> suspend helpers</text>
      <text class="text" x="756" y="36">non-null getters fail fast</text>
      <text class="text" x="756" y="70">nullable getters return null</text>
      <text class="text" x="1044" y="36"><tspan class="type">Blob</tspan> stream uses <tspan class="type">Dispatchers.IO</tspan></text>
      <text class="text" x="1044" y="70"><tspan class="type">ByteBuffer</tspan> is sliced before read</text>
    </g>

    <g transform="translate(0 586)">
      <rect x="0" y="0" width="316" height="110" fill="#f2e7dc"/>
      <text class="family" x="26" y="44">Execution helper</text>
      <text class="small" x="26" y="78">Run through virtual threads?</text>
      <text class="text code" x="344" y="36">virtualThreadTransaction()</text>
      <text class="text code" x="344" y="70">virtualThreadTransactionAsync()</text>
      <text class="text" x="756" y="36"><tspan class="type">T</tspan> or <tspan class="type">Deferred&lt;T&gt;</tspan></text>
      <text class="text" x="1044" y="36">custom <tspan class="type">Executor</tspan> stays caller-owned</text>
      <text class="text" x="1044" y="70">shutdown executors are rejected</text>
    </g>
  </g>
</svg>
