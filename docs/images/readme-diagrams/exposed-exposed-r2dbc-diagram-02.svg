<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1320" viewBox="0 0 1760 1320" role="img" aria-labelledby="title desc">
  <title id="title">R2dbcRepository Contract Hierarchy</title>
  <desc id="desc">R2DBC repository contract hierarchy rebuilt from exposed-r2dbc repository source files and README repository sections.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.4" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1760" height="1320"/>
  <rect class="decor" x="44" y="36" width="1672" height="1260" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1596" height="1124" rx="24"/>
  <text class="title" x="72" y="88">R2dbcRepository Contract Hierarchy</text>
  <text class="subtitle" x="76" y="121">R2dbcRepository owns coroutine CRUD/query/page defaults; soft-delete and audit repositories add table-constrained operations.</text>
  <g id="group-collaborators">
    <rect class="group" x="92" y="156" width="1576" height="220" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Base collaborators and result contracts</text>
  </g>
  <g id="group-interfaces">
    <rect class="group" x="92" y="416" width="1576" height="350" rx="18"/>
    <text class="group-title" x="122" y="440" dominant-baseline="middle">Repository interfaces</text>
  </g>
  <g id="group-aliases">
    <rect class="group" x="92" y="806" width="1576" height="260" rx="18"/>
    <text class="group-title" x="122" y="830" dominant-baseline="middle">ID-specific convenience interfaces</text>
  </g>
  <g id="group-note">
    <rect class="group" x="92" y="1106" width="1576" height="150" rx="18"/>
    <text class="group-title" x="122" y="1130" dominant-baseline="middle">Reader caveat</text>
  </g>
  <path id="route-r2dbc-id-table" data-edge="r2dbc-&gt;id-table" data-label="table: IdTable&lt;ID&gt;" class="connector" d="M 705 482 L 705 380 L 310 380 L 310 327" stroke="#758297"/>
  <path id="route-r2dbc-result-row" data-edge="r2dbc-&gt;result-row" data-label="maps row to E" class="connector" d="M 800 482 L 800 327" stroke="#2E8F89"/>
  <path id="route-r2dbc-page" data-edge="r2dbc-&gt;page" data-label="findPage returns" class="connector" d="M 965 482 L 965 380 L 1115 380 L 1115 327" stroke="#4F83BF"/>
  <path id="route-soft-r2dbc" data-edge="soft-&gt;r2dbc" data-label="extends base coroutine contract" class="connector generalization" d="M 545 638 L 545 620 L 735 620 L 735 608" stroke="#2E8F89"/>
  <path id="route-auditable-r2dbc" data-edge="auditable-&gt;r2dbc" data-label="extends base coroutine contract" class="connector generalization" d="M 1225 638 L 1225 620 L 1025 620 L 1025 608" stroke="#B9851B"/>
  <path id="route-auditable-audit-context" data-edge="auditable-&gt;audit-context" data-label="sets updatedBy/updatedAt" class="connector" d="M 1380 638 L 1380 327" stroke="#B9851B"/>
  <path id="route-r2dbc-aliases-r2dbc" data-edge="r2dbc-aliases-&gt;r2dbc" data-label="specializes ID type" class="connector" d="M 880 862 L 880 608" stroke="#4F83BF"/>
  <path id="route-soft-aliases-soft" data-edge="soft-aliases-&gt;soft" data-label="specializes soft table type" class="connector" d="M 370 900 L 370 750" stroke="#2E8F89"/>
  <path id="route-audit-aliases-auditable" data-edge="audit-aliases-&gt;auditable" data-label="specializes audit table type" class="connector" d="M 1380 900 L 1380 750" stroke="#B9851B"/>
  <g id="node-id-table" data-node="id-table" transform="translate(145,245)">
    <rect class="shape" x="0" y="0" width="330" height="82" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="165" y="22" text-anchor="middle" dominant-baseline="middle">IdTable&lt;ID&gt;</text>
    <text class="detail" x="165" y="41" text-anchor="middle" dominant-baseline="middle">table primary key contract</text>
    <text class="detail" x="165" y="60" text-anchor="middle" dominant-baseline="middle">repository.table source</text>
  </g>
  <g id="node-result-row" data-node="result-row" transform="translate(530,245)">
    <rect class="shape" x="0" y="0" width="360" height="82" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="180" y="22" text-anchor="middle" dominant-baseline="middle">suspend ResultRow.toEntity()</text>
    <text class="detail" x="180" y="41" text-anchor="middle" dominant-baseline="middle">implementation mapping hook</text>
    <text class="detail" x="180" y="60" text-anchor="middle" dominant-baseline="middle">row -&gt; entity E</text>
  </g>
  <g id="node-page" data-node="page" transform="translate(955,245)">
    <rect class="shape" x="0" y="0" width="320" height="82" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="160" y="22" text-anchor="middle" dominant-baseline="middle">ExposedPage&lt;E&gt;</text>
    <text class="detail" x="160" y="41" text-anchor="middle" dominant-baseline="middle">findPage result</text>
    <text class="detail" x="160" y="60" text-anchor="middle" dominant-baseline="middle">content and totalCount</text>
  </g>
  <g id="node-audit-context" data-node="audit-context" transform="translate(1330,245)">
    <rect class="shape" x="0" y="0" width="300" height="82" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="150" y="22" text-anchor="middle" dominant-baseline="middle">Audit collaborators</text>
    <text class="detail" x="150" y="41" text-anchor="middle" dominant-baseline="middle">UserContext</text>
    <text class="detail" x="150" y="60" text-anchor="middle" dominant-baseline="middle">CurrentTimestamp</text>
  </g>
  <g id="node-r2dbc" data-node="r2dbc" transform="translate(615,482)">
    <rect class="shape" x="0" y="0" width="530" height="126" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="265" y="34.5" text-anchor="middle" dominant-baseline="middle">R2dbcRepository&lt;ID, E&gt;</text>
    <text class="detail" x="265" y="53.5" text-anchor="middle" dominant-baseline="middle">base interface</text>
    <text class="detail" x="265" y="72.5" text-anchor="middle" dominant-baseline="middle">suspend CRUD, Flow query</text>
    <text class="detail" x="265" y="91.5" text-anchor="middle" dominant-baseline="middle">batch insert/upsert and paging</text>
  </g>
  <g id="node-soft" data-node="soft" transform="translate(320,638)">
    <rect class="shape" x="0" y="0" width="450" height="112" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="225" y="27.5" text-anchor="middle" dominant-baseline="middle">SoftDeletedR2dbcRepository&lt;ID, E, T&gt;</text>
    <text class="detail" x="225" y="46.5" text-anchor="middle" dominant-baseline="middle">extends R2dbcRepository</text>
    <text class="detail" x="225" y="65.5" text-anchor="middle" dominant-baseline="middle">T: SoftDeletedIdTable&lt;ID&gt;</text>
    <text class="detail" x="225" y="84.5" text-anchor="middle" dominant-baseline="middle">active/deleted Flow filters</text>
  </g>
  <g id="node-auditable" data-node="auditable" transform="translate(990,638)">
    <rect class="shape" x="0" y="0" width="470" height="112" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="235" y="27.5" text-anchor="middle" dominant-baseline="middle">AuditableR2dbcRepository&lt;ID, E, T&gt;</text>
    <text class="detail" x="235" y="46.5" text-anchor="middle" dominant-baseline="middle">extends R2dbcRepository</text>
    <text class="detail" x="235" y="65.5" text-anchor="middle" dominant-baseline="middle">T: AuditableIdTable&lt;ID&gt;</text>
    <text class="detail" x="235" y="84.5" text-anchor="middle" dominant-baseline="middle">auditedUpdateById / All</text>
  </g>
  <g id="node-soft-aliases" data-node="soft-aliases" transform="translate(145,900)">
    <rect class="shape" x="0" y="0" width="450" height="92" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="225" y="27" text-anchor="middle" dominant-baseline="middle">SoftDeleted key aliases</text>
    <text class="detail" x="225" y="46" text-anchor="middle" dominant-baseline="middle">Int, Long, Uuid, UUID</text>
    <text class="detail" x="225" y="65" text-anchor="middle" dominant-baseline="middle">String table-bound aliases</text>
  </g>
  <g id="node-r2dbc-aliases" data-node="r2dbc-aliases" transform="translate(660,862)">
    <rect class="shape" x="0" y="0" width="440" height="92" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="220" y="27" text-anchor="middle" dominant-baseline="middle">R2dbcRepository key aliases</text>
    <text class="detail" x="220" y="46" text-anchor="middle" dominant-baseline="middle">Int, Long, Uuid, UUID</text>
    <text class="detail" x="220" y="65" text-anchor="middle" dominant-baseline="middle">String specializations</text>
  </g>
  <g id="node-audit-aliases" data-node="audit-aliases" transform="translate(1160,900)">
    <rect class="shape" x="0" y="0" width="440" height="92" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="220" y="27" text-anchor="middle" dominant-baseline="middle">Auditable key aliases</text>
    <text class="detail" x="220" y="46" text-anchor="middle" dominant-baseline="middle">Int, Long, UUID</text>
    <text class="detail" x="220" y="65" text-anchor="middle" dominant-baseline="middle">Auditable*IdTable bound</text>
  </g>
  <g id="node-caveat" data-node="caveat" transform="translate(260,1164)">
    <rect class="shape" x="0" y="0" width="1240" height="58" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="620" y="19.5" text-anchor="middle" dominant-baseline="middle">No implementation classes are hidden here</text>
    <text class="detail" x="620" y="38.5" text-anchor="middle" dominant-baseline="middle">Repository implementations are user classes that override table, extractId, and suspend ResultRow.toEntity().</text>
  </g>
</svg>
