<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1558" viewBox="0 0 1754 1558" role="img" aria-label="R2dbcRepository Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1558"/>
<rect class="frame" x="32" y="28" width="1690" height="1502" rx="28"/>
<text class="title" x="66" y="82">R2dbcRepository Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="inheritLine" d="M672 1202 C672 987 262 987 262 772"/>
<path class="inheritLine" d="M1082 1202 C1082 1016 1492 1016 1492 830"/>
<path class="inheritLine" d="M877 940 C877 683 877 683 877 426"/>
<path class="inheritLine" d="M1082 560 C1082 493 877 493 877 426"/>
<path class="inheritLine" d="M672 560 C672 493 877 493 877 426"/>
<path class="inheritLine" d="M262 560 C262 493 877 493 877 426"/>
<path class="inheritLine" d="M1492 560 C1492 493 877 493 877 426"/>
<g transform="translate(707,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">R2dbcRepository</text>
  <text class="mono" x="18" y="108">+table: IdTable~ID~</text>
<text class="mono" x="18" y="129">+extractId(entity) ID</text>
<text class="mono" x="18" y="150">+count() Long</text>
<text class="mono" x="18" y="171">+existsById(id) Boolean</text>
<text class="mono" x="18" y="192">+findById(id) E</text>
<text class="mono" x="18" y="213">+findByIdOrNull(id) E?</text>
</g>
<g transform="translate(92,568)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">AuditableR2dbcRepository</text>
  <text class="mono" x="18" y="108">+table: AuditableIdTable~ID~</text>
<text class="mono" x="18" y="129">+auditedUpdateById(id, updatedBy, ...) Int</text>
<text class="mono" x="18" y="150">+auditedUpdateAll(updatedBy, predicate,</text>
<text class="mono" x="18" y="171">...) Int</text>
</g>
<g transform="translate(502,568)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">IntR2dbcRepository</text>

</g>
<g transform="translate(912,568)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">LongR2dbcRepository</text>

</g>
<g transform="translate(1322,568)">
  <rect class="card" x="0" y="0" width="340" height="254" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Soft Deleted R2dbc</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Repository</text>
  <text class="mono" x="18" y="124">+table: SoftDeletedIdTable~ID~</text>
<text class="mono" x="18" y="145">+softDeleteById(id)</text>
<text class="mono" x="18" y="166">+restoreById(id)</text>
<text class="mono" x="18" y="187">+countActive(...) Long</text>
<text class="mono" x="18" y="208">+findActive(...) Flow~E~</text>
<text class="mono" x="18" y="229">+findDeleted(...) Flow~E~</text>
</g>
<g transform="translate(707,948)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">StringR2dbcRepository</text>

</g>
<g transform="translate(502,1210)">
  <rect class="card" x="0" y="0" width="340" height="128" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Long Auditable R2dbc</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Repository</text>

</g>
<g transform="translate(912,1210)">
  <rect class="card" x="0" y="0" width="340" height="128" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Long Soft Deleted R2dbc</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Repository</text>

</g>
</svg>
