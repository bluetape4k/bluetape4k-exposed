<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Lettuce Repository Boundary</title>
  <desc id="desc">Architecture diagram for exposed-r2dbc-lettuce showing coroutine repository calls, optional NearCache, LettuceSuspendedLoadedMap, Redis cache, and R2DBC loader/writer transactions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#327d91" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#20303a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 18px; fill: #51636f; }
      .zoneTitle { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 27px; fill: #21343f; }
      .cardTitle { font-family: "Comic Mono", monospace; font-size: 19px; font-weight: 700; fill: #20323d; }
      .cardText { font-family: "Comic Mono", monospace; font-size: 15px; fill: #33454f; }
      .small { font-family: "Comic Mono", monospace; font-size: 13px; fill: #52636f; }
      .label { font-family: "Comic Mono", monospace; font-size: 14px; fill: #315664; }
      .flow { stroke: #327d91; stroke-width: 4.3; marker-end: url(#arrow); fill: none; }
      .side { stroke: #7d6ab0; stroke-width: 4.1; marker-end: url(#arrow); fill: none; }
      .write { stroke: #8c6f33; stroke-width: 4.1; marker-end: url(#arrow); fill: none; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
    <marker id="arrow-327d91" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#327d91" stroke="#327d91" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-7d6ab0" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#7d6ab0" stroke="#7d6ab0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-8c6f33" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#8c6f33" stroke="#8c6f33" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  </defs>

  <rect class="canvas" width="1680" height="1040"/>
  <rect class="frame" x="42" y="34" width="1596" height="968" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Lettuce Repository Boundary</text>
  <text class="subtitle" x="86" y="126">A suspend repository fronts Redis with optional NearCache, then delegates cache misses and DB writes to R2DBC loader/writer transactions.</text>

  <g transform="translate(92 164)">
    <rect x="0" y="0" width="1496" height="176" rx="18" fill="#e7f1f4" stroke="#9dbbc4" stroke-width="2.5"/><image data-bluetape4k-icon="redis.icon" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="zoneTitle" x="28" y="46">Coroutine repository surface</text>
    <rect x="326" y="66" width="328" height="88" rx="14" fill="#fffdf8" stroke="#8db7c2" stroke-width="2"/>
    <text class="cardTitle" x="354" y="99">Caller coroutine</text>
    <text class="cardText" x="354" y="128"><tspan class="code">findById</tspan>, <tspan class="code">save</tspan>, <tspan class="code">delete</tspan>, <tspan class="code">clear</tspan></text>
    <rect x="772" y="66" width="430" height="88" rx="14" fill="#fffdf8" stroke="#8db7c2" stroke-width="2"/>
    <text class="cardTitle type" x="800" y="99">AbstractR2dbcLettuceRepository</text>
    <text class="cardText" x="800" y="128">implements <tspan class="type">R2dbcLettuceRepository</tspan></text>
  </g>

  <path class="flow" d="M856 340 V390" style="marker-end:url(#arrow-327d91)"/>
  <text class="label" x="878" y="370">suspend repository call</text>

  <g transform="translate(92 390)">
    <rect x="0" y="0" width="1496" height="262" rx="18" fill="#eef4e6" stroke="#a9c58b" stroke-width="2.5"/><image data-bluetape4k-icon="cache.caffeine" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="zoneTitle" x="28" y="46">Cache layer</text>
    <rect x="130" y="86" width="330" height="116" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>
    <text class="cardTitle type" x="158" y="120">Caffeine NearCache</text>
    <text class="cardText" x="158" y="150">optional local front</text>
    <text class="cardText" x="158" y="180">key = <tspan class="code">serializeKey(id)</tspan></text>

    <rect x="582" y="74" width="356" height="140" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>
    <text class="cardTitle type" x="610" y="108">LettuceSuspendedLoadedMap</text>
    <text class="cardText" x="610" y="138">Redis read/write-through map</text>
    <text class="cardText" x="610" y="168"><tspan class="type">READ_ONLY</tspan>, <tspan class="type">WRITE_THROUGH</tspan></text>
    <text class="cardText" x="610" y="198"><tspan class="type">WRITE_BEHIND</tspan> by Lettuce</text>

    <rect x="1060" y="86" width="300" height="116" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>
    <text class="cardTitle" x="1088" y="120">Redis keyspace</text>
    <text class="cardText" x="1088" y="150">remote cache back</text>
    <text class="cardText" x="1088" y="180">pattern invalidation</text>
  </g>

  <path class="side" d="M552 522 H674" style="marker-end:url(#arrow-7d6ab0)"/>
  <text class="label" x="572" y="503">miss</text>
  <path class="flow" d="M1030 534 H1152" style="marker-end:url(#arrow-327d91)"/>
  <text class="label" x="1050" y="515">Redis I/O</text>
  <path class="flow" d="M852 652 V706" style="marker-end:url(#arrow-327d91)"/>
  <text class="label" x="874" y="686">loader / writer</text>

  <g transform="translate(92 706)">
    <rect x="0" y="0" width="1496" height="178" rx="18" fill="#fff0d8" stroke="#d8ad68" stroke-width="2.5"/>
    <text class="zoneTitle" x="28" y="46">R2DBC persistence boundary</text>
    <rect x="170" y="76" width="356" height="72" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle code" x="198" y="108">R2dbcExposedEntityMapLoader</text>
    <text class="cardText" x="198" y="134"><tspan class="keyword">SELECT</tspan>, PK-ascending batches</text>
    <rect x="632" y="76" width="382" height="72" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle code" x="660" y="108">R2dbcExposedEntityMapWriter</text>
    <text class="cardText" x="660" y="134">retry + <tspan class="keyword">UPDATE</tspan>/<tspan class="keyword">INSERT</tspan>/<tspan class="keyword">DELETE</tspan></text>
    <rect x="1120" y="76" width="262" height="72" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle" x="1148" y="108">R2DBC database</text>
    <text class="cardText" x="1148" y="134"><tspan class="code">suspendTransaction</tspan></text>
  </g>

  <path class="write" d="M1106 814 H1212" style="marker-end:url(#arrow-8c6f33)"/>
  <text class="label" x="1128" y="794">DB rows</text>

  <g transform="translate(126 920)">
    <rect x="0" y="0" width="1428" height="50" rx="14" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
    <text class="small" x="28" y="31">Boundary rule: this module exposes suspend-only R2DBC repositories; the JDBC Lettuce repository is a separate module.</text>
  </g>
</svg>
