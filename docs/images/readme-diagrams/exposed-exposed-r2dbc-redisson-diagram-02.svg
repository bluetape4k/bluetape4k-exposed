<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1100" viewBox="0 0 1366 1100" role="img" aria-label="R2DBC Redisson Repository Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1366" height="1100"/>
<rect class="frame" x="32" y="28" width="1302" height="1044" rx="28"/>
<text class="title" x="66" y="82">R2DBC Redisson Repository Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="inheritLine" d="M1103 576 C1103 480 683 480 683 384"/>
<path class="inheritLine" d="M683 576 C683 459 263 459 263 342"/>
<path class="line" d="M263 576 C263 480 683 480 683 384"/>
<path class="line" d="M263 576 C263 459 263 459 263 342"/>
<path class="implLine" d="M263 576 C263 509 1103 509 1103 442"/>
<g transform="translate(88,180)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="175" y="61" text-anchor="middle">R2dbcEntityMapLoaderID_E</text>
  <text class="mono" x="18" y="108">+load(key: ID): CompletableFuture~E~</text>
<text class="mono" x="18" y="129">+loadAllKeys(): AsyncIterator~ID~</text>
</g>
<g transform="translate(508,180)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
  <text class="small" x="175" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="175" y="61" text-anchor="middle">R2dbcEntityMapWriterID_E</text>
  <text class="mono" x="18" y="108">+write(map: Map~ID, E~):</text>
<text class="mono" x="18" y="129">CompletableFuture~Void~</text>
<text class="mono" x="18" y="150">+delete(keys: Collection~Any~):</text>
<text class="mono" x="18" y="171">CompletableFuture~Void~</text>
</g>
<g transform="translate(928,180)">
  <rect class="card" x="0" y="0" width="350" height="254" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="56.5" text-anchor="middle">R2dbc Redisson Repository</text>
<text class="label" x="175" y="81.5" text-anchor="middle">ID_E</text>
  <text class="mono" x="18" y="124">+cacheName: String</text>
<text class="mono" x="18" y="145">+table: IdTable~ID~</text>
<text class="mono" x="18" y="166">+cache: RMap~ID, E~</text>
<text class="mono" x="18" y="187">+extractId(entity: E): ID</text>
<text class="mono" x="18" y="208">+toEntity(ResultRow): E [suspend]</text>
<text class="mono" x="18" y="229">+exists(id: ID): Boolean [suspend]</text>
</g>
<g transform="translate(88,584)">
  <rect class="card" x="0" y="0" width="350" height="296" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#DC6B82"/>
  <text class="small" x="175" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="175" y="56.5" text-anchor="middle">Abstract R2dbc Redisson</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Repository ID_E</text>
  <text class="mono" x="18" y="124">+redissonClient: RedissonClient</text>
<text class="mono" x="18" y="145">+cacheName: String</text>
<text class="mono" x="18" y="166">#config: RedissonCacheConfig</text>
<text class="mono" x="18" y="187">#scope: CoroutineScope</text>
<text class="mono" x="18" y="208">#r2dbcEntityMapLoader:</text>
<text class="mono" x="18" y="229">R2dbcEntityMapLoader~ID, E~</text>
<text class="mono" x="18" y="250">#r2dbcEntityMapWriter:</text>
<text class="mono" x="18" y="271">R2dbcEntityMapWriter~ID, E~ ?</text>
</g>
<g transform="translate(508,584)">
  <rect class="card" x="0" y="0" width="350" height="212" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#45A7A1"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="56.5" text-anchor="middle">R2dbc Exposed Entity Map</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Loader ID_E</text>
  <text class="mono" x="18" y="124">-entityTable: IdTable~ID~</text>
<text class="mono" x="18" y="145">-scope: CoroutineScope</text>
<text class="mono" x="18" y="166">-batchSize: Int</text>
<text class="mono" x="18" y="187">-toEntity: suspend ResultRow.() -&gt; E</text>
</g>
<g transform="translate(928,584)">
  <rect class="card" x="0" y="0" width="350" height="275" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#8A72D6"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="56.5" text-anchor="middle">R2dbc Exposed Entity Map</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Writer ID_E</text>
  <text class="mono" x="18" y="124">-entityTable: IdTable~ID~</text>
<text class="mono" x="18" y="145">-scope: CoroutineScope</text>
<text class="mono" x="18" y="166">-updateBody: (UpdateStatement, E) -&gt; Unit</text>
<text class="mono" x="18" y="187">-batchInsertBody: BatchInsertStatement.(E)</text>
<text class="mono" x="18" y="208">-&gt; Unit</text>
<text class="mono" x="18" y="229">-deleteFromDBOnInvalidate: Boolean</text>
<text class="mono" x="18" y="250">-writeMode: WriteMode</text>
</g>
</svg>
