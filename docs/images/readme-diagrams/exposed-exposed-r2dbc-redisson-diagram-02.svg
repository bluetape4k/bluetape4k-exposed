<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Redisson Repository Class Map</title>
  <desc id="desc">UML-style class diagram for R2dbcRedissonRepository, AbstractR2dbcRedissonRepository, Redisson loader/writer base classes, Exposed adapter classes, and repository implementation hooks.</desc>
  <defs>
    <marker id="hollow" viewBox="0 0 22 18" refX="20" refY="9" markerWidth="17" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 20 9 L 2 16 Z" fill="#fffaf2" stroke="#496879" stroke-width="2.8" stroke-dasharray="none"/></marker>
    <marker id="open" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#327d91" stroke-width="2.8" stroke-dasharray="none"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/></filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle, .cardText, .small, .label { font-family: "Comic Mono", monospace; fill: #51636f; }
      .subtitle { font-size: 18px; }
      .clusterTitle { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 26px; fill: #21343f; }
      .cardTitle { font-family: "Comic Mono", monospace; font-size: 18px; font-weight: 700; fill: #20323d; }
      .cardText { font-size: 14px; }
      .small { font-size: 13px; }
      .label { font-size: 13px; fill: #315664; }
      .uml { fill: #fffdf8; stroke: #9fb8c2; stroke-width: 2.2; }
      .adapter { fill: #fffdf8; stroke: #d3a663; stroke-width: 2.3; }
      .hook { fill: #fffdf8; stroke: #a9c58b; stroke-width: 2.3; }
      .generalize { fill: none; stroke: #496879; stroke-width: 3.3; marker-end: url(#hollow); stroke-linecap: round; stroke-linejoin: round; }
      .depends { fill: none; stroke: #327d91; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#open); stroke-linecap: round; stroke-linejoin: round; }
      .owns { fill: none; stroke: #327d91; stroke-width: 3.4; marker-end: url(#open); stroke-linecap: round; stroke-linejoin: round; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="1120"/>
  <rect class="frame" x="42" y="34" width="1596" height="1048" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Redisson Repository Class Map</text>
  <text class="subtitle" x="86" y="126">Class relationships stay code-focused: contracts, base adapters, Exposed adapters, and concrete mapping hooks.</text>

  <rect x="92" y="164" width="1496" height="242" rx="18" fill="#e7f1f4" stroke="#9dbbc4" stroke-width="2.5"/>
  <text class="clusterTitle" x="124" y="210">Repository contracts</text>
  <g transform="translate(170 252)">
    <rect class="uml" x="0" y="0" width="430" height="112" rx="12"/>
    <text class="cardTitle type" x="26" y="34">R2dbcRedissonRepository&lt;ID,E&gt;</text>
    <line x1="0" y1="50" x2="430" y2="50" stroke="#c8d7dd"/>
    <text class="cardText" x="26" y="78">+ cache: <tspan class="type">RMap&lt;ID,E?&gt;</tspan></text>
    <text class="cardText" x="26" y="100">+ get / put / invalidate / clear</text>
  </g>
  <g transform="translate(846 224)">
    <rect class="uml" x="0" y="0" width="540" height="154" rx="12"/>
    <text class="cardTitle type" x="26" y="34">AbstractR2dbcRedissonRepository&lt;ID,E&gt;</text>
    <line x1="0" y1="50" x2="540" y2="50" stroke="#c8d7dd"/>
    <text class="cardText" x="26" y="78">- redissonClient, config, scope</text>
    <text class="cardText" x="26" y="102"># cache, cacheOnlyMap, loader, writer?</text>
    <text class="cardText" x="26" y="126">+ findAll syncs selected rows into cache</text>
  </g>
  <path class="generalize" d="M846 302 H620"/>
  <text class="label" x="688" y="282">implements</text>

  <rect x="92" y="448" width="1496" height="340" rx="18" fill="#fff0d8" stroke="#d8ad68" stroke-width="2.5"/>
  <text class="clusterTitle" x="124" y="494">Redisson callback adapters</text>
  <g transform="translate(186 542)">
    <rect class="adapter" x="0" y="0" width="450" height="116" rx="12"/>
    <text class="cardTitle code" x="26" y="34">R2dbcEntityMapLoader&lt;ID,E&gt;</text>
    <line x1="0" y1="50" x2="450" y2="50" stroke="#ead3ad"/>
    <text class="cardText" x="26" y="78">implements <tspan class="type">MapLoaderAsync</tspan></text>
    <text class="cardText" x="26" y="100">load(id), loadAllKeys()</text>
  </g>
  <g transform="translate(992 542)">
    <rect class="adapter" x="0" y="0" width="450" height="116" rx="12"/>
    <text class="cardTitle code" x="26" y="34">R2dbcEntityMapWriter&lt;ID,E&gt;</text>
    <line x1="0" y1="50" x2="450" y2="50" stroke="#ead3ad"/>
    <text class="cardText" x="26" y="78">implements <tspan class="type">MapWriterAsync</tspan></text>
    <text class="cardText" x="26" y="100">write(map), delete(ids)</text>
  </g>
  <g transform="translate(186 694)">
    <rect class="adapter" x="0" y="0" width="450" height="76" rx="12"/>
    <text class="cardTitle code" x="26" y="32">R2dbcExposedEntityMapLoader</text>
    <text class="cardText" x="26" y="58">uses table + toEntity hook</text>
  </g>
  <g transform="translate(992 694)">
    <rect class="adapter" x="0" y="0" width="450" height="76" rx="12"/>
    <text class="cardTitle code" x="26" y="32">R2dbcExposedEntityMapWriter</text>
    <text class="cardText" x="26" y="58">uses table + write hooks</text>
  </g>
  <path class="generalize" d="M410 694 V662"/>
  <path class="generalize" d="M1216 694 V662"/>
  <path class="owns" d="M1030 378 C860 438 620 454 456 542"/>
  <text class="label" x="668" y="472">loaderAsync</text>
  <path class="owns" d="M1208 378 V542"/>
  <text class="label" x="1228" y="468">writerAsync when enabled</text>

  <rect x="92" y="834" width="1496" height="178" rx="18" fill="#eef4e6" stroke="#a9c58b" stroke-width="2.5"/>
  <text class="clusterTitle" x="124" y="880">Concrete repository hooks</text>
  <g transform="translate(222 922)"><rect class="hook" x="0" y="0" width="330" height="62" rx="12"/><text class="cardTitle" x="26" y="38">table: <tspan class="type">IdTable&lt;ID&gt;</tspan></text></g>
  <g transform="translate(674 922)"><rect class="hook" x="0" y="0" width="330" height="62" rx="12"/><text class="cardTitle code" x="26" y="38">ResultRow.toEntity()</text></g>
  <g transform="translate(1124 910)"><rect class="hook" x="0" y="0" width="360" height="86" rx="12"/><text class="cardTitle code" x="26" y="34">updateEntity / insertEntity</text><text class="cardText" x="26" y="62">write-mode mapping hooks</text></g>
  <path class="depends" d="M410 760 V922"/>
  <text class="label" x="430" y="840">table</text>
  <path class="depends" d="M1216 760 V910"/>
  <text class="label" x="1236" y="836">write hooks</text>

  <rect x="126" y="1024" width="1428" height="42" rx="13" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
  <text class="small" x="150" y="1050">UML rule: service icons are intentionally omitted because every card here represents code, not Redis or database infrastructure.</text>
</svg>
