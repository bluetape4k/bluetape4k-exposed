<g data-footer="reader-note"><rect class="note" x="110" y="2402" width="1520" height="48" rx="12"/><text class="small" x="870" y="2419" text-anchor="middle" dominant-baseline="middle">This is a sequence diagram: lifelines show call timing; labels are kept off message lines.</text><text class="small" x="870" y="2436" text-anchor="middle" dominant-baseline="middle">Synchronous helpers await VirtualFuture; asynchronous helpers return the handle immediately.</text></g>
