<svg data-sequence-spacing-scale="1.16" xmlns="http://www.w3.org/2000/svg" width="1680" height="1252.8" viewBox="0 0 1680 1252.8" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Redisson Write-Through Sequence</title>
  <desc id="desc">Sequence diagram for write-through put and upsertAll where Redisson invokes the R2DBC writer and the repository resumes after the database transaction completes.</desc>
  <defs>
    <marker id="seqArrow-3F7D9C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke="#3f7d9c" /></marker>
    <marker id="seqArrow-6E8F4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke="#6e8f4f" /></marker>
    <marker id="seqArrow-7E6AB8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#7e6ab8" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke="#7e6ab8" /></marker>
    <marker id="seqArrow-9B7D54" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#9b7d54" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke="#9b7d54" /></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/></filter>
    <style>
      .canvas { fill: #f6f0e8; } .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle, .role, .msg, .note, .footer { font-family: "Comic Mono", monospace; fill: #52636f; }
      .subtitle { font-size: 18px; } .actorTitle { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 20px; fill: #1f3138; }
      .role { font-size: 13px; } .seqText { font-size: 13px; } .note { font-size: 13px; fill: #40515b; } .footer { font-size: 14px; }
      .actor { fill: #ffffff; stroke: #8db7c2; stroke-width: 2.2; } .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.2; stroke-linecap: round;stroke-linejoin:round; marker-end: url(#seqArrow-3F7D9C); }
      .cache { fill: none; stroke: #6e8f4f; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#seqArrow-6E8F4F); }
      .db { fill: none; stroke: #7e6ab8; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#seqArrow-7E6AB8); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-linecap: round;stroke-linejoin:round; stroke-dasharray: 8 6; marker-end: url(#seqArrow-9B7D54); }
      .opt { fill: #ffffff; fill-opacity:0.12; stroke: #7e6ab8; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; } .callLabel { stroke: #9cc2d1; } .cacheLabel { stroke: #b6c9a4; } .dbLabel { stroke: #b9addd; } .returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.7; } .callBadge { fill: #eaf4f8; stroke: #3f7d9c; } .cacheBadge { fill: #eef7f0; stroke: #6e8f4f; } .dbBadge { fill: #f3eefb; stroke: #7e6ab8; } .returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono", monospace; font-size: 11px; font-weight: 700; } .callText { fill: #2f6f8e; } .cacheText { fill: #55783f; } .dbText { fill: #6d58a8; } .returnText { fill: #7f6038; }
      .code { fill: #9b3d5a; font-weight: 700; } .type { fill: #176f7a; font-weight: 700; } .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1252.8"/><rect class="frame" x="42" y="39.44" width="1596" height="1160" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="105.56">R2DBC Redisson Write-Through</text>
  <text class="subtitle" x="86" y="146.16">Write-through waits for the Redisson MapWriterAsync R2DBC transaction before the suspend repository call resumes.</text>
  <g id="a t c a t s">
    <rect class="actor" x="86" y="199.52" width="160" height="83.52" rx="10"/><text class="actorTitle" x="166" y="233.16" text-anchor="middle">Caller</text><text class="role" x="166" y="259.84" text-anchor="middle">coroutine</text>
    <rect class="actor" x="330" y="199.52" width="218" height="83.52" rx="10"/><text class="actorTitle" x="439" y="233.16" text-anchor="middle">Repository</text><text class="role" x="439" y="259.84" text-anchor="middle">suspend API</text>
    <rect class="actor" x="662" y="199.52" width="246" height="72" rx="10"/><image data-bluetape4k-icon="redis.icon" x="684" y="218.08" width="34" height="34" href="data:image/svg+xml;base64,"/><text class="actorTitle" x="804" y="233.16" text-anchor="middle">Redisson map</text><text class="role" x="804" y="259.84" text-anchor="middle">WRITE_THROUGH</text>
    <rect class="actor" x="1018" y="199.52" width="246" height="83.52" rx="10"/><text class="actorTitle" x="1141" y="233.16" text-anchor="middle">R2DBC writer</text><text class="role code" x="1141" y="259.84" text-anchor="middle">MapWriterAsync</text>
    <rect class="actor" x="1412" y="199.52" width="178" height="72" rx="10"/><image data-bluetape4k-icon="generic.database" x="1430" y="218.08" width="34" height="34" href="data:image/svg+xml;base64,"/><text class="actorTitle" x="1520" y="233.16" text-anchor="middle">DB</text><text class="role" x="1520" y="259.84" text-anchor="middle">R2DBC rows</text>
  </g>
  <line class="lifeline" x1="166" y1="283.04" x2="166" y2="1088.08"/><line class="lifeline" x1="439" y1="283.04" x2="439" y2="1088.08"/><line class="lifeline" x1="804" y1="283.04" x2="804" y2="1088.08"/><line class="lifeline" x1="1141" y1="283.04" x2="1141" y2="1088.08"/><line class="lifeline" x1="1520" y1="283.04" x2="1520" y2="1088.08"/>
  <rect class="activation" x="432" y="415.28" width="14" height="522" rx="6"/><rect class="activation" x="797" y="505.76" width="14" height="324.8" rx="6"/><rect class="activation" x="1134" y="607.84" width="14" height="232" rx="6"/>
  <rect x="70" y="359.6" width="1540" height="626.4" rx="14" class="opt"/><rect x="94" y="380.48" width="376" height="34.8" rx="15" fill="#f3eefb" stroke="#7e6ab8" stroke-width="1.6"/><text class="note" x="118" y="403.68">WRITE_THROUGH mode</text>
  <rect x="96" y="436.16" width="270" height="37.12" rx="16" class="pill callLabel"/><circle cx="119" cy="454.72" r="12" class="badge callBadge"/><text x="119" y="459.36" text-anchor="middle" class="badgeText callText">1</text><text x="146" y="460.52" class="seqText callText"><tspan class="code">put</tspan> / <tspan class="code">upsertAll</tspan></text><path class="seq call" d="M 166 489.52 L 439 489.52"/>
  <rect x="512" y="519.68" width="304" height="37.12" rx="16" class="pill cacheLabel"/><circle cx="535" cy="538.24" r="12" class="badge cacheBadge"/><text x="535" y="542.88" text-anchor="middle" class="badgeText cacheText">2</text><text x="562" y="544.04" class="seqText cacheText"><tspan class="code">fastPutAsync</tspan> / <tspan class="code">putAllAsync</tspan></text><path class="cache" d="M 439 577.68 L 804 577.68"/>
  <rect x="862" y="603.2" width="274" height="37.12" rx="16" class="pill dbLabel"/><circle cx="885" cy="621.76" r="12" class="badge dbBadge"/><text x="885" y="626.4" text-anchor="middle" class="badgeText dbText">3</text><text x="912" y="627.56" class="seqText dbText"><tspan class="code">writer.write(map)</tspan></text><path class="db" d="M 804 661.2 L 1141 661.2"/>
  <rect x="1224" y="689.04" width="286" height="37.12" rx="16" class="pill dbLabel"/><circle cx="1247" cy="707.6" r="12" class="badge dbBadge"/><text x="1247" y="712.24" text-anchor="middle" class="badgeText dbText">4</text><text x="1274" y="713.4" class="seqText dbText">select existing IDs</text><path class="db" d="M 1141 740.08 L 1520 740.08"/>
  <rect x="1220" y="774.88" width="330" height="37.12" rx="16" class="pill dbLabel"/><circle cx="1243" cy="793.44" r="12" class="badge dbBadge"/><text x="1243" y="798.08" text-anchor="middle" class="badgeText dbText">5</text><text x="1270" y="799.24" class="seqText dbText"><tspan class="keyword">UPDATE</tspan> existing, <tspan class="keyword">INSERT</tspan> allowed rows</text><path class="db" d="M 1141 828.24 L 1520 828.24"/>
  <rect x="856" y="856.08" width="272" height="37.12" rx="16" class="pill returnLabel"/><circle cx="879" cy="874.64" r="12" class="badge returnBadge"/><text x="879" y="879.28" text-anchor="middle" class="badgeText returnText">6</text><text x="906" y="880.44" class="seqText returnText">writer completed</text><path class="ret return" d="M 1141 907.12 L 804 907.12"/>
  <rect x="510" y="923.36" width="260" height="37.12" rx="16" class="pill returnLabel"/><circle cx="533" cy="941.92" r="12" class="badge returnBadge"/><text x="533" y="946.56" text-anchor="middle" class="badgeText returnText">7</text><text x="560" y="947.72" class="seqText returnText">cache write accepted</text><path class="ret return" d="M 804 974.4 L 439 974.4"/>
  <rect x="196" y="1011.52" width="230" height="37.12" rx="16" class="pill returnLabel"/><circle cx="219" cy="1030.08" r="12" class="badge returnBadge"/><text x="219" y="1034.72" text-anchor="middle" class="badgeText returnText">8</text><text x="246" y="1035.88" class="seqText returnText">suspend call resumes</text><path class="ret return" d="M 439 1069.52 L 166 1069.52"/>
  <rect x="128" y="1125.2" width="1424" height="48.72" rx="13" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/><text class="footer" x="152" y="1155.36">Write-through rule: the repository observes DB write completion, not just cache acceptance.</text>
</svg>
