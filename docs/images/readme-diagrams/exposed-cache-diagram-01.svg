<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1320" viewBox="0 0 1740 1320" role="img" aria-labelledby="title desc">
  <title id="title">exposed-cache Repository Class Diagram</title>
  <desc id="desc">UML-style class diagram for exposed-cache repository interfaces and Redis extension interfaces.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="generalizationArrow" viewBox="0 0 10 10" markerWidth="18" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="#FFFFFF" stroke="#536C85" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .pkg{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .pkg-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .uml{filter:url(#shadow);stroke-width:2}
      .uml-title{font-family:"Architects Daughter";font-size:20px;fill:#1F3044;font-weight:400}
      .stereo{font-family:"Comic Mono";font-size:12px;fill:#536476;font-weight:400}
      .member{font-family:"Comic Mono";font-size:13px;fill:#394B61;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .divider{stroke:#C8D6E4;stroke-width:1.4}
      .generalization{fill:none;stroke-width:2.4;marker-end:url(#generalizationArrow);stroke-linecap:round;stroke-linejoin:round}
      .note{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
    <marker id="generalizationArrow-3e9868" viewBox="0 0 10 10" markerWidth="18" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="#FFFFFF" stroke="#3E9868" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="generalizationArrow-b9851b" viewBox="0 0 10 10" markerWidth="18" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="#FFFFFF" stroke="#B9851B" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="generalizationArrow-4f83bf" viewBox="0 0 10 10" markerWidth="18" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="#FFFFFF" stroke="#4F83BF" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>
  <rect class="canvas" width="1740" height="1320"/>
  <rect class="frame" x="42" y="34" width="1656" height="1252" rx="34"/>
  <text class="title" x="72" y="88">exposed-cache Repository Class Diagram</text>
  <text class="subtitle" x="76" y="121">Shared repository interfaces define cache and DB hooks; Redis interfaces only add pattern invalidation.</text>

  <rect class="pkg" x="82" y="154" width="1576" height="555" rx="22"/>
  <text class="pkg-title" x="116" y="190">io.bluetape4k.exposed.cache</text>
  <rect class="pkg" x="82" y="755" width="1576" height="330" rx="22"/>
  <text class="pkg-title" x="116" y="791">io.bluetape4k.exposed.cache.redis</text>

  <path id="route-jdbc-redis-jdbc" data-edge="jdbc-redis-&gt;jdbc" class="generalization" d="M 330 835 L 330 650" stroke="#3E9868" style="marker-end:url(#generalizationArrow-3e9868)"/>
  <path id="route-suspend-redis-suspended-jdbc" data-edge="suspend-redis-&gt;suspended-jdbc" class="generalization" d="M 870 835 L 870 650" stroke="#B9851B" style="marker-end:url(#generalizationArrow-b9851b)"/>
  <path id="route-r2dbc-redis-r2dbc" data-edge="r2dbc-redis-&gt;r2dbc" class="generalization" d="M 1410 835 L 1410 650" stroke="#4F83BF" style="marker-end:url(#generalizationArrow-4f83bf)"/>

  <g id="node-jdbc" data-node="jdbc" transform="translate(130,245)">
    <rect class="uml" x="0" y="0" width="400" height="405" rx="10" fill="#EAF7EF" stroke="#58A978"/>
    <text class="stereo" x="200" y="26" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="uml-title" x="200" y="52" text-anchor="middle">JdbcCacheRepository&lt;ID, E&gt;</text>
    <line class="divider" x1="0" y1="72" x2="400" y2="72"/>
    <text class="member" x="18" y="98">+ table: IdTable&lt;ID&gt;</text>
    <text class="member" x="18" y="119">+ cacheName: String</text>
    <text class="member" x="18" y="140">+ cacheMode: CacheMode</text>
    <text class="member" x="18" y="161">+ cacheWriteMode: CacheWriteMode</text>
    <line class="divider" x1="0" y1="184" x2="400" y2="184"/>
    <text class="member" x="18" y="210">+ ResultRow.toEntity(): E</text>
    <text class="member" x="18" y="231">+ extractId(entity): ID</text>
    <text class="member" x="18" y="252">+ findByIdFromDb(id): E?</text>
    <text class="member" x="18" y="273">+ findAllFromDb(ids): List&lt;E&gt;</text>
    <text class="member" x="18" y="294">+ countFromDb(): Long</text>
    <text class="member" x="18" y="315">+ findAll(...): List&lt;E&gt;</text>
    <text class="member" x="18" y="336">+ get / getAll / containsKey</text>
    <text class="member" x="18" y="357">+ put / putAll</text>
    <text class="member" x="18" y="378">+ invalidate / invalidateAll / clear</text>
  </g>

  <g id="node-suspended-jdbc" data-node="suspended-jdbc" transform="translate(650,245)">
    <rect class="uml" x="0" y="0" width="440" height="405" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="stereo" x="220" y="26" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="uml-title" x="220" y="52" text-anchor="middle">SuspendedJdbcCacheRepository&lt;ID, E&gt;</text>
    <line class="divider" x1="0" y1="72" x2="440" y2="72"/>
    <text class="member" x="18" y="98">+ table: IdTable&lt;ID&gt;</text>
    <text class="member" x="18" y="119">+ cacheName: String</text>
    <text class="member" x="18" y="140">+ cacheMode: CacheMode</text>
    <text class="member" x="18" y="161">+ cacheWriteMode: CacheWriteMode</text>
    <line class="divider" x1="0" y1="184" x2="440" y2="184"/>
    <text class="member" x="18" y="210">+ ResultRow.toEntity(): E</text>
    <text class="member" x="18" y="231">+ extractId(entity): ID</text>
    <text class="member" x="18" y="252">+ suspend findByIdFromDb(id): E?</text>
    <text class="member" x="18" y="273">+ suspend findAllFromDb(ids): List&lt;E&gt;</text>
    <text class="member" x="18" y="294">+ suspend countFromDb(): Long</text>
    <text class="member" x="18" y="315">+ suspend findAll(...): List&lt;E&gt;</text>
    <text class="member" x="18" y="336">+ suspend get / getAll / containsKey</text>
    <text class="member" x="18" y="357">+ suspend put / putAll</text>
    <text class="member" x="18" y="378">+ suspend invalidate / clear</text>
  </g>

  <g id="node-r2dbc" data-node="r2dbc" transform="translate(1210,245)">
    <rect class="uml" x="0" y="0" width="400" height="405" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="stereo" x="200" y="26" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="uml-title" x="200" y="52" text-anchor="middle">R2dbcCacheRepository&lt;ID, E&gt;</text>
    <line class="divider" x1="0" y1="72" x2="400" y2="72"/>
    <text class="member" x="18" y="98">+ table: IdTable&lt;ID&gt;</text>
    <text class="member" x="18" y="119">+ cacheName: String</text>
    <text class="member" x="18" y="140">+ cacheMode: CacheMode</text>
    <text class="member" x="18" y="161">+ cacheWriteMode: CacheWriteMode</text>
    <line class="divider" x1="0" y1="184" x2="400" y2="184"/>
    <text class="member" x="18" y="210">+ suspend ResultRow.toEntity(): E</text>
    <text class="member" x="18" y="231">+ extractId(entity): ID</text>
    <text class="member" x="18" y="252">+ suspend findByIdFromDb(id): E?</text>
    <text class="member" x="18" y="273">+ suspend findAllFromDb(ids): List&lt;E&gt;</text>
    <text class="member" x="18" y="294">+ suspend countFromDb(): Long</text>
    <text class="member" x="18" y="315">+ suspend findAll(...): List&lt;E&gt;</text>
    <text class="member" x="18" y="336">+ suspend get / getAll / containsKey</text>
    <text class="member" x="18" y="357">+ suspend put / putAll</text>
    <text class="member" x="18" y="378">+ suspend invalidate / clear</text>
  </g>

  <g id="node-jdbc-redis" data-node="jdbc-redis" transform="translate(130,835)">
    <rect class="uml" x="0" y="0" width="400" height="150" rx="10" fill="#EAF7EF" stroke="#58A978"/>
    <text class="stereo" x="200" y="26" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="uml-title" x="200" y="52" text-anchor="middle">JdbcRedisRepository&lt;ID, E&gt;</text>
    <line class="divider" x1="0" y1="72" x2="400" y2="72"/>
    <text class="member" x="18" y="101">+ invalidateByPattern(patterns, count): Long</text>
  </g>

  <g id="node-suspend-redis" data-node="suspend-redis" transform="translate(650,835)">
    <rect class="uml" x="0" y="0" width="440" height="150" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="stereo" x="220" y="26" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="uml-title" x="220" y="52" text-anchor="middle">SuspendJdbcRedisRepository&lt;ID, E&gt;</text>
    <line class="divider" x1="0" y1="72" x2="440" y2="72"/>
    <text class="member" x="18" y="101">+ suspend invalidateByPattern(patterns, count): Long</text>
  </g>

  <g id="node-r2dbc-redis" data-node="r2dbc-redis" transform="translate(1210,835)">
    <rect class="uml" x="0" y="0" width="400" height="150" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="stereo" x="200" y="26" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="uml-title" x="200" y="52" text-anchor="middle">R2dbcRedisRepository&lt;ID, E&gt;</text>
    <line class="divider" x1="0" y1="72" x2="400" y2="72"/>
    <text class="member" x="18" y="101">+ suspend invalidateByPattern(patterns, count): Long</text>
  </g>

  <g transform="translate(100,1145)" data-footer="reader-contract">
    <rect class="note" x="0" y="0" width="1540" height="72" rx="12"/>
    <text class="small" x="770" y="26" text-anchor="middle" dominant-baseline="middle">This is a class diagram: it shows interface contracts and inheritance only, not runtime cache topology.</text>
    <text class="small" x="770" y="48" text-anchor="middle" dominant-baseline="middle">Use the configuration map and sequence diagram to choose CacheMode, CacheWriteMode, and write timing.</text>
  </g>
</svg>
