<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="1166" viewBox="0 0 1288 1166" role="img" aria-label="Storage / Retrieval Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1288" height="1166"/>
<rect class="frame" x="32" y="28" width="1224" height="1110" rx="28"/>
<text class="title" x="66" y="82">Storage / Retrieval Sequence Diagram</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1106" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="494" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="644" y="198.5" text-anchor="middle">Measure Column</text>
<text class="smallLabel" x="644" y="219.5" text-anchor="middle">Type~Length~</text>
<line class="lifeline" x1="644" y1="252" x2="644" y2="1106" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="998" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1148" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1148" y1="252" x2="1148" y2="1106" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="196.5" y="286" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="214.5" y="313" text-anchor="start">1. insert { it[width] = 1500.millimeters() }</text>
<path class="line" d="M140 344 L644 344"/>
<rect x="500.5" y="396" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="518.5" y="423" text-anchor="start">2. notNullValueToDB(value in Length.meters)</text>
<path class="line" d="M644 454 C708 454 708 488 644 488"/>
<rect x="773" y="526" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="791" y="553" text-anchor="start">3. INSERT ... VALUES (1.5)</text>
<path class="line" d="M644 584 L1148 584"/>
<rect x="456.5" y="636" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="474.5" y="663" text-anchor="start">4. SELECT width FROM products WHERE id = 1</text>
<path class="line" d="M140 694 L1148 694"/>
<rect x="791" y="746" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="773" text-anchor="start">5. 1.5 (Double)</text>
<path class="dashed" d="M1148 804 L644 804"/>
<rect x="496.5" y="856" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="514.5" y="883" text-anchor="start">6. fromBaseValue(1.5) → Measure(1.5, meters)</text>
<path class="line" d="M644 914 C708 914 708 948 644 948"/>
<rect x="253" y="986" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="271" y="1013" text-anchor="start">7. Measure(1.5, Length.meters)</text>
<path class="dashed" d="M644 1044 L140 1044"/>
</svg>
