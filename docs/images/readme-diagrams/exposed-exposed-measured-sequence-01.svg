<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1160" viewBox="0 0 1680 1160" role="img" aria-labelledby="title desc">
  <title id="title">Measured Column Round Trip</title>
  <desc id="desc">Sequence diagram for exposed-measured showing insertion of measured values as base-unit DOUBLE values and readback into measured Kotlin types.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .band{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.actor{filter:url(#shadow);stroke-width:2}
      .lifeline{stroke:#B8C8D8;stroke-width:2;stroke-dasharray:8 8}.call{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}.labelPill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}
      .labelPill.callLabel{stroke:#AFC9E8}.labelPill.convertLabel{stroke:#9ED2CD}.labelPill.dbLabel{stroke:#D6A441}.labelPill.readLabel{stroke:#B7A8E4}
      .badge{stroke-width:1.8}.badge.callBadge{fill:#E8F3FF;stroke:#4F83BF}.badge.convertBadge{fill:#E9F7F6;stroke:#2E8F89}
      .badge.dbBadge{fill:#FFF3D9;stroke:#B9851B}.badge.readBadge{fill:#F1ECFF;stroke:#755BC6}
      .badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.msg{font-family:"Comic Mono";font-size:14px;font-weight:400}
      .msg.callText,.badgeText.callText{fill:#3D6FAD}.msg.convertText,.badgeText.convertText{fill:#247B77}
      .msg.dbText,.badgeText.dbText{fill:#8A6417}.msg.readText,.badgeText.readText{fill:#624EB1}
      .note{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}.actor-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}.small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1160"/>
  <rect class="frame" x="44" y="36" width="1592" height="1088" rx="34"/>
  <text class="title" x="72" y="88">Measured Column Round Trip</text>
  <text class="subtitle" x="76" y="121">Measured values enter Exposed as typed Kotlin objects and leave the database as base-unit DOUBLE values.</text>
  <rect class="band" x="82" y="160" width="1516" height="820" rx="20"/>

  <g data-node="test" transform="translate(132,190)"><rect class="actor" x="0" y="0" width="230" height="78" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="actor-title" x="115" y="28" text-anchor="middle">Test / repository</text><text class="detail" x="115" y="54" text-anchor="middle">typed values</text></g>
  <g data-node="dsl" transform="translate(440,190)"><rect class="actor" x="0" y="0" width="230" height="78" rx="12" fill="#EAF7EF" stroke="#58A978"/><text class="actor-title" x="115" y="28" text-anchor="middle">Table DSL</text><text class="detail" x="115" y="54" text-anchor="middle">column definition</text></g>
  <g data-node="column" transform="translate(742,190)"><rect class="actor" x="0" y="0" width="250" height="78" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="actor-title" x="125" y="28" text-anchor="middle">ColumnType</text><text class="detail" x="125" y="54" text-anchor="middle">base-unit conversion</text></g>
  <g data-node="jdbc" transform="translate(1078,190)"><rect class="actor" x="0" y="0" width="220" height="78" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="actor-title" x="110" y="28" text-anchor="middle">Exposed JDBC</text><text class="detail" x="110" y="54" text-anchor="middle">insert/select</text></g>
  <g data-node="db" transform="translate(1370,190)"><rect class="actor" x="0" y="0" width="180" height="78" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="actor-title" x="90" y="28" text-anchor="middle">DB</text><text class="detail" x="90" y="54" text-anchor="middle">DOUBLE</text></g>

  <line class="lifeline" x1="247" y1="292" x2="247" y2="934"/>
  <line class="lifeline" x1="555" y1="292" x2="555" y2="934"/>
  <line class="lifeline" x1="867" y1="292" x2="867" y2="934"/>
  <line class="lifeline" x1="1188" y1="292" x2="1188" y2="934"/>
  <line class="lifeline" x1="1460" y1="292" x2="1460" y2="934"/>

  <path class="call" data-edge="test-to-dsl" d="M 247 350 L 555 350" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <rect class="labelPill callLabel" x="300" y="292" width="204" height="34" rx="17"/>
  <circle class="badge callBadge" cx="324" cy="309" r="13"/><text class="badgeText callText" x="324" y="314" text-anchor="middle">1</text>
  <text class="msg callText" x="348" y="314">length(&quot;width&quot;)</text>

  <path class="call" data-edge="dsl-to-column" d="M 555 424 L 867 424" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <rect class="labelPill convertLabel" x="628" y="376" width="206" height="34" rx="17"/>
  <circle class="badge convertBadge" cx="652" cy="393" r="13"/><text class="badgeText convertText" x="652" y="398" text-anchor="middle">2</text>
  <text class="msg convertText" x="676" y="398">registerColumn()</text>

  <path class="call" data-edge="test-to-jdbc" d="M 247 504 L 1188 504" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <rect class="labelPill callLabel" x="566" y="446" width="286" height="34" rx="17"/>
  <circle class="badge callBadge" cx="590" cy="463" r="13"/><text class="badgeText callText" x="590" y="468" text-anchor="middle">3</text>
  <text class="msg callText" x="614" y="468">insert 150.centimeters()</text>

  <path class="call" data-edge="jdbc-to-column" d="M 1188 584 L 867 584" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <rect class="labelPill convertLabel" x="928" y="526" width="228" height="34" rx="17"/>
  <circle class="badge convertBadge" cx="952" cy="543" r="13"/><text class="badgeText convertText" x="952" y="548" text-anchor="middle">4</text>
  <text class="msg convertText" x="976" y="548">notNullValueToDB</text>

  <path class="return" data-edge="column-to-jdbc" d="M 867 650 L 1188 650" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <rect class="labelPill convertLabel" x="940" y="668" width="208" height="34" rx="17"/>
  <circle class="badge convertBadge" cx="964" cy="685" r="13"/><text class="badgeText convertText" x="964" y="690" text-anchor="middle">5</text>
  <text class="msg convertText" x="988" y="690">1.5 as Double</text>

  <path class="call" data-edge="jdbc-to-db" d="M 1188 724 L 1460 724" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <rect class="labelPill dbLabel" x="1236" y="666" width="200" height="34" rx="17"/>
  <circle class="badge dbBadge" cx="1260" cy="683" r="13"/><text class="badgeText dbText" x="1260" y="688" text-anchor="middle">6</text>
  <text class="msg dbText" x="1284" y="688">store DOUBLE</text>

  <path class="call" data-edge="jdbc-&gt;db" d="M 1188 792 L 1460 792" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <rect class="labelPill readLabel" x="1242" y="734" width="164" height="34" rx="17"/>
  <circle class="badge readBadge" cx="1266" cy="751" r="13"/><text class="badgeText readText" x="1266" y="756" text-anchor="middle">7</text>
  <text class="msg readText" x="1290" y="756">selectAll()</text>

  <path class="return" data-edge="db-to-column" d="M 1460 842 L 867 842" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <rect class="labelPill readLabel" x="1070" y="862" width="220" height="34" rx="17"/>
  <circle class="badge readBadge" cx="1094" cy="879" r="13"/><text class="badgeText readText" x="1094" y="884" text-anchor="middle">8</text>
  <text class="msg readText" x="1118" y="884">Number from DB</text>

  <path class="return" data-edge="column-to-test" d="M 867 910 L 247 910" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <rect class="labelPill callLabel" x="436" y="934" width="260" height="34" rx="17"/>
  <circle class="badge callBadge" cx="460" cy="951" r="13"/><text class="badgeText callText" x="460" y="956" text-anchor="middle">9</text>
  <text class="msg callText" x="484" y="956">Measure in base unit</text>

  <g transform="translate(112,1020)"><rect class="note" x="0" y="0" width="1456" height="42" rx="10"/><text class="small" x="728" y="23" text-anchor="middle" dominant-baseline="middle">Temperature follows the same sequence, but uses inKelvin() and Temperature.fromKelvin() instead of generic Measure(base, unit).</text></g>
</svg>
