<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-exposed Architecture</title>
  <desc id="desc">Architecture overview for bluetape4k Exposed extensions, showing Kotlin applications, the Exposed core layer, cross-cutting modules, database dialect extensions, and Spring Boot auto-configuration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef6f4"/>
      <stop offset="100%" stop-color="#f7f0e8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f3d5e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 36px; font-weight: 760; letter-spacing: 0; }
      .subtitle { font-size: 17px; font-weight: 460; fill: #475569; }
      .section { font-size: 15px; font-weight: 720; fill: #475569; letter-spacing: 0.04em; }
      .node-title { font-size: 19px; font-weight: 760; }
      .node-body { font-size: 14px; font-weight: 460; fill: #475569; }
      .node-body-invert { font-size: 14px; font-weight: 460; fill: #dbeafe; }
      .small { font-size: 13px; font-weight: 560; fill: #334155; }
      .pill { fill: #ffffff; stroke: #d7e0ea; stroke-width: 1.4; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .soft-line { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="115" r="150" fill="#0f766e" opacity="0.07"/>
  <circle cx="160" cy="650" r="190" fill="#f59e0b" opacity="0.08"/>

  <text x="64" y="70" class="label title">bluetape4k-exposed Architecture</text>
  <text x="64" y="101" class="label subtitle">Type-safe Exposed extensions for repositories, column types, dialect helpers, cache, and Spring Boot integration.</text>

  <g filter="url(#shadow)">
    <rect x="62" y="154" width="268" height="118" rx="18" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5"/>
    <text x="88" y="193" class="label node-title">Kotlin Application</text>
    <text x="88" y="222" class="label node-body">Exposed DSL, DAO, repository APIs</text>
    <text x="88" y="248" class="label node-body">Coroutine and blocking workloads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="142" width="338" height="340" rx="24" fill="url(#core)"/>
    <text x="462" y="186" class="label section" fill="#bfdbfe">CORE LAYER</text>
    <text x="462" y="224" class="label node-title" fill="#ffffff">bluetape4k-exposed-core</text>
    <text x="462" y="253" class="label node-body-invert">Column types, DSL helpers, shared extensions</text>

    <rect x="462" y="286" width="274" height="50" rx="13" fill="#ffffff" opacity="0.94"/>
    <text x="484" y="317" class="label small">DAO lifecycle helpers</text>

    <rect x="462" y="354" width="274" height="50" rx="13" fill="#ffffff" opacity="0.94"/>
    <text x="484" y="385" class="label small">JDBC repositories + transactions</text>

    <rect x="462" y="422" width="274" height="50" rx="13" fill="#ffffff" opacity="0.94"/>
    <text x="484" y="453" class="label small">R2DBC repositories + suspend transactions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="154" width="268" height="250" rx="20" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5"/>
    <text x="896" y="194" class="label section">CROSS-CUTTING MODULES</text>

    <rect x="896" y="219" width="216" height="34" rx="17" class="pill"/>
    <text x="916" y="241" class="label small">Cache: Caffeine / Redis</text>

    <rect x="896" y="267" width="216" height="34" rx="17" class="pill"/>
    <text x="916" y="289" class="label small">JSON: Jackson / Fastjson2</text>

    <rect x="896" y="315" width="216" height="34" rx="17" class="pill"/>
    <text x="916" y="337" class="label small">Tink encrypted columns</text>

    <rect x="896" y="363" width="216" height="34" rx="17" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
    <text x="916" y="385" class="label small">Measured unit columns</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="518" width="470" height="156" rx="22" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5"/>
    <text x="126" y="558" class="label section">DATABASE EXTENSIONS</text>
    <text x="126" y="589" class="label node-body">Dialect-specific SQL helpers and connector support</text>

    <g>
      <rect x="126" y="616" width="112" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="148" y="638" class="label small">PostgreSQL</text>
      <rect x="252" y="616" width="92" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="276" y="638" class="label small">MySQL 8</text>
      <rect x="358" y="616" width="88" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="380" y="638" class="label small">BigQuery</text>
      <rect x="460" y="616" width="76" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="480" y="638" class="label small">Trino</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="532" width="238" height="126" rx="22" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5"/>
    <text x="670" y="572" class="label section">SPRING BOOT 4</text>
    <text x="670" y="604" class="label node-body">Auto-configuration</text>
    <text x="670" y="630" class="label node-body">JDBC, R2DBC, Batch</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="922" y="532" width="182" height="126" rx="22" fill="url(#accent)"/>
    <text x="950" y="572" class="label section" fill="#fff7ed">ANALYTICS</text>
    <text x="950" y="606" class="label node-title" fill="#ffffff">DuckDB</text>
    <text x="950" y="634" class="label node-body-invert">ClickHouse</text>
  </g>

  <path class="line" d="M 330 213 C 370 213, 385 213, 430 213"/>
  <path class="line" d="M 768 253 C 812 253, 827 253, 870 253"/>
  <path class="line" d="M 768 353 C 813 353, 828 353, 870 353"/>
  <path class="line" d="M 586 482 C 553 513, 512 527, 450 544"/>
  <path class="line" d="M 666 482 C 694 512, 714 520, 744 532"/>
  <path class="soft-line" d="M 878 595 C 902 595, 906 595, 922 595"/>

  <text x="356" y="198" class="label small">builds on</text>
  <text x="790" y="236" class="label small">extends</text>
  <text x="540" y="525" class="label small">dialects</text>
</svg>
