<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">Lightweight coroutine batch and Spring Batch runtime comparison</title>
  <desc id="desc">A dark two-lane architecture diagram. The left lane shows the lightweight coroutine batch lease, read-process-write flow, post-write checkpoint, and status. The right lane shows Spring Batch JobRepository and ExecutionContext, partitioner, task executor, keyset reader, processor, writer, chunk commit, and restart key. Shared requirements are stable keys, idempotency, replay tests, cancellation, and metrics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#8fd3ff"/></marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#111d31"/><stop offset="1" stop-color="#1d2c43"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2639"/><stop offset="1" stop-color="#0f1726"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1800" height="1250" fill="url(#canvas)"/><rect x="40" y="34" width="1720" height="1176" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4"/>
  <text x="900" y="100" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Two Batch Runtimes, Two Restart Contracts</text>
  <text x="900" y="143" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b8c7d9">1.11 • do not merge the lightweight runner with Spring Batch semantics</text>
  <rect x="80" y="180" width="780" height="880" rx="28" fill="#111b2c" stroke="#4d8ec9" stroke-width="4"/><rect x="940" y="180" width="780" height="880" rx="28" fill="#111b2c" stroke="#159c92" stroke-width="4"/>
  <text x="470" y="238" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="35" fill="#9ed8ff">Lightweight Coroutine Batch</text><text x="1330" y="238" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="35" fill="#5eead4">Spring Batch Integration</text>

  <g fill="none" stroke="#8fd3ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path class="connector" data-connector="lease-to-read" d="M470 362 V400"/><path class="connector" data-connector="read-to-process" d="M470 492 V530"/><path class="connector" data-connector="process-to-write" d="M470 622 V660"/><path class="connector" data-connector="write-to-checkpoint" d="M470 752 V790"/><path class="connector" data-connector="checkpoint-to-status" d="M470 882 V920"/><path class="connector" data-connector="status-to-shared" d="M470 1012 V1100"/>
    <path class="connector" data-connector="job-to-partition" d="M1330 362 V400"/><path class="connector" data-connector="partition-to-read" d="M1330 492 V530"/><path class="connector" data-connector="read-to-chunk" d="M1330 622 V660"/><path class="connector" data-connector="chunk-to-restart" d="M1330 752 V790"/><path class="connector" data-connector="restart-to-status" d="M1330 882 V920"/><path class="connector" data-connector="spring-status-to-shared" d="M1330 1012 V1100"/>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="190" y="270" width="560" height="92" rx="22" fill="#17263a" stroke="#8b6bd6" stroke-width="3"/><rect class="card" x="190" y="400" width="560" height="92" rx="22" fill="#17263a" stroke="#4d8ec9" stroke-width="3"/><rect class="card" x="190" y="530" width="560" height="92" rx="22" fill="#17263a" stroke="#159c92" stroke-width="3"/><rect class="card" x="190" y="660" width="560" height="92" rx="22" fill="#17263a" stroke="#c58b2a" stroke-width="3"/><rect class="card" x="190" y="790" width="560" height="92" rx="22" fill="#17263a" stroke="#f6c96b" stroke-width="3"/><rect class="card" x="190" y="920" width="560" height="92" rx="22" fill="#17263a" stroke="#8b6bd6" stroke-width="3"/>
    <rect class="card" x="1050" y="270" width="560" height="92" rx="22" fill="#17263a" stroke="#8b6bd6" stroke-width="3"/><rect class="card" x="1050" y="400" width="560" height="92" rx="22" fill="#17263a" stroke="#4d8ec9" stroke-width="3"/><rect class="card" x="1050" y="530" width="560" height="92" rx="22" fill="#17263a" stroke="#159c92" stroke-width="3"/><rect class="card" x="1050" y="660" width="560" height="92" rx="22" fill="#17263a" stroke="#c58b2a" stroke-width="3"/><rect class="card" x="1050" y="790" width="560" height="92" rx="22" fill="#17263a" stroke="#f6c96b" stroke-width="3"/><rect class="card" x="1050" y="920" width="560" height="92" rx="22" fill="#17263a" stroke="#8b6bd6" stroke-width="3"/>
    <rect class="card" x="230" y="1100" width="1340" height="72" rx="22" fill="#17263a" stroke="#f6c96b" stroke-width="3"/>
  </g>
  <g text-anchor="middle">
    <text x="470" y="308" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#d2c4ff">Lease + Restore Checkpoint</text><text x="470" y="338" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">skip when another owner holds the lease</text>
    <text x="470" y="438" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#9ed8ff">Reader to Items</text><text x="470" y="468" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">resume from restored position</text>
    <text x="470" y="568" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#5eead4">Processor</text><text x="470" y="598" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">retry or skip policy</text>
    <text x="470" y="698" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#f6c96b">Writer</text><text x="470" y="728" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">side effect may occur before failure</text>
    <text x="470" y="828" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#f6c96b">Post-write Checkpoint</text><text x="470" y="858" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">advance only after successful write</text>
    <text x="470" y="958" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#d2c4ff">Completed / Failed / Stopped</text><text x="470" y="988" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">cancellation persists STOPPED</text>

    <text x="1330" y="308" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#d2c4ff">JobRepository + ExecutionContext</text><text x="1330" y="338" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">framework-owned restart metadata</text>
    <text x="1330" y="438" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#9ed8ff">Partitioner + TaskExecutor</text><text x="1330" y="468" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">application may override executor</text>
    <text x="1330" y="568" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#5eead4">Keyset Reader</text><text x="1330" y="598" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">stable min / max / lastKey</text>
    <text x="1330" y="698" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#f6c96b">Processor to Writer to Chunk Commit</text><text x="1330" y="728" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">writer joins the chunk transaction</text>
    <text x="1330" y="828" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#f6c96b">Persist lastKey</text><text x="1330" y="858" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">restart after the committed chunk</text>
    <text x="1330" y="958" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#d2c4ff">Job / Step Status</text><text x="1330" y="988" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">Spring Batch lifecycle</text>
    <text x="900" y="1145" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#f6c96b">Both require stable keys • idempotent effects • replay tests • cancellation policy • metrics</text>
  </g>
</svg>
