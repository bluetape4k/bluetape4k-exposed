<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Exposed cache backend and write policy selection</title>
  <desc id="desc">A dark decision map that routes one shared repository contract to local Caffeine, remote Redis, or near-cache adapters, then separates cache-aside, write-through, and write-behind durability.</desc>
  <defs>
    <marker id="flow-blue" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
    </marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="56%" stop-color="#142033"/>
      <stop offset="100%" stop-color="#20314a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <filter id="line-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1800" height="1120">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1800" height="1120" fill="url(#canvas)"/>
  <rect x="42" y="34" width="1716" height="1052" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>

  <text x="900" y="102" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="52" fill="#f8fafc">Choose Ownership Before Cache Technology</text>
  <text x="900" y="146" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="20" fill="#b6c4d6">One repository contract • three state-sharing boundaries • three durability choices</text>

  <rect x="550" y="190" width="700" height="140" rx="28" fill="#172033" stroke="#8b6bd6" stroke-width="4" filter="url(#shadow)"/>
  <text x="900" y="246" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#c4b5fd">Who must see the same cached value?</text>
  <text x="900" y="287" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#d5dfeb">JdbcCacheRepository • SuspendedJdbcCacheRepository • R2dbcCacheRepository</text>

  <g fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#line-glow)">
    <path d="M 700 330 V 365 Q 700 385 680 385 H 330 Q 310 385 310 405 V 438" marker-end="url(#flow-blue)"/>
    <path d="M 900 330 V 438" marker-end="url(#flow-blue)"/>
    <path d="M 1100 330 V 365 Q 1100 385 1120 385 H 1470 Q 1490 385 1490 405 V 438" marker-end="url(#flow-blue)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="438" width="440" height="300" rx="28" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect x="680" y="438" width="440" height="300" rx="28" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect x="1270" y="438" width="440" height="300" rx="28" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
  </g>

  <text x="310" y="495" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#9ed8ff">One JVM</text>
  <text x="310" y="531" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">LOCAL • Caffeine</text>
  <text x="135" y="582" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">JDBC   jdbc-caffeine</text>
  <text x="135" y="620" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">R2DBC  r2dbc-caffeine</text>
  <text x="310" y="676" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#b6c4d6">lowest operational cost</text>
  <text x="310" y="704" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#fda4af">no cross-JVM invalidation</text>

  <text x="900" y="495" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#5eead4">All Instances</text>
  <text x="900" y="531" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">REMOTE • Redis</text>
  <text x="725" y="582" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">JDBC   Lettuce / Redisson</text>
  <text x="725" y="620" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">R2DBC  Lettuce / Redisson</text>
  <text x="900" y="676" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#b6c4d6">shared state • explicit codec</text>
  <text x="900" y="704" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#fda4af">network + Redis failure path</text>

  <text x="1490" y="495" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#f6c96b">Hot Local Reads</text>
  <text x="1490" y="531" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">NEAR_CACHE • L1 + Redis</text>
  <text x="1315" y="582" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">Lettuce selected suspend paths</text>
  <text x="1315" y="620" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">Redisson local cached map</text>
  <text x="1490" y="676" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#b6c4d6">L1 hit before shared Redis</text>
  <text x="1490" y="704" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#fda4af">two-tier invalidation contract</text>

  <rect x="90" y="790" width="1620" height="220" rx="28" fill="#151d2b" stroke="#536377" stroke-width="3"/>
  <text x="900" y="837" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#f8fafc">Choose durability separately from location</text>

  <rect x="135" y="870" width="450" height="100" rx="20" fill="#172033" stroke="#4c8cc8" stroke-width="3"/>
  <text x="360" y="910" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#9ed8ff">Cache-aside / Read-through</text>
  <text x="360" y="944" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">DB is authority • miss loader fills cache</text>

  <rect x="675" y="870" width="450" height="100" rx="20" fill="#172033" stroke="#159c92" stroke-width="3"/>
  <text x="900" y="910" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#5eead4">Write-through</text>
  <text x="900" y="944" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">return after configured DB writer completes</text>

  <rect x="1215" y="870" width="450" height="100" rx="20" fill="#172033" stroke="#c58b2a" stroke-width="3"/>
  <text x="1440" y="910" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#f6c96b">Write-behind</text>
  <text x="1440" y="944" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">bounded queue • DB durability arrives later</text>

  <text x="900" y="1048" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#fda4af">Ordinary put is not write-through • invalidation is cache-only unless an explicit backend policy says otherwise</text>
</svg>
