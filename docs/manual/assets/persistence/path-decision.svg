<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Choose the JDBC or R2DBC persistence path</title>
  <desc id="desc">A source-backed decision map that routes one application persistence decision to JDBC or R2DBC according to driver, framework, call-chain, transaction, cancellation, testing, and migration constraints.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <marker id="arrow-teal" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#5eead4" stroke="#5eead4"/></marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#canvas)"/>
  <rect x="42" y="36" width="1516" height="928" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="52" fill="#f8fafc">Choose the Whole Persistence Path</text>
  <text x="800" y="148" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b6c4d6">Driver + framework + call chain + transaction + tests must agree</text>

  <rect class="card" x="450" y="195" width="700" height="145" rx="28" fill="#172033" stroke="#8b6bd6" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="250" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#c4b5fd">What boundary does the application own?</text>
  <text x="800" y="290" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">Choose from current constraints, not from a performance slogan</text>

  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path class="connector" d="M 650 340 V 370 Q 650 390 630 390 H 420 Q 400 390 400 410 V 470" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/>
    <path class="connector" d="M 950 340 V 370 Q 950 390 970 390 H 1180 Q 1200 390 1200 410 V 470" stroke="#5eead4" marker-end="url(#arrow-teal)"/>
  </g>
  <text x="400" y="435" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#9ed8ff">blocking boundary</text>
  <text x="1200" y="435" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#5eead4">non-blocking boundary</text>

  <rect class="card" x="100" y="470" width="600" height="350" rx="28" fill="#172033" stroke="#4c8cc8" stroke-width="4" filter="url(#shadow)"/>
  <rect class="card" x="900" y="470" width="600" height="350" rx="28" fill="#172033" stroke="#159c92" stroke-width="4" filter="url(#shadow)"/>
  <text x="400" y="530" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="38" fill="#9ed8ff">JDBC</text>
  <text x="1200" y="530" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="38" fill="#5eead4">R2DBC</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">
    <text x="150" y="585">• JDBC driver + DataSource / pool</text>
    <text x="150" y="625">• transaction { } or framework boundary</text>
    <text x="150" y="665">• blocking calls isolated from event loops</text>
    <text x="150" y="705">• mature JDBC tooling and migrations</text>
    <text x="150" y="745">• JDBC/Testcontainers integration tests</text>
    <text x="150" y="785" fill="#f6c96b">Migration cost: driver + boundary + tests</text>

    <text x="950" y="585">• R2DBC driver + ConnectionFactory / pool</text>
    <text x="950" y="625">• suspendTransaction { } or framework context</text>
    <text x="950" y="665">• non-blocking call chain end to end</text>
    <text x="950" y="705">• Flow collected inside the transaction</text>
    <text x="950" y="745">• cancellation and R2DBC driver tests</text>
    <text x="950" y="785" fill="#f6c96b">Not automatically faster: measure workload</text>
  </g>

  <rect x="180" y="865" width="1240" height="62" rx="20" fill="#201923" stroke="#d16f75" stroke-width="3"/>
  <text x="800" y="903" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#fda4af">Do not mix a JDBC driver, R2DBC transaction context, and blocking dependencies in one "reactive" path.</text>
</svg>
