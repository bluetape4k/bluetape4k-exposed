<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" role="img" aria-labelledby="title desc">
  <title id="title">JDBC and R2DBC transaction ownership</title>
  <desc id="desc">Two parallel responsibility lanes show application or framework ownership flowing through transaction context, repository, driver, and database. Repositories participate in but do not create transactions.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <marker id="arrow-teal" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#5eead4" stroke="#5eead4"/></marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <symbol id="database-icon" viewBox="0 0 128 128">
      <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
      <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
      <path d="M30 58c0 8 15 14 34 14s34-6 34-14M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect width="2000" height="1100" fill="url(#canvas)"/>
  <rect x="42" y="36" width="1916" height="1028" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="1000" y="102" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="52" fill="#f8fafc">The Caller Owns the Transaction Boundary</text>
  <text x="1000" y="146" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b6c4d6">Repositories join the current context; they do not open a hidden transaction</text>

  <rect x="70" y="195" width="1860" height="320" rx="28" fill="#111827" stroke="#4c8cc8" stroke-width="3"/>
  <text x="110" y="242" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="32" fill="#9ed8ff">JDBC ownership lane</text>
  <rect x="70" y="555" width="1860" height="320" rx="28" fill="#111827" stroke="#159c92" stroke-width="3"/>
  <text x="110" y="602" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="32" fill="#5eead4">R2DBC ownership lane</text>

  <g filter="url(#shadow)">
    <rect class="card" x="100" y="285" width="280" height="170" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
    <rect class="card" x="455" y="285" width="320" height="170" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
    <rect class="card" x="850" y="285" width="300" height="170" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect class="card" x="1225" y="285" width="300" height="170" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect class="card" x="1600" y="285" width="300" height="170" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
    <rect class="card" x="100" y="645" width="280" height="170" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
    <rect class="card" x="455" y="645" width="320" height="170" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
    <rect class="card" x="850" y="645" width="300" height="170" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="1225" y="645" width="300" height="170" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="1600" y="645" width="300" height="170" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
  </g>

  <g text-anchor="middle">
    <text x="240" y="340" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#f6c96b">Application / Spring</text><text x="240" y="380" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">owns use-case scope</text><text x="240" y="412" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">commit • rollback</text>
    <text x="615" y="340" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#c4b5fd">transaction { }</text><text x="615" y="380" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">JdbcTransaction context</text><text x="615" y="412" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">connection + isolation</text>
    <text x="1000" y="340" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#9ed8ff">JdbcRepository</text><text x="1000" y="380" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">uses current context</text><text x="1000" y="412" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#fda4af">never creates transaction</text>
    <text x="1375" y="340" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#9ed8ff">JDBC driver</text><text x="1375" y="380" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">blocking connection I/O</text>
    <use href="#database-icon" x="1618" y="303" width="90" height="90"/><text x="1795" y="350" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#f6c96b">Database</text><text x="1795" y="388" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">durable state</text>

    <text x="240" y="700" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#f6c96b">Application / Spring</text><text x="240" y="740" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">owns coroutine scope</text><text x="240" y="772" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">commit • rollback</text>
    <text x="615" y="700" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#c4b5fd">suspendTransaction { }</text><text x="615" y="740" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">R2dbcTransaction context</text><text x="615" y="772" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">connection + cancellation</text>
    <text x="1000" y="700" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#5eead4">R2dbcRepository</text><text x="1000" y="740" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">Flow collected here</text><text x="1000" y="772" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#fda4af">never creates transaction</text>
    <text x="1375" y="700" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#5eead4">R2DBC driver</text><text x="1375" y="740" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">non-blocking connection I/O</text>
    <use href="#database-icon" x="1618" y="663" width="90" height="90"/><text x="1795" y="710" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#f6c96b">Database</text><text x="1795" y="748" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">durable state</text>
  </g>

  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path class="connector" d="M380 370 H455" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/><path class="connector" d="M775 370 H850" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/><path class="connector" d="M1150 370 H1225" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/><path class="connector" d="M1525 370 H1600" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/>
    <path class="connector" d="M380 730 H455" stroke="#5eead4" marker-end="url(#arrow-teal)"/><path class="connector" d="M775 730 H850" stroke="#5eead4" marker-end="url(#arrow-teal)"/><path class="connector" d="M1150 730 H1225" stroke="#5eead4" marker-end="url(#arrow-teal)"/><path class="connector" d="M1525 730 H1600" stroke="#5eead4" marker-end="url(#arrow-teal)"/>
  </g>

  <rect x="220" y="925" width="1560" height="74" rx="22" fill="#201923" stroke="#d16f75" stroke-width="3"/>
  <text x="1000" y="958" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="24" fill="#fda4af">One business operation, one owner, one propagated transaction context</text>
  <text x="1000" y="985" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">Returning a DAO entity or uncollected database Flow crosses the boundary before the work is complete.</text>
</svg>
