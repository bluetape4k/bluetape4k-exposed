<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Spring Boot R2DBC ownership boundary</title>
  <desc id="desc">A dark architecture flow showing caller-owned ConnectionPool and R2dbcDatabase, thin mapping-only auto-configuration, repository scanning and factory, Exposed suspend transactions, and the database. It explicitly excludes a Spring reactive transaction manager.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#8fd3ff"/></marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#111d31"/><stop offset="1" stop-color="#1d2c43"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2639"/><stop offset="1" stop-color="#0f1726"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1800" height="1200" fill="url(#canvas)"/><rect x="40" y="34" width="1720" height="1128" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4"/>
  <text x="900" y="100" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Spring R2DBC: Thin Integration, Explicit Transactions</text>
  <text x="900" y="143" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b8c7d9">1.11 • application-owned pool • Exposed coroutine transaction boundary</text>
  <g fill="none" stroke="#8fd3ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path class="connector" data-connector="app-to-runtime" d="M900 282 V330"/><path class="connector" data-connector="runtime-to-mapping" d="M900 442 V490"/><path class="connector" data-connector="mapping-to-scan" d="M900 582 V630"/><path class="connector" data-connector="scan-to-factory" d="M900 722 V770"/><path class="connector" data-connector="factory-to-transaction" d="M900 862 V910"/><path class="connector" data-connector="transaction-to-db" d="M900 1002 V1040"/>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="560" y="190" width="680" height="92" rx="22" fill="#17263a" stroke="#8b6bd6" stroke-width="3"/>
    <rect class="card" x="500" y="330" width="800" height="112" rx="22" fill="#17263a" stroke="#4d8ec9" stroke-width="3"/>
    <rect class="card" x="560" y="490" width="680" height="92" rx="22" fill="#17263a" stroke="#159c92" stroke-width="3"/>
    <rect class="card" x="560" y="630" width="680" height="92" rx="22" fill="#17263a" stroke="#4d8ec9" stroke-width="3"/>
    <rect class="card" x="560" y="770" width="680" height="92" rx="22" fill="#17263a" stroke="#159c92" stroke-width="3"/>
    <rect class="card" x="560" y="910" width="680" height="92" rx="22" fill="#17263a" stroke="#c58b2a" stroke-width="3"/>
    <rect class="card" x="650" y="1040" width="500" height="72" rx="20" fill="#17263a" stroke="#8b6bd6" stroke-width="3"/>
    <rect class="card" x="80" y="485" width="350" height="190" rx="22" fill="#111b2c" stroke="#f6c96b" stroke-width="3"/>
    <rect class="card" x="1370" y="485" width="350" height="190" rx="22" fill="#111b2c" stroke="#fda4af" stroke-width="3"/>
  </g>
  <g text-anchor="middle">
    <text x="900" y="228" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#d2c4ff">Spring Boot Application</text><text x="900" y="258" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d8e2ee">coroutine or WebFlux call chain</text>
    <text x="900" y="370" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#9ed8ff">Caller ConnectionPool + R2dbcDatabase</text><text x="900" y="404" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d8e2ee">application creates, configures, and closes both</text>
    <text x="900" y="528" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#5eead4">Thin Mapping Auto-configuration</text><text x="900" y="558" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d8e2ee">mapping context only; no pool or database construction</text>
    <text x="900" y="668" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#9ed8ff">@EnableExposedR2dbcRepositories</text><text x="900" y="698" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d8e2ee">scan repository interfaces</text>
    <text x="900" y="808" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#5eead4">Repository Factory</text><text x="900" y="838" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d8e2ee">SimpleR2dbcRepository implementation</text>
    <text x="900" y="948" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#f6c96b">Exposed suspendTransaction</text><text x="900" y="978" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d8e2ee">wrap related calls together for multi-operation atomicity</text>
    <text x="900" y="1085" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#d2c4ff">R2DBC Database</text>
    <text x="255" y="530" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#f6c96b">Application owns</text><text x="255" y="568" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">pool • credentials</text><text x="255" y="598" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">schema • lifecycle</text><text x="255" y="628" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">outer transaction scope</text>
    <text x="1545" y="530" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#fda4af">Not provided</text><text x="1545" y="568" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">Spring reactive TM</text><text x="1545" y="598" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">implicit multi-call</text><text x="1545" y="628" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d8e2ee">transaction ownership</text>
  </g>
</svg>
