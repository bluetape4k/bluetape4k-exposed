<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Batch Runtime Role Map</title>
  <desc id="desc">Role map for exposed-batch showing the DSL, BatchJob, StepRunner, Reader/Processor/Writer contracts, and checkpoint repositories.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#b9851b" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755bc6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#f6f0e8}.frame{fill:#fffaf2;stroke:#28485a;stroke-width:4}.lane{stroke-width:2.4}.card{fill:#fffdf8;stroke-width:2.2}.title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:48px;fill:#21343f}.subtitle,.cardText,.small,.label,.step{font-family:"Comic Mono",monospace;fill:#51636f}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:27px;fill:#21343f}.cardTitle{font-family:"Comic Mono",monospace;font-size:17px;font-weight:700;fill:#20323d}.cardText{font-size:13px}.small{font-size:12px}.label{font-size:12px;fill:#315664}.code{fill:#9b3d5a;font-weight:700}.type{fill:#176f7a;font-weight:700}.warn{fill:#8a5b00;font-weight:700}.blue{stroke:#8db7c2}.green{stroke:#a9c58b}.gold{stroke:#d3a663}.purple{stroke:#b2a1dc}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.lineBlue{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.lineGreen{stroke:#6e8f4f;marker-end:url(#arrow-green)}.lineGold{stroke:#b9851b;marker-end:url(#arrow-gold)}.linePurple{stroke:#755bc6;marker-end:url(#arrow-purple)}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1000"/>
  <rect class="frame" x="36" y="30" width="1728" height="940" rx="24"/>
  <text class="title" x="86" y="96">Batch Runtime Role Map</text>
  <text class="subtitle" x="90" y="132">A coroutine-first chunk pipeline: DSL builds a job, StepRunner owns execution, repositories persist restart state.</text>

  <rect class="lane" x="82" y="178" width="410" height="682" rx="18" fill="#e7f1f4" stroke="#9dbbc4"/>
  <text class="laneTitle" x="116" y="226">User-facing DSL</text>
  <g transform="translate(122 272)">
    <rect class="card blue" width="330" height="112" rx="12"/>
    <text class="cardTitle code" x="165" y="32" text-anchor="middle">batchJob("name")</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">repository(...), params(...)</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">one or more step blocks</text>
  </g>
  <g transform="translate(122 444)">
    <rect class="card blue" width="330" height="130" rx="12"/>
    <text class="cardTitle" x="165" y="32" text-anchor="middle">BatchJob</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">runs steps sequentially</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">maps report to SuspendWork</text>
    <text class="cardText" x="165" y="104" text-anchor="middle">persists final Job status</text>
  </g>
  <g transform="translate(122 636)">
    <rect class="card blue" width="330" height="130" rx="12"/>
    <text class="cardTitle" x="165" y="32" text-anchor="middle">BatchStep</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">reader -> processor -> writer</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">chunkSize, skipPolicy</text>
    <text class="cardText" x="165" y="104" text-anchor="middle">retryPolicy, commitTimeout</text>
  </g>

  <rect class="lane" x="540" y="178" width="410" height="682" rx="18" fill="#eef4e6" stroke="#a9c58b"/>
  <text class="laneTitle" x="574" y="226">Execution engine</text>
  <g transform="translate(580 272)">
    <rect class="card green" width="330" height="150" rx="12"/>
    <text class="cardTitle type" x="165" y="32" text-anchor="middle">BatchStepRunner</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">skips completed steps</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">opens reader and writer</text>
    <text class="cardText" x="165" y="104" text-anchor="middle">collects chunks until EOF</text>
    <text class="cardText" x="165" y="126" text-anchor="middle">never swallows cancellation</text>
  </g>
  <g transform="translate(580 500)">
    <rect class="card green" width="330" height="130" rx="12"/>
    <text class="cardTitle" x="165" y="32" text-anchor="middle">Failure controls</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">processor skip per item</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">writer retry per chunk</text>
    <text class="cardText" x="165" y="104" text-anchor="middle">write timeout becomes error</text>
  </g>
  <g transform="translate(580 708)">
    <rect class="card green" width="330" height="112" rx="12"/>
    <text class="cardTitle" x="165" y="32" text-anchor="middle">StepReport</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">read / write / skip counts</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">final status + checkpoint</text>
  </g>

  <rect class="lane" x="998" y="178" width="410" height="682" rx="18" fill="#fff0d8" stroke="#d3a663"/>
  <text class="laneTitle" x="1032" y="226">I/O contracts</text>
  <g transform="translate(1038 272)">
    <rect class="card gold" width="330" height="130" rx="12"/>
    <text class="cardTitle warn" x="165" y="32" text-anchor="middle">BatchReader</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">open, read, close</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">checkpoint / restoreFrom</text>
    <text class="cardText" x="165" y="104" text-anchor="middle">onChunkCommitted advances key</text>
  </g>
  <g transform="translate(1038 464)">
    <rect class="card gold" width="330" height="112" rx="12"/>
    <text class="cardTitle" x="165" y="32" text-anchor="middle">BatchProcessor</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">suspend transform per item</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">null means filtered item</text>
  </g>
  <g transform="translate(1038 638)">
    <rect class="card gold" width="330" height="112" rx="12"/>
    <text class="cardTitle" x="165" y="32" text-anchor="middle">BatchWriter</text>
    <text class="cardText" x="165" y="60" text-anchor="middle">writes a whole chunk</text>
    <text class="cardText" x="165" y="82" text-anchor="middle">JDBC/R2DBC use batchInsert</text>
  </g>

  <rect class="lane" x="1456" y="178" width="262" height="682" rx="18" fill="#efe9fb" stroke="#b2a1dc"/>
  <text class="laneTitle" x="1488" y="226">State store</text>
  <g transform="translate(1488 272)">
    <rect class="card purple" width="198" height="126" rx="12"/>
    <text class="cardTitle" x="99" y="32" text-anchor="middle">InMemory</text>
    <text class="cardText" x="99" y="60" text-anchor="middle">test and simple use</text>
    <text class="cardText" x="99" y="82" text-anchor="middle">keeps Any checkpoint</text>
  </g>
  <g transform="translate(1488 474)">
    <rect class="card purple" width="198" height="196" rx="12"/>
    <image data-bluetape4k-icon="database.generic" x="79" y="20" width="40" height="40" href="data:image/svg+xml;base64,"/>
    <text class="cardTitle" x="99" y="82" text-anchor="middle">Execution tables</text>
    <text class="cardText" x="99" y="110" text-anchor="middle">batch_job_execution</text>
    <text class="cardText" x="99" y="132" text-anchor="middle">batch_step_execution</text>
    <text class="cardText" x="99" y="154" text-anchor="middle">JDBC + R2DBC repos</text>
    <text class="cardText" x="99" y="176" text-anchor="middle">TypedCheckpoint JSON</text>
  </g>

  <path class="line lineBlue" d="M287 384 V444"/>
  <path class="line lineBlue" d="M287 574 V636"/>
  <path class="line lineGreen" d="M 452 701 L 536 701 Q 548 701 548 713 L 548 752 Q 548 764 560 764 L 580 764"/>
  <path class="line lineGold" d="M910 347 H1038"/>
  <path class="line lineGold" d="M910 565 H1038"/>
  <path class="line lineGold" d="M 910 736 L 966 736 Q 978 736 978 724 L 978 706 Q 978 694 990 694 L 1038 694"/>
  <path class="line linePurple" d="M 910 347 L 944 347 Q 956 347 956 335 L 956 256 Q 956 244 968 244 L 1575 244 Q 1587 244 1587 256 L 1587 272"/>
  <path class="line linePurple" d="M 910 806 L 1575 806 Q 1587 806 1587 794 L 1587 670"/>
  <path class="line linePurple" d="M 1368 672 L 1418 672 Q 1430 672 1430 660 L 1430 637 Q 1430 625 1442 625 L 1488 625"/>

  <text class="label" x="468" y="684">configured step</text>
  <text class="label" x="932" y="330">pull items</text>
  <text class="label" x="932" y="548">apply transform</text>
  <text class="label" x="994" y="682">write chunk</text>
  <text class="label" x="1240" y="790">persist progress</text>

  <rect x="128" y="904" width="1544" height="34" rx="10" fill="#eef3f4" stroke="#c2d1d4" stroke-width="1.8"/>
  <text class="small" x="900" y="926" text-anchor="middle">Reader-facing contract: checkpoint keys advance only after writer success; completed steps are skipped on restart without opening reader or writer.</text>
</svg>
