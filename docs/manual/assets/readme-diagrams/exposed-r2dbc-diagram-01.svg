<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Repository Runtime Boundary</title>
  <desc id="desc">Architecture view of exposed-r2dbc runtime boundaries from coroutine callers to repository contracts, Exposed R2DBC statements, and database drivers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#327d91" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#20303a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 19px; fill: #51636f; }
      .layerTitle { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 28px; fill: #21343f; }
      .cardTitle { font-family: "Comic Mono", monospace; font-size: 20px; font-weight: 700; fill: #20323d; }
      .cardText { font-family: "Comic Mono", monospace; font-size: 16px; fill: #33454f; }
      .cardSmall { font-family: "Comic Mono", monospace; font-size: 14px; fill: #33454f; }
      .small { font-family: "Comic Mono", monospace; font-size: 14px; fill: #52636f; }
      .label { font-family: "Comic Mono", monospace; font-size: 14px; fill: #315664; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="980"/>
  <rect class="frame" x="42" y="34" width="1596" height="908" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Repository Runtime Boundary</text>
  <text class="subtitle" x="86" y="126">Callers own the transaction; repositories map rows and delegate SQL work to Exposed R2DBC.</text>

  <g transform="translate(94 166)">
    <rect x="0" y="0" width="1492" height="146" rx="18" fill="#e7f1f4" stroke="#9dbbc4" stroke-width="2.5"/>
    <text class="layerTitle" x="28" y="44">Coroutine application layer</text>
    <rect x="384" y="28" width="440" height="90" rx="14" fill="#fffdf8" stroke="#8db7c2" stroke-width="2"/>
    <text class="cardTitle code" x="412" y="62">suspendTransaction</text>
    <text class="cardText" x="412" y="92">caller owns transaction scope</text>
    <rect x="884" y="28" width="470" height="90" rx="14" fill="#fffdf8" stroke="#8db7c2" stroke-width="2"/>
    <text class="cardTitle" x="912" y="62">Flow collector</text>
    <text class="cardText" x="912" y="92">multi-row reads stream as <tspan class="type">Flow&lt;E&gt;</tspan></text>
  </g>

  <path d="M840 312 V370" stroke="#327d91" stroke-width="4.4" marker-end="url(#arrow)" fill="none"/>
  <text class="label" x="862" y="350">repository call</text>

  <g transform="translate(94 370)">
    <rect x="0" y="0" width="1492" height="210" rx="18" fill="#eef4e6" stroke="#a9c58b" stroke-width="2.5"/>
    <text class="layerTitle" x="28" y="44">Repository contract layer</text>
    <rect x="218" y="52" width="382" height="116" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>
    <text class="cardTitle type" x="246" y="86">R2dbcRepository</text>
    <text class="cardText" x="246" y="116"><tspan class="type">IdTable&lt;ID&gt;</tspan> + <tspan class="code">toEntity()</tspan></text>
    <text class="cardText" x="246" y="146">CRUD, page, batch writes</text>
    <rect x="628" y="52" width="382" height="116" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>
    <text class="cardTitle" x="656" y="86">Auditable extension</text>
    <text class="cardSmall" x="656" y="116"><tspan class="code">updatedAt</tspan> = <tspan class="type">CurrentTimestamp</tspan></text>
    <text class="cardSmall" x="656" y="146"><tspan class="code">updatedBy</tspan> from arg/context</text>
    <rect x="1038" y="52" width="382" height="116" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>
    <text class="cardTitle" x="1066" y="86">Soft-delete extension</text>
    <text class="cardText" x="1066" y="116"><tspan class="code">isDeleted</tspan> flag updates</text>
    <text class="cardText" x="1066" y="146"><tspan class="code">findActive</tspan> / <tspan class="code">findDeleted</tspan></text>
  </g>

  <path d="M840 580 V638" stroke="#327d91" stroke-width="4.4" marker-end="url(#arrow)" fill="none"/>
  <text class="label" x="862" y="618">statement delegation</text>

  <g transform="translate(94 638)">
    <rect x="0" y="0" width="1492" height="184" rx="18" fill="#fff0d8" stroke="#d8ad68" stroke-width="2.5"/><image data-bluetape4k-icon="generic.database" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="layerTitle" x="28" y="44">Exposed R2DBC and driver layer</text>
    <rect x="184" y="52" width="344" height="98" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle" x="240" y="86">R2DBC Query</text>
    <text class="cardText" x="240" y="116"><tspan class="keyword">select</tspan> / <tspan class="keyword">update</tspan> / <tspan class="keyword">delete</tspan></text>
    <rect x="588" y="52" width="406" height="98" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle" x="618" y="86">Additional SQL helpers</text>
    <text class="cardText" x="618" y="116"><tspan class="keyword">CTE</tspan>, <tspan class="keyword">SELECT *</tspan>, <tspan class="keyword">ON CONFLICT</tspan></text>
    <rect x="1054" y="52" width="344" height="98" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle" x="1082" y="86">R2DBC driver</text>
    <text class="cardText" x="1082" y="116">H2 / PostgreSQL / MySQL</text>
  </g>

  <g transform="translate(126 858)">
    <rect x="0" y="0" width="1428" height="46" rx="14" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
    <text class="small" x="28" y="30"><tspan class="type">VirtualThreadTransaction</tspan> is an optional execution helper; it still runs Exposed R2DBC work through <tspan class="code">suspendTransaction</tspan>.</text>
  </g>
</svg>
