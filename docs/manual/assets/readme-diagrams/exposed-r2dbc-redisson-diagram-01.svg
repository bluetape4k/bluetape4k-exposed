<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Redisson Repository Boundary</title>
  <desc id="desc">Architecture diagram for exposed-r2dbc-redisson showing coroutine repository calls, writer-backed Redisson maps, cache-only invalidation, and R2DBC loader/writer transactions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#327d91" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#9b5e3b" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#20303a" flood-opacity="0.14"/></filter>
    <style>
      .canvas { fill: #f6f0e8; }
      .frame { fill: #fffaf2; stroke: #28485a; stroke-width: 4; }
      .title { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 46px; fill: #21343f; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 18px; fill: #51636f; }
      .zoneTitle { font-family: "Architects Daughter", "Comic Mono", monospace; font-size: 27px; fill: #21343f; }
      .cardTitle { font-family: "Comic Mono", monospace; font-size: 19px; font-weight: 700; fill: #20323d; }
      .cardText { font-family: "Comic Mono", monospace; font-size: 15px; fill: #33454f; }
      .small { font-family: "Comic Mono", monospace; font-size: 13px; fill: #52636f; }
      .label { font-family: "Comic Mono", monospace; font-size: 14px; fill: #315664; }
      .flow { stroke: #327d91; stroke-width: 4.3; marker-end: url(#arrow); fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .side { stroke: #7d6ab0; stroke-width: 4.1; marker-end: url(#arrow); fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .write { stroke: #8c6f33; stroke-width: 4.1; marker-end: url(#arrow); fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .warn { stroke: #9b5e3b; stroke-width: 4.1; marker-end: url(#arrowWarn); fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; }
      .code { fill: #9b3d5a; font-weight: 700; }
      .type { fill: #176f7a; font-weight: 700; }
      .keyword { fill: #8a5b00; font-weight: 700; }
    </style>
    <marker id="arrow-327d91" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#327d91" stroke="#327d91" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-7d6ab0" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#7d6ab0" stroke="#7d6ab0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-8c6f33" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#8c6f33" stroke="#8c6f33" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  </defs>

  <rect class="canvas" width="1680" height="1080"/>
  <rect class="frame" x="42" y="34" width="1596" height="1008" rx="24" filter="url(#shadow)"/>
  <text class="title" x="84" y="91">R2DBC Redisson Repository Boundary</text>
  <text class="subtitle" x="86" y="126">A suspend repository fronts Redisson maps; misses and writer callbacks cross into Exposed R2DBC transactions.</text>

  <g transform="translate(92 164)">
    <rect x="0" y="0" width="1496" height="176" rx="18" fill="#e7f1f4" stroke="#9dbbc4" stroke-width="2.5"/><image data-bluetape4k-icon="redis.icon" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="zoneTitle" x="28" y="46">Coroutine repository surface</text>
    <rect x="284" y="66" width="330" height="88" rx="14" fill="#fffdf8" stroke="#8db7c2" stroke-width="2"/>
    <text class="cardTitle" x="314" y="99">Caller coroutine</text>
    <text class="cardText" x="314" y="128"><tspan class="code">get</tspan>, <tspan class="code">put</tspan>, <tspan class="code">findAll</tspan>, <tspan class="code">invalidate</tspan></text>
    <rect x="760" y="58" width="466" height="104" rx="14" fill="#fffdf8" stroke="#8db7c2" stroke-width="2"/>
    <text class="cardTitle type" x="790" y="94">AbstractR2dbcRedissonRepository</text>
    <text class="cardText" x="790" y="124">selects cache mode + write mode</text>
    <text class="cardText" x="790" y="148">implements <tspan class="type">R2dbcRedissonRepository</tspan></text>
  </g>

  <path class="flow" d="M866 340 V386" style="marker-end:url(#arrow-327d91)"/>
  <text class="label" x="888" y="368">suspend repository call</text>

  <g transform="translate(92 386)">
    <rect x="0" y="0" width="1496" height="298" rx="18" fill="#eef4e6" stroke="#a9c58b" stroke-width="2.5"/><image data-bluetape4k-icon="redis.icon" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="zoneTitle" x="28" y="46">Redisson cache boundary</text>
    <rect x="112" y="82" width="356" height="132" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>

    <text class="cardTitle type" x="198" y="120">RLocalCachedMap</text>
    <text class="cardText" x="198" y="150">optional Near Cache</text>
    <text class="cardText" x="138" y="190">cleared after cache-only invalidation</text>

    <rect x="560" y="64" width="430" height="168" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>

    <text class="cardTitle type" x="656" y="112">Writer-backed Redisson map</text>
    <text class="cardText" x="656" y="142"><tspan class="type">RMapCache</tspan> or <tspan class="type">RLocalCachedMap</tspan></text>
    <text class="cardText" x="590" y="176">loaderAsync always; writerAsync for writes</text>
    <text class="cardText" x="590" y="206"><tspan class="type">READ_ONLY</tspan>, <tspan class="type">WRITE_THROUGH</tspan>, <tspan class="type">WRITE_BEHIND</tspan></text>

    <rect x="1088" y="82" width="334" height="132" rx="14" fill="#fffdf8" stroke="#a7c481" stroke-width="2"/>

    <text class="cardTitle" x="1176" y="120">cacheOnlyMap</text>
    <text class="cardText" x="1176" y="150">same Redis name</text>
    <text class="cardText" x="1116" y="190">writerless cache removal</text>
  </g>

  <path class="flow" d="M560 520 H652" style="marker-end:url(#arrow-327d91)"/>
  <text class="label" x="578" y="500">near miss</text>
  <path class="side" d="M1082 530 H1180" style="marker-end:url(#arrow-7d6ab0)"/>
  <text class="label" x="1096" y="510">cache-only</text>
  <path class="flow" d="M866 684 V734" style="marker-end:url(#arrow-327d91)"/>
  <text class="label" x="888" y="716">loader / writer callbacks</text>

  <g transform="translate(92 734)">
    <rect x="0" y="0" width="1496" height="204" rx="18" fill="#fff0d8" stroke="#d8ad68" stroke-width="2.5"/>
    <text class="zoneTitle" x="28" y="46">Exposed R2DBC persistence boundary</text>
    <rect x="118" y="76" width="382" height="92" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle code" x="146" y="108">R2dbcExposedEntityMapLoader</text>
    <text class="cardText" x="146" y="138"><tspan class="keyword">SELECT</tspan> by id; PK-ascending keys</text>
    <rect x="596" y="76" width="408" height="92" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>
    <text class="cardTitle code" x="624" y="108">R2dbcExposedEntityMapWriter</text>
    <text class="cardText" x="624" y="138"><tspan class="keyword">UPDATE</tspan>/<tspan class="keyword">INSERT</tspan>; optional <tspan class="keyword">DELETE</tspan></text>
    <rect x="1108" y="68" width="308" height="108" rx="14" fill="#fffdf8" stroke="#d8ad68" stroke-width="2"/>

    <text class="cardTitle" x="1196" y="108">R2DBC database</text>
    <text class="cardText" x="1196" y="138"><tspan class="code">suspendTransaction</tspan></text>
  </g>

  <path class="write" d="M1096 842 H1224" style="marker-end:url(#arrow-8c6f33)"/>
  <text class="label" x="1120" y="822">DB rows</text>

  <g transform="translate(126 970)">
    <rect x="0" y="0" width="1428" height="50" rx="14" fill="#eef3f4" stroke="#c2d1d4" stroke-width="2"/>
    <text class="small" x="28" y="31">Boundary rule: invalidation removes Redis state by default; database row deletion is opt-in and batched through the R2DBC writer.</text>
  </g>
</svg>
