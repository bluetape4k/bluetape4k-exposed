<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">MySQL8 GIS Serialization Flow</title>
  <desc id="desc">Flow diagram showing exposed-mysql8 geometry helper registration, write serialization, SQL literal generation, MySQL storage, and readback parsing.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.layerTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}.title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B;font-weight:400}.small{font-family:"Comic Mono";font-size:12px;fill:#627184;font-weight:400}
      .edge{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
      .labelPill{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}.label{font-family:"Comic Mono";font-size:13px;font-weight:700}.blue{fill:#3D6FAD}.teal{fill:#247B77}.gold{fill:#8A6417}.purple{fill:#624EB1}
      .note{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}.warn{fill:#FFF3D9;stroke:#D6A441;stroke-width:1.8}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1120"/>
  <rect class="frame" x="44" y="36" width="1592" height="1048" rx="34"/>
  <text class="title" x="76" y="90">MySQL8 GIS Serialization Flow</text>
  <text class="subtitle" x="80" y="124">ColumnType owns the MySQL-specific boundary: JTS objects become internal geometry bytes or SQL literals.</text>

  <rect class="layer" x="92" y="170" width="1496" height="142" rx="18"/>
  <text class="layerTitle" x="118" y="206">1. Table declaration</text>
  <rect class="card" x="202" y="224" width="294" height="58" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="349" y="247" text-anchor="middle">Table.geoPoint</text>
  <text class="detail" x="349" y="269" text-anchor="middle">checks MysqlDialect</text>
  <rect class="card" x="666" y="224" width="348" height="58" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="840" y="247" text-anchor="middle">registerColumn(...)</text>
  <text class="detail" x="840" y="269" text-anchor="middle">GeometryColumnType&lt;T&gt;</text>
  <rect class="card" x="1188" y="224" width="274" height="58" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1325" y="247" text-anchor="middle">POINT SRID 4326</text>
  <text class="detail" x="1325" y="269" text-anchor="middle">sqlType()</text>

  <rect class="layer" x="92" y="352" width="1496" height="296" rx="18"/>
  <text class="layerTitle" x="118" y="388">2. Write paths</text>
  <rect class="card" x="168" y="424" width="352" height="82" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="344" y="451" text-anchor="middle">JTS Geometry value</text>
  <text class="detail" x="344" y="474" text-anchor="middle">Point, Polygon, LineString...</text>
  <rect class="card" x="664" y="396" width="352" height="92" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="840" y="424" text-anchor="middle">notNullValueToDB</text>
  <text class="detail" x="840" y="448" text-anchor="middle">buildMySqlInternalGeometry()</text>
  <text class="small" x="840" y="468" text-anchor="middle">4-byte SRID LE + WKB</text>
  <rect class="card" x="664" y="522" width="352" height="92" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="840" y="550" text-anchor="middle">nonNullValueToString</text>
  <text class="detail" x="840" y="574" text-anchor="middle">ST_GeomFromWKB(...)</text>
  <text class="small" x="840" y="594" text-anchor="middle">axis-order=long-lat</text>
  <rect class="card" x="1170" y="454" width="330" height="92" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1335" y="482" text-anchor="middle">MySQL 8 GIS column</text>
  <text class="detail" x="1335" y="506" text-anchor="middle">spatial value with SRID</text>
  <text class="small" x="1335" y="526" text-anchor="middle">storage remains MySQL-owned</text>

  <rect class="layer" x="92" y="688" width="1496" height="284" rx="18"/>
  <text class="layerTitle" x="118" y="724">3. Readback and validation</text>
  <rect class="card" x="1170" y="764" width="330" height="82" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1335" y="791" text-anchor="middle">JDBC ByteArray</text>
  <text class="detail" x="1335" y="814" text-anchor="middle">MySQL internal format</text>
  <rect class="card" x="664" y="764" width="352" height="82" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="840" y="791" text-anchor="middle">valueFromDB</text>
  <text class="detail" x="840" y="814" text-anchor="middle">parseMySqlInternalGeometry()</text>
  <rect class="card" x="168" y="764" width="352" height="82" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="344" y="791" text-anchor="middle">Typed JTS result</text>
  <text class="detail" x="344" y="814" text-anchor="middle">subtype checked except GEOMETRY</text>
  <rect class="warn" x="556" y="884" width="568" height="54" rx="12"/>
  <text class="detail" x="840" y="906" text-anchor="middle">Unexpected DB value types are logged with geometryType, then fail fast.</text>
  <text class="small" x="840" y="926" text-anchor="middle">Bad WKB parse failures keep SRID and byte-size diagnostics in logs.</text>

  <path class="edge" d="M 496 253 L 666 253" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <rect class="labelPill" x="534" y="218" width="96" height="28" rx="14"/><text class="label blue" x="582" y="237" text-anchor="middle">register</text>
  <path class="edge" d="M 1014 253 L 1188 253" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <rect class="labelPill" x="1056" y="218" width="94" height="28" rx="14"/><text class="label purple" x="1103" y="237" text-anchor="middle">sqlType</text>

  <path class="edge" d="M 520 442 L 664 442" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <rect class="labelPill" x="548" y="413" width="80" height="28" rx="14"/><text class="label teal" x="588" y="432" text-anchor="middle">bind</text>
  <path class="edge" d="M 520 488 L 620 488 Q 632 488 632 500 L 632 556 Q 632 568 644 568 L 664 568" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <rect class="labelPill" x="532" y="526" width="102" height="28" rx="14"/><text class="label gold" x="583" y="545" text-anchor="middle">literal</text>
  <path class="edge" d="M 1016 442 L 1138 442 Q 1150 442 1150 454 L 1150 488 Q 1150 500 1162 500 L 1170 500" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1016 568 L 1128 568 Q 1140 568 1140 556 L 1140 534 Q 1140 522 1152 522 L 1170 522" stroke="#B9851B" marker-end="url(#arrow-gold)"/>

  <path class="return" d="M 1335 546 L 1335 764" stroke="#755BC6"/>
<polygon points="1335,764 1330,754 1340,754" fill="#755BC6" stroke="#755BC6" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect class="labelPill" x="1402" y="642" width="134" height="28" rx="14"/><text class="label purple" x="1469" y="661" text-anchor="middle">select read</text>
  <path class="return" d="M 1170 805 L 1016 805" stroke="#755BC6"/>
<polygon points="1016,805 1026,800 1026,810" fill="#755BC6" stroke="#755BC6" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect class="labelPill" x="1046" y="770" width="94" height="28" rx="14"/><text class="label purple" x="1093" y="789" text-anchor="middle">parse</text>
  <path class="return" d="M 664 805 L 520 805" stroke="#4F83BF"/>
<polygon points="520,805 530,800 530,810" fill="#4F83BF" stroke="#4F83BF" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect class="labelPill" x="558" y="770" width="70" height="28" rx="14"/><text class="label blue" x="593" y="789" text-anchor="middle">cast</text>

  <g transform="translate(112,1000)">
    <rect class="note" x="0" y="0" width="1456" height="58" rx="12"/>
    <text class="small" x="728" y="24" text-anchor="middle">The database stores geometry, not the original Kotlin helper call. Keep SRID and coordinate order explicit at the table boundary.</text>
    <text class="small" x="728" y="43" text-anchor="middle">WGS84 helper functions use longitude first, latitude second; SQL literal generation preserves that long-lat axis order.</text>
  </g>
</svg>
