<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc">
<title id="title">WebFlux suspend request flow</title>
<desc id="desc">Suspend WebFlux product API request flow showing read calls, create calls, guarded update and delete transactions, row mapping, database access, and HTTP response creation.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7.5 4 Q 13 6.5 7.5 9 L 1 12" fill="none" stroke="#5d6f83" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="readArrow" markerWidth="14" markerHeight="14" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7.5 4 Q 13 6.5 7.5 9 L 1 12" fill="none" stroke="#5b8def" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="writeArrow" markerWidth="14" markerHeight="14" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7.5 4 Q 13 6.5 7.5 9 L 1 12" fill="none" stroke="#dc6b82" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="dtoArrow" markerWidth="14" markerHeight="14" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7.5 4 Q 13 6.5 7.5 9 L 1 12" fill="none" stroke="#58a978" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .band{fill:#fbfdff;stroke:#d8e0ea;stroke-width:1.4}
    .bandTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:24px;fill:#243447}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:17px;fill:#536273}
    .card{stroke-width:2.2;filter:url(#shadow)}
    .label{font-family:"Architects Daughter","Comic Mono",monospace;font-size:25px;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:15px;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:15px;fill:#102033}
    .line{stroke:#5d6f83;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
    .read{stroke:#5b8def;stroke-width:2.6;fill:none;marker-end:url(#readArrow)}
    .write{stroke:#dc6b82;stroke-width:2.6;fill:none;marker-end:url(#writeArrow)}
    .dto{stroke:#58a978;stroke-width:2.6;fill:none;marker-end:url(#dtoArrow)}
  </style>
</defs>
<rect class="canvas" width="1540" height="900"/>
<rect class="frame" x="32" y="28" width="1476" height="844" rx="26"/>
<text class="title" x="68" y="86">WebFlux Suspend Request Flow</text>
<text class="subtitle" x="72" y="120">Controller endpoints call suspend repository methods; guarded mutations stay inside suspendTransaction.</text>

<rect class="band" x="64" y="154" width="1412" height="150" rx="18"/>
<text class="bandTitle" x="90" y="188">HTTP boundary</text>
<rect class="band" x="64" y="354" width="1412" height="280" rx="18"/>
<text class="bandTitle" x="90" y="396">Suspend repository work</text>
<rect class="band" x="64" y="684" width="1412" height="128" rx="18"/>
<text class="bandTitle" x="90" y="708">Database and response boundary</text>

<path class="line" d="M330 246 H424"/>
<path class="line" d="M764 246 H820"/>
<path class="read" d="M 908 292 L 908 370 Q 908 382 896 382 L 427 382 Q 415 382 415 394 L 415 424"/>
<path class="write" d="M 995 292 L 995 370 Q 995 382 983 382 L 787 382 Q 775 382 775 394 L 775 424"/>
<path class="write" d="M 1082 292 L 1082 370 Q 1082 382 1094 382 L 1138 382 Q 1150 382 1150 394 L 1150 424"/>
<path class="read" d="M 415 534 L 415 586 Q 415 598 427 598 L 610 598"/>
<path class="write" d="M775 534 V554"/>
<path class="write" d="M 1150 534 L 1150 586 Q 1150 598 1138 598 L 940 598"/>
<path class="dto" d="M 940 598 L 1028 598 Q 1040 598 1040 610 L 1040 753 Q 1040 765 1052 765 L 1244 765"/>
<path class="dto" d="M 610 598 L 532 598 Q 520 598 520 610 L 520 766 Q 520 778 508 778 L 404 778"/>

<g transform="translate(94,204)">
  <rect class="card" x="0" y="0" width="236" height="84" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="118" y="35" text-anchor="middle">HTTP Request</text>
  <text class="small" x="118" y="62" text-anchor="middle">GET, POST, PUT, DELETE</text>
</g>
<g transform="translate(424,204)">
  <rect class="card" x="0" y="0" width="340" height="84" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="170" y="35" text-anchor="middle">ProductController</text>
  <text class="small" x="170" y="62" text-anchor="middle">suspend endpoint method</text>
</g>
<g transform="translate(820,202)">
  <rect class="card" x="0" y="0" width="350" height="90" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="175" y="35" text-anchor="middle">ProductR2dbcRepository</text>
  <text class="small" x="175" y="63" text-anchor="middle">suspend CRUD contract</text>
</g>

<g transform="translate(250,424)">
  <rect class="card" x="0" y="0" width="330" height="110" rx="8" fill="#f1ecff" stroke="#8a72d6"/>
  <text class="label" x="165" y="35" text-anchor="middle">Read Calls</text>
  <text class="small" x="165" y="64" text-anchor="middle">findAllAsList()</text>
  <text class="mono" x="165" y="90" text-anchor="middle">findByIdOrNull(id) ?: 404</text>
</g>
<g transform="translate(610,424)">
  <rect class="card" x="0" y="0" width="330" height="110" rx="8" fill="#e9f7f6" stroke="#45a7a1"/>
  <text class="label" x="165" y="35" text-anchor="middle">Create Call</text>
  <text class="small" x="165" y="64" text-anchor="middle">save(dto.copy(id = null))</text>
  <text class="mono" x="165" y="90" text-anchor="middle">201 Created</text>
</g>
<g transform="translate(970,424)">
  <rect class="card" x="0" y="0" width="360" height="110" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="180" y="35" text-anchor="middle">Guarded Mutations</text>
  <text class="small" x="180" y="64" text-anchor="middle">suspendTransaction { find or 404 }</text>
  <text class="mono" x="180" y="90" text-anchor="middle">save(...) or deleteById(...)</text>
</g>
<g transform="translate(610,554)">
  <rect class="card" x="0" y="0" width="330" height="88" rx="8" fill="#fff7e8" stroke="#d99a36"/>
  <text class="label" x="165" y="35" text-anchor="middle">Row Mapping</text>
  <text class="small" x="165" y="62" text-anchor="middle">ResultRow &lt;-&gt; ProductRecord</text>
</g>

<g transform="translate(94,738)">
  <rect class="card" x="0" y="0" width="310" height="80" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="155" y="34" text-anchor="middle">HTTP Response</text>
  <text class="small" x="155" y="60" text-anchor="middle">ProductRecord, 201, 204, 404</text>
</g>
<g transform="translate(1244,720)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="8" fill="#f8fbff" stroke="#6b7f93"/><image data-bluetape4k-icon="database.h2" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="124" y="35" text-anchor="middle">H2 R2DBC</text>
  <text class="small" x="124" y="62" text-anchor="middle">webflux_products</text>
</g>
</svg>
