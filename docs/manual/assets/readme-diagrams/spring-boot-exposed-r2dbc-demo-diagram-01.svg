<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc">
<title id="title">Spring Boot R2DBC demo structure</title>
<desc id="desc">Spring WebFlux product API structure with suspend controller methods, Exposed R2DBC repository mapping, startup initialization, connection pool, and H2 R2DBC database.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7 3.7 Q 12 6 7 8.3 L 1 11" fill="none" stroke="#5d6f83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="arrow-5d6f83" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7 3.7 Q 12 6 7 8.3 L 1 11" fill="none" stroke="#5d6f83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="arrow-45a7a1" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7 3.7 Q 12 6 7 8.3 L 1 11" fill="none" stroke="#45a7a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .layer{fill:#fbfdff;stroke:#d8e0ea;stroke-width:1.4}
    .layerTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:25px;fill:#243447}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:17px;fill:#536273}
    .card{stroke-width:2.2;filter:url(#shadow)}
    .label{font-family:"Architects Daughter","Comic Mono",monospace;font-size:25px;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:15px;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:15px;fill:#102033}
    .line{stroke:#5d6f83;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .init{stroke:#45a7a1;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1540" height="900"/>
<rect class="frame" x="32" y="28" width="1476" height="844" rx="26"/>
<text class="title" x="68" y="86">Spring Boot R2DBC Demo Structure</text>
<text class="subtitle" x="72" y="120">A WebFlux product API that keeps HTTP records, suspend repository mapping, and R2DBC pool setup explicit.</text>

<rect class="layer" x="64" y="154" width="1412" height="162" rx="18"/>
<text class="layerTitle" x="90" y="188">HTTP and coroutine boundary</text>
<rect class="layer" x="64" y="358" width="1412" height="202" rx="18"/>
<text class="layerTitle" x="90" y="400">Exposed R2DBC repository model</text>
<rect class="layer" x="64" y="602" width="1412" height="188" rx="18"/>
<text class="layerTitle" x="90" y="644">Boot startup and database</text>

<path class="line" d="M330 250 H424" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M764 250 H838" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M594 298 V416" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M764 472 H838" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M1158 472 H1244" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M1386 528 V650" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M364 710 H424" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M 754 712 L 798 712 Q 810 712 810 700 L 810 652 Q 810 640 822 640 L 1381.5 640 Q 1386 640 1386 644.5 L 1386 650" style="marker-end:url(#arrow-5d6f83)"/>
<path class="init" d="M 998 660 L 998 560 Q 998 548 1010 548 L 1282.5 548 Q 1292 548 1292 538.5 L 1292 528" style="marker-end:url(#arrow-45a7a1)"/>

<g transform="translate(94,208)">
  <rect class="card" x="0" y="0" width="236" height="84" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="118" y="35" text-anchor="middle">HTTP Client</text>
  <text class="small" x="118" y="62" text-anchor="middle">/products endpoints</text>
</g>
<g transform="translate(424,202)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="170" y="35" text-anchor="middle">ProductController</text>
  <text class="small" x="170" y="62" text-anchor="middle">suspend CRUD methods</text>
  <text class="mono" x="170" y="84" text-anchor="middle">201, 204, 404 handling</text>
</g>
<g transform="translate(838,202)">
  <rect class="card" x="0" y="0" width="310" height="96" rx="8" fill="#f1ecff" stroke="#8a72d6"/>
  <text class="label" x="155" y="35" text-anchor="middle">ProductRecord</text>
  <text class="small" x="155" y="62" text-anchor="middle">HTTP request/response body</text>
  <text class="mono" x="155" y="84" text-anchor="middle">id name price stock</text>
</g>

<g transform="translate(424,416)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="170" y="35" text-anchor="middle">ProductR2dbcRepository</text>
  <text class="small" x="170" y="64" text-anchor="middle">findAllAsList, save, deleteById</text>
  <text class="mono" x="170" y="92" text-anchor="middle">ProductRecord &lt;-&gt; ResultRow</text>
</g>
<g transform="translate(838,416)">
  <rect class="card" x="0" y="0" width="320" height="112" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="160" y="35" text-anchor="middle">ExposedR2dbcRepository</text>
  <text class="small" x="160" y="64" text-anchor="middle">suspend repository runtime</text>
  <text class="mono" x="160" y="92" text-anchor="middle">suspendTransaction</text>
</g>
<g transform="translate(1244,416)">
  <rect class="card" x="0" y="0" width="190" height="112" rx="8" fill="#fff7e8" stroke="#d99a36"/>
  <text class="label" x="95" y="35" text-anchor="middle">Products</text>
  <text class="small" x="95" y="64" text-anchor="middle">LongIdTable</text>
  <text class="mono" x="95" y="92" text-anchor="middle">webflux_products</text>
</g>

<g transform="translate(94,666)">
  <rect class="card" x="0" y="0" width="270" height="88" rx="8" fill="#e9f7f6" stroke="#45a7a1"/>
  <text class="label" x="135" y="35" text-anchor="middle">ExposedR2dbcConfig</text>
  <text class="small" x="135" y="62" text-anchor="middle">options + dispatcher</text>
</g>
<g transform="translate(424,660)">
  <rect class="card" x="0" y="0" width="330" height="104" rx="8" fill="#f7eef8" stroke="#b879bd"/>
  <text class="label" x="165" y="35" text-anchor="middle">ConnectionPool</text>
  <text class="small" x="165" y="64" text-anchor="middle">pool properties</text>
  <text class="mono" x="165" y="92" text-anchor="middle">R2dbcDatabase.connect(...)</text>
</g>
<g transform="translate(838,660)">
  <rect class="card" x="0" y="0" width="320" height="104" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="160" y="35" text-anchor="middle">DataInitializer</text>
  <text class="small" x="160" y="64" text-anchor="middle">ApplicationReadyEvent coroutine</text>
  <text class="mono" x="160" y="92" text-anchor="middle">SchemaUtils + seed rows</text>
</g>
<g transform="translate(1244,650)">
  <rect class="card" x="0" y="0" width="190" height="124" rx="8" fill="#f8fbff" stroke="#6b7f93"/><image data-bluetape4k-icon="database.h2" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="124" y="39" text-anchor="middle">H2 R2DBC</text>
  <text class="small" x="124" y="68" text-anchor="middle">in-memory DB</text>
  <text class="mono" x="124" y="96" text-anchor="middle">webfluxdb</text>
</g>
</svg>
