<g><rect class="note" x="110" y="1788.72" width="1520" height="55.68" rx="12"/><text class="small" x="870" y="1808.44" text-anchor="middle" dominant-baseline="middle">Suspend WRITE_BEHIND resumes after Redis accepts the write; JDBC persistence remains eventual through the async writer.</text><text class="small" x="870" y="1828.16" text-anchor="middle" dominant-baseline="middle">Use this flow when caller latency matters more than immediate database durability.</text></g>
