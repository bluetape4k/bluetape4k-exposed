<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="title desc">
  <title id="title">ClickHouse DDL Lifecycle</title>
  <desc id="desc">Flow diagram for exposed-clickhouse showing how ClickHouseTable createStatement filters Exposed DDL, strips unsupported clauses, appends a ClickHouse engine clause, and executes through an autocommit JDBC connection.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#C94D68" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .track{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .track-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1180"/>
  <rect class="frame" x="44" y="36" width="1612" height="1108" rx="34"/>
  <text class="title" x="72" y="88">ClickHouse DDL Lifecycle</text>
  <text class="subtitle" x="76" y="121">The module keeps Exposed schema declarations, then rewrites only the parts ClickHouse cannot execute safely.</text>

  <g id="track-definition">
    <rect class="track" x="82" y="162" width="420" height="850" rx="18"/>
    <text class="track-title" x="112" y="190" dominant-baseline="middle">Table definition</text>
  </g>
  <g id="track-create">
    <rect class="track" x="532" y="162" width="540" height="850" rx="18"/>
    <text class="track-title" x="562" y="190" dominant-baseline="middle">Create statement rewrite</text>
  </g>
  <g id="track-execute">
    <rect class="track" x="1102" y="162" width="516" height="850" rx="18"/>
    <text class="track-title" x="1132" y="190" dominant-baseline="middle">Execution and unsupported paths</text>
  </g>

  <path data-edge="definition-&gt;schema" class="connector" d="M 287 332 V 420" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="schema-&gt;create" class="connector" d="M 442 466 L 508 466 Q 520 466 520 454 L 520 298 Q 520 286 532 286 L 648 286" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="create-&gt;filter" class="connector" d="M 798 332 V 405" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="filter-&gt;sanitize" class="connector" d="M 802 529 V 585" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="sanitize-&gt;engine" class="connector" d="M 802 709 V 765" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="engine-&gt;autocommit" class="connector" d="M 928 827 L 1018 827 Q 1030 827 1030 815 L 1030 465 Q 1030 453 1042 453 L 1210 453" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="autocommit-&gt;table" class="connector" d="M 1365 501 V 585" stroke="#C94D68" marker-end="url(#arrow-red)"/>
  <path data-edge="table-&gt;native" class="connector" d="M 1365 681 V 765" stroke="#755BC6" marker-end="url(#arrow-purple)"/>

  <g id="node-definition" data-node="definition" transform="translate(132,240)">
    <rect class="card" x="0" y="0" width="310" height="92" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="16" y="16" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="184" y="32" text-anchor="middle" dominant-baseline="middle">ClickHouseTable</text>
    <text class="detail" x="184" y="62" text-anchor="middle" dominant-baseline="middle">columns + engine property</text>
  </g>
  <g id="node-schema" data-node="schema" transform="translate(132,420)">
    <rect class="card" x="0" y="0" width="310" height="92" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="155" y="32" text-anchor="middle" dominant-baseline="middle">SchemaUtils.create</text>
    <text class="detail" x="155" y="62" text-anchor="middle" dominant-baseline="middle">asks Table for DDL</text>
  </g>
  <g id="node-create" data-node="create" transform="translate(648,240)">
    <rect class="card" x="0" y="0" width="300" height="92" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="32" text-anchor="middle" dominant-baseline="middle">createStatement()</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">overrides Exposed DDL</text>
  </g>

  <g id="node-filter" data-node="filter" transform="translate(640,405)">
    <rect class="card" x="0" y="0" width="324" height="124" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="162" y="32" text-anchor="middle" dominant-baseline="middle">Keep CREATE TABLE</text>
    <text class="detail" x="162" y="60" text-anchor="middle" dominant-baseline="middle">drop COMMENT ON COLUMN</text>
    <text class="detail" x="162" y="82" text-anchor="middle" dominant-baseline="middle">ignore secondary DDL lines</text>
    <text class="detail" x="162" y="104" text-anchor="middle" dominant-baseline="middle">avoid unsupported statements</text>
  </g>
  <g id="node-sanitize" data-node="sanitize" transform="translate(620,585)">
    <rect class="card" x="0" y="0" width="364" height="124" rx="12" fill="#FFF3D9" stroke="#D6A441"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="16" y="16" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="210" y="32" text-anchor="middle" dominant-baseline="middle">sanitizeForClickHouse</text>
    <text class="detail" x="210" y="60" text-anchor="middle" dominant-baseline="middle">strip PRIMARY KEY</text>
    <text class="detail" x="210" y="82" text-anchor="middle" dominant-baseline="middle">strip CONSTRAINT / REFERENCES</text>
    <text class="detail" x="210" y="104" text-anchor="middle" dominant-baseline="middle">remove NOT NULL / NULL suffixes</text>
  </g>
  <g id="node-engine" data-node="engine" transform="translate(678,765)">
    <rect class="card" x="0" y="0" width="250" height="124" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="125" y="32" text-anchor="middle" dominant-baseline="middle">Append ENGINE</text>
    <text class="detail" x="125" y="60" text-anchor="middle" dominant-baseline="middle">MergeTree()</text>
    <text class="detail" x="125" y="82" text-anchor="middle" dominant-baseline="middle">ORDER BY ...</text>
    <text class="detail" x="125" y="104" text-anchor="middle" dominant-baseline="middle">settings and partition</text>
  </g>

  <g id="node-autocommit" data-node="autocommit" transform="translate(1210,405)">
    <rect class="card" x="0" y="0" width="310" height="96" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="card-title" x="155" y="31" text-anchor="middle" dominant-baseline="middle">Autocommit execution</text>
    <text class="detail" x="155" y="58" text-anchor="middle" dominant-baseline="middle">commit and rollback do nothing</text>
    <text class="detail" x="155" y="79" text-anchor="middle" dominant-baseline="middle">failure cannot undo prior DDL/DML</text>
  </g>
  <g id="node-table" data-node="table" transform="translate(1208,585)">
    <rect class="card" x="0" y="0" width="314" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="16" y="16" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="180" y="31" text-anchor="middle" dominant-baseline="middle">ClickHouse table</text>
    <text class="detail" x="180" y="58" text-anchor="middle" dominant-baseline="middle">physical sort key from engine</text>
    <text class="detail" x="180" y="79" text-anchor="middle" dominant-baseline="middle">use idempotent load design</text>
  </g>
  <g id="node-native" data-node="native" transform="translate(1270,765)">
    <rect class="card" x="0" y="0" width="190" height="96" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="95" y="31" text-anchor="middle" dominant-baseline="middle">Manual DDL</text>
    <text class="detail" x="95" y="58" text-anchor="middle" dominant-baseline="middle">modifyColumn</text>
    <text class="detail" x="95" y="79" text-anchor="middle" dominant-baseline="middle">returns empty list</text>
  </g>

  <g transform="translate(112,1050)">
    <rect class="constraint" x="0" y="0" width="1476" height="72" rx="10"/>
    <text class="small" x="738" y="24" text-anchor="middle" dominant-baseline="middle">The diagram is intentionally DDL-focused: reads and inserts still use Exposed queries, but transaction atomicity is not provided by ClickHouse.</text>
    <text class="small" x="738" y="48" text-anchor="middle" dominant-baseline="middle">Model schema evolution with native ClickHouse migrations when ALTER COLUMN semantics are required.</text>
  </g>
</svg>
