<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1358" viewBox="0 0 1760 1358" role="img" aria-labelledby="title desc">
  <title id="title">JDBC Repository Contract Map</title>
  <desc id="desc">Repository contract map rebuilt from exposed-jdbc repository source files and README repository sections.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="10" markerHeight="10" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="#536C85" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="generalizationArrow" viewBox="0 0 5 5" markerWidth="18" markerHeight="16" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="#FFFFFF" stroke="#536C85" stroke-width="0.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.generalization{marker-end:url(#generalizationArrow)}.dashed{stroke-dasharray:7 6}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
    <marker id="arrow-758297" viewBox="0 0 5 5" markerWidth="10" markerHeight="10" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="#758297" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
    <marker id="arrow-2e8f89" viewBox="0 0 5 5" markerWidth="10" markerHeight="10" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="#2E8F89" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
    <marker id="arrow-4f83bf" viewBox="0 0 5 5" markerWidth="10" markerHeight="10" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="#4F83BF" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
    <marker id="arrow-b9851b" viewBox="0 0 5 5" markerWidth="10" markerHeight="10" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="#B9851B" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="canvas" width="1760" height="1358"/>
  <rect class="decor" x="44" y="36" width="1672" height="1286" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1596" height="1062" rx="24"/>
  <text class="title" x="72" y="88">JDBC Repository Contract Map</text>
  <text class="subtitle" x="76" y="121">JdbcRepository owns CRUD/query/page defaults; soft-delete and audit repositories add table-constrained operations.</text>
  <g id="group-collaborators">
    <rect class="group" x="92" y="156" width="1576" height="220" rx="18"/>
    <text class="group-title" x="122" y="180" dominant-baseline="middle">Base collaborators and result contracts</text>
  </g>
  <g id="group-interfaces">
    <rect class="group" x="92" y="416" width="1576" height="290" rx="18"/>
    <text class="group-title" x="122" y="440" dominant-baseline="middle">Repository interfaces</text>
  </g>
  <g id="group-aliases">
    <rect class="group" x="92" y="746" width="1576" height="245" rx="18"/>
    <text class="group-title" x="122" y="770" dominant-baseline="middle">ID-specific convenience interfaces</text>
  </g>
  <g id="group-note">
    <rect class="group" x="92" y="1030" width="1576" height="150" rx="18"/>
    <text class="group-title" x="122" y="1054" dominant-baseline="middle">Reader caveat</text>
  </g>
  <path id="route-jdbc-id-table" data-edge="jdbc-&gt;id-table" data-label="table: IdTable&lt;ID&gt;" class="connector" d="M 715 496 L 715 392 Q 715 380 703 380 L 322 380 Q 310 380 310 368 L 310 327" stroke="#758297" style="marker-end:url(#arrow-758297)"/>
  <path id="route-jdbc-result-row" data-edge="jdbc-&gt;result-row" data-label="maps row to E" class="connector" d="M 810 496 L 810 327" stroke="#2E8F89" style="marker-end:url(#arrow-2e8f89)"/>
  <path id="route-jdbc-page" data-edge="jdbc-&gt;page" data-label="findPage returns" class="connector" d="M 965 496 L 965 392 Q 965 380 977 380 L 1083 380 Q 1095 380 1095 368 L 1095 327" stroke="#4F83BF" style="marker-end:url(#arrow-4f83bf)"/>
  <path id="route-soft-jdbc" data-edge="soft-&gt;jdbc" data-label="extends base CRUD contract" class="connector generalization" d="M 575 650 L 688 650 Q 700 650 700 638 L 700 612" stroke="#2E8F89" style="marker-end:url(#arrow-2e8f89)"/>
  <path id="route-auditable-jdbc" data-edge="auditable-&gt;jdbc" data-label="extends base CRUD contract" class="connector generalization" d="M 1160 650 L 1072 650 Q 1060 650 1060 638 L 1060 612" stroke="#B9851B" style="marker-end:url(#arrow-b9851b)"/>
  <path id="route-auditable-audit-context" data-edge="auditable-&gt;audit-context" data-label="sets updatedBy/updatedAt" class="connector" d="M 1395 594 L 1395 327" stroke="#B9851B" style="marker-end:url(#arrow-b9851b)"/>
  <path id="route-jdbc-aliases-jdbc" data-edge="jdbc-aliases-&gt;jdbc" data-label="specializes ID type" class="connector" d="M 765 851 L 765 612" stroke="#4F83BF" style="marker-end:url(#arrow-4f83bf)"/>
  <path id="route-soft-aliases-soft" data-edge="soft-aliases-&gt;soft" data-label="specializes soft table type" class="connector" d="M 350 851 L 350 706" stroke="#2E8F89" style="marker-end:url(#arrow-2e8f89)"/>
  <path id="route-audit-aliases-auditable" data-edge="audit-aliases-&gt;auditable" data-label="specializes audit table type" class="connector" d="M 1375 851 L 1375 706" stroke="#B9851B" style="marker-end:url(#arrow-b9851b)"/>
  <g id="node-id-table" data-node="id-table" transform="translate(145,245)">
    <rect class="shape" x="0" y="0" width="330" height="82" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="165" y="22" text-anchor="middle" dominant-baseline="middle">IdTable&lt;ID&gt;</text>
    <text class="detail" x="165" y="41" text-anchor="middle" dominant-baseline="middle">table primary key contract</text>
    <text class="detail" x="165" y="60" text-anchor="middle" dominant-baseline="middle">repository.table source</text>
  </g>
  <g id="node-result-row" data-node="result-row" transform="translate(540,245)">
    <rect class="shape" x="0" y="0" width="330" height="82" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="165" y="22" text-anchor="middle" dominant-baseline="middle">ResultRow.toEntity()</text>
    <text class="detail" x="165" y="41" text-anchor="middle" dominant-baseline="middle">implementation mapping hook</text>
    <text class="detail" x="165" y="60" text-anchor="middle" dominant-baseline="middle">row -&gt; entity E</text>
  </g>
  <g id="node-page" data-node="page" transform="translate(935,245)">
    <rect class="shape" x="0" y="0" width="320" height="82" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="160" y="22" text-anchor="middle" dominant-baseline="middle">ExposedPage&lt;E&gt;</text>
    <text class="detail" x="160" y="41" text-anchor="middle" dominant-baseline="middle">findPage result</text>
    <text class="detail" x="160" y="60" text-anchor="middle" dominant-baseline="middle">content and totalCount</text>
  </g>
  <g id="node-audit-context" data-node="audit-context" transform="translate(1310,245)">
    <rect class="shape" x="0" y="0" width="300" height="82" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="150" y="22" text-anchor="middle" dominant-baseline="middle">Audit collaborators</text>
    <text class="detail" x="150" y="41" text-anchor="middle" dominant-baseline="middle">UserContext</text>
    <text class="detail" x="150" y="60" text-anchor="middle" dominant-baseline="middle">CurrentTimestamp</text>
  </g>
  <g id="node-jdbc" data-node="jdbc" transform="translate(615,496)">
    <rect class="shape" x="0" y="0" width="530" height="116" rx="12" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="265" y="29.5" text-anchor="middle" dominant-baseline="middle">JdbcRepository&lt;ID, E&gt;</text>
    <text class="detail" x="265" y="48.5" text-anchor="middle" dominant-baseline="middle">base interface</text>
    <text class="detail" x="265" y="67.5" text-anchor="middle" dominant-baseline="middle">CRUD, query, update, batch</text>
    <text class="detail" x="265" y="86.5" text-anchor="middle" dominant-baseline="middle">findPage validates page inputs</text>
  </g>
  <g id="node-soft" data-node="soft" transform="translate(125,594)">
    <rect class="shape" x="0" y="0" width="450" height="112" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="225" y="27.5" text-anchor="middle" dominant-baseline="middle">SoftDeletedJdbcRepository&lt;ID, E, T&gt;</text>
    <text class="detail" x="225" y="46.5" text-anchor="middle" dominant-baseline="middle">extends JdbcRepository</text>
    <text class="detail" x="225" y="65.5" text-anchor="middle" dominant-baseline="middle">T: SoftDeletedIdTable&lt;ID&gt;</text>
    <text class="detail" x="225" y="84.5" text-anchor="middle" dominant-baseline="middle">active/deleted filters</text>
  </g>
  <g id="node-auditable" data-node="auditable" transform="translate(1160,594)">
    <rect class="shape" x="0" y="0" width="470" height="112" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="235" y="27.5" text-anchor="middle" dominant-baseline="middle">AuditableJdbcRepository&lt;ID, E, T&gt;</text>
    <text class="detail" x="235" y="46.5" text-anchor="middle" dominant-baseline="middle">extends JdbcRepository</text>
    <text class="detail" x="235" y="65.5" text-anchor="middle" dominant-baseline="middle">T: AuditableIdTable&lt;ID&gt;</text>
    <text class="detail" x="235" y="84.5" text-anchor="middle" dominant-baseline="middle">auditedUpdateById / All</text>
  </g>
  <g id="node-soft-aliases" data-node="soft-aliases" transform="translate(125,851)">
    <rect class="shape" x="0" y="0" width="450" height="92" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="225" y="27" text-anchor="middle" dominant-baseline="middle">SoftDeleted key aliases</text>
    <text class="detail" x="225" y="46" text-anchor="middle" dominant-baseline="middle">Long, Int, Uuid, UUID</text>
    <text class="detail" x="225" y="65" text-anchor="middle" dominant-baseline="middle">String table-bound aliases</text>
  </g>
  <g id="node-jdbc-aliases" data-node="jdbc-aliases" transform="translate(615,851)">
    <rect class="shape" x="0" y="0" width="440" height="92" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="220" y="27" text-anchor="middle" dominant-baseline="middle">JdbcRepository key aliases</text>
    <text class="detail" x="220" y="46" text-anchor="middle" dominant-baseline="middle">Int, Long, Uuid, UUID</text>
    <text class="detail" x="220" y="65" text-anchor="middle" dominant-baseline="middle">String specializations</text>
  </g>
  <g id="node-audit-aliases" data-node="audit-aliases" transform="translate(1155,851)">
    <rect class="shape" x="0" y="0" width="440" height="92" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="card-title" x="220" y="27" text-anchor="middle" dominant-baseline="middle">Auditable key aliases</text>
    <text class="detail" x="220" y="46" text-anchor="middle" dominant-baseline="middle">Int, Long, UUID</text>
    <text class="detail" x="220" y="65" text-anchor="middle" dominant-baseline="middle">Auditable*IdTable bound</text>
  </g>
  <g id="node-caveat" data-node="caveat" transform="translate(260,1126)">
    <rect class="shape" x="0" y="0" width="1240" height="58" rx="12" fill="#F2F5F9" stroke="#9AA8B8"/>
    <text class="card-title" x="620" y="19.5" text-anchor="middle" dominant-baseline="middle">No implementation classes are hidden here</text>
    <text class="detail" x="620" y="38.5" text-anchor="middle" dominant-baseline="middle">Repository implementations are user classes that override table, extractId, and ResultRow.toEntity().</text>
  </g>
  <g transform="translate(76,1266)" data-footer="repository-project-module">
    <rect class="pill" x="0" y="0" width="1608" height="48" rx="10"/>
    <text class="small" x="804" y="18" text-anchor="middle" dominant-baseline="middle">This is a repository contract map: arrows show extension/specialization around table constraints and result contracts.</text>
    <text class="small" x="804" y="35" text-anchor="middle" dominant-baseline="middle">Repository implementations provide table, ID extraction, and ResultRow.toEntity().</text>
  </g>
</svg>
