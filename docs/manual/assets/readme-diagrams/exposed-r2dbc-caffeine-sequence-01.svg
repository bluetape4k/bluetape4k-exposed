      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.2; stroke-linecap: round;stroke-linejoin:round; marker-end: url(#seqArrow-3F7D9C); }
      .work { fill: none; stroke: #6e8f4f; stroke-width: 3.2; stroke-linecap: round;stroke-linejoin:round; marker-end: url(#seqArrow-6E8F4F); }
      .async { fill: none; stroke: #7e6ab8; stroke-width: 3.2; stroke-linecap: round;stroke-linejoin:round; marker-end: url(#seqArrow-7E6AB8); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-linecap: round;stroke-linejoin:round; stroke-dasharray: 8 6; marker-end: url(#seqArrow-9B7D54); }
      .alt { fill:#FFFFFF; fill-opacity:0.12; stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .opt { fill: none; stroke: #7e6ab8; stroke-width: 2.5; stroke-dasharray: 11 7; }
      .branchDivider { stroke: #78909c; stroke-width: 2.5; stroke-dasharray: 11 7; }
