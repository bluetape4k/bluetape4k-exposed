  <circle cx="225" cy="628.56" r="12" class="badge returnBadge"/><text x="225" y="633.2" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="252" y="634.36" class="seqText returnText">return <tspan class="type">E?</tspan></text>
  <path class="ret return" d="M 431 668 L 167 668"/>

