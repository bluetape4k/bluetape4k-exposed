<svg data-sequence-spacing-scale="1.34" xmlns="http://www.w3.org/2000/svg" width="1680" height="2700" viewBox="0 0 1680 2700" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC Caffeine Cache Sequence</title>
  <desc id="desc">Sequence diagram for read-through cache hit and miss, write-through database writes, write-behind queueing, and close-time final flush in AbstractR2dbcCaffeineRepository.</desc>
  <defs>
    <marker id="seqArrow-3F7D9C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrow-6E8F4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrow-7E6AB8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7e6ab8" stroke="#7e6ab8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrow-9B7D54" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#20303a" flood-opacity="0.12"/>
    </filter>
    <style>
