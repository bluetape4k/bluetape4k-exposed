  <text x="752" y="1404.36" class="seqText workText"><tspan class="code">writeToDb</tspan> for <tspan class="type">WRITE_THROUGH</tspan></text>
  <path class="seq work" d="M 431 1438 L 1326 1438"/>

  <rect x="1348" y="1480" width="238" height="37.12" rx="16" class="pill workLabel"/>
  <circle cx="1371" cy="1498.56" r="12" class="badge workBadge"/><text x="1371" y="1503.2" text-anchor="middle" class="badgeText workText">10</text>
  <text x="1398" y="1504.36" class="seqText workText"><tspan class="keyword">UPDATE</tspan>; maybe insert</text>
