    <text class="actorTitle" x="731" y="229.68" text-anchor="middle">AsyncCache</text>
    <text class="role" x="731" y="255.2" text-anchor="middle">local Caffeine</text>
    <rect class="actor" x="918" y="197.2" width="212" height="78.88" rx="10"/>
    <text class="actorTitle" x="1024" y="229.68" text-anchor="middle">Queue</text>
    <text class="role" x="1024" y="255.2" text-anchor="middle">write-behind channel</text>
    <rect class="actor" x="1210" y="197.2" width="232" height="78.88" rx="10"/>
    <text class="actorTitle" x="1326" y="229.68" text-anchor="middle">Transaction</text>
    <text class="role code" x="1326" y="255.2" text-anchor="middle">suspendTransaction</text>
    <rect class="actor" x="1508" y="197.2" width="110" height="68" rx="10"/><image data-bluetape4k-icon="generic.database" x="1520" y="211.12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="actorTitle" x="1563" y="229.68" text-anchor="middle">DB</text>
    <text class="role" x="1563" y="255.2" text-anchor="middle">rows</text>
  </g>

