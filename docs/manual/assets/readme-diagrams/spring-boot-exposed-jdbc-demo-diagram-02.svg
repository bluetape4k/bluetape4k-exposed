<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc">
<title id="title">Spring Boot JDBC demo request flow</title>
<desc id="desc">Product API request flow showing transaction boundaries, query methods, DAO mutation, DTO conversion, and HTTP response creation.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5d6f83" stroke="#5d6f83" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-5d6f83" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5d6f83" stroke="#5d6f83" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-5b8def" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5b8def" stroke="#5b8def" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-dc6b82" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#dc6b82" stroke="#dc6b82" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <marker id="arrow-58a978" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#58a978" stroke="#58a978" style="stroke-dasharray:none!important" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .band{fill:#fbfdff;stroke:#d8e0ea;stroke-width:1.4}
    .bandTitle{font-family:"Architects Daughter","Comic Mono",monospace;font-size:24px;fill:#243447}
    .title{font-family:"Architects Daughter","Comic Mono",monospace;font-size:44px;fill:#102033}
    .subtitle{font-family:"Comic Mono",monospace;font-size:17px;fill:#536273}
    .card{stroke-width:2.2;filter:url(#shadow)}
    .label{font-family:"Architects Daughter","Comic Mono",monospace;font-size:22px;fill:#102033}
    .small{font-family:"Comic Mono",monospace;font-size:14px;fill:#536273}
    .mono{font-family:"Comic Mono",monospace;font-size:13px;fill:#102033}
    .line{stroke:#5d6f83;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .read{stroke:#5b8def;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .write{stroke:#dc6b82;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .dto{stroke:#58a978;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1540" height="900"/>
<rect class="frame" x="32" y="28" width="1476" height="844" rx="26"/>
<text class="title" x="68" y="86">Product API Transaction Flow</text>
<text class="subtitle" x="72" y="120">Each controller method completes DAO work and DTO conversion inside one Exposed transaction.</text>

<rect class="band" x="64" y="154" width="1412" height="150" rx="18"/>
<text class="bandTitle" x="90" y="196">HTTP boundary</text>
<rect class="band" x="64" y="354" width="1412" height="292" rx="18"/>
<text class="bandTitle" x="90" y="396">transaction { ... }</text>
<rect class="band" x="64" y="696" width="1412" height="116" rx="18"/>
<text class="bandTitle" x="90" y="738">Response boundary</text>

<path class="line" d="M330 236 H424" style="marker-end:url(#arrow-5d6f83)"/>
<path class="line" d="M584 274 V440" style="marker-end:url(#arrow-5d6f83)"/>
<path class="read" d="M660 470 H760" style="marker-end:url(#arrow-5b8def)"/>
<path class="write" d="M660 530 H760" style="marker-end:url(#arrow-dc6b82)"/>
<path class="read" d="M1060 451 H1140" style="marker-end:url(#arrow-5b8def)"/>
<path class="write" d="M1060 566 H1140" style="marker-end:url(#arrow-dc6b82)"/>
<path class="dto" d="M 1280 570 L 1280 742 Q 1280 754 1268 754 L 1000 754" style="marker-end:url(#arrow-58a978)"/>
<path class="dto" d="M724 754 H700" style="marker-end:url(#arrow-58a978)"/>

<g transform="translate(94,196)">
  <rect class="card" x="0" y="0" width="236" height="80" rx="8" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="118" y="34" text-anchor="middle">HTTP Request</text>
  <text class="small" x="118" y="60" text-anchor="middle">GET, POST, PUT, DELETE</text>
</g>
<g transform="translate(424,196)">
  <rect class="card" x="0" y="0" width="320" height="78" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="160" y="32" text-anchor="middle">ProductController</text>
  <text class="small" x="160" y="58" text-anchor="middle">starts request transaction</text>
</g>

<g transform="translate(360,440)">
  <rect class="card" x="0" y="0" width="300" height="120" rx="8" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="150" y="34" text-anchor="middle">Repository Call</text>
  <text class="small" x="150" y="64" text-anchor="middle">findAll, findById, findByName</text>
  <text class="mono" x="150" y="92" text-anchor="middle">ProductEntity.new { ... }</text>
</g>
<g transform="translate(760,396)">
  <rect class="card" x="0" y="0" width="300" height="120" rx="8" fill="#f1ecff" stroke="#8a72d6"/>
  <text class="label" x="150" y="34" text-anchor="middle">Read / Search</text>
  <text class="small" x="150" y="64" text-anchor="middle">repository PartTree methods</text>
  <text class="mono" x="150" y="92" text-anchor="middle">findByName(name)</text>
</g>
<g transform="translate(760,526)">
  <rect class="card" x="0" y="0" width="300" height="80" rx="8" fill="#fdecef" stroke="#dc6b82"/>
  <text class="label" x="150" y="34" text-anchor="middle">Create / Update</text>
  <text class="small" x="150" y="60" text-anchor="middle">DAO mutation before commit</text>
</g>
<g transform="translate(1140,450)">
  <rect class="card" x="0" y="0" width="280" height="120" rx="8" fill="#e9f7f6" stroke="#45a7a1"/>
  <text class="label" x="140" y="34" text-anchor="middle">ProductEntity</text>
  <text class="small" x="140" y="64" text-anchor="middle">stays inside transaction</text>
  <text class="mono" x="140" y="92" text-anchor="middle">toRecord()</text>
</g>

<g transform="translate(424,714)">
  <rect class="card" x="0" y="0" width="276" height="80" rx="8" fill="#f8fbff" stroke="#6b7f93"/>
  <text class="label" x="138" y="34" text-anchor="middle">ResponseEntity</text>
  <text class="small" x="138" y="60" text-anchor="middle">200, 201, 204, 404</text>
</g>
<g transform="translate(724,714)">
  <rect class="card" x="0" y="0" width="276" height="80" rx="8" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="138" y="34" text-anchor="middle">ProductRecord</text>
  <text class="small" x="138" y="60" text-anchor="middle">DTO crosses HTTP boundary</text>
</g>
</svg>
