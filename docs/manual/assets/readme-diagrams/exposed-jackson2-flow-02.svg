<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1160" viewBox="0 0 1680 1160" role="img" aria-labelledby="title desc">
  <title id="title">Jackson 2 JSON Round Trip</title>
  <desc id="desc">Flow diagram for exposed-jackson2 showing how a Kotlin value is serialized into a JSON or JSONB column, queried with JSON helpers, and read back through ResultRow or R2DBC Readable extensions.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#755BC6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.card{filter:url(#shadow);stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:45px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
      .layer-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .connector{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}
      .constraint{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1160"/>
  <rect class="frame" x="44" y="36" width="1592" height="1088" rx="34"/>
  <text class="title" x="72" y="88">Jackson 2 JSON Round Trip</text>
  <text class="subtitle" x="76" y="121">Serialization, dialect rendering, and readback stay explicit so JSON columns do not hide database-specific behavior.</text>

  <rect class="layer" x="82" y="160" width="1516" height="178" rx="18"/><text class="layer-title" x="112" y="190" dominant-baseline="middle">1. Write path</text>
  <rect class="layer" x="82" y="382" width="1516" height="204" rx="18"/><text class="layer-title" x="112" y="412" dominant-baseline="middle">2. Exposed column conversion</text>
  <rect class="layer" x="82" y="630" width="1516" height="170" rx="18"/><text class="layer-title" x="112" y="660" dominant-baseline="middle">3. Database JSON surface</text>
  <rect class="layer" x="82" y="844" width="1516" height="132" rx="18"/><text class="layer-title" x="112" y="874" dominant-baseline="middle">4. Read path</text>

  <path data-edge="value-&gt;serializer" class="connector" d="M 500 258 L 630 258" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="serializer-&gt;column" class="connector" d="M 840 298 L 840 426" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="column-&gt;db" class="connector" d="M 840 516 L 840 682" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  <path data-edge="query-&gt;db" class="connector" d="M 1160 506 L 1160 608 Q 1160 620 1148 620 L 1002 620 Q 990 620 990 632 L 990 682" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="db-&gt;readers" class="connector" d="M 840 744 L 840 884" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  <path data-edge="readers-&gt;serializer" class="connector" d="M 1050 912 L 1488 912 Q 1500 912 1500 900 L 1500 270 Q 1500 258 1488 258 L 1050 258" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>

  <g id="node-value" data-node="value" transform="translate(260,218)"><rect class="card" x="0" y="0" width="240" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="card-title" x="120" y="28" text-anchor="middle" dominant-baseline="middle">Kotlin value</text><text class="detail" x="120" y="54" text-anchor="middle" dominant-baseline="middle">DTO, Map, List, JSON object</text></g>
  <g id="node-serializer" data-node="serializer" transform="translate(630,218)"><rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="card-title" x="210" y="28" text-anchor="middle" dominant-baseline="middle">JacksonSerializer</text><text class="detail" x="210" y="54" text-anchor="middle" dominant-baseline="middle">lazy default or caller-supplied mapper</text></g>

  <g id="node-column" data-node="column" transform="translate(620,426)"><rect class="card" x="0" y="0" width="440" height="90" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="card-title" x="220" y="30" text-anchor="middle" dominant-baseline="middle">JacksonColumnType / JacksonBColumnType</text><text class="detail" x="220" y="58" text-anchor="middle" dominant-baseline="middle">notNullValueToDB, parameterMarker, readObject</text></g>
  <g id="node-query" data-node="query" transform="translate(1080,426)"><rect class="card" x="0" y="0" width="300" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/><text class="card-title" x="150" y="28" text-anchor="middle" dominant-baseline="middle">JSON predicates</text><text class="detail" x="150" y="54" text-anchor="middle" dominant-baseline="middle">extract / contains / exists</text></g>

  <g id="node-db" data-node="db" transform="translate(620,682)"><rect class="card" x="0" y="0" width="440" height="62" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="card-title" x="220" y="24" text-anchor="middle" dominant-baseline="middle">Database JSON / JSONB value</text><text class="detail" x="220" y="46" text-anchor="middle" dominant-baseline="middle">dialect provider renders vendor JSON SQL</text></g>
  <g id="node-readers" data-node="readers" transform="translate(630,884)"><rect class="card" x="0" y="0" width="420" height="62" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="card-title" x="210" y="24" text-anchor="middle" dominant-baseline="middle">ResultRow / Readable helpers</text><text class="detail" x="210" y="46" text-anchor="middle" dominant-baseline="middle">String, ByteArray, existing T, or parse from toString()</text></g>

  <g transform="translate(112,1030)"><rect class="constraint" x="0" y="0" width="1456" height="40" rx="10"/><text class="small" x="728" y="22" text-anchor="middle" dominant-baseline="middle">JSONB is not just a serializer choice: JacksonBColumnType also changes binary-format markers and SQLite/H2/PostgreSQL handling.</text></g>
</svg>
