<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL OLTP and ClickHouse OLAP Example Topology</title>
  <desc id="desc">Static topology for the example module: a JUnit integration scenario creates schemas in PostgreSQL and ClickHouse, inserts transactional orders through an Exposed repository, forwards the inserted records into a ClickHouse MergeTree table, and returns aggregate analytics.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#2E8F6B" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5.4 2.7 Q 10 5 5.4 7.3 L 0 10" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
      .band{fill:#F3F7FB;stroke:#D8E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#203449;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476;font-weight:400}
      .band-title{font-family:"Architects Daughter";font-size:23px;fill:#203449;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#203449;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:12px;fill:#627184;font-weight:400}
      .label{font-family:"Comic Mono";font-size:13px;fill:#42556B;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .note{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.5}
      .icon-bg{fill:#FFFFFF;stroke:#D8E2EC;stroke-width:1.2}
    </style>
  </defs>

  <rect class="canvas" width="1520" height="900"/>
  <rect class="frame" x="44" y="36" width="1432" height="820" rx="34"/>
  <text class="title" x="76" y="90">PostgreSQL OLTP and ClickHouse OLAP Example</text>
  <text class="subtitle" x="80" y="123">The test keeps transactional inserts in PostgreSQL, forwards inserted records as OLAP events, then runs ClickHouse-native aggregate SQL.</text>

  <rect class="band" x="82" y="164" width="1356" height="150" rx="18"/>
  <rect class="band" x="82" y="354" width="1356" height="216" rx="18"/>
  <rect class="band" x="82" y="610" width="1356" height="142" rx="18"/>
  <text class="band-title" x="112" y="194">JUnit scenario and Exposed repositories</text>
  <text class="band-title" x="112" y="384">Storage boundaries</text>
  <text class="band-title" x="112" y="640">Reader contract</text>

  <path data-edge="test-scenario-to-orders-repo" class="connector" d="M 354 278 L 496 278" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  <path data-edge="orders-repo-to-postgres" class="connector" d="M 654 314 L 654 412" stroke="#2E8F6B" marker-end="url(#arrow-green)"/>
  <path data-edge="analytics-repo-to-clickhouse" class="connector" d="M 1092 314 L 1092 412" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="postgres-to-clickhouse" class="connector" d="M 724 466 L 796 466" stroke="#B9851B" marker-end="url(#arrow-gold)"/>
  <path data-edge="clickhouse-to-result" class="connector" d="M 1022 528 L 1022 640 Q 1022 652 1034 652 L 1100 652" stroke="#B9851B" marker-end="url(#arrow-gold)"/>

  <g id="test-scenario" data-node="test-scenario" transform="translate(126,218)">
    <rect class="card" x="0" y="0" width="228" height="96" rx="13" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="card-title" x="114" y="28" text-anchor="middle">Integration Test</text>
    <text class="detail" x="114" y="54" text-anchor="middle">OltpOlapIntegrationTest</text>
    <text class="detail" x="114" y="76" text-anchor="middle">schemas, orders, assertions</text>
  </g>

  <g id="orders-repo" data-node="orders-repo" transform="translate(496,218)">
    <rect class="card" x="0" y="0" width="316" height="96" rx="13" fill="#EAF7EF" stroke="#58A978"/>
    <text class="card-title" x="158" y="30" text-anchor="middle">OrdersRepository</text>
    <text class="detail" x="158" y="58" text-anchor="middle">single-row insert in JDBC transaction</text>
    <text class="detail" x="158" y="78" text-anchor="middle">returns generated order id</text>
  </g>

  <g id="analytics-repo" data-node="analytics-repo" transform="translate(934,218)">
    <rect class="card" x="0" y="0" width="316" height="96" rx="13" fill="#FFF3D9" stroke="#D6A441"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="158" y="30" text-anchor="middle">AnalyticsRepository</text>
    <text class="detail" x="158" y="58" text-anchor="middle">batchInsertOrders into OLAP events</text>
    <text class="detail" x="158" y="78" text-anchor="middle">raw aggregate SQL for ClickHouse</text>
  </g>

  <g id="postgres" data-node="postgres" transform="translate(426,412)">
    <rect class="card" x="0" y="0" width="298" height="116" rx="13" fill="#E8F3FF" stroke="#5B8DEF"/><image data-bluetape4k-icon="testcontainers.postgresql" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="182" y="34" text-anchor="middle">PostgreSQL OLTP</text>
    <text class="detail" x="182" y="64" text-anchor="middle">orders table</text>
    <text class="detail" x="182" y="86" text-anchor="middle">transactional row inserts</text>
  </g>

  <g id="clickhouse" data-node="clickhouse" transform="translate(796,412)">
    <rect class="card" x="0" y="0" width="330" height="116" rx="13" fill="#FFF3D9" stroke="#D6A441"/><image data-bluetape4k-icon="testcontainers.clickhouse" x="12" y="12" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="198" y="34" text-anchor="middle">ClickHouse OLAP</text>
    <text class="detail" x="198" y="64" text-anchor="middle">order_events MergeTree</text>
    <text class="detail" x="198" y="86" text-anchor="middle">partitionBy(region), orderBy ids</text>
  </g>

  <g id="result" data-node="result" transform="translate(1100,646)">
    <rect class="card" x="0" y="0" width="278" height="86" rx="13" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="139" y="30" text-anchor="middle">OrderAnalyticsResult</text>
    <text class="detail" x="139" y="58" text-anchor="middle">count, uniqExact, p95, argMax</text>
  </g>

  <g id="contract" data-node="contract" transform="translate(126,662)">
    <rect class="note" x="0" y="0" width="810" height="58" rx="11"/>
    <text class="small" x="22" y="24">Forwarding is example code, not a transactional outbox.</text>
    <text class="small" x="22" y="43">If forwarding fails after PostgreSQL commits, ClickHouse may hold partial events; production code needs idempotency or replay.</text>
  </g>

  <text class="label" x="412" y="260" text-anchor="middle">insert(order)</text>
  <text class="label" x="710" y="360" text-anchor="start">transaction(pgDb)</text>
  <text class="label" x="1148" y="360" text-anchor="start">transaction(chDb)</text>
</svg>
