<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Exposed module responsibility map</title>
  <desc id="desc">A static module map showing shared foundation modules, parallel JDBC and R2DBC lanes, lane-specific cache and test support, and framework integrations in release 1.12.1.</desc>
  <defs>
    <marker id="flow-blue" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
    </marker>
    <marker id="relation-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5eead4" stroke="#5eead4"/>
    </marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1800" height="1100" fill="url(#canvas)"/>
  <rect x="42" y="36" width="1716" height="1028" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="900" y="100" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="52" fill="#f8fafc">Choose a Runtime Lane, Keep Its Ownership Intact</text>
  <text x="900" y="142" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b6c4d6">Stable 1.12.1 relationships • JDBC and R2DBC remain parallel • optional modules refine a lane</text>

  <rect x="90" y="185" width="360" height="745" rx="28" fill="#111827" stroke="#536377" stroke-width="3"/>
  <text x="270" y="230" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#9ed8ff">Shared foundation</text>
  <g filter="url(#shadow)">
    <rect class="card" x="125" y="275" width="290" height="125" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect class="card" x="125" y="465" width="290" height="125" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
    <rect class="card" x="125" y="655" width="290" height="125" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="125" y="830" width="290" height="70" rx="20" fill="#172033" stroke="#536377" stroke-width="3"/>
  </g>
  <g text-anchor="middle">
    <text x="270" y="325" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#9ed8ff">exposed-core</text>
    <text x="270" y="360" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">columns • DSL • mappings</text>
    <text x="270" y="515" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#c4b5fd">exposed-dao</text>
    <text x="270" y="550" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">entity and ID lifecycle</text>
    <text x="270" y="705" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#5eead4">exposed-cache</text>
    <text x="270" y="740" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">cache contracts and modes</text>
    <text x="270" y="875" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#b6c4d6">exposed-bom • version alignment</text>
  </g>

  <rect x="500" y="185" width="1205" height="350" rx="28" fill="#111827" stroke="#4c8cc8" stroke-width="3"/>
  <text x="545" y="230" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#9ed8ff">JDBC lane</text>
  <g filter="url(#shadow)">
    <rect class="card" x="540" y="275" width="340" height="170" rx="25" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect class="card" x="950" y="275" width="330" height="170" rx="25" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="1350" y="275" width="315" height="170" rx="25" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
  </g>
  <text x="710" y="330" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#9ed8ff">exposed-jdbc</text>
  <text x="710" y="370" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">blocking repository + transaction</text>
  <text x="710" y="405" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">exposed-jdbc-tests</text>
  <text x="1115" y="325" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#5eead4">JDBC cache adapters</text>
  <text x="1115" y="365" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">exposed-jdbc-caffeine</text>
  <text x="1115" y="393" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">exposed-jdbc-lettuce • redisson</text>
  <text x="1507" y="325" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#f6c96b">JDBC integrations</text>
  <text x="1507" y="363" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#d5dfeb">spring-boot-jdbc • batch</text>
  <text x="1507" y="391" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#d5dfeb">spring-modulith • exposed-ktor</text>

  <rect x="500" y="575" width="1205" height="350" rx="28" fill="#111827" stroke="#159c92" stroke-width="3"/>
  <text x="545" y="620" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#5eead4">R2DBC lane</text>
  <g filter="url(#shadow)">
    <rect class="card" x="540" y="665" width="340" height="170" rx="25" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="950" y="665" width="330" height="170" rx="25" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="1350" y="665" width="315" height="170" rx="25" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
  </g>
  <text x="710" y="720" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#5eead4">exposed-r2dbc</text>
  <text x="710" y="760" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">coroutine repository + transaction</text>
  <text x="710" y="795" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">exposed-r2dbc-tests</text>
  <text x="1115" y="715" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#5eead4">R2DBC cache adapters</text>
  <text x="1115" y="755" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">exposed-r2dbc-caffeine</text>
  <text x="1115" y="783" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">exposed-r2dbc-lettuce • redisson</text>
  <text x="1507" y="715" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#f6c96b">R2DBC integrations</text>
  <text x="1507" y="755" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#d5dfeb">spring-boot-r2dbc</text>
  <text x="1507" y="783" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#d5dfeb">exposed-ktor • app-owned resources</text>
  <text x="1507" y="811" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="13" fill="#b6c4d6">reuses spring-boot-jdbc foundation</text>

  <g fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path class="connector" d="M 415 500 H 445 Q 465 500 465 480 V 440 Q 465 420 485 420 H 540" marker-end="url(#flow-blue)"/>
    <path class="connector" d="M 415 550 H 445 Q 465 550 465 570 V 760 Q 465 780 485 780 H 540" marker-end="url(#flow-blue)"/>
    <path class="connector" d="M 270 400 V 465" marker-end="url(#flow-blue)"/>
  </g>
  <g fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="connector" d="M 880 360 H 950" marker-end="url(#relation-teal)"/>
    <path class="connector" d="M 710 275 V 260 Q 710 250 730 250 H 1487 Q 1507 250 1507 260 V 275" marker-end="url(#relation-teal)"/>
    <path class="connector" d="M 880 750 H 950" marker-end="url(#relation-teal)"/>
    <path class="connector" d="M 710 835 V 850 Q 710 870 730 870 H 1487 Q 1507 870 1507 850 V 835" marker-end="url(#relation-teal)"/>
    <path class="connector" d="M 415 717 H 455 Q 475 717 475 697 V 500 Q 475 480 495 480 H 1095 Q 1115 480 1115 460 V 445" marker-end="url(#relation-teal)"/>
    <path class="connector" d="M 415 717 H 455 Q 475 717 475 737 V 860 Q 475 880 495 880 H 1095 Q 1115 880 1115 860 V 835" marker-end="url(#relation-teal)"/>
  </g>

  <rect x="145" y="970" width="1510" height="54" rx="18" fill="#111827" stroke="#536377" stroke-width="2"/>
  <text x="900" y="1004" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#b6c4d6">Codecs and database adapters refine the selected lane; they never turn JDBC into R2DBC or replace transaction ownership.</text>
</svg>
