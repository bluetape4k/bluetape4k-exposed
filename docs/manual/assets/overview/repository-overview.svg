<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Exposed stable repository architecture</title>
  <desc id="desc">A dark architecture map showing the shared foundation, parallel JDBC and R2DBC paths, optional capabilities, and application integrations in release 1.11.0.</desc>
  <defs>
    <marker id="flow-blue" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
    </marker>
    <marker id="relation-teal" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#5eead4" stroke="#5eead4"/>
    </marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#canvas)"/>
  <rect x="42" y="36" width="1516" height="928" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="100" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Build One Data Path, Then Refine It</text>
  <text x="800" y="140" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#b6c4d6">bluetape4k-exposed 1.11.0 • shared foundation • parallel runtimes • explicit ownership</text>

  <text x="120" y="205" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#9ed8ff">Foundation</text>
  <g filter="url(#shadow)">
    <rect class="card" x="120" y="225" width="390" height="125" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="605" y="225" width="390" height="125" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect class="card" x="1090" y="225" width="390" height="125" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
  </g>
  <g text-anchor="middle">
    <text x="315" y="275" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#5eead4">exposed-cache</text>
    <text x="315" y="313" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb">contracts • modes • resilience</text>
    <text x="800" y="275" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#9ed8ff">exposed-core</text>
    <text x="800" y="313" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb">columns • DSL • mappings</text>
    <text x="1285" y="275" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#c4b5fd">exposed-dao</text>
    <text x="1285" y="313" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb">entities • IDs • lifecycle</text>
  </g>

  <g fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path class="connector" d="M 800 350 V 378 Q 800 398 780 398 H 605 Q 585 398 585 418 V 445" marker-end="url(#flow-blue)"/>
    <path class="connector" d="M 800 350 V 378 Q 800 398 820 398 H 995 Q 1015 398 1015 418 V 445" marker-end="url(#flow-blue)"/>
    <path class="connector" d="M 995 287 H 1090" marker-end="url(#flow-blue)"/>
  </g>

  <text x="120" y="425" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#9ed8ff">Choose one primary runtime</text>
  <g filter="url(#shadow)">
    <rect class="card" x="300" y="445" width="500" height="145" rx="26" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
    <rect class="card" x="800" y="445" width="500" height="145" rx="26" fill="#172033" stroke="#159c92" stroke-width="4"/>
  </g>
  <text x="550" y="500" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="32" fill="#9ed8ff">exposed-jdbc</text>
  <text x="550" y="540" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">blocking driver • JDBC transaction owner</text>
  <text x="550" y="566" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">default when the application owns a JDBC boundary</text>
  <text x="1050" y="500" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="32" fill="#5eead4">exposed-r2dbc</text>
  <text x="1050" y="540" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">non-blocking driver • coroutine transaction</text>
  <text x="1050" y="566" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#b6c4d6">use when the complete call chain stays non-blocking</text>

  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="connector" data-connector="jdbc-to-cache" d="M 470 590 V 625 Q 470 645 450 645 H 300 Q 280 645 280 665 V 690" stroke="#9ed8ff" marker-end="url(#flow-blue)"/>
    <path class="connector" data-connector="r2dbc-to-cache" d="M 1300 520 H 1510 Q 1530 520 1530 540 V 850 Q 1530 870 1510 870 H 490 Q 470 870 470 850 V 810 Q 470 790 460 790 H 450" stroke="#5eead4" marker-end="url(#relation-teal)"/>
    <path class="connector" data-connector="jdbc-to-codecs" d="M 630 590 V 625 Q 630 645 650 645 H 740 Q 760 645 760 665 V 690" stroke="#9ed8ff" marker-end="url(#flow-blue)"/>
    <path class="connector" data-connector="r2dbc-to-adapters" d="M 970 590 V 625 Q 970 645 950 645 H 860 Q 840 645 840 665 V 690" stroke="#5eead4" marker-end="url(#relation-teal)"/>
    <path class="connector" data-connector="r2dbc-to-integrations" d="M 1130 590 V 625 Q 1130 645 1150 645 H 1300 Q 1320 645 1320 665 V 690" stroke="#5eead4" marker-end="url(#relation-teal)"/>
    <path class="connector" data-connector="cache-to-adapters" d="M 120 287 H 90 Q 70 287 70 307 V 750 Q 70 770 90 770 H 110" stroke="#5eead4" marker-end="url(#relation-teal)"/>
  </g>

  <text x="120" y="670" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#5eead4">Refine the selected path</text>
  <g filter="url(#shadow)">
    <rect class="card" x="110" y="690" width="340" height="160" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/>
    <rect class="card" x="490" y="690" width="310" height="160" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4"/>
    <rect class="card" x="800" y="690" width="330" height="160" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/>
    <rect class="card" x="1150" y="690" width="340" height="160" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
  </g>
  <g text-anchor="middle">
    <text x="280" y="745" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#5eead4">Cache adapters</text>
    <text x="280" y="783" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">Caffeine • Lettuce • Redisson</text>
    <text x="280" y="812" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#b6c4d6">JDBC and R2DBC variants</text>
    <text x="645" y="745" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#c4b5fd">Column codecs</text>
    <text x="645" y="783" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">Jackson • Fastjson2 • Tink</text>
    <text x="645" y="812" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#b6c4d6">measured column mappings</text>
    <text x="965" y="745" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#f6c96b">DB adapters</text>
    <text x="965" y="783" font-family="Comic Mono, ui-monospace, monospace" font-size="15" fill="#d5dfeb">PostgreSQL • MySQL8 • DuckDB</text>
    <text x="965" y="812" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#b6c4d6">analytics and distributed backends</text>
    <text x="1320" y="745" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#9ed8ff">Integrations</text>
    <text x="1320" y="783" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">Spring Boot • Ktor • Batch</text>
    <text x="1320" y="812" font-family="Comic Mono, ui-monospace, monospace" font-size="14" fill="#b6c4d6">Spring Modulith • Timefold persistence</text>
  </g>

  <rect x="210" y="885" width="1180" height="48" rx="18" fill="#111827" stroke="#536377" stroke-width="2"/>
  <text x="800" y="916" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#b6c4d6">The BOM aligns versions; it is not a runtime layer. Audit history remains in the adjacent bluetape4k-javers repository.</text>
</svg>
