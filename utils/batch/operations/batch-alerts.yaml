schemaVersion: 1
alerts:
  - id: batch-lease-loss-critical
    severity: critical
    owner: batch-platform
    route: batch-oncall
    window: 1m
    minimumSamples: 1
    condition:
      metric: lease_loss_total
      operator: ">="
      threshold: 1
    action: stop_scheduling
    clearCondition:
      metric: lease_loss_total
      operator: "=="
      threshold: 0
      window: 10m
    resumeAuthority:
      authority: release-owner
      role: release-owner
      requiredEvidence:
        - operator
  - id: batch-renewal-failure-high
    severity: high
    owner: batch-platform
    route: batch-oncall
    window: 5m
    minimumSamples: 20
    condition:
      metric: renewal_failure_ratio
      operator: ">"
      threshold: 0.01
      denominator: renewal_attempt_total
    action: stop_scheduling
    clearCondition:
      metric: renewal_failure_ratio
      operator: "<="
      threshold: 0.01
      denominator: renewal_attempt_total
      window: 15m
    resumeAuthority:
      authority: release-owner
      role: release-owner
      requiredEvidence:
        - db-health
  - id: batch-renewal-latency-high
    severity: high
    owner: batch-platform
    route: batch-oncall
    window: 5m
    minimumSamples: 20
    condition:
      metric: renewal_latency_p95_millis
      operator: ">"
      threshold: "min(executionLeaseMillis / 12, repositoryTimeoutMillis * 4 / 5)"
      includesTimeoutSamples: true
    action: stop_scheduling
    clearCondition:
      metric: renewal_latency_p95_millis
      operator: "<="
      threshold: "min(executionLeaseMillis / 12, repositoryTimeoutMillis * 4 / 5)"
      includesTimeoutSamples: true
      window: 15m
    resumeAuthority:
      authority: release-owner
      role: release-owner
      requiredEvidence:
        - capacity
  - id: batch-cancellation-completion-failed-critical
    severity: critical
    owner: batch-platform
    route: batch-oncall
    window: 1m
    minimumSamples: 1
    condition:
      metric: cancellation_completion_failed_total
      operator: ">="
      threshold: 1
    action: stop_logical_key_and_reconcile
    clearCondition:
      metric: cancellation_completion_failed_total
      operator: "=="
      threshold: 0
      window: 10m
    resumeAuthority:
      authority: release-owner
      role: release-owner
      requiredEvidence:
        - reconciliation
